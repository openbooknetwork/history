# Roman Republic
battle.sides.0.name: "الجمهورية الرومانية"

# 86,400, with 10,000 left to guard the camps
battle.sides.0.strength: "86,400، منهم 10,000 تُركوا لحراسة المعسكرات"

# Polybius: 70,000 killed, 10,000 captured. Livy: 48,200 killed, 19,300 captured
battle.sides.0.casualties: "بوليبيوس: 70,000 قتيل، و10,000 أسير. ليفيوس: 48,200 قتيل، و19,300 أسير"

# Carthage
battle.sides.1.name: "قرطاج"

# 50,000, with 10,000 cavalry
battle.sides.1.strength: "50,000، منهم 10,000 فارس"

# Polybius: 5,700 killed. Livy: 8,000 killed
battle.sides.1.casualties: "بوليبيوس: 5,700 قتيل. ليفيوس: 8,000 قتيل"

# Battle of Cannae
battle.name: "معركة كاناي"

# 2 August 216 BC
battle.date: "2 أغسطس 216 ق.م"

# Carthaginian victory
battle.result: "نصر قرطاجي"

