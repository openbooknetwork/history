  the-tourelles:
    account: >-
      The Tourelles were a bridge-house on a pier at the south end of the bridge, joined by a drawbridge to the
      boulevard, an earthwork on the shore before them; on the city side three arches of the bridge were broken
      (Lowell, Ramsay, the chronicle of the feast). On Saturday 7 May (the Journal dates it the 6th, as Quicherat's
      note corrects) the French attacked the boulevard and the Tourelles from the south bank from morning to evening:
      to sunset in the Journal and Pasquerel, to six in the evening in the Chronique, to eight in Dunois. Whether the
      captains opposed the attack is disputed: the Chronique has her cross with the burgesses' consent and against all
      the royal captains, and Lowell has the council of war give way to her and the townsmen, while Lang differs from
      Lowell on that resistance; the body says the townsmen backed her and a note gives the dispute. From the city the
      townsmen bridged the broken arches with gutters and ladders, a carpenter lengthening the longest gutter, and
      attacked from the bridge too (the Journal, the Chronique, the chronicle of the feast, Ramsay); Ramsay has their
      guns fire on the Tourelles from the Île Saint-Antoine, a place told with his name. She was struck by an arrow or
      a crossbolt between the neck and the shoulder as she raised a ladder against the boulevard, by her own account
      at her trial, with the Journal, Dunois and the Chronique; Pasquerel alone puts the wound above the breast. The
      hour is disputed: in the morning (the Chronique), after dinner (Pasquerel), early in the afternoon (Lowell),
      after the boulevard was won (Ramsay); the body gives no hour and a note names them. She was carried off and the
      wound dressed, and came back; towards evening, when the captains meant to draw off, she prayed apart in a
      vineyard about half an hour (Dunois), set her standard at the edge of the ditch (Luillier, Dunois), and the
      French went up the boulevard and took it; the chronicle of the feast has knights see a white dove over her
      standard about four in the afternoon, told as its account. As the English of the boulevard made for the
      Tourelles the bridge between gave way under them, and Glasdale, Sir William Moleyns, Sir Hugh Poynings and many
      others fell into the Loire and drowned (the Journal, the Chronique, Dunois, Pasquerel, the Bourgeois); the
      Tourelles were taken. Why the bridge failed is disputed: it gave way under them (the Journal), by God's judgement
      (the Chronique); Quicherat cites the town's accounts of 1429 that it was burned on purpose with a fire-boat, and
      Lowell has the fire spread from the fire-boat to the drawbridge; the chronicle of the feast tells of the
      fire-boat and says the English had cut the bridge themselves to trap the French; the body says the drawbridge
      gave way and a note gives each cause with its source. The English in the boulevard and the Tourelles: about
      600 under two banners and the standard of Chandos, all killed or taken (Charles VII's letter), 500 to 600 picked
      men (the chronicle of the feast), 400 to 500 all killed or drowned but a few taken (the Journal), about 200 of
      500 taken alive (the Chronique), 300 taken (Ramsay); each with its author, and Wikipedia's 700 to 800 not used.
      With the Tourelles taken and Saint-Privé empty, the English held nothing south of the Loire. That night the
      Journal has her stay in the field with the captains guarding the Tourelles and watching Saint-Laurent; the
      Chronique, Dunois and Lowell have her ride back into the city over the repaired bridge, the bells ringing; the
      body follows the Chronique and Dunois and a note gives the Journal. The map shows the Tourelles, the boulevard,
      the Île Saint-Antoine and the townsmen's way over the bridge (the text links the boulevard and the island, whose
      icons wait under the Tourelles' at the opening view); the places and the line of the medieval bridge are
      reconstructions.
