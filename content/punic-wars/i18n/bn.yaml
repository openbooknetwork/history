markers.phintias-249.note: "কার্থালো একটি রোমান নৌবহরকে পরাজিত করেন, ঝড়ে বাকিগুলো বিধ্বস্ত হয়, খ্রিস্টপূর্ব ২৪৯"

# Hamilcar Barca holds out on the mountain
markers.eryx-244.note: "হ্যামিলকার বার্কা পর্বতে টিকে থাকেন"

# Besieged until the peace of 241 BC
markers.drepana-241.note: "খ্রিস্টপূর্ব ২৪১ সালের সন্ধি পর্যন্ত অবরুদ্ধ"

# Besieged until the peace of 241 BC
markers.lilybaeum-241.note: "খ্রিস্টপূর্ব ২৪১ সালের সন্ধি পর্যন্ত অবরুদ্ধ"

# The Roman fleet anchors here the night before the battle
markers.aegusa-241.note: "যুদ্ধের আগের রাতে রোমান নৌবহর এখানে নোঙর করে"

# Blockaded by the rebels, 239 – 238 BC
markers.carthage-241.note: "বিদ্রোহীদের দ্বারা অবরুদ্ধ, খ্রিস্টপূর্ব ২৩৯ – ২৩৮"

# The unpaid army is sent here, 241 BC
markers.sicca-241.note: "বেতন না পাওয়া সেনাবাহিনীকে এখানে পাঠানো হয়, খ্রিস্টপূর্ব ২৪১"

# Rebel base, besieged by Hamilcar in 238 BC
markers.tunis-238.note: "বিদ্রোহীদের ঘাঁটি, খ্রিস্টপূর্ব ২৩৮ সালে হ্যামিলকারের অবরোধে"

# Besieged by the rebels, joins them in 239 BC
markers.utica-240.note: "বিদ্রোহীদের অবরোধে, খ্রিস্টপূর্ব ২৩৯ সালে তাদের সঙ্গে যোগ দেয়"

# Besieged by the rebels, joins them in 239 BC
markers.hippo-240.note: "বিদ্রোহীদের অবরোধে, খ্রিস্টপূর্ব ২৩৯ সালে তাদের সঙ্গে যোগ দেয়"

# Held by the rebels until late 238 or early 237 BC
markers.utica-238.note: "খ্রিস্টপূর্ব ২৩৮ সালের শেষ বা ২৩৭ সালের শুরু পর্যন্ত বিদ্রোহীদের দখলে"

# Held by the rebels until late 238 or early 237 BC
markers.hippo-238.note: "খ্রিস্টপূর্ব ২৩৮ সালের শেষ বা ২৩৭ সালের শুরু পর্যন্ত বিদ্রোহীদের দখলে"

# Matho’s army is destroyed nearby, 238 BC
markers.leptis-parva-238.note: "কাছেই মাথোর সেনাবাহিনী ধ্বংস হয়, খ্রিস্টপূর্ব ২৩৮"

# Main Carthaginian port of Sardinia
markers.karalis-238.note: "সার্ডিনিয়ার প্রধান কার্থেজীয় বন্দর"

# Punic town on the west coast
markers.tharros-238.note: "পশ্চিম উপকূলের পিউনিক শহর"

# Punic town on the island of Sant’Antioco
markers.sulci-238.note: "সান্ত’আন্তিয়োকো দ্বীপের পিউনিক শহর"

