pages.ankara-march.title: "Ankara’ya yürüyüş, 1402"

# The Çubuk stream, which flows south to Ankara. Both armies draw their water from it and the streams that join it
emblems.ankara.cubuk: "Ankara’ya doğru güneye akan Çubuk Çayı. İki ordu da suyunu bu çaydan ve ona katılan derelerden alır"

# July 1402
pages.ankara.date: "Temmuz 1402"

# The armies at Ankara
pages.ankara.title: "Ankara’da iki ordu"

# The Çubuk stream, which flows south to Ankara. Both armies draw their water from it and the streams that join it
emblems.ankara-lines.cubuk: "Ankara’ya doğru güneye akan Çubuk Çayı. İki ordu da suyunu bu çaydan ve ona katılan derelerden alır"

# Stefan Lazarević on the right wing with his Serbian horsemen in black armour, his brother Vuk and Đurađ and Grgur Branković. Doukas gives them 5,000 men
emblems.ankara-lines.serbs: "Sağ kanatta siyah zırhlı Sırp atlılarıyla Stefan Lazarević, kardeşi Vuk ve Đurađ ile Grgur Branković. Dukas onlara 5.000 kişi verir"

# Bayezid in the centre on a low rise, with about 10,000 janissaries, the azaps in front of them, his sons İsa, Musa and Mustafa and the grand vizier Çandarlı Ali Pasha
emblems.ankara-lines.bayezid: "Merkezde alçak bir tepede Bayezid: 10.000 kadar yeniçeri, önlerinde azaplar, oğulları İsa, Musa ve Mustafa ile sadrazam Çandarlı Ali Paşa"

# Süleyman Çelebi on the left wing with the sipahis of Anatolia. Nizam ad-Din Shami and İsmail Hakkı Uzunçarşılı put the Rumelian troops here and the Anatolian troops on the right beside the Serbs
emblems.ankara-lines.suleyman: "Sol kanatta Anadolu sipahileriyle Süleyman Çelebi. Nizâmeddin Şâmî ile İsmail Hakkı Uzunçarşılı burada Rumeli askerlerini, Anadolu askerlerini ise sağda Sırpların yanında gösterir"

# The troops of Aydın, Saruhan, Menteşe and Germiyan, lands Bayezid annexed in 1390, on the left wing with Süleyman. The accounts place them no closer
emblems.ankara-lines.beyliks: "Bayezid’in 1390’da topraklarına kattığı Aydın, Saruhan, Menteşe ve Germiyan’ın askerleri, sol kanatta Süleyman’ın yanında. Anlatımlar yerlerini daha kesin vermez"

# Mehmed Çelebi with the reserve behind the centre
emblems.ankara-lines.mehmed: "Merkezin gerisinde ihtiyat kuvvetleriyle Mehmed Çelebi"

# The Black Tatars, horse archers settled in Anatolia, behind the left wing. Spencer Tucker counts a quarter of Bayezid’s army as Tatars
emblems.ankara-lines.tatars: "Anadolu’ya yerleşmiş atlı okçular olan Kara Tatarlar, sol kanadın gerisinde. Spencer Tucker Bayezid’in ordusunun dörtte birini Tatar sayar"

# Troops Bayezid leaves against an encirclement on Çataltepe, about 4 km behind the line in Alexandrescu-Dersca’s account. Drawn on the ridge that fits that distance
emblems.ankara-lines.cataltepe: "Bayezid’in kuşatılmaya karşı Çataltepe’ye bıraktığı askerler. Alexandrescu-Dersca’ya göre tepe hattın 4 kilometre kadar gerisindedir. Bu uzaklığa uyan sırtta gösterilmiştir"

# Thirty-two war elephants brought from India, in front of Timur’s centre
emblems.ankara-lines.elephants: "Timur’un merkezinin önünde, Hindistan’dan getirilmiş otuz iki savaş fili"

# Timur in the centre with the main body. The accounts put his grandson Muhammad Sultan here or with the right wing
emblems.ankara-lines.timur: "Merkezde ana kuvvetle Timur. Anlatımlar torunu Muhammed Sultan’ı burada ya da sağ kanatta gösterir"

# Timur’s son Miran Shah with the right wing
emblems.ankara-lines.miranshah: "Sağ kanatta Timur’un oğlu Miranşah"

# Timur’s son Shah Rukh with the left wing, with his grandson Khalil Sultan
emblems.ankara-lines.shahrukh: "Sol kanatta Timur’un oğlu Şahruh, torunu Halil Sultan ile"

# Horse archers of the vanguard under Timur’s grandson Abu Bakr. In later Turkish accounts they open the battle against the Ottoman left
emblems.ankara-lines.vanguard: "Timur’un torunu Ebubekir komutasındaki öncü atlı okçular. Sonraki Türk anlatımlarında muharebeyi Osmanlı sol kanadına saldırarak bunlar açar"

# The vanguard shoots into the Ottoman left. Later Turkish accounts have Timur’s right open the battle. Other accounts have the Ottomans attack first into swarms of arrows
emblems.ankara-lines.vanguard-fire: "Öncüler Osmanlı sol kanadını oka tutar. Sonraki Türk anlatımlarında muharebeyi Timur’un sağ kanadı açar. Başka anlatımlarda önce Osmanlılar saldırır ve ok yağmuruyla karşılanır"

# The Ottoman left charges and drives the vanguard back
emblems.ankara-lines.left-attack: "Osmanlı sol kanadı hücum eder ve öncüleri geri püskürtür"

# 20 July 1402, or 28 July
pages.ankara-lines.date: "20 ya da 28 Temmuz 1402"

# The battle lines
pages.ankara-lines.title: "Savaş düzeni"

# The Çubuk stream, which flows south to Ankara. Both armies draw their water from it and the streams that join it
emblems.ankara-desertion.cubuk: "Ankara’ya doğru güneye akan Çubuk Çayı. İki ordu da suyunu bu çaydan ve ona katılan derelerden alır"

# Stefan Lazarević’s Serbs cut through the Timurid ranks three times. Bayezid refuses to break out with them, and they fight their way off the field
emblems.ankara-desertion.serbs: "Stefan Lazarević’in Sırpları Timur saflarını üç kez yarar. Bayezid onlarla birlikte çemberi yarmayı reddeder, Sırplar da savaşarak alandan çekilir"

# Bayezid in the centre on a low rise, with about 10,000 janissaries, the azaps in front of them, his sons İsa, Musa and Mustafa and the grand vizier Çandarlı Ali Pasha
emblems.ankara-desertion.bayezid: "Merkezde alçak bir tepede Bayezid: 10.000 kadar yeniçeri, önlerinde azaplar, oğulları İsa, Musa ve Mustafa ile sadrazam Çandarlı Ali Paşa"

# What remains of the Ottoman left gives way and falls back on the centre
emblems.ankara-desertion.left-wing: "Osmanlı sol kanadından geriye kalanlar dağılır ve merkeze doğru çekilir"

# Mehmed Çelebi with the reserve behind the centre
emblems.ankara-desertion.mehmed: "Merkezin gerisinde ihtiyat kuvvetleriyle Mehmed Çelebi"

# The Black Tatars change sides and shoot into the Ottoman left from behind
emblems.ankara-desertion.tatars: "Kara Tatarlar taraf değiştirir ve Osmanlı sol kanadını arkadan oka tutar"

# The troops of Aydın, Saruhan, Menteşe and Germiyan see the banners of their old beys in Timur’s army and ride over to them
emblems.ankara-desertion.beyliks: "Aydın, Saruhan, Menteşe ve Germiyan askerleri Timur ordusunda eski beylerinin sancaklarını görür ve onların yanına geçer"

# Troops Bayezid leaves against an encirclement on Çataltepe, about 4 km behind the line in Alexandrescu-Dersca’s account. Drawn on the ridge that fits that distance
emblems.ankara-desertion.cataltepe: "Bayezid’in kuşatılmaya karşı Çataltepe’ye bıraktığı askerler. Alexandrescu-Dersca’ya göre tepe hattın 4 kilometre kadar gerisindedir. Bu uzaklığa uyan sırtta gösterilmiştir"

# Timur’s elephants and the armoured horsemen of Transoxiana advance against the Ottoman centre
emblems.ankara-desertion.elephants: "Timur’un filleri ve Mâverâünnehir’in zırhlı atlıları Osmanlı merkezine ilerler"

# Timur in the centre with the main body
emblems.ankara-desertion.timur: "Merkezde ana kuvvetle Timur"

# Miran Shah’s right wing presses the Ottoman left
emblems.ankara-desertion.miranshah: "Miranşah’ın sağ kanadı Osmanlı sol kanadını sıkıştırır"

# Shah Rukh’s left wing, reinforced, fights the Serbs and the Ottoman right
emblems.ankara-desertion.shahrukh: "Takviye alan Şahruh’un sol kanadı Sırplarla ve Osmanlı sağ kanadıyla çarpışır"

# The troops of the beyliks ride over to Timur’s side. Later Turkish accounts have the Anatolian sipahis of the Ottoman right go over in the afternoon
emblems.ankara-desertion.beyliks-over: "Beylik askerleri Timur’un tarafına geçer. Sonraki Türk anlatımlarında Osmanlı sağ kanadındaki Anadolu sipahileri öğleden sonra karşı tarafa geçer"

# The Tatars shoot into the Ottoman left from behind
emblems.ankara-desertion.tatars-fire: "Tatarlar Osmanlı sol kanadını arkadan oka tutar"

# Timur’s right wing breaks the Ottoman left
emblems.ankara-desertion.miranshah-attack: "Timur’un sağ kanadı Osmanlı sol kanadını bozar"

# Süleyman leaves the field for Bursa with the grand vizier Çandarlı Ali Pasha and the commander of the janissaries
emblems.ankara-desertion.suleyman-leaves: "Süleyman, sadrazam Çandarlı Ali Paşa ve yeniçeri ağasıyla birlikte savaş alanından Bursa’ya doğru ayrılır"

# The Serbs break out to the north-west. Stefan is wounded and Grgur Branković taken. Laonikos Chalkokondyles praises their fight
emblems.ankara-desertion.serbs-out: "Sırplar kuzeybatıya doğru çemberi yarar. Stefan yaralanır, Grgur Branković esir düşer. Laonikos Halkokondilis onların savaşını över"

# 20 July 1402, or 28 July
pages.ankara-desertion.date: "20 ya da 28 Temmuz 1402"

# The Anatolian troops change sides
pages.ankara-desertion.title: "Anadolu askerleri taraf değiştirir"

# The Çubuk stream, which flows south to Ankara. Both armies draw their water from it and the streams that join it
emblems.ankara-hill.cubuk: "Ankara’ya doğru güneye akan Çubuk Çayı. İki ordu da suyunu bu çaydan ve ona katılan derelerden alır"

# Bayezid with a few thousand janissaries on the hill until sunset. Bıyıktay names the hill Çataltepe. Drawn on the ridge about 4 km behind the Ottoman line
emblems.ankara-hill.bayezid: "Güneş batana kadar birkaç bin yeniçeriyle tepede Bayezid. Bıyıktay tepeye Çataltepe der. Osmanlı hattının 4 kilometre kadar gerisindeki sırtta gösterilmiştir"

# Timur’s troops surround the hill: Shah Rukh, sent to take Bayezid, with Miran Shah, Sultan Husayn and Süleyman Shah, joined by the horsemen back from the pursuit
emblems.ankara-hill.ring: "Timur’un askerleri tepeyi kuşatır: Bayezid’i yakalamaya gönderilen Şahruh, Miranşah, Sultan Hüseyin ve Süleyman Şah, kovalamadan dönen atlılarla birlikte"

# Timur with the main body. He sends his son Shah Rukh to take Bayezid
emblems.ankara-hill.timur: "Ana kuvvetle Timur. Bayezid’i yakalaması için oğlu Şahruh’u gönderir"

# Timur’s horsemen attack the hill again and again and are driven back by the janissaries
emblems.ankara-hill.ring-assault: "Timur’un atlıları tepeye tekrar tekrar saldırır, yeniçeriler onları geri püskürtür"

# In the afternoon Mehmed Çelebi leaves the field with his troops for Amasya
emblems.ankara-hill.mehmed-leaves: "Öğleden sonra Mehmed Çelebi askerleriyle savaş alanından ayrılıp Amasya’ya gider"

# At sunset Bayezid breaks out to the north-east with about 300 horsemen. Many die of heat and thirst
emblems.ankara-hill.bayezid-flight: "Güneş batarken Bayezid 300 kadar atlıyla kuzeydoğuya doğru çemberi yarar. Birçoğu sıcaktan ve susuzluktan ölür"

# The Chagatai khan Sultan Mahmud, who rides with Timur, pursues Bayezid and takes him about 16 km from the hill, in the Turkish reconstruction
emblems.ankara-hill.mahmud-pursuit: "Timur’un yanındaki Çağatay hanı Sultan Mahmud Bayezid’i kovalar ve Türk anlatımına göre tepeden 16 kilometre kadar uzakta yakalar"

