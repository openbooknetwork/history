image.caption: "หอคอยของสองพี่น้องสคิปิโอใกล้ตาร์ราโก อนุสรณ์ศพโรมันที่ตามธรรมเนียมโยงกับกไนอุสและปูบลิอุส สคิปิโอ ภาพพิมพ์หินในหนังสือ Recuerdos y bellezas de España ค.ศ. 1839"
