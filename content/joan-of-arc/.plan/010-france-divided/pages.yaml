- id: murder-in-paris
  title: "Murder in Paris"
  date: "November 1407"
  when: 1407-11
  tells: >-
    Men of John the Fearless, Duke of Burgundy, cut down Louis, Duke of Orléans, the mad king's brother, in a Paris
    street, and the duke owns the deed. The quarrel of the two princely houses becomes the civil war of Armagnacs
    and Burgundians, the parties that hold France apart for the rest of the story.
