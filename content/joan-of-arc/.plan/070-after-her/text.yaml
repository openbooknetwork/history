section:
  years: "1431 – 1456, and a closing page to 1920"
  opens: >-
    On 30 May 1431 she is dead, burned at the Old Market of Rouen as a relapsed heretic. The English hold Normandy,
    Paris and the land about it, Calais and Gascony; the Duke of Burgundy, Philip the Good, is still their ally and
    holds Picardy, Arras, Flanders and the two Burgundies. Compiègne, Beauvais and the towns between the Oise and Paris
    that came over in 1429 hold for Charles VII, crowned at Reims in July 1429. Henry VI is king of France by the
    Treaty of Troyes and not yet crowned in France. The reader has followed her trial at Rouen and knows Pierre
    Cauchon, Bedford, Richemont, the Bastard of Orléans, L'Isle-Adam, Talbot and Matthew Gough from earlier sections,
    and Isabelle Romée as her mother.
  introduces: [Notre-Dame, Viscount Lisle, Sir Thomas Beaumont, the Porte Saint-Jacques, the Bastille Saint-Antoine, the Tour du Velin, Épinay, Charenton, Brie-Comte-Robert, Saint-Germain-en-Laye, Pontoise, Caudebec, the Pays de Caux, Margaret of Anjou, the Truce of Tours, Pont-de-l'Arche, Conches, Gerberoy, Edmund Beaufort, Duke of Somerset, Fresnay, Domfront, Vire, Falaise, Saint-Sauveur, Cherbourg, Sir Thomas Kyriell, "John, Count of Clermont", Valognes, the Fords of Saint-Clément, Carentan, Isigny, Formigny, Saint-Lô, Fougères, Dunois, Bayonne, the Médoc, Coëtivy, Castillon, Branne, the Lidoire, Mont Horable, Jean Bureau, the lord of Montauban, the lord of La Hunaudaye, Guillaume Bouillé, Guillaume d'Estouteville, Jean Bréhal, Calixtus III, Guillaume Chartier, Richard Olivier de Longueil, Jean d'Arc, Pierre d'Arc, Lyon, Aeneas Sylvius Piccolomini, Antoninus of Florence, Shakespeare, "Southey, Hallam, Carlyle, De Quincey", Félix Dupanloup, Leo XIII, Pius X, Benedict XV, Rome, Renoux, the Hundred Years' War]
  hands_on: >-
    The story ends here. The war is over: of all the lands the English held in France, Calais alone is left after
    19 October 1453; Charles VII holds Paris, Normandy and Gascony, and Burgundy has been his ally since Arras. The
    sentence of 1431 has been null since 7 July 1456. The closing page carries what is recorded of her memory to her
    canonisation on 16 May 1920 and claims nothing of what she means.
  left_out:
    - { event: "070.13, English rule in France limited to Normandy and a strip of Gascony by 1444", why: "it rests on Wikipedia (Wagner) alone and stands in the Thin part of the digest; rules.md leaves it out. The map of 1444 to 1453 shows as English only the towns and lands the sources of the reconquest name." }
    - { event: "070.46 in part, that the play at the bridge of Orléans on 8 May 1435 was the Mistère du siège d'Orléans", why: "it rests on Wikipedia (Hamblin) alone and stands in the Thin part; rules.md leaves out the name of the play of 8 May 1435. The payment for 'a certain mistère' is told, and the play is not named." }
    - { event: "070.50, the feast of Orléans stripped of its church ceremony in 1791, stopped in 1793 and restored in 1803", why: "it rests on Anatole France's Life, read only for where to look, and on Wikipedia citing France and an unread Warner; rules.md leaves it out." }
pages:
  burgundy-changes-sides:
    account: >-
      Seven months after her death Henry VI, ten years old, is crowned King of France in Notre-Dame de Paris by
      Cardinal Beaufort (the Cardinal of Winchester). The Bourgeois of Paris and Ramsay give Sunday 16 December 1431;
      Monstrelet has him go from the Palace to Notre-Dame on the 17th (070.1). The body gives 16 December and names
      Monstrelet's 17th. Paris still holds for him, and the English and Burgundian alliance still stands. It breaks
      at Arras in 1435. The congress sits at Arras in the summer; the English envoys leave on 6 September, and
      Charles VII's envoys and Philip the Good conclude a separate peace, which the Duke seals in his letters of 21
      September 1435 in the abbey of Saint-Vaast (070.3, Beaucourt and Monstrelet). He swears "good peace" with
      Charles VII, an apology for the murder of his father John the Fearless at Montereau in 1419 is given and
      accepted (Ramsay), and the cardinals absolve him of his oaths to the English (070.4). Bedford, the regent, dies
      at Rouen on the night of 14–15 September 1435, while the congress sits, and the news reaches Arras on the 16th
      (070.2). With the Treaty of Arras the English stand alone against France and Burgundy; Ramsay dates the last
      stage of the Hundred Years' War from it (070.5; tell Ramsay's judgement with his name). Meanwhile Saint-Denis,
      taken by the French on 1 June 1435, is besieged by the English and Burgundians, and its garrison marches out
      with the honours of war on 4 October 1435 (070.6, Ramsay's dates; Monstrelet tells the French storm of the
      town without a date). The map changes in allegiance, not in land: the Burgundian zone is the same before and
      after Arras, now Charles VII's ally's, and the English hold Paris, the land about it and Normandy as in 1429.
      Say once in this chapter, here, that the borders the map draws are approximate: the sources give these holdings
      by town and by province, never by a line.
    files:
      - { file: .references/archive.org-download-lancasterandyor00ramsgoog-lancasterandyor00ramsgoog-djvu.txt.txt, read: "Ramsay vol. 1, ch. 29, the coronation, lines 26860-26900; ch. 32, the Congress of Arras, Bedford's death and Saint-Denis, lines 28990-29320" }
      - { file: .references/archive.org-rt-histoire-de-charles-vii-v-2-Beaucourt-20Histoire-20de-20Charles-20VII-20v-202-djvu.txt.txt, read: "Beaucourt vol. 2, book 2 ch. 12, Le congrès d'Arras, lines 29440-30060" }
      - { file: .references/archive.org-download-journaldunbourge54182gut-54182-0.txt.txt, read: "the Bourgeois of Paris, §592, 1431, the coronation, lines 15740-15800" }
      - { file: .references/archive.org-download-chroniclesengue06johngoog-chroniclesengue06johngoog-djvu.txt.txt, read: "Monstrelet book 2, Henry VI's coming to Paris and the coronation, lines 41860-41910; ch. 174, the French take Saint-Denis, lines 44470-44490" }
      - { file: .references/archive.org-download-chroniclesengue07johngoog-chroniclesengue07johngoog-djvu.txt.txt, read: "Monstrelet book 2, ch. 186-187, the English leave Arras and the peace is concluded (the table of chapters at line 169 leads to them)" }
    passages: ["the Bourgeois of Paris, §592 (1431)", "Monstrelet, book 2, Henry VI's coronation in Paris", "Monstrelet, book 2, ch. 187", "Ramsay, Lancaster and York, vol. 1, ch. 32", "Beaucourt, Histoire de Charles VII, vol. 2, book 2 ch. 12"]
    disputes:
      - { claim: "070.1", how: "the body gives Sunday 16 December 1431, the day of the Bourgeois and Ramsay, and names Monstrelet's 17th in a clause, since the page turns on the coronation." }
      - { claim: "070.6", how: "single: Ramsay's dates of 1 June and 4 October 1435 are told as his; Monstrelet tells the French capture without a date." }
    sources:
      - "J. H. Ramsay, Lancaster and York, vol. 1 (Oxford, Clarendon Press, 1892), ch. 29 and 32."
      - "G. du Fresne de Beaucourt, Histoire de Charles VII, vol. 2 (Paris, 1882), book 2 ch. 12, Le congrès d'Arras."
      - "A. Tuetey (ed.), Journal d'un bourgeois de Paris, 1405–1449 (Paris, 1881), §592."
      - "E. de Monstrelet, Chronicles, tr. T. Johnes (London, Bohn, 1849), book 2."
    images:
      - { name: henry-vi-paris-coronation-miniature, shows: "a fifteenth-century miniature of Henry VI crowned King of France in Notre-Dame de Paris in December 1431", "on": marker notre-dame-1431 }
      - { name: arras-peace-1435-miniature, shows: "a fifteenth-century miniature of the Congress or the peace of Arras of 1435", "on": marker arras-1435 }
  paris-opens:
    account: >-
      After Arras the English lose ground round Paris and in Normandy, as Ramsay alone gives it (070.7, single): Dieppe
      on 29 October 1435, and soon the whole Pays de Caux but Caudebec; early in 1436 Pontoise, Charenton,
      Brie-Comte-Robert, Saint-Germain-en-Laye, Corbeil and Vincennes. Paris is cut off; the force of Arthur de
      Richemont, Constable of France for Charles VII, with the Bastard of Orléans and the lord of L'Isle-Adam, now
      Charles VII's man, marches from Pontoise (070.9; Monstrelet). In April 1436 they storm Saint-Denis; near Épinay,
      a little beyond it, Sir Thomas Beaumont's sortie from Paris is routed and he is taken, and English survivors who
      held the Tour du Velin at Saint-Denis are taken and put to death (070.8). Ramsay gives 10 April for Beaumont's
      defeat and Monstrelet the Thursday before the entry into Paris; no account leads, so the body gives April 1436
      and no day. On Friday 13 April 1436 Richemont's force comes before the Porte Saint-Jacques; the gates are locked,
      the citizens let down ladders, L'Isle-Adam climbs with the banner of Charles VII and a proclamation of amnesty,
      the gate is opened and the constable enters Paris (070.10; Ramsay, the Bourgeois, who has the Friday after Easter,
      and Monstrelet). The English garrison under Lord Willoughby and Louis of Luxembourg, Bishop of Thérouanne, shuts
      itself in the Bastille Saint-Antoine, treats with the constable and marches out under safe-conduct on 17 April,
      hooted by the Parisians (070.11). That they went by land and water to Rouen is Monstrelet's alone and is told
      with his name. Paris, Henry VI's capital since 1422, is Charles VII's. The map shows the English lands after 13
      April 1436, Normandy without Dieppe and the Caux, most of Maine, Calais and Gascony, drawn from Ramsay's list of
      places lost and approximate; Maine is kept English from Lowell's provinces of 1428, and Le Crotoy, which no
      source names after 1430, is left out. The line of the constable's march joins Pontoise and Saint-Denis, since no
      road is given, and stops there: no source gives the way round to the gate of the left bank. The markers of the
      Porte Saint-Jacques, the Bastille Saint-Antoine and Saint-Denis wait under the marker of Paris at the opening
      view, so the text links each of them.
    files:
      - { file: .references/archive.org-download-lancasterandyor00ramsgoog-lancasterandyor00ramsgoog-djvu.txt.txt, read: "Ramsay vol. 1, ch. 32, the loss of Caux and of the places round Paris and the loss of Paris, lines 29330-29460" }
      - { file: .references/archive.org-download-journaldunbourge54182gut-54182-0.txt.txt, read: "the Bourgeois of Paris, §690-695, 1436, lines 17540-17660" }
      - { file: .references/archive.org-download-chroniclesengue07johngoog-chroniclesengue07johngoog-djvu.txt.txt, read: "Monstrelet book 2, ch. 198, the city of Paris is reduced to the obedience of Charles, lines 4495-4580" }
    passages: ["Ramsay, Lancaster and York, vol. 1, ch. 32, the loss of Paris", "the Bourgeois of Paris, §691-695 (1436)", "Monstrelet, book 2, ch. 198"]
    disputes:
      - { claim: "070.8", how: "Ramsay's 10 April and Monstrelet's Thursday before the entry differ, and no account leads: the body gives April 1436, days before Paris opened, and names no day." }
      - { claim: "070.7", how: "single: the places lost after Arras are told as Ramsay's list, with his name." }
      - { claim: "070.11", how: "the Bastille and 17 April are told plainly; the road by land and water to Rouen is told as Monstrelet's." }
    sources:
      - "J. H. Ramsay, Lancaster and York, vol. 1 (Oxford, Clarendon Press, 1892), ch. 32."
      - "A. Tuetey (ed.), Journal d'un bourgeois de Paris, 1405–1449 (Paris, 1881), §691-695."
      - "E. de Monstrelet, Chronicles, tr. T. Johnes (London, Bohn, 1849), book 2, ch. 198."
    images:
      - { name: paris-1436-recovery-miniature, shows: "a fifteenth-century miniature of Charles VII's men entering Paris in April 1436", "on": marker paris-1436 }
      - { name: bastille-saint-antoine-view, shows: "the Bastille Saint-Antoine in an old view or plan of Paris", "on": marker bastille-1436 }
  normandy-won-back:
    account: >-
      A general truce is made at Tours in May 1444, at the time of Margaret of Anjou's betrothal to Henry VI by proxy
      there on 24 May (070.12). Ramsay and Wikipedia have it signed four days after the betrothal, on 28 May, and the
      text of the truce in Monstrelet is given at Tours on 20 May: the body gives May 1444. On 24 March 1449 an English
      force drawn from the garrisons of Normandy under François de Surienne seizes and sacks Fougères in Brittany, and
      French captains take Pont-de-l'Arche, Conches and Gerberoy in reprisal (070.14): the truce is broken. Charles
      VII's armies overrun Normandy. Rouen rises on 19 October 1449; Edmund Beaufort, Duke of Somerset, signs a
      capitulation on 29 October and marches out on 4 November, and Charles VII enters on 10 November 1449 (070.15;
      Lowell dates the entry by the capitulation, October). At the close of 1449, by Ramsay's list (070.16, single),
      English Normandy is cut down to Fresnay, Domfront, Vire, Falaise, Honfleur, Caen, Bayeux, Saint-Sauveur and
      Cherbourg. Sir Thomas Kyriell lands at Cherbourg about 15 March 1450 with the last English relief army, takes
      Valognes, is joined by men of the garrisons under Matthew Gough, crosses the Fords of Saint-Clément on 14 April
      and passes Carentan for Formigny (070.17; Ramsay). John, Count of Clermont, son of the Duke of Bourbon, commanding
      in Lower Normandy, follows from Carentan by Isigny, and Richemont comes from Saint-Lô (070.18). The battle of
      Formigny is fought on 15 April 1450 (Oman, Ramsay, Beaucourt; Monstrelet's continuator has the 18th). The English
      stand with a stream and orchards behind them and archers in front behind stakes; Oman throws out a wing-guard
      under Gough beyond their left flank, Ramsay rests their right on a bridge, and Monstrelet's continuator has the
      constable's archers attack their left wing at a bridge. After about three hours of skirmishing the French bring
      up two culverins, which English archers rush out and take. Richemont's coming decides the day; Oman brings him on
      the English flank, Ramsay has him send a detachment to his left to join Clermont and himself advance on the
      centre, and Monstrelet's continuator has Kyriell fall back to the stream and the village (070.19: tell the three
      accounts with their authors). Kyriell is taken and Gough escapes to Bayeux. The figures stand on the card and in
      the text with their authors (070.20, 070.21, 070.22). Caen, besieged from early June, capitulates by articles of
      24 June; on 1 July Richemont escorts Somerset out and Dunois takes possession, and Charles VII enters on 6 July
      (070.23). Cherbourg, the last English hold in Normandy, is given up after a month's siege on 12 August 1450, and
      English Normandy is at an end (070.24). The map shows the English Normandy of the close of 1449, drawn round
      Ramsay's towns and approximate, with Rouen, Caen and Cherbourg as markers in the colour of the king who took
      them; the next page shows Normandy French. The lines of Kyriell's, Clermont's and Richemont's marches join the
      places the authors name, since no road is given.
    files:
      - { file: .references/archive.org-download-cu31924088011436-cu31924088011436-djvu.txt.txt, read: "Ramsay vol. 2, ch. 5, the Truce of Tours, lines 6240-6270; ch. 7, Fougères, Rouen and the close of 1449, lines 8000-8530; ch. 8, Kyriell, Formigny, Caen and Cherbourg, lines 8775-9115, with the notes" }
      - { file: .references/archive.org-download-historyofartofwa0002char-historyofartofwa0002char-djvu.txt.txt, read: "Oman vol. 2, book 14 ch. 2, the battle of Formigny, lines 19855-19985" }
      - { file: .references/archive.org-rt-histoire-de-charles-vii-v-5-Beaucourt-20Histoire-20de-20Charles-20VII-20v-205-djvu.txt.txt, read: "Beaucourt vol. 5, book 5 ch. 1, the conquest of Normandy, lines 210-2360" }
      - { file: .references/archive.org-download-chroniclesengue07johngoog-chroniclesengue07johngoog-djvu.txt.txt, read: "Monstrelet book 2, ch. 275, the text of the truce, lines 11560-11640; book 3 (continuation), ch. 29, Formigny, lines 14235-14320" }
    passages: ["Ramsay, Lancaster and York, vol. 2, ch. 5, ch. 7 and ch. 8", "Oman, Art of War, vol. 2, book 14 ch. 2, Formigny", "Beaucourt, Histoire de Charles VII, vol. 5, book 5 ch. 1", "Monstrelet's continuator, book 3, ch. 29"]
    disputes:
      - { claim: "070.12", how: "the day of the truce is disputed and no account leads: the body gives May 1444." }
      - { claim: "070.18", how: "the body gives 15 April 1450 with Oman, Ramsay and Beaucourt, and names the 18th of Monstrelet's continuator in a clause." }
      - { claim: "070.19", how: "where Richemont came on the field: Oman's flank, Ramsay's detachment to the left and attack on the centre, and Monstrelet's continuator's archers at the bridge and Kyriell's fall back to the stream, each with its author." }
      - { claim: "070.20", how: "the strengths as each author gives them: Oman's some 4,500 English and Clermont's about 3,000 with two guns and Richemont's 1,200 more; Ramsay's 2,500 with Kyriell and perhaps 1,000 from the garrisons, who halves the French writers' figures; Beaucourt's four to five thousand with Kyriell; the heralds' report in Monstrelet's continuator, not more than 3,000 French against six to seven thousand English." }
      - { claim: "070.21", how: "the English dead: 3,774 by the French heralds' count the next day (Oman, Beaucourt; 3,773 in Monstrelet's continuator, buried in fourteen pits), with 1,200 to 1,400 prisoners (Beaucourt); Ramsay holds the English reckoning of 3,000 an exaggeration." }
      - { claim: "070.22", how: "open: the French losses cannot be ascertained (Oman); the French annalists name twelve men-at-arms, and Beaucourt ten or twelve men. The text says the loss is not known beyond those claims." }
      - { claim: "070.16", how: "single: the places of the close of 1449 are Ramsay's list, with his name." }
      - { claim: "070.15", how: "the body gives Ramsay's and Beaucourt's days; Lowell's October is his dating by the capitulation and is not told as a dispute." }
    sources:
      - "J. H. Ramsay, Lancaster and York, vol. 2 (Oxford, Clarendon Press, 1892), ch. 5, 7 and 8."
      - "C. Oman, A History of the Art of War in the Middle Ages, vol. 2 (London, 1924), book 14 ch. 2."
      - "G. du Fresne de Beaucourt, Histoire de Charles VII, vol. 5 (Paris, 1890), book 5 ch. 1."
      - "E. de Monstrelet, Chronicles, tr. T. Johnes (London, Bohn, 1849), book 2, ch. 275, and the continuation, book 3, ch. 29."
    images:
      - { name: formigny-battle-miniature, shows: "a fifteenth-century miniature of the battle of Formigny, 1450", "on": card formigny-1450 }
      - { name: rouen-1449-entry-miniature, shows: "a fifteenth-century miniature of Charles VII's entry into Rouen on 10 November 1449", "on": marker rouen-1449 }
      - { name: fougeres-castle, shows: "the castle of Fougères in Brittany", "on": marker fougeres-1449 }
  castillon:
    account: >-
      In 1451 the French conquer Gascony: Bordeaux treats on 12 June and is delivered to Dunois on 30 June (Ramsay and
      Beaucourt; Oman has Bordeaux fall in August 1451), and Bayonne, besieged from 6 or 7 August, is entered on 20
      August (Ramsay; Beaucourt has the capitulation signed on the 20th and Dunois entering on the 21st) (070.25).
      Calais alone is left to the English on the mainland (070.26). Bordeaux calls them back: John Talbot, Earl of
      Shrewsbury, commissioned King's Lieutenant of Aquitaine on 2 September 1452 (070.27), lands in the Médoc on 17
      October 1452; the Bordelais rise, and Bordeaux opens to him and takes the French seneschal Coëtivy (070.28). The
      day Bordeaux was occupied differs, the 20th by the English constable's accounts in Ramsay and the 23rd in
      Beaucourt, and the body gives October 1452. In July 1453 the French besiege Castillon on the Dordogne, from 13 or
      14 July, and entrench their artillery park in a camp east of the town by the Lidoire under Jean Bureau, with
      the Bretons on the Mont Horable to the north-east (070.29; Ramsay; Beaucourt has the camp two kilometres east of
      the town between the Dordogne and the Lidoire). Talbot comes from Bordeaux at daybreak on 17 July (Ramsay
      supposes by the crossing of the Dordogne at Branne), takes the abbey west of the town, later the priory of
      Saint-Florent, and attacks the camp. For about an hour the English fight at the palisades under the French guns;
      the Breton men-at-arms under the lords of Montauban and La Hunaudaye come down on the English left flank and the
      French sally from the camp (070.30; Ramsay, Beaucourt and Monstrelet's continuator; Oman tells the column blown
      to pieces by the guns and names no Bretons). Talbot is killed, and his son Viscount Lisle with him (070.33); the
      manner of his death is told as each author tells it. The figures stand on the card and in the text with their
      authors (070.31, 070.32, 070.34). Castillon yields the next day; Bordeaux, blockaded from 1 August, treats in
      early October, and Charles VII's officers take possession on 19 October 1453, which ends the war (070.35). The
      map shows the English Gascony of October 1452 to October 1453, Bordeaux, the Médoc and the Bordelais up the
      Dordogne to Castillon, with Calais, drawn approximately from the places the sources name; Bayonne and Bordeaux
      are markers in the colour of the king who took them. Talbot's two lines join the places Ramsay names; the
      crossing at Branne is Ramsay's inference, and the text says so.
    files:
      - { file: .references/archive.org-download-cu31924088011436-cu31924088011436-djvu.txt.txt, read: "Ramsay vol. 2, ch. 10, the loss of Aquitaine, Bordeaux recovered, the battle of Castillon and the end of the war, lines 10960-11680, with the notes" }
      - { file: .references/archive.org-rt-histoire-de-charles-vii-v-5-Beaucourt-20Histoire-20de-20Charles-20VII-20v-205-djvu.txt.txt, read: "Beaucourt vol. 5, book 5 ch. 2, Gascony in 1451, lines 3080-3260; book 5 ch. 9, Talbot's return, Castillon and Bordeaux, lines 16260-17470" }
      - { file: .references/archive.org-download-historyofartofwa0002char-historyofartofwa0002char-djvu.txt.txt, read: "Oman vol. 2, book 14 ch. 2, Castillon, lines 20010-20055" }
      - { file: .references/archive.org-download-chroniclesengue07johngoog-chroniclesengue07johngoog-djvu.txt.txt, read: "Monstrelet's continuator, book 3, the siege of Castillon and the death of the Earl of Shrewsbury, lines 17370-17480" }
    passages: ["Ramsay, Lancaster and York, vol. 2, ch. 10", "Beaucourt, Histoire de Charles VII, vol. 5, book 5 ch. 2 and ch. 9", "Oman, Art of War, vol. 2, book 14 ch. 2, Castillon", "Monstrelet's continuator, book 3, Shrewsbury slain"]
    disputes:
      - { claim: "070.25", how: "Bordeaux is delivered on 30 June 1451 in Ramsay and Beaucourt; Oman's August 1451 is named in a clause." }
      - { claim: "070.28", how: "the body gives October 1452 for Bordeaux's opening, and names the 20th (Ramsay, from the English constable's accounts) and the 23rd (Beaucourt) only if it gives a day." }
      - { claim: "070.31", how: "Talbot's force as each gives it: 500 men-at-arms and 800 archers from Aeneas Sylvius, Ramsay's most likely estimate; about 7,000, Beaucourt, who lists the chroniclers' 800 to 1,000 horse and 4,000 to 5,000 foot up to Basin's 10,000; 800 to 1,000 horse followed by four to six thousand foot, Monstrelet's continuator; Oman's army of 1452, less than 3,000." }
      - { claim: "070.32", how: "the French as each gives them: about 1,800 lances with francs-archers, Beaucourt; 1,600 to 1,800 men-at-arms and archers, Monstrelet's continuator; 700 sappers or gunners under the Bureau brothers, Monstrelet's continuator and Ramsay; the guns more than a hundred, it is said, Oman, and three hundred, Beaucourt." }
      - { claim: "070.33", how: "the manner of Talbot's death as each tells it: mortally wounded by a cannon-ball, Oman; his palfrey felled by a cannon-ball that shattered his knee and he trodden underfoot, Ramsay; a culverin shot in the leg and French archers, Beaucourt; his hackney struck down by a culverin-ball and he killed as he lay, Monstrelet's continuator." }
      - { claim: "070.34", how: "single: four or five hundred English dead buried, Monstrelet's continuator, with his name." }
    sources:
      - "J. H. Ramsay, Lancaster and York, vol. 2 (Oxford, Clarendon Press, 1892), ch. 10."
      - "G. du Fresne de Beaucourt, Histoire de Charles VII, vol. 5 (Paris, 1890), book 5 ch. 2 and ch. 9."
      - "C. Oman, A History of the Art of War in the Middle Ages, vol. 2 (London, 1924), book 14 ch. 2."
      - "E. de Monstrelet, Chronicles, tr. T. Johnes (London, Bohn, 1849), the continuation, book 3."
    images:
      - { name: castillon-battle-miniature, shows: "a fifteenth-century miniature of the battle of Castillon or of Talbot's death, 1453", "on": card castillon-1453 }
      - { name: dordogne-at-castillon, shows: "the Dordogne at Castillon-la-Bataille" }
  the-retrial:
    account: >-
      Once Rouen is his, Charles VII commissions Guillaume Bouillé, a doctor of theology, in February 1450 to enquire
      into the trial of 1431 (Murray's note has 13 February, Beaucourt 15 February, Lowell February: the body gives
      February 1450); Bouillé hears seven witnesses at Rouen on 4 and 5 March 1450, and the matter goes no further
      (070.36). In late April and May 1452 the papal legate, Cardinal Guillaume d'Estouteville, with the inquisitor
      Jean Bréhal, opens a second enquiry at Rouen and hears some twenty witnesses (070.37). Whose move it was is
      disputed: on the legate's own authority, Beaucourt; at the formal request of Isabelle Romée, Murray's
      introductory note; Lowell has the petition urged in Charles VII's name for five years and put in the mother's
      name, with her sons Pierre and Jean, only in 1455. Pope Calixtus III's rescript of 11 June 1455 authorises the
      revision and names as judges Jean Juvénal des Ursins, Archbishop of Reims, Guillaume Chartier, Bishop of Paris,
      and Richard Olivier de Longueil, Bishop of Coutances, who take the inquisitor Bréhal with them (070.38). On 7
      November 1455 the retrial opens in Notre-Dame de Paris, where Isabelle Romée, in mourning, with her sons Jean and
      Pierre, presents the rescript and her petition in tears before the judges; a second public sitting follows on
      17 November (070.39). She had lived at Orléans for fifteen years by then, as Lowell has it (070.40, single), and
      men of Orléans came with her. Witnesses are heard at Domrémy and Vaucouleurs in January and February 1456, at
      Orléans in February and March, at Paris in April and May and at Rouen in December and May, and Jean d'Aulon at
      Lyon on 28 May 1456 (070.41). How many is told as each source counts them (070.42). On Wednesday 7 July 1456, at
      eight in the morning, in the great hall of the archbishop's palace at Rouen, the judges pronounce the sentence,
      read by the Archbishop of Reims: the trial of 1431, the abjuration and the execution are null; it is published
      that day at Saint-Ouen and the next in the Old Market, where a cross is set up (070.43). Quote the sentence's
      words in Murray's translation, "null, non-existent, without value or effect", or in Lowell's, "null, invalid,
      and void", with the translator named; Thurston calls the court an appellate court constituted by the pope
      (070.44). The text tells what the court decided and claims no more for it. The map shows the kingdom with Calais
      alone English and marks the places where the enquiries sat and the witnesses were heard; Bar and Lorraine are
      drawn as on the pages of 1429, approximately, since no source of this section gives their edge in 1456.
