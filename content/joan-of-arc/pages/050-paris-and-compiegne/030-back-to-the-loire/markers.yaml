saint-denis-abbey:
  lnglat: [2.36, 48.936]
  icon: church
  color: france
  image: saint-denis-basilica-04b381
  label: "Saint-Denis"
  note: "Joan offers her whole white armour, with a sword won before Paris, to this abbey's image of Our Lady and its relics, September 1429; she told her judges her voice had bidden her stay here"
lagny-sep-1429:
  lnglat: [2.71, 48.87]
  icon: flag
  color: france
  label: "Lagny"
  note: "Charles VII crosses the Marne here on his way south from Saint-Denis, September 1429, and leaves Ambroise de Loré as its captain"
provins-sep-1429:
  lnglat: [3.3, 48.56]
  icon: flag
  color: france
  label: "Provins"
  note: "Charles VII's army comes here a day after Lagny on its way south, September 1429 (the Journal of the Siege)"
bray-1429:
  lnglat: [3.24, 48.41]
  icon: key
  color: france
  label: "Bray"
  note: "Shut against Charles VII in August, it opens to him in September 1429 and his army crosses here"
sens-sep-1429:
  lnglat: [3.28, 48.2]
  icon: shield-x
  color: english
  label: "Sens"
  note: "Does not open to Charles VII in September 1429, and his army fords the Yonne a little below it (the Journal of the Siege)"
courtenay-1429:
  lnglat: [3.06, 48.04]
  icon: flag
  color: france
  label: "Courtenay"
  note: "A town on Charles VII's way from the Yonne to Montargis and Gien, September 1429 (the Journal of the Siege)"
montargis-1429:
  lnglat: [2.73, 48]
  icon: flag
  color: france
  label: "Montargis"
  note: "A town on Charles VII's way from Courtenay to Gien, September 1429 (the Journal of the Siege)"
gien-disbanded:
  lnglat: [2.63, 47.69]
  icon: flag-off
  color: france
  label: "Gien"
  note: "Charles VII dines here on 21 September 1429 and his army is disbanded: the Duke of Alençon goes home to Beaumont, and other captains to their frontiers"
