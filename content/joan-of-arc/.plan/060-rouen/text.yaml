  the-old-market:
    account: >-
      On the morning of 30 May 1431 Martin Ladvenu, sent by Cauchon, told her she was to die and heard her confession,
      and she received communion; to Cauchon she said, "Bishop, I die through you" (Toutmouillé and Ladvenu in 1450,
      Thurston; 060.58). She was led from the castle to the Old Market under a guard of more than 800 soldiers with axes
      and swords in Massieu, who walked beside her, or several score English soldiers in Lowell (060.59). At about nine
      in the morning, at the Old Market near the church of Saint-Sauveur, she was set on a scaffold, one of three, and
      Nicolas Midi preached (the record, Lowell, Lang; the Bourgeois has the day; 060.60). The sentence declared her a
      relapsed heretic, cut off from the Church and given over to the secular power (060.61). The bailli of Rouen gave
      no sentence: as soon as the church's sentence was read she was taken down and handed to the executioner, which
      Laurent Guesdon, acting for the bailli, and the other witnesses of the retrial held irregular (060.62). She asked
      for a cross; an Englishman made her a small one of wood, Massieu had the cross of Saint-Sauveur brought, and she
      called on Jesus in the fire to the last (060.63). The Bourgeois of Paris reported that when her dress had burned
      the fire was drawn back so the crowd could see her body, and then the executioner burned it to ashes (060.64). Her
      ashes were thrown into the Seine (Guesdon, Lowell, Thurston; 060.65). Whether she said that morning that her voices
      had deceived her is disputed (060.66): the judges' information of 7 June 1431, added to the record, has her say
      so; Lowell sees no reason to think it altered in the recording; Thurston says a doubt must always be felt, and
      gives Manchon's word that to the last she said her voices came from God. The map shows her road from the castle
      to the Old Market, a line that joins the two places since no source gives the streets.
