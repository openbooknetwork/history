# Build every story with harita and publish dist/ to GitHub Pages at openhistoryatlas.org when a v* tag is pushed.
name: Deploy
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # the elevation tiles harita downloads on the first build of an area, kept between runs
      - uses: actions/cache@v4
        with:
          path: .cache/harita
          key: elevation-${{ hashFiles('content/*/story.yaml', 'content/*/pages/**/page.yaml') }}
          restore-keys: elevation-
      - run: npm run build
      - run: cp CNAME dist/CNAME
      # enables Pages with the Actions source on first use, so no setting has to be flipped by hand
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
