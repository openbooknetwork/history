# Bought and built in two days
markers.rhone-hanno-boats.note: "دو دن میں خریدی اور بنائی گئیں"

# Crosses about 40 km upstream
markers.rhone-hanno-hanno.note: "تقریباً 40 کلو میٹر اوپر کی طرف پار کرتا ہے"

# Fortified camp on the east bank
markers.rhone-hanno-volcae.note: "مشرقی کنارے پر قلعہ بند کیمپ"

# Hanno in position at dawn
