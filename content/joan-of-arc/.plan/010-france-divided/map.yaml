    Burgundy: "shown by the burgundy zone"
two-kings:
  bbox: [-1.2, 46.5, 3.6, 49.4]
  zones: [france-1420, english-1420, burgundy-1420, brittany-1407]
  routes:
    - id: dauphin-1421-bauge
      family: france
      stations: [Le Lude, Baugé]
      passage: "Wylie and Waugh 3, ch. 69, l. 16848 to 16851 (on Good Friday the Dauphin's army is at Le Lude on the Loir and pushes on to Baugé the same day)"
      basis: sourced
      why: "drawn in france, as the brief's Map part says for a route of the Dauphin's army with its Scots. Both stations are Wylie and Waugh's; the road between them is short and drawn direct."
    - id: clarence-1421-bauge
      family: english
      stations: [Beaufort-en-Vallée, the bridge over the Couasnon, Vieil-Baugé]
      passage: "Ramsay 1, ch. 20, l. 18961 to 18975 (Clarence at Beaufort-en-Vallée, the allies at Vieil-Baugé); Cagny, Baugé, l. 5945 to 5950 (Clarence before the castle of Beaufort); Wylie and Waugh 3, ch. 69, note, l. 17104 (the fight beyond the bridge, on the low hill north-east of the church)"
      basis: sourced
      why: "the three stations are named in the passages; the line between them is short and drawn direct."
  markers:
    meaux-1422: { name: Meaux, what: "Henry V besieges the town on the Marne from October 1421 to May 1422, and takes there, Oman says, the dysentery that kills him, about 48.960 N 2.878 E. In the colour of english", basis: sourced, rank: 3 }
    vincennes-1422: { name: Vincennes, what: "Henry V dies in the castle on 31 August 1422, about 48.843 N 2.435 E. In the colour of english", basis: sourced, rank: 3 }
    paris-1422: { name: Paris, what: "Charles VI dies in his hôtel of Saint-Pol on 21 October 1422; Bedford rides back into the city as regent, about 48.853 N 2.362 E. In the colour of english", basis: sourced, rank: 3 }
    saint-denis-1422: { name: Saint-Denis, what: "Charles VI is buried in the abbey on 11 November 1422 and a herald cries Henry VI King of France and England, about 48.935 N 2.360 E. In the colour of english", basis: sourced, rank: 4 }
    mehun-1422: { name: Mehun-sur-Yèvre, what: "the Dauphin takes the title of King, Charles VII, on 30 October 1422 (Beaucourt), about 47.144 N 2.215 E. In the colour of france", basis: sourced, rank: 4 }
    bourges-1422: { name: Bourges, what: "where Charles VII makes his long stays, the cause of his enemies' nickname, the \"King of Bourges\" (Beaucourt), about 47.081 N 2.399 E. In the colour of france", basis: sourced, rank: 3 }
  unmarked:
    Baugé: "the battle card stands on the field by the church of Vieil-Baugé"
    Le Lude: "the starting point of the Dauphin's route to Baugé"
    Beaufort-en-Vallée: "the starting point of Clarence's route"
    the Couasnon: "the river at the bridge, a station of Clarence's route under the Baugé card"
    Troyes: "in the treaty's name only"
    Verneuil: "named ahead of the next page, which marks it"
    Cravant: "named ahead of the next page, which marks it"
    the Loire: "the river is on the base map; the two kings' lands meet along it"
    the Marne: "the river is on the base map, at the Meaux marker"
    Normandy: "shown by the english zone"
    Champagne: "shown by the english zone"
    Anjou: "the province of Baugé, inside the france zone"
    Dauphiné: "shown by the france zone, outside the frame"
cravant-and-verneuil:
  bbox: [0.0, 47.0, 4.4, 49.3]
  zones: [france-1422, english-1420, burgundy-1420, brittany-1407]
  routes:
    - id: salisbury-1423-cravant
      family: english
      stations: [Auxerre, the right bank of the Yonne, Champs, the left bank of the Yonne, the bridge of Cravant]
      passage: "Ramsay 1, ch. 22, l. 21446 to 21462 (the English and Burgundians join at Auxerre, march out on 30 July up the right bank of the Yonne, cross to the left bank probably at Champs, march up to the bridge of Cravant, wade the river and carry the bridge)"
      basis: reconstruction
      why: "the stations and the two banks are Ramsay's, and the Yonne gives the line; the crossing to the left bank is at Champs only 'probably', in Ramsay's word, so the line is a reconstruction. The route ends on the left bank at the bridge, across the river from the French, who stood between the walls of Cravant and the water."
    - id: bedford-1424-verneuil
      family: english
      stations: [Ivry, Verneuil]
      passage: "the Bourgeois §405 (the regent follows the French day and night until the Thursday after mid-August); Beaucourt 2, book 2 ch. 1, l. 600 to 606 (Bedford, having taken Ivry, marches on)"
      basis: reconstruction
      why: "the two ends are sourced; no source read gives the road between them, so the line runs direct."
    - id: france-1424-verneuil
      family: france
      stations: [Tours, Nonancourt, Verneuil]
      passage: "Cagny, the battle of Verneuil, l. 6562 to 6576 (the lords of France and Scotland set out from Tours for Ivry and turn to Verneuil); Beaucourt 2, book 2 ch. 1, l. 600 to 604 (the army comes as far as Nonancourt and marches on Verneuil in place of Ivry)"
      basis: reconstruction
      why: "the three stations are Cagny's and Beaucourt's; the road from Tours to Nonancourt is not given, so the line runs direct, and the turn back west from Nonancourt to Verneuil is Beaucourt's."
  markers:
    auxerre-1423: { name: Auxerre, what: "the Burgundian town where Salisbury's English and the Burgundians join, July 1423, about 47.798 N 3.567 E. In the colour of burgundy", basis: sourced, rank: 3 }
    cravant-1423: { name: Cravant, what: "the English and Burgundians wade the Yonne and carry the bridge, the garrison sallies, and the army of Charles VII breaks, 31 July 1423; Darnley loses an eye and is taken, about 47.683 N 3.689 E. In the colour of burgundy", basis: sourced, rank: 5 }
    ivry-1424: { name: Ivry, what: "the castle Bedford besieges in summer 1424, the French army's first goal, about 48.885 N 1.461 E. In the colour of english", basis: sourced, rank: 3 }
    verneuil-1424: { name: Verneuil, what: "the French take the town in August 1424, by a ruse (the Bourgeois, Beaucourt) or opened by its townsmen to the Duke of Alençon (Cagny); the slaughter after the battle is greatest at its moat, about 48.739 N 0.928 E. In the colour of france", basis: sourced, rank: 3 }
  unmarked:
    Tours: "a station of the French army's route"
    Nonancourt: "a station of the French army's route"
    Champs: "where Salisbury's route probably crosses the Yonne (Ramsay), a station of the route"
    Bourges: "where Lang has Charles VII linger after Verneuil, told in a clause; marked on two-kings"
    Chinon: "where Lang has Charles VII linger, told in a clause; marked in 020 for Joan's arrival"
    Gien: "where Lang has Charles VII linger, told in a clause; marked in a later section"
    Troyes: "where Bedford marries Anne of Burgundy in June 1423, told in a clause; marked on normandy-and-troyes for the treaty"
    Montereau: "in a clause on Narbonne's part in the murder; marked on normandy-and-troyes"
    Aumale: "in the count's title only"
    Agincourt: "in Lang's phrase only"
    the Loire: "the river is on the base map"
    the Yonne: "the river is on the base map; Salisbury's route follows it"
    Burgundy: "shown by the burgundy zone"
