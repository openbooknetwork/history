# Charge from the hill
markers.telamon-charge-cavalry.note: "پہاڑی سے دھاوا"

# 40,000 killed, 10,000 captured
markers.telamon-charge-gauls.note: "40,000 مارے گئے، 10,000 قید"

# Taken prisoner
markers.telamon-charge-concolitanus.note: "قید کر لیا گیا"

