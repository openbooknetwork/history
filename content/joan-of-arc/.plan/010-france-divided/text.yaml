    disputes:
      - { claim: "010.60", how: "the body gives Saturday 31 July 1423 with Monstrelet, Beaucourt, Ramsay and Tuetey; Lang's 30 July and the Chronique de la Pucelle's 31 August are not told, since the page does not turn on the day." }
      - { claim: "010.61", how: "the body gives Monstrelet's losses, about 1,200 slain and some 400 gentlemen taken, and the Chronique de la Pucelle's 2,000 to 3,000 killed and taken, each with its name; the strengths of the armies are Thin and not told." }
      - { claim: "010.62", how: "both accounts, each with its author: the ruse of the Scots with bound hands passed off as English prisoners (the Bourgeois, and Beaucourt's ruse) and the townsmen who opened the town to the Duke of Alençon (Cagny)." }
      - { claim: "010.65", how: "the body gives no strength as the truth; the card gives each author's, and the text may say that the counts range from Ramsay's 2,000 or 3,000 English to the Bourgeois's 18,000 French, each named." }
      - { claim: "010.66", how: "the body gives Bedford's letter of two days after (7,262 French dead, in Ramsay) and the Bourgeois's 9,000, each named, with Oman's judgement that Bedford's figure is incredible." }
