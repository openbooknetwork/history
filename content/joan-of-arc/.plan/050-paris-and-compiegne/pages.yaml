- id: back-to-the-loire
  title: "Back to the Loire"
  date: "September 1429"
  when: "1429-09-13"
  tells: She leaves her armour in the abbey of Saint-Denis, the king leads the army back across the Marne at Lagny and the Seine at Bray to Gien, and there on 21 September the army that crowned him is disbanded and Alençon sent home.
