      - { file: .references/archive.org-download-chroniclesengue06johngoog-chroniclesengue06johngoog-djvu.txt.txt, read: "book 2, ch. 52 and ch. 56, lines 38595-38660 and 38840-38927" }
      - { file: .references/archive.org-download-joanofarc00lowe-joanofarc00lowe-djvu.txt.txt, read: "ch. 7, the siege of Orléans, lines 3520-4000" }
      - { file: .references/archive.org-download-historyofartofwa0002char-historyofartofwa0002char-djvu.txt.txt, read: "book 14, ch. 2, the Herrings, lines 19476-19494" }
      - { file: .references/archive.org-download-journaldunbourge54182gut-54182-0.txt.txt, read: "1429, the Herrings, lines 13592-13640" }
