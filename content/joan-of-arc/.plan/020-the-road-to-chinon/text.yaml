  vaucouleurs-again:
    account: >-
      In the winter of 1428-1429 Laxart brought her back: Lang has her at his house at Burey from the first fortnight
      of January and at the house of Henri Le Royer, a cartwright of Vaucouleurs, and his wife Catherine from the first
      week of February; Poulengy has her come back towards the beginning of Lent; the Le Royers said she lived with them
      about three weeks in all. By her own account Baudricourt twice refused to hear her, and the third time listened
      and gave her an escort, as the voice had said. He came to the house with the curé Jean Fournier, who exorcised
      her (Catherine Le Royer, who had it from Joan). Duke Charles II of Lorraine sent her a safe-conduct and had her
      brought to Nancy; he asked her about his health, she asked for his son (his son-in-law René, Lowell) and men to
      take her into France, and he gave her four francs; on the way Jacques Alain and Laxart took her on pilgrimage to
      Saint-Nicolas-de-Port, and she came back to Vaucouleurs. Jean de Metz found her at the Le Royers' and swore to
      take her to the king, and he and Bertrand de Poulengy offered to escort her at their own cost, which the king's
      treasury repaid. The people of Vaucouleurs bought her men's clothes and gear; the horse cost twelve francs,
      paid by Laxart and Jacques Alain and repaid by Baudricourt (Laxart), or about sixteen (Jean de Metz), and Jean
      Morel, by hearsay, said the duke gave her a black horse, which Lowell doubts. Baudricourt gave way with doubt:
      he gave her a sword, made her escort swear to take her well and safely, and said, as Lang gives it, "Go, come
      what may." Why he gave way is not known (Lowell; Lang). The Journal of the Siege tells that on the day of the
      Herrings she knew of the defeat and told Baudricourt; Lowell finds the evidence insufficient though Baudricourt
      came to believe it, Lang notes that it stands only in chronicles of about 1467, and Thurston dates her
      announcement 17 February. The map shows her road from Domrémy by Burey to Vaucouleurs and her journey into
      Lorraine to the shrine and to Nancy; both are reconstructions from the places the witnesses name.
    files:
      - { file: .references/archive.org-download-jeannedarcmaidof028754mbp-jeannedarcmaidof028754mbp-djvu.txt.txt, read: "Part II, the depositions of Jean de Metz, Durand Laxart, Catherine and Henri Le Royer and Bertrand de Poulengy, lines 11590-11930" }
      - { file: .references/sourcebooks.web.fordham.edu-basis-joanofarc-trial.asp.txt, read: "the public examination of 22 February 1431, lines 1185-1215; Champion's sketches of Charles II, Jean de Nouvilonpont and Bertrand de Poulengy, lines 8918-8990" }
      - { file: .references/archive.org-download-joanofarc00lowe-joanofarc00lowe-djvu.txt.txt, read: "ch. 4, Vaucouleurs, lines 1900-2290, with the notes" }
      - { file: .references/archive.org-download-maidoffrancebein00languoft-maidoffrancebein00languoft-djvu.txt.txt, read: "ch. 7, lines 3506-3900, and the notes at lines 14740-14762" }
      - { file: .references/archive.org-download-procsdecondam04joanuoft-procsdecondam04joanuoft-djvu.txt.txt, read: "the Journal du siège, the day of the Herrings, lines 5250-5262" }
