# One story: a timeline shown on one map.
id: viking-age
title: "The Viking Age"
summary: "The raiders, traders and settlers of Scandinavia, from the raid on Lindisfarne in 793 through the Danelaw, Normandy, the Rus' and the North Atlantic to the battles of 1066."
cover: guests-from-overseas-roerich-20cf0d   # Nicholas Roerich, Guests from Overseas, 1901; shown on the main page
span: "793 – 1066"
languages: [en, tr]
default_language: en
labels:
  countries: false

# Map extent for the border data and the opening view: [west, south, east, north]. Reaches Baffin Island and New Brunswick in the west,
# the Caspian in the east, Baghdad in the south and the North Cape.
extent: [-78, 32, 58, 71.5]
# Countries whose land the zones are clipped to. Natural Earth names.
land: [Canada, Greenland, Iceland, Faeroe Is., Norway, Sweden, Åland, Finland, Denmark, United Kingdom, Isle of Man, Jersey,
  Guernsey, Ireland, Portugal, Spain, Gibraltar, Andorra, France, Monaco, Belgium, Luxembourg, Netherlands, Germany, Switzerland,
  Liechtenstein, Austria, Italy, San Marino, Vatican, Malta, Czechia, Slovakia, Hungary, Slovenia, Croatia, Bosnia and Herz., Serbia,
  Montenegro, Kosovo, Albania, Macedonia, Greece, Bulgaria, Romania, Moldova, Ukraine, Belarus, Poland, Lithuania, Latvia, Estonia,
  Russia, Kazakhstan, Georgia, Armenia, Azerbaijan, Turkmenistan, Uzbekistan, Iran, Iraq, Turkey, Cyprus, N. Cyprus, Syria, Lebanon,
  Israel, Palestine, Jordan, Saudi Arabia, Morocco, Algeria, Tunisia, Libya]
# Countries drawn with borders. Everything else inside the extent is left out.
countries: [Canada, United States of America, St. Pierre and Miquelon, Greenland, Iceland, Faeroe Is., Norway, Sweden, Åland, Finland,
  Denmark, United Kingdom, Isle of Man, Jersey, Guernsey, Ireland, Portugal, Spain, Gibraltar, Andorra, France, Monaco, Belgium,
  Luxembourg, Netherlands, Germany, Switzerland, Liechtenstein, Austria, Italy, San Marino, Vatican, Malta, Czechia, Slovakia, Hungary,
  Slovenia, Croatia, Bosnia and Herz., Serbia, Montenegro, Kosovo, Albania, Macedonia, Greece, Bulgaria, Romania, Moldova, Ukraine,
  Belarus, Poland, Lithuania, Latvia, Estonia, Russia, Kazakhstan, Georgia, Armenia, Azerbaijan, Turkmenistan, Uzbekistan, Iran, Iraq,
  Turkey, Cyprus, N. Cyprus, Syria, Lebanon, Israel, Palestine, Jordan, Saudi Arabia, Morocco, Algeria, Tunisia, Libya]

# Zone families. A zone subtracts every zone from a family with a lower priority number.
# Zones in the same family never cut each other, so one family can hold several dated shapes.
families:
  danes:         { priority: 0, color: "#b5352a", color_dark: "#e8695c" }                                 # Denmark, the Danelaw, Sweyn’s England, Cnut’s North Sea empire
  fiveboroughs:  { priority: 0, color: "#b5352a", color_dark: "#e8695c", pattern: dots }            # the Five Boroughs of the Danelaw
  norway:        { priority: 0, color: "#2f6fb0", color_dark: "#6fa6e0" }                                 # Harald Fairhair’s kingdom, then Norway and its lands overseas
  petty:         { priority: 0, color: "#7f8c8d", color_dark: "#aab7b8", aliases: [other] }                  # the Norwegian petty kingdoms that fought Harald Fairhair
  lade:          { priority: 0, color: "#2f6fb0", color_dark: "#6fa6e0", pattern: cross }                 # the jarls of Lade
  swedes:        { priority: 0, color: "#d4a017", color_dark: "#f2c94c" }                                 # the Svear, then Sweden
  gotar:         { priority: 0, color: "#d4a017", color_dark: "#f2c94c", pattern: hatch }                 # the Götar
  rus:           { priority: 0, color: "#1f8a8a", color_dark: "#4fc4c4" }                                 # the Rus’, then Kievan Rus’
  norse:         { priority: 1, color: "#6a3d9a", color_dark: "#a98bd6", pattern: hatch }                 # the Kingdom of Dublin, and the Norse of Ireland before it
  york:          { priority: 1, color: "#8c2f45", color_dark: "#d77589", pattern: hatch }                 # the Kingdom of York
  towns:         { priority: 1, color: "#8c2f45", color_dark: "#d77589", pattern: hatch }                 # Waterford, Wexford and Limerick
  isles:         { priority: 1, color: "#9a6a8a", color_dark: "#cf9cbf" }                                 # the Norse Hebrides, then the Kingdom of the Isles and Man
  orkney:        { priority: 1, color: "#3f4fa0", color_dark: "#8c9ae6", pattern: cross }                 # Norse Orkney and Shetland, then the earldom of Orkney
  faroes:        { priority: 1, color: "#4f6272", color_dark: "#8fa5b8", pattern: dots }                  # the Faroe Islands
  iceland:       { priority: 1, color: "#3fa2d0", color_dark: "#86d0f0", pattern: hatch }                 # the Icelandic Commonwealth
  greenland:     { priority: 1, color: "#3fa2d0", color_dark: "#86d0f0" }                                 # the Norse settlements in Greenland
  normans:       { priority: 1, color: "#c78a1c", color_dark: "#f0b54a", pattern: hatch }                 # Normandy
  normans-italy: { priority: 1, color: "#c78a1c", color_dark: "#f0b54a", pattern: hatch }                 # the Norman lands in southern Italy
  english:       { priority: 2, color: "#3d7a2a", color_dark: "#7cc160" }                                 # Wessex, then the kingdom of England
  mercia:        { priority: 3, color: "#8a3b22", color_dark: "#c9714f", pattern: cross }                 # Mercia, then English Mercia
  northumbria:   { priority: 3, color: "#a0522d", color_dark: "#d98b5f", pattern: dots, aliases: [anglo] } # Northumbria, then Bernicia under the lords of Bamburgh
  eanglia:       { priority: 3, color: "#e2734a", color_dark: "#f7a07c", pattern: hatch }                 # East Anglia
  alba:          { priority: 3, color: "#24456e", color_dark: "#5f8cc0", pattern: dots }                  # the Picts, then Alba and Scotland
  dalriata:      { priority: 3, color: "#5cb89a", color_dark: "#9ae3c8" }                                 # Dál Riata
  strathclyde:   { priority: 3, color: "#4f6272", color_dark: "#8fa5b8", pattern: hatch }                 # Strathclyde
  wales:         { priority: 3, color: "#c2a878", color_dark: "#e2cfa3", pattern: cross }                 # the Welsh kingdoms
  cornwall:      { priority: 3, color: "#5e4630", color_dark: "#9c8164", pattern: hatch }                 # Cornwall
  celts:         { priority: 3, color: "#2e8b57", color_dark: "#5fcf8f", pattern: dots }                  # the Irish kingdoms as one zone, and Brian’s army on the Clontarf plans
  munster:       { priority: 3, color: "#93b02a", color_dark: "#c9e063", pattern: cross }                 # Munster
  leinster:      { priority: 3, color: "#2e8b57", color_dark: "#5fcf8f", pattern: dots }                  # Leinster
  connacht:      { priority: 3, color: "#93b02a", color_dark: "#c9e063", pattern: hatch }                 # Connacht
  mide:          { priority: 3, color: "#2e8b57", color_dark: "#5fcf8f", pattern: cross }                 # Mide
  ulaid:         { priority: 3, color: "#2e8b57", color_dark: "#5fcf8f", pattern: hatch }                 # Ulaid
  ailech:        { priority: 3, color: "#93b02a", color_dark: "#c9e063", pattern: dots }                  # the northern Uí Néill and Airgialla
  brittany:      { priority: 3, color: "#4f6272", color_dark: "#8fa5b8", pattern: hatch }                 # Brittany
  franks:        { priority: 4, color: "#7a6a53", color_dark: "#b8a68a" }                                 # the Carolingian empire, then West Francia and France
  efrancia:      { priority: 4, color: "#4f6272", color_dark: "#8fa5b8", pattern: cross }                 # East Francia, then the Holy Roman Empire
  mfrancia:      { priority: 4, color: "#c2a878", color_dark: "#e2cfa3", pattern: hatch }                 # Middle Francia
  lotharingia:   { priority: 4, color: "#c2a878", color_dark: "#e2cfa3", pattern: hatch }                 # Lotharingia
  provence:      { priority: 4, color: "#5e4630", color_dark: "#9c8164", pattern: cross }                 # Provence
  burgundy:      { priority: 4, color: "#5e4630", color_dark: "#9c8164", pattern: dots }                  # Upper Burgundy, then Burgundy
  italy:         { priority: 4, color: "#7a6a53", color_dark: "#b8a68a", pattern: dots }                  # the Kingdom of Italy
  byzantium:     { priority: 4, color: "#6b2d6b", color_dark: "#c27ac2" }                                 # the Byzantine Empire
  leon:          { priority: 4, color: "#d4607f", color_dark: "#f597b0", pattern: hatch }                 # Asturias, then León
  navarre:       { priority: 4, color: "#8c2f45", color_dark: "#d77589" }                                 # Pamplona
  cordoba:       { priority: 4, color: "#a57a12", color_dark: "#d6ab3e", aliases: [islam] }               # the Emirate and Caliphate of Córdoba, then the taifas
  idrisids:      { priority: 4, color: "#6b8e23", color_dark: "#a3c45a", pattern: dots }                  # the Idrisids
  nekor:         { priority: 4, color: "#6b8e23", color_dark: "#a3c45a", pattern: hatch }                 # the Emirate of Nekor
  rustamids:     { priority: 4, color: "#6b8e23", color_dark: "#a3c45a", pattern: cross }                 # the Rustamids
  aghlabids:     { priority: 4, color: "#6b8e23", color_dark: "#a3c45a" }                                 # the Aghlabids
  sicily:        { priority: 4, color: "#6b8e23", color_dark: "#a3c45a" }                                 # the Emirate of Sicily
  abbasids:      { priority: 4, color: "#6b8e23", color_dark: "#a3c45a", pattern: hatch }                 # the Abbasid Caliphate
  samanids:      { priority: 4, color: "#6b8e23", color_dark: "#a3c45a", pattern: cross }                 # the Samanids
  azerbaijan:    { priority: 4, color: "#6b8e23", color_dark: "#a3c45a" }                                 # Azerbaijan and Arran
  caspian:       { priority: 4, color: "#a57a12", color_dark: "#d6ab3e" }                                 # Gilan, Daylam and Tabaristan
  shirvan:       { priority: 4, color: "#6b8e23", color_dark: "#a3c45a", pattern: dots }                  # Shirvan and Derbent
  bulgaria:      { priority: 5, color: "#b03a7a", color_dark: "#e07ab0", pattern: hatch }                 # the First Bulgarian Empire
  khazars:       { priority: 5, color: "#e2734a", color_dark: "#f7a07c", pattern: dots }                  # the Khazar Khaganate
  vbulgars:      { priority: 5, color: "#9a6a8a", color_dark: "#cf9cbf", pattern: cross }                 # Volga Bulgaria
  pechenegs:     { priority: 5, color: "#9a6a8a", color_dark: "#cf9cbf", pattern: dots }                  # the Pechenegs
  oghuz:         { priority: 5, color: "#d4607f", color_dark: "#f597b0" }                                 # the Oghuz
  hungary:       { priority: 5, color: "#e2734a", color_dark: "#f7a07c", pattern: hatch }                 # the Magyars, then Hungary
  poland:        { priority: 6, color: "#8c2f45", color_dark: "#d77589", pattern: cross }                 # Poland
  polabians:     { priority: 6, color: "#c2a878", color_dark: "#e2cfa3", pattern: cross }                 # the Obotrites and the Polabian Slavs
  drevlians:     { priority: 6, color: "#c2a878", color_dark: "#e2cfa3" }                                 # the Drevlians
  finns:         { priority: 6, color: "#4f6272", color_dark: "#8fa5b8", pattern: cross }                 # the Finnic peoples
  slavs:         { priority: 6, color: "#c2a878", color_dark: "#e2cfa3", pattern: hatch }                 # the Slavic peoples
  peoples:       { priority: 7, color: "#7f8c8d", color_dark: "#aab7b8", pattern: dots }                  # peoples and states at the edge of a page that its text does not name
  water:         { priority: 9, color: "#5b9bd5", color_dark: "#2c5d87" }                                 # rivers and lakes on the battle plans, no zones
# Corner rounding passes applied to every hand drawn zone before the clip.
smoothing: 4
# Battle plans are drawn at the scale of the field: the bridge at Stamford Bridge and the causeway at Maldon are a few
# hundred metres across.
max_zoom: 16
