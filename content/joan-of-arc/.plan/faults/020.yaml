  new: "Two clauses of the pre-plan's tells have no line: Vaucouleurs as the king's stronghold \"on the upper Meuse\" (the-voices), and that she \"crosses the Loire at Gien\" (eleven-days). Searched: Lowell and Lang put Domrémy on the Meuse (Lowell ch. 2 line 748, Lang ch. 2 line 1626) but no quote found sets Vaucouleurs on it; Lowell ch. 5, lines 2402-2404, has Gien \"a town on the Loire about forty miles above Orleans, holding for Charles\" and Lang ch. 8, lines 4004-4007 and 4014-4016, sets Fierbois south of the Loire, but no passage read says they crossed the river at Gien. Add a line for each from the sources, or the plan drops the clause."
