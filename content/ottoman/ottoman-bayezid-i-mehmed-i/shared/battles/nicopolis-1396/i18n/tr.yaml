# 15,000 to 20,000, with about 1,500 Serbian horsemen
battle.sides.0.strength: "15.000 ile 20.000 arası, 1.500 kadar Sırp süvarisiyle"

# Heavy
battle.sides.0.casualties: "Ağır"

# Crusade: Hungary, France and Burgundy, German princes, Wallachia and the Knights Hospitaller
battle.sides.1.name: "Haçlı ordusu: Macaristan, Fransa ve Burgonya, Alman prensleri, Eflak ve Rodos Şövalyeleri"

# About 16,000
battle.sides.1.strength: "16.000 kadar"

# Most killed or captured, 300 to 3,000 prisoners put to death the next day
battle.sides.1.casualties: "Çoğu öldürülür ya da esir düşer, ertesi gün 300 ile 3.000 arasında esir öldürülür"

# Battle of Nicopolis
battle.name: "Niğbolu Muharebesi"

# 25 September 1396
battle.date: "25 Eylül 1396"

# Ottoman victory, the crusade destroyed
battle.result: "Osmanlı zaferi, Haçlı ordusu yok edilir"

