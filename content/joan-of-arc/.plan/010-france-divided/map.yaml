    paris-1418: { name: Paris, what: "the Burgundians take the city in May and June 1418 and massacre the Armagnacs, the Count of Armagnac among them; the Dauphin is carried off, about 48.857 N 2.352 E. In the colour of burgundy", basis: sourced, rank: 4 }
    bourges-1418: { name: Bourges, what: "where the Dauphin flees in 1418 (Lang), about 47.081 N 2.399 E. In the colour of france", basis: sourced, rank: 4 }
    rouen-1419: { name: Rouen, what: "besieged from 29 July 1418, starved, surrendered on 19 January 1419, about 49.443 N 1.099 E. In the colour of english", basis: sourced, rank: 5 }
    mont-saint-michel-1419: { name: Mont-Saint-Michel, what: "the one place in Normandy left to the French at the end of 1419, about 48.636 N -1.511 E. In the colour of france", basis: sourced, rank: 3 }
    montereau-1419: { name: Montereau, what: "John the Fearless is killed at his meeting with the Dauphin on the bridge where the Yonne meets the Seine, 10 September 1419, about 48.385 N 2.952 E. In the colour of france", basis: sourced, rank: 5 }
    troyes-1420: { name: Troyes, what: "the treaty is sealed in the cathedral on 21 May 1420, and Henry V marries Catherine of Valois there on 2 June (Ramsay), about 48.297 N 4.074 E. In the colour of english", basis: sourced, rank: 5 }
    melun-1420: { name: Melun, what: "a hold of the Dauphin's party inside the land that obeys Henry V in 1420 (Ramsay), about 48.540 N 2.660 E. In the colour of france", basis: sourced, rank: 2 }
    meaux-1420: { name: Meaux, what: "a hold of the Dauphin's party inside the land that obeys Henry V in 1420 (Ramsay), about 48.960 N 2.878 E. In the colour of france", basis: sourced, rank: 2 }
    soissons-1420: { name: Soissons, what: "a hold of the Dauphin's party inside the land that obeys Henry V in 1420 (Ramsay), about 49.381 N 3.323 E. In the colour of france", basis: sourced, rank: 2 }
    compiegne-1420: { name: Compiègne, what: "a hold of the Dauphin's party inside the land that obeys Henry V in 1420 (Ramsay), about 49.418 N 2.826 E. In the colour of france", basis: sourced, rank: 2 }
  unmarked:
