# The siege of Ústí and the Saxon relief
pages.usti.title: "Ústí kuşatması ve Sakson kurtarma ordusu"

# The Ždírnický brook, on its present course. The relief army forms up in its valley between Český Újezd and Hrbovice.
emblems.usti-fort.zdirnice-brook: "Bugünkü yatağıyla Ždírnický deresi. Kurtarma ordusu Český Újezd ile Hrbovice arasındaki vadisinde düzen alır."

# Wagon fort of the Hussite unions on Běhání hill: about 500 wagons by the chronicles, drawn as 40, chained wheel to wheel. Sigismund Korybut, Prokop the Great and Jan Roháč of Dubá command about 11,000 by Čornej and Bělina, 24,000 to 25,000 by the chronicles. The hill was dug away by a coal mine in 1977–1997.
emblems.usti-fort.wagon-fort: "Husçu birliklerinin Běhání tepesindeki araba kalesi: kroniklere göre yaklaşık 500 araba, 40 araba çizilmiştir, tekerlek tekerleğe zincirli. Sigismund Korybut, Büyük Prokop ve Dubálı Jan Roháč, Čornej ile Bělina’ya göre yaklaşık 11.000, kroniklere göre 24.000 ile 25.000 kişiyi yönetir. Tepe 1977–1997 arasında bir kömür ocağı tarafından kazınıp yok edilmiştir."

# Second line of wagons behind the north side. With some 500 wagons the Hussites can set two lines one behind the other (Čornej and Bělina).
emblems.usti-fort.second-line: "Kuzey yanının arkasında ikinci araba sırası. Yaklaşık 500 arabası olan Husçular iki sırayı arka arkaya kurabilir (Čornej ve Bělina)."

# Howitzers (houfnice) and light field guns (tarasnice) aimed through gaps in the wagon line
emblems.usti-fort.guns: "Araba sırasındaki aralıklara doğrultulmuş houfniceler ve hafif sahra topları (tarasnice)"

# Pavise bearers: large shields with pointed ends driven into the ground, a cover behind the second line (Lützow)
emblems.usti-fort.pavises: "Pavez kalkanı taşıyanlar: sivri uçları toprağa çakılmış büyük kalkanlar, ikinci sıranın arkasında bir siper (Lützow)"

# Handgunners with píšťaly, ready to fire through the gaps between the wagons
emblems.usti-fort.handguns: "Arabaların arasındaki aralıklardan ateş etmeye hazır, píšťala taşıyan el topçuları"

# Hussite foot with flails, halberds and hooks, held inside the ring
emblems.usti-fort.hussite-foot: "Halkanın içinde tutulan, savaş döveni, teber ve kancalı Husçu yayalar"

# Hussite horse, a few hundred, held inside the ring for a sally
emblems.usti-fort.hussite-horse: "Bir çıkış için halkanın içinde tutulan birkaç yüz Husçu atlı"

# Knights and men at arms of Meissen, Saxony, Thuringia and Hesse under Boso of Vitzthum. The relief army: about 13,000 by Čornej and Bělina, 10,000 horse and 20,000 foot by Bartošek of Drahonice, 70,000 by the Old Czech Annals.
emblems.usti-fort.relief-horse: "Vitzthumlu Boso komutasında Meissen, Saksonya, Thüringen ve Hessen şövalyeleri ve zırhlı atlıları. Kurtarma ordusu: Čornej ile Bělina’ya göre yaklaşık 13.000, Drahoniceli Bartošek’e göre 10.000 atlı ve 20.000 yaya, Eski Çek Yıllıkları’na göre 70.000."

# Horse of the relief army coming on from Chabařovice in the north-west
emblems.usti-fort.relief-horse-nw: "Kuzeybatıdan, Chabařovice’den gelen kurtarma ordusu atlıları"

# Foot of the relief army: townsmen and peasant levies, short of food after the march over the mountains
emblems.usti-fort.relief-foot: "Kurtarma ordusunun yayaları: dağları aştıktan sonra yiyeceği azalmış kentliler ve köylü askerler"

# 16 June 1426, morning
pages.usti-fort.date: "16 Haziran 1426, sabah"

# The wagon fort on Běhání hill
pages.usti-fort.title: "Běhání tepesindeki araba kalesi"

# The Ždírnický brook, on its present course. The relief army forms up in its valley between Český Újezd and Hrbovice.
emblems.usti-assault.zdirnice-brook: "Bugünkü yatağıyla Ždírnický deresi. Kurtarma ordusu Český Újezd ile Hrbovice arasındaki vadisinde düzen alır."

# The Hussite wagon fort, opened on the north side where the knights overturn a row of wagons and cut the chains
emblems.usti-assault.wagon-fort: "Şövalyelerin bir sıra arabayı devirip zincirleri kestiği kuzey yanında açılmış Husçu araba kalesi"

# Second line of wagons behind the north side. With some 500 wagons the Hussites can set two lines one behind the other (Čornej and Bělina).
emblems.usti-assault.second-line: "Kuzey yanının arkasında ikinci araba sırası. Yaklaşık 500 arabası olan Husçular iki sırayı arka arkaya kurabilir (Čornej ve Bělina)."

# Howitzers and field guns fire into the knights between the two lines of wagons
emblems.usti-assault.guns: "Houfniceler ve sahra topları iki araba sırası arasındaki şövalyelere ateş eder"

# Pavises behind the second line, the last cover before the foot
emblems.usti-assault.pavises: "İkinci sıranın arkasındaki pavez kalkanları, yayaların önündeki son siper"

# Handgunners fire through the gaps of the second line at a few paces
emblems.usti-assault.handguns: "El topçuları ikinci sıranın aralıklarından birkaç adım öteye ateş eder"

# Hussite foot with flails, halberds and long hooks that pull riders from the saddle
emblems.usti-assault.hussite-foot: "Savaş döveni, teber ve atlıları eyerden çeken uzun kancalarla Husçu yayalar"

# Hussite horse, waiting inside the ring
emblems.usti-assault.hussite-horse: "Halkanın içinde bekleyen Husçu atlılar"

# Knights who break through the first line of wagons and are held at the second, shot at from three sides
emblems.usti-assault.breach: "Birinci araba sırasını yarıp ikincide durdurulan, üç yandan ateş altındaki şövalyeler"

# Knights attacking along the north-east side of the ring, under fire from the wagons
emblems.usti-assault.relief-horse: "Halkanın kuzeydoğu yanı boyunca arabalardan gelen ateş altında saldıran şövalyeler"

# Horse from Chabařovice attacking the west end of the ring
emblems.usti-assault.relief-horse-nw: "Chabařovice’den gelip halkanın batı ucuna saldıran atlılar"

# Foot of the relief army following the horse up the slope in heat and dust
emblems.usti-assault.relief-foot: "Sıcakta ve tozda atlıların ardından yamacı tırmanan kurtarma ordusu yayaları"

# The main attack climbs the gentle slope from the brook valley and breaks the chain of the first line
emblems.usti-assault.main-attack: "Asıl saldırı dere vadisinden hafif yamacı tırmanır ve birinci sıranın zincirini kırar"

# Guns fire into the knights caught between the lines
emblems.usti-assault.gunfire: "Toplar iki sıra arasında kalan şövalyelere ateş eder"

# Handguns fire through the gaps of the second line
emblems.usti-assault.handgun-fire: "El topları ikinci sıranın aralıklarından ateş eder"

# 16 June 1426, late morning
pages.usti-assault.date: "16 Haziran 1426, öğleye doğru"

# The knights break the chain
pages.usti-assault.title: "Şövalyeler zinciri kırar"

# The Ždírnický brook, on its present course. The relief army forms up in its valley between Český Újezd and Hrbovice.
emblems.usti-rout.zdirnice-brook: "Bugünkü yatağıyla Ždírnický deresi. Kurtarma ordusu Český Újezd ile Hrbovice arasındaki vadisinde düzen alır."

# The Hussite wagon fort, opened for the sally
emblems.usti-rout.wagon-fort: "Çıkış için açılan Husçu araba kalesi"

# Hussite foot out of the wagons, charging with flails and halberds
emblems.usti-rout.hussite-foot: "Arabalardan çıkıp savaş dövenleri ve teberlerle saldıran Husçu yayalar"

# Hussite horse riding down the fugitives for a mile and a half (Bartošek of Drahonice)
emblems.usti-rout.hussite-horse: "Kaçanları bir buçuk mil boyunca kovalayan Husçu atlılar (Drahoniceli Bartošek)"

# Hussite foot surrounding the fugitives in Hrbovice and Předlice
emblems.usti-rout.village-foot: "Hrbovice ve Předlice’deki kaçakların etrafını saran Husçu yayalar"

# The nobles of the relief army fight as the rear guard while the foot runs
emblems.usti-rout.rear-guard: "Yayalar kaçarken artçı olarak savaşan kurtarma ordusunun soyluları"

# Part of the relief horse, cut off in Hrbovice and Předlice. The Hussites set fire to the villages.
emblems.usti-rout.caught-horse: "Hrbovice ve Předlice’de sıkışan kurtarma ordusu atlılarının bir bölümü. Husçular köyleri ateşe verir."

# The Hussites open the wagons and come out, horse and foot
emblems.usti-rout.sally: "Husçular arabaları açar ve atlılarıyla yayalarıyla dışarı çıkar"

# The townsmen and peasant levies flee first, towards Chabařovice and the border. Many die of heat and exhaustion on the way.
emblems.usti-rout.flight: "Kentliler ve köylü askerler ilk kaçanlardır, Chabařovice’ye ve sınıra doğru. Birçoğu yolda sıcaktan ve bitkinlikten ölür."

# Part of the horse flees north-east to Hrbovice and Předlice
emblems.usti-rout.flight-east: "Atlıların bir bölümü kuzeydoğuya, Hrbovice ve Předlice’ye kaçar"

# The Hussite horse pursues towards the Ore Mountains
emblems.usti-rout.pursuit: "Husçu atlılar Cevher Dağları’na doğru kovalar"

# Hussite foot follow the fugitives to the villages
emblems.usti-rout.to-villages: "Husçu yayalar kaçakları köylere kadar izler"

# 16 June 1426, from midday
pages.usti-rout.date: "16 Haziran 1426, öğleden itibaren"

# The sally and the flight
pages.usti-rout.title: "Çıkış ve kaçış"

