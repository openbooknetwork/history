  - "Dick Harrison, Stora döden: den värsta katastrof som drabbat Europa (2000), on Aragon in spring 1348, as Wikipedia cites it."
  - "Juan Luis Carriazo Rubio, La Casa de Arcos entre Sevilla y la frontera de Granada (1374–1474) (2003), p. 252, and Clifford Rogers (ed.), The Oxford Encyclopedia of Medieval Warfare and Military Technology (2010), p. 210, on Gibraltar taken in 1462, as Wikipedia cites them."
