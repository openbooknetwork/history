# Return from the pursuit
markers.trebia-mago-cavalry.note: "تعاقب سے لوٹتی ہے"

# Leads 10,000 to Placentia
markers.trebia-breakthrough-sempronius.note: "10,000 کو پلاسینشیا لے جاتا ہے"

# Routed by the legions
markers.trebia-breakthrough-gauls.note: "لیجنوں کے ہاتھوں شکست"

# Cut down near the river
markers.trebia-breakthrough-flanks.note: "دریا کے پاس کاٹ دیے جاتے ہیں"

# Flaminius follows from Arretium, June 217 BC
routes.flaminius-217.name: "فلامینیئس اریٹیئم سے پیچھا کرتا ہے، جون 217 ق م"

# Hannibal crosses the Apennines and the Arno marshes, spring 217 BC
routes.hannibal-217.name: "ہنیبال اپینائن اور آرنو کی دلدلیں پار کرتا ہے، موسمِ بہار 217 ق م"

# Four days and three nights in water
markers.arno-217.note: "چار دن اور تین راتیں پانی میں"

# In full view of the Romans
