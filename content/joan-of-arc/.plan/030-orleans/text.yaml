section:
  years: "29 April – 8 May 1429"
  opens: >-
    At the end of April 1429 Joan, examined at Poitiers and found without fault, armed and given a household and a
    banner at Tours, is at Blois with a convoy of supplies for Orléans and its escort, under the marshals de Boussac
    and de Rais with La Hire, the Archbishop of Reims and Gaucourt having brought her there. Orléans has been besieged
    since October 1428. The English hold the Loire bridges of Jargeau, Meung and Beaugency and the Tourelles at the
    city's own bridge, and a ring of bastilles on both banks that covers the west and the south and leaves the
    north-east open, so that armed companies can come and go; since the Herrings no French army has tried to break it.
    Salisbury is dead, and Suffolk, Lord Talbot and Lord Scales command for Bedford. Charles VII is at Chinon. The
    reader has been told that the day the convoy leaves Blois is for this section.
  introduces: [Ambroise de Loré, Florent d'Illiers, Guy de Cailly, Jacques Boucher, Jean Luillier, Simon Beaucroix, Guillaume Girault, William Glasdale, Sir William Moleyns, Sir Hugh Poynings, Chandos, the chronicle of the feast, Windecke, the bastille of Saint-Loup, the bastille of Saint-Laurent, the bastille of London, the bastille of Rouen, the bastille of Paris, the bastille of Saint-Jean-le-Blanc, the Augustins, the bastille of Saint-Privé, the Île Charlemagne, the boulevard of the Tourelles, the Belle-Croix, the Île Saint-Aignan, the Île Saint-Antoine, the Île-aux-Bourdons, the Porte Regnart, Saint-Aignan, Chécy, Reuilly, Cléry, Berry]
  hands_on: >-
    On 8 May 1429 Orléans is free after about seven months. The English have lost every work south of the Loire and
    have left and pulled down their bastilles on the north bank; Talbot and Lord Scales hold Meung and Beaugency,
    Suffolk Jargeau, and Janville is still theirs, so the English keep the Loire bridges above and below the city and
    the Beauce behind them. It is decided to go and seek the king, and Joan goes with the Bastard of Orléans and the
    captains. Left unsettled: whether Charles VII will follow the relief with a campaign on the Loire, which section
    040 tells.
  left_out:
    - { event: "the gate she entered Orléans by on 29 April", why: "only Anatole France names the Porte de Bourgogne (030.25, single), and rules.md leaves the gate out; the text says she rode in, and names no gate." }
    - { event: "Saint-Laurent as the bastille the army passed on 4 May", why: "Wikipedia alone gives it (030.35 and research 'Thin'), and rules.md does not tell the Thin part; the text names the bastille of Paris with Lang and the chronicle of the feast, and says the Journal and the Chronique name none." }
    - { event: "the distances between the bastilles of London, Rouen and Paris", why: "France alone gives nine hundred feet (030.79, single), and no claim rests on him alone (rules.md); the map places the three close together from Girault and the Chronique, and the text gives no measure." }
    - { event: "the English strength round the town in spring 1429 as fewer than 3,000", why: "France's figure alone (030.37), and no claim rests on him alone; the card and the text give the Chronique's, Oman's and Lowell's." }
pages:
  from-blois:
    account: >-
      The convoy, with the priests going before it singing the Veni Creator, left Blois on 27 April by France, who
      notes that Windecke gives the 28th, or on 28 April by Lowell; Ramsay leaves it at the 27th or 28th, and
      Pasquerel remembered two nights in the fields. No account leads, so the body gives "27 or 28 April" and names
      the authors. Its escort was led by the marshals de Rais and de Boussac (Jean de Brosse, lord of Boussac), with
      the admiral de Culant, La Hire and Ambroise de Loré (Dunois's deposition). Its size: about 3,000 (Lowell, and
      Lang from Windecke and the Chronique de Tournai), 7,000 (Monstrelet), 10,000 or 12,000 (Joan at her trial),
      figures Lang calls impossible. The captains took it up the south bank through the Sologne, because the English
      were strongest in the Beauce, and did not tell her, who wanted to go by the Beauce; when she met the Bastard of
      Orléans (later Count of Dunois), commanding in the city, she reproached him for it, in his own account of
      1456. The convoy came opposite the city by the heights of Olivet on 28 April (Lang, France, Ramsay; Lowell has
      about noon on Friday 29 April). The supplies went into boats sent up from the city: before Chécy, at the
      Île-aux-Bourdons, says the chronicle of the feast of 8 May, with the Journal of the Siege's supplies brought "as
      far as Chécy"; Dunois remembered the convoy facing the church of Saint-Loup, and Ramsay follows him. The wind,
      contrary until then, turned, and the laden boats came down past the English bastilles into the city, as Dunois
      and the chronicles tell it, while the garrison skirmished before Saint-Loup. She crossed with about 200 lances
      (Simon Beaucroix; Ramsay gives the same) and the rest of the escort went back to Blois to cross the river there,
      Pasquerel with the priests and her banner. The Journal has the force lie that night at Chécy; Lang and France
      have her sleep at Reuilly, the house of Guy de Cailly, Ramsay at Rully near Chécy, and Lowell takes the
      Journal's Chécy for a slip and reads Cléry; the body follows the Journal and a note gives the others. On the
      evening of Friday 29 April, at about eight, she rode into Orléans armed on a white horse, the Bastard of Orléans
      on her left and the townspeople carrying torches, and the English did not stop her (the Journal; the Bourgeois
      of Paris heard it too); she lodged with Jacques Boucher, the Duke of Orléans's treasurer, by the Porte Regnart.
      The text names no gate (rules.md). Gaucourt, governor of the city, is named as the man who brought her to Blois.
      The map shows the convoy's road up the south bank, the boats down the river past Saint-Loup and her ride into
      the city; all three lines are reconstructions from their stations, and the text says once in the chapter that
      the roads and the places of the forts are approximate, since no plan of the bastilles survives in the sources
      read.
