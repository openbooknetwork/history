# Roman Republic
battle.sides.0.name: "جمهوری روم"

# 86,400, with 10,000 left to guard the camps
battle.sides.0.strength: "۸۶٬۴۰۰، که ۱۰ هزار تن از آنان برای نگهبانی از اردوگاه‌ها ماندند"

# Polybius: 70,000 killed, 10,000 captured. Livy: 48,200 killed, 19,300 captured
battle.sides.0.casualties: "پولیبیوس: ۷۰ هزار کشته، ۱۰ هزار اسیر. لیویوس: ۴۸٬۲۰۰ کشته، ۱۹٬۳۰۰ اسیر"

# Carthage
battle.sides.1.name: "کارتاژ"

# 50,000, with 10,000 cavalry
battle.sides.1.strength: "۵۰ هزار، با ۱۰ هزار سواره‌نظام"

# Polybius: 5,700 killed. Livy: 8,000 killed
battle.sides.1.casualties: "پولیبیوس: ۵٬۷۰۰ کشته. لیویوس: ۸ هزار کشته"

# Battle of Cannae
battle.name: "نبرد کانای"

# 2 August 216 BC
battle.date: "۲ اوت ۲۱۶ پیش از میلاد"

# Carthaginian victory
battle.result: "پیروزی کارتاژ"

