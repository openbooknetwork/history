- id: herrings-1429
  page: salisbury-on-the-loire
  phases: false
  name: Battle of the Herrings
  date: "12 February 1429"
  site: Rouvray, in the Beauce, two leagues from Janville
  sides:
    - name: English
      family: english
      commanders: [Sir John Fastolf]
      strength: "The Journal of the Siege and the Bourgeois: 1,500; Monstrelet: 1,600 combatants and a thousand common men; Cagny: 2,000 and more; Oman: 1,000 archers and 1,200 Paris militia"
      casualties: "Monstrelet: one man of note"
    - name: French and Scots
      family: france
      commanders: ["Charles, Count of Clermont", Sir John Stewart of Darnley, the Bastard of Orléans]
      strength: "The Journal of the Siege and Monstrelet: 3,000 to 4,000; Cagny: 4,000 and more; the Bourgeois: 7,000; Oman: four times the English"
      casualties: "The Journal of the Siege: 300 to 400 killed; Monstrelet: six score gentlemen and 500 common men killed, most of them Scots. Darnley and Guillaume d'Albret among the dead"
  outcome: English victory. The French and Scots are beaten off from Fastolf's wagon park, and the convoy goes on to the army before Orléans.
