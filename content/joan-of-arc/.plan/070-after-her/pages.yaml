- id: burgundy-changes-sides
  title: "Burgundy Changes Sides"
  date: "December 1431 – September 1435"
  when: "1431-12"
  tells: >-
    Henry VI is crowned King of France in Notre-Dame de Paris in December 1431, in a city that still holds for him.
    At the Congress of Arras in 1435 Philip the Good of Burgundy makes his peace with Charles VII and leaves the
    English alliance, and the English are left alone in the north.
  markers: [notre-dame-1431, arras-1435]
  battles: []
- id: paris-opens
  title: "Paris Opens Its Gates"
  date: "April 1436"
  when: "1436-04"
  tells: >-
    With Saint-Denis taken and the city cut off, the citizens let Richemont's men in by the Porte Saint-Jacques on
    13 April 1436; the English shut themselves in the Bastille Saint-Antoine and are let go to Rouen.
  markers: [paris-1436, saint-denis-1436, porte-saint-jacques-1436, bastille-1436]
  battles: []
- id: normandy-won-back
  title: "Normandy Won Back"
  date: "1449 – 1450"
  when: "1449"
  tells: >-
    The truce of 1444 breaks, and Charles VII's armies overrun Normandy: Rouen surrenders in the autumn of 1449, the
    English relief army is beaten at Formigny on 15 April 1450, and Caen and Cherbourg fall that summer.
  markers: [rouen-1449, caen-1450, cherbourg-1450]
  battles:
    - { id: formigny-1450, phases: false }
- id: castillon
  title: "Castillon"
  date: "1451 – October 1453"
  when: "1451"
  tells: >-
    The French take Gascony in 1451; Bordeaux calls the English back and Talbot retakes it in 1452; at Castillon on
    17 July 1453 Talbot attacks the French guns and is killed, and Bordeaux surrenders in October. English Gascony
    is gone, and with it the war: of all the lands the English held in France, Calais is left.
  markers: [bordeaux-1453, calais-1453]
  battles:
    - { id: castillon-1453, phases: false }
- id: the-retrial
  title: "The Sentence Annulled"
  date: "November 1455 – 7 July 1456"
  when: "1455-11"
  tells: >-
    After the enquiries of 1450 and 1452 at Rouen, her mother's petition opens the retrial at Notre-Dame de Paris
    under the papal rescript of 1455; witnesses are heard at Domrémy, Orléans, Paris and Rouen, and on 7 July 1456
    the judges at Rouen declare the sentence of 1431 null.
  markers: [notre-dame-1455, domremy-1456, orleans-1456, rouen-1456]
  battles: []
- id: afterwards
  title: "Afterwards"
  date: "1456 – 1920"
  when: "1456-08"
  tells: >-
    What is recorded of how she was remembered: the procession at Orléans each 8 May, her name in France in the
    centuries after, the cause opened in 1869, her beatification in 1909 and her canonisation at Rome in 1920.
  markers: [orleans-8-may]
  battles: []
