emblems.constantinople-mines.constantine: "Mesoteikhion’da, Topkapı’dan Likos’a kadar Rum askerleriyle XI. Konstantinos"

# Zaganos’s troops can now cross the Horn to the walls
emblems.constantinople-mines.crossing: "Zağanos’un askerleri artık Haliç’i geçip surlara ulaşabilir"

