# Roman Republic
battle.sides.0.name: "جمهوری روم"

# 40,000: 36,000 infantry, 4,000 cavalry
battle.sides.0.strength: "۴۰ هزار: ۳۶ هزار پیاده‌نظام، ۴ هزار سواره‌نظام"

# 20,000 killed, many captured
battle.sides.0.casualties: "۲۰ هزار کشته، و اسیران بسیار"

# Carthage
battle.sides.1.name: "کارتاژ"

# 40,000, with 11,000 cavalry and about 30 elephants
battle.sides.1.strength: "۴۰ هزار، با ۱۱ هزار سواره‌نظام و حدود ۳۰ فیل"

# Several thousand infantry, a few cavalry, several elephants
battle.sides.1.casualties: "چند هزار پیاده‌نظام، چند سوار و چند فیل"

# Battle of the Trebia
battle.name: "نبرد تربیا"

# 22 or 23 December 218 BC
battle.date: "۲۲ یا ۲۳ دسامبر ۲۱۸ پیش از میلاد"

# Carthaginian victory
battle.result: "پیروزی کارتاژ"

