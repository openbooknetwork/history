  title: "The cemetery of Saint-Ouen"
  date: "24 – 29 May 1431"
  when: "1431-05-24"
  tells: >-
    On a scaffold in the cemetery of Saint-Ouen, before the sentence is read to its end, she abjures and is
    sentenced to prison for life; four days later she is found in man's dress again in her cell, and the judges
    declare her relapsed.
