markers.aegates-battle-losses.note: "50 ڈوبے، 70 پکڑے گئے"

# Escapes when the wind turns
markers.aegates-battle-hanno.note: "ہوا بدلنے پر بچ نکلتا ہے"

# The army of Sicily is shipped from Lilybaeum to Carthage
routes.gisco-241.name: "سسلی کی فوج کو لیلیبیئم سے قرطاجنہ بھیجا جاتا ہے"

