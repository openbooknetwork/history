# 060 rouen, May 1430 - May 1431. Pre-plan: the pages stand; rests_on is written at `plan`.
- id: beaulieu-and-beaurevoir
  title: "The prisoner of John of Luxembourg"
  date: "May to October 1430"
  when: 1430-05-25
  tells: >-
    Taken at Compiègne, she is held by John of Luxembourg, first at Beaulieu, where she nearly slips out of her
    tower, then at his castle of Beaurevoir, where she leaps from the tower while the English bargain for her.
  markers: [beaulieu-1430, beaurevoir-1430]
  battles: []
- id: sold-to-the-english
  title: "Sold to the English"
  date: "October to December 1430"
  when: 1430-10
  tells: >-
    John of Luxembourg sells her to the English for ten thousand livres, as Lowell tells it (francs in Ramsay,
    who names the Duke of Burgundy as the seller), and she is taken from Beaurevoir by Arras to Le Crotoy at the mouth of the Somme, and from there round the coast
    to Rouen, where she is shut in a tower of the castle.
  markers: [arras-1430, le-crotoy-1430, rouen-1430]
  battles: []
- id: the-court
  title: "The court of Pierre Cauchon"
  date: "January to February 1431"
  when: 1431-01-09
  tells: >-
    Pierre Cauchon, Bishop of Beauvais, in whose diocese she was taken and whose see Charles VII now holds, opens
    the trial at Rouen in English Normandy, with the vice-inquisitor and masters of the University of Paris beside
    him and the English crown paying: a church court that has to prove her a heretic.
  markers: [rouen-castle-1431, beauvais-1431, university-of-paris-1431]
  battles: []
- id: the-questioning
  title: "The questioning"
  date: "21 February to 9 May 1431"
  when: 1431-02-21
  tells: >-
    In the chapel and the hall of the castle and then in her cell, she is questioned on her voices, the sign given
    to the king and the man's dress she will not put off; the charges are drawn into seventy articles and then
    twelve, and in the great tower she is shown the instruments of torture.
  markers: [castle-chapel-1431, prison-tower-1431, great-tower-1431]
  battles: []
- id: saint-ouen
  title: "The cemetery of Saint-Ouen"
  date: "24 to 28 May 1431"
  when: 1431-05-24
  tells: >-
    On a scaffold in the cemetery of Saint-Ouen, before the sentence is read to its end, she abjures and is
    sentenced to prison for life; four days later she is found in man's dress again in her cell, and the judges
    declare her relapsed.
  markers: [saint-ouen-1431, castle-relapse-1431]
  battles: []
- id: the-old-market
  title: "The Old Market"
  date: "30 May 1431"
  when: 1431-05-30
  tells: >-
    On the morning of 30 May she is taken from the castle to the Old Market of Rouen, handed to the secular arm and
    burned, as the witnesses of the burning told it in 1456.
  markers: [castle-last-morning-1431, old-market-1431]
  battles: []
