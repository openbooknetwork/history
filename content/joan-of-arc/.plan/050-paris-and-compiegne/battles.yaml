- id: paris-1429
  page: paris
  phases: false
  name: Attack on Paris
  date: "8 September 1429"
  site: the Porte Saint-Honoré of Paris, on the wall of Charles V, attacked from the pig market before it
  sides:
    - name: French
      family: france
      commanders: [Joan, the Duke of Alençon, Gilles de Rais, Raoul de Gaucourt, Marshal de Boussac]
      strength: "the Bourgeois of Paris: 12,000 or more"
      casualties: "the Bourgeois of Paris, by the oath of the French herald who came for the dead: 1,500 wounded, 500 or more of them dead or mortally wounded; Cagny: very few hurt, and none died of it; Monstrelet: many killed and wounded by the guns. Joan wounded and her standard-bearer killed"
    - name: Paris, for Henry VI
      family: english
      commanders: [Louis of Luxembourg, L'Isle-Adam]
      strength: "Monstrelet: 400 combatants sent by the Duke of Burgundy; the Journal of the Siege: 2,000 combatants left by Bedford; the Bourgeois of Paris: hardly any men-at-arms in the fight but some 40 or 50 English"
  outcome: Paris holds. The assault stops at the water of the inner moat, Joan is wounded, and the king calls the army back to Saint-Denis next day.
- id: compiegne-1430
  page: compiegne
  phases: false
  name: Siege of Compiègne
  date: "23 May 1430 (Monstrelet: 24 May)"
  site: the fields and the causeway on the Picardy side of the Oise, between the bridge of Compiègne and the Burgundian post at Margny
  sides:
    - name: French
      family: france
      commanders: [Joan]
      strength: "Monstrelet: 500 to 600 horse and foot; Chastellain: 500 armed men"
      casualties: "the Bourgeois of Paris: about 400 killed or drowned; the Duke of Burgundy's letter: many taken, drowned and killed; Monstrelet: few taken with her. Joan taken, with Poton le Bourguignon, and her brother and her steward in Chastellain"
    - name: Burgundians
      family: burgundy
      commanders: ["Philip the Good, Duke of Burgundy", John of Luxembourg, Baudot de Noyelle]
      casualties: "the Duke of Burgundy's letter: fewer than twenty wounded, none killed or taken"
    - name: English
      family: english
      commanders: [Lord Montgomery]
      strength: "Monstrelet: near 500, from Venette"
  outcome: Burgundian victory. The sortie is cut off from the bridge, the gate is shut, and Joan is taken; the siege goes on.
