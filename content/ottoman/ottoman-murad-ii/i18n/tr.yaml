emblems.varna-king.hunyadi: "Sol kanattan dönüp kralın cesedini kurtarmaya ve orduyu toparlamaya çalışan Hunyadi"

# The wagon fort, held by 300 or 600 Czech and Ruthenian mercenaries with Poles, Lithuanians and Wallachians, 7 to 10 men to a wagon, with bombards
emblems.varna-king.wagons: "Lehler, Litvanyalılar ve Eflaklılarla birlikte 300 ya da 600 Çek ve Rutenyalı paralı askerin tuttuğu, her arabada 7 ile 10 kişinin bulunduğu, bombardalı araba istihkâmı"

# Władysław charges the Ottoman centre with 500 Polish knights to take Murad
emblems.varna-king.king-charge: "Vladislav, Murad’ı esir almak için 500 Leh şövalyesiyle Osmanlı merkezine hücum eder"

# The Rumelian sipahis come back from the pursuit
emblems.varna-king.rumelians-close: "Rumeli sipahileri kovalamadan geri döner"

# The crusader army breaks. Many flee to the wagon fort
emblems.varna-king.rout: "Haçlı ordusu bozulur, birçoğu araba istihkâmına kaçar"

# Hunyadi escapes from the field with part of his men. The accounts do not say by which road
emblems.varna-king.hunyadi-escape: "Hunyadi askerlerinin bir bölümüyle muharebe alanından kaçar. Anlatımlar hangi yoldan gittiğini söylemez"

