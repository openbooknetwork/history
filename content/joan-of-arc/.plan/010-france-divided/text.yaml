# text.yaml of section 010 france-divided. The writer, the fact checker, the reviewer and the image finder read it.
section:
  years: "1407 to 1424"
  opens: >-
    The story's first section: the reader knows only its summary. In 1407 Charles VI is King of France, mad at
    intervals since 1392 (Lang). His brother Louis, Duke of Orléans, and his cousin John the Fearless, Duke of Burgundy,
    contend for the power he cannot hold. The Duke of Burgundy rules Flanders and the duchy and county of Burgundy, the
    King of England holds Calais and Gascony about Bordeaux, and Brittany has its own duke. Joan is not yet born.
  introduces: [Charles VI, Isabeau of Bavaria, "Louis, Duke of Orléans", John the Fearless, "Bernard, Count of Armagnac", Charles of Orléans, the Armagnacs, the Burgundians, Monstrelet, the Bourgeois of Paris, Joan, Jacques d'Arc, Isabelle Romée, Jean Morel, Beatrix Estellin, Perceval de Boulainvilliers, Domrémy, Greux, Maxey, Vaucouleurs, Ceffonds, Vouthon, the Meuse, the duchy of Bar, the duchy of Lorraine, Champagne, Henry V, Edward III, Harfleur, the Chef de Caux, Honfleur, the Seine, Calais, the Somme, Blanche-Taque, Béthencourt, Péronne, Bapaume, Agincourt, Tramecourt, Ruisseauville, the Constable d'Albret, "Edward, Duke of York", Lord Camoys, "John I, Duke of Alençon", "Edward, Duke of Bar", "John, Duke of Bourbon", Marshal Boucicaut, Clignet de Brabant, "Michael de la Pole, Earl of Suffolk", the Gesta, the Dauphin Charles, Normandy, Touques, Caen, Lisieux, Bayeux, Rouen, Mont-Saint-Michel, Bourges, Montereau, the Yonne, Tanguy du Châtel, Philip the Good, Troyes, Catherine of Valois, Melun, Meaux, Soissons, Compiègne, the Île-de-France, Picardy, "Charles II, Duke of Lorraine", René of Anjou, the Cardinal of Bar, Baugé, Le Lude, Anjou, the Couasnon, "Thomas, Duke of Clarence", the Earl of Buchan, "John Beaufort, Earl of Somerset", the Earl of Huntingdon, the Chronique de la Pucelle, Cagny, the Marne, Vincennes, Saint-Denis, Henry VI, "John, Duke of Bedford", Mehun-sur-Yèvre, Charles VII, the Loire, Gascony, Dauphiné, Maine, Perche, Anne of Burgundy, Auxerre, Cravant, the Earl of Salisbury, Lord Willoughby, Sir John Stewart of Darnley, Ivry, Verneuil, the Duke of Alençon, the Earl of Douglas, James Douglas, "the Counts of Aumale, Ventadour and Tonnerre", the Viscount of Narbonne, Marshal La Fayette, the Lombards, the Earl of Suffolk, Chinon, Gien]
  hands_on: >-
    In August 1424 Henry VI, not yet three, is King of France in Paris and Normandy, ruled for him by Bedford as
    regent, with Champagne and the north, and Bedford is bound to the Duke of Burgundy by his marriage to Anne. The
    Duke of Burgundy holds Flanders, Picardy and the two Burgundies, and Brittany its own duke's land. Charles VII,
    uncrowned, holds the land south of the Loire between the Garonne and the Rhône, with Dauphiné; his field army
    is broken at Verneuil, the Duke of Alençon is a prisoner, and he keeps to the defence of his places behind the
    Loire. On the Meuse, Vaucouleurs and Domrémy hold for him among Burgundian and Lorraine land, and Joan is about
    twelve. Unsettled: Charles VII has not been anointed at Reims, and Bedford means to carry the war down the
    Loire (Oman), which leads to the siege of Orléans in section 020.
  left_out:
    - { event: "the name of the leader of the murderers of 1407, Raoulet d'Anquetonville, and the fifteen masked men", why: "the Wikipedia article on Louis of Orléans alone gives them, its footnote unread (010.2); names.md marks the name not told. The text gives Monstrelet's eighteen men with his name." }
    - { event: "the modern counts of the armies at Agincourt (Curry, Sumption, Rogers, Barker)", why: "they rest on Wikipedia alone and stand in the digest's Thin part (010.25, 010.26); rules.md: not told." }
    - { event: "the strengths of the two armies at Cravant", why: "they rest on Wikipedia alone and stand in the digest's Thin part (010.61); rules.md: not told. The losses are told with their authors." }
    - { event: "Henry IV's English contingents sent to the Duke of Burgundy in 1411", why: "in Lang's passage only and on no line of the digest; it changes no map of the story." }
pages:
  murder-in-paris:
    account: >-
      On Wednesday 23 November 1407, St Clement's day, Louis, Duke of Orléans, the only brother of Charles VI, rides
      on his mule from Queen Isabeau's hôtel and is cut down in the dark near the Porte Barbette in the rue
      Vieille-du-Temple, by about eighteen men who had lodged at an inn near the Porte Barbette and had meant the
      deed for several days (Monstrelet's figure, told with his name). Three days before, on Sunday 20 November, he and his cousin John the Fearless, Duke of Burgundy, had sworn
      friendship and taken communion together. John the Fearless owns to the princes that he ordered the deed, then
      owns it openly, retires to Lille (Lang), and has a priest praise the murder before the great men of the kingdom
      (Lowell). Why it matters: the two had fought for the power of a king mad at intervals since 1392 (Lang's year,
      told with his name), and the murder turns their quarrel into civil war. From 1410 Bernard, Count of Armagnac,
      father-in-law of the young Charles of Orléans, leads the Orléans party, which takes the name of Armagnacs. The
      map shows the kingdom as the war begins: the Duke of Burgundy's Flanders and Artois to the north and his duchy
      and county to the east, Lang adding that Picardy and much of the north and east were in his power, which the
      map tells in the text and does not draw; the English in Calais and Gascony; Brittany its own; the rest the
      kingdom of Charles VI. The sources give these lands by province and never by a line, so every border is
      approximate, and the text says so once here for the whole section. The Paris and Lille markers are the only
      places; the Armagnacs are told, not drawn, since they are a party and not a land.
