lnglat: [1.695, 48.048]
name: "Battle of Patay"
date: "18 June 1429"
result: "French victory; the French vanguard rides down the English before they are formed, Talbot is taken and Fastolf flees"
source: https://en.wikipedia.org/wiki/Battle_of_Patay
default_language: en
images: [patay-miniature]
families:
  france: { color: "#231b7e", color_dark: "#6257db" }
  english: { color: "#3d7a2a", color_dark: "#7cc160" }
sides:
  - name: "French"
    color: france
    commanders: ["the Duke of Alençon", "La Hire", "Poton de Xaintrailles", "Arthur de Richemont, Constable of France"]
    strength: "Wavrin: about 6,000 before Beaugency on 17 June, 12,000 to 13,000 on the march of the 18th; Monstrelet: a main body of 8,000 to 9,000; the Journal of the Siege: 1,400 to 1,500 of the vanguard engaged"
    casualties: "Wavrin and Monstrelet: small loss, with no figure"
  - name: "English"
    color: english
    commanders: ["Lord Talbot", "Sir John Fastolf", "Lord Scales"]
    strength: "Wavrin, who marched with it: about 5,000 leaving Paris; Chartier: 4,000 to 5,000; Monstrelet: four or five thousand; the Journal of the Siege: 4,000; Alençon: a thousand men-at-arms"
    casualties: "Monstrelet: about 1,800 dead and 100 to 120 taken; Wavrin: about 2,000 dead and 200 taken; Gruel, by the heralds' count, and the Journal of the Siege: about 2,200 dead; Cagny: 2,000 to 3,000 dead and 400 to 500 taken besides the lords; Dunois: more than 4,000 killed and taken; Oman: a third or more of the army. Talbot, Lord Scales, Sir Thomas Rempston and Hungerford taken"
