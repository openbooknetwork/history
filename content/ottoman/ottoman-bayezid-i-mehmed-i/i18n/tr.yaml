# 1389 – 1421
story.span: "1389 – 1421"

# Bayezid I's conquests from the Danube to the Euphrates, the crusade he beat at Nicopolis in 1396 and his defeat by Timur at Ankara in 1402, the civil war of his sons, and Mehmed I's reunion of the Ottoman lands until his death in 1421.
story.summary: "I. Bayezid’in Tuna’dan Fırat’a uzanan fetihleri, 1396’da Niğbolu’da yendiği haçlı seferi ve 1402’de Ankara’da Timur’a yenilişi, oğulları arasındaki taht kavgası ve I. Mehmed’in 1421’deki ölümüne kadar Osmanlı topraklarını yeniden birleştirişi."

# Bayezid I and Mehmed I: Nicopolis, Ankara and the Civil War
story.title: "I. Bayezid ve I. Mehmed: Niğbolu, Ankara ve Fetret Devri"

