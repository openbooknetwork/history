  old: "010.48 Event: the day of Baugé. disputed: Holy Saturday, 22 March 1421, in Beaucourt and in the Scots' own letter written at Baugé \"the eve of Easter\"; 21 March in Oman; the Saturday of Palm Sunday, in the year 1420 old style, in the Chronique de la Pucelle. \"un éclatant succès remporté le 22 mars\" (archive.org-rt-histoire-de-charles-vii-v-1-Beaucourt-20Histoire-20de-20Charles-20VII-20v-201-djvu.txt.txt, Beaucourt 1, ch. 6, l. 16846, scholarly) \"Escript en ceste dicle ville de Baugé, la veille de Pasques\" (archive.org-rt-histoire-de-charles-vii-v-1-Beaucourt-20Histoire-20de-20Charles-20VII-20v-201-djvu.txt.txt, Beaucourt 1, ch. 6, the letter of Douglas and Buchan, l. 16908, primary) \"This was Baugé (March 21, 1421)\" (archive.org-download-historyofartofwa0002char-historyofartofwa0002char-djvu.txt.txt, Oman book 14 ch. 1, l. 19343, scholarly) \"le  samedi  de  Pasqucs  flories  1420\" (archive.org-download-chroniquedelapuc00cousuoft-chroniquedelapuc00cousuoft-djvu.txt.txt, Chronique de la Pucelle ch. 182, l. 7475, primary)"
  new: "010.48 Event: the day of Baugé. disputed: Holy Saturday, 22 March 1421, in Beaucourt and in the Scots' own letter written at Baugé \"the eve of Easter\", and in Wylie and Waugh and Ramsay, who have the Scots reach Baugé on Good Friday and Clarence attack them on the Saturday (Ramsay's text reads \"31st March\" for that Good Friday, which Wylie and Waugh date 21 March); 21 March in Oman; the Saturday of Palm Sunday, in the year 1420 old style, in the Chronique de la Pucelle. \"un éclatant succès remporté le 22 mars\" (archive.org-rt-histoire-de-charles-vii-v-1-Beaucourt-20Histoire-20de-20Charles-20VII-20v-201-djvu.txt.txt, Beaucourt 1, ch. 7, l. 16846, scholarly) \"Escript en ceste dicle ville de Baugé, la veille de Pasques\" (archive.org-rt-histoire-de-charles-vii-v-1-Beaucourt-20Histoire-20de-20Charles-20VII-20v-201-djvu.txt.txt, Beaucourt 1, ch. 7, the letter of Douglas and Buchan, l. 16908, primary) \"This was Baugé (March 21, 1421)\" (archive.org-download-historyofartofwa0002char-historyofartofwa0002char-djvu.txt.txt, Oman book 14 ch. 1, l. 19343, scholarly) \"le  samedi  de  Pasqucs  flories  1420\" (archive.org-download-chroniquedelapuc00cousuoft-chroniquedelapuc00cousuoft-djvu.txt.txt, Chronique de la Pucelle ch. 182, l. 7475, primary) \"March  21,  they  were  at  Le  Lude  on  the  Loir\" (archive.org-download-reignofhenryfift03wyliuoft-reignofhenryfift03wyliuoft-djvu.txt.txt, Wylie and Waugh 3, ch. 69, l. 16849, scholarly) \"dinner  on  the  Saturday,  when  his  foragers  brought  in  some\" (archive.org-download-reignofhenryfift03wyliuoft-reignofhenryfift03wyliuoft-djvu.txt.txt, Wylie and Waugh 3, ch. 69, l. 16902, scholarly) \"On  Good  Friday  (31st  March)  the  allies  reached  Baug6\" (archive.org-download-lancasterandyor00ramsgoog-lancasterandyor00ramsgoog-djvu.txt.txt, Ramsay 1, ch. 20, l. 18969, scholarly)"
  source: "archive.org-download-reignofhenryfift03wyliuoft-reignofhenryfift03wyliuoft-djvu.txt.txt 16848-16849: \"On Good Friday, March 21, they were at Le Lude on the Loir. On the same day they pushed forward to Bauge\", and 16902: Clarence learned of them \"at dinner on the Saturday\"; archive.org-download-lancasterandyor00ramsgoog-lancasterandyor00ramsgoog-djvu.txt.txt 18969-18975: the allies reached Baugé on Good Friday and Clarence attacked late the next day; Beaucourt 1 CHAPITRE VII begins at l. 16680, so l. 16846 and l. 16908 stand in ch. 7"
