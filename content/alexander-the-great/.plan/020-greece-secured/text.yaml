section:
  years: "Autumn 336 BC to the end of September 335 BC"
  opens: Alexander, about twenty, has just been acclaimed king at Aegae after Philip's murder. Macedon holds Philip's kingdom with Thrace to the Haemus, and Thessaly. The mainland Greeks are bound to Macedon in the League of Corinth, with Sparta outside it, and a Macedonian garrison holds the Cadmeia of Thebes. An advance force has been in Asia Minor since spring 336. The reader has been told how Philip built the army, how Chaeronea broke Athens and Thebes, and that the motive for the murder is disputed.
  introduces: ["Amyntas, son of Perdiccas", Hecataeus, "Cleitus, son of Bardylis", Glaucias, Syrmus, Perdiccas, Pindar, Sparta, the Thracians, the Triballi, the Getae, the Taulantians, the Agrianians, the Peloponnese, the Nessus, Mount Haemus, the Lyginus, Peuce, the Danube, Pelium, Eordaea, Elimiotis, Pelinna, Thermopylae, Onchestus, Boeotia, the Cadmeia, Orchomenus, Plataea]
  hands_on: By autumn 335 BC Alexander is back in Macedon preparing to invade Asia. Macedon holds what Philip held, and the Thracians, Triballi, Getae and Illyrians around it have been beaten. Thebes is gone and a Macedonian garrison holds the Cadmeia. Alexander is hegemon of the League of Corinth, Sparta is still outside, and Athens has been spared. Unsettled, the war on Persia is voted and not begun, and nobody yet holds Europe in Alexander's place.
  left_out:
    - { event: "Olympias's killing of Cleopatra and her infant daughter", why: "the brief does not ask for it, and it changes no map." }
    - { event: Alexander and Diogenes at Corinth, why: "an anecdote with no map change and no digest line." }
    - { event: "Alexander's demand that Athens surrender Demosthenes, and his pardon", why: "no digest line. 020.14 covers the end of unrest in a sentence." }
    - { event: The festival at Dium on the way home, why: "no digest line and no map change." }
    - { event: The embassy of the Celts, why: "no digest line and no map change." }
pages:
  league-renewed:
    account: Philip's death leaves rivals at home and unrest in Greece. Alexander has Amyntas, son of Perdiccas, killed, and sends Hecataeus to Asia, where he kills Attalus. He marches south. The Thessalians block the vale of Tempe, and he cuts steps up Mount Ossa to get behind them. The Thessalian League, the Amphictyons at Thermopylae and the congress at Corinth acknowledge him in turn, and only Sparta refuses. He could not leave Macedon or fight in the north with rivals at home, and the Greeks had to be held to the League. The map shows his first march, from Aegae to Corinth. Every border is a reconstruction.
    files:
      - { file: .references/archive.org-download-theanabasisofale46976gut-46976-0.txt.txt, read: "Book I, Chapter I, the first paragraph" }
      - { file: .references/penelope.uchicago.edu-Thayer-E-Roman-Texts-Diodorus-Siculus-17A.txt, read: "sections 2 to 5" }
      - { file: .references/archive.org-onquest-20and-20Empire-20The-20Reign-20of-20Alexander-20the-20Great-20-281993-29-djvu.txt.txt, read: "ch. 2, I. The accession, and part II, A.I. Alexander and the Corinthian League" }
      - { file: .references/archive.org-20Griffith-20G.-20A-20history-20of-20Macedonia.-20V.3-2C-20336-167-20B.C.-201988-djvu.txt.txt, read: "part one, ch. I, 1 and 3" }
    passages: ["Arrian 1.1", "Diodorus 17.2 to 17.5", "Plutarch, Alexander 14"]
    disputes:
      - { claim: "020.21", how: "the body tells the vote at Corinth here, after Arrian and Diodorus, and a note gives Plutarch, who tells it after the fall of Thebes." }
    sources:
      - "Arrian, Anabasis of Alexander, book 1, 1."
      - "Diodorus Siculus, Library of History, book 17, 2 to 5."
      - "Plutarch, Life of Alexander, 14."
      - "A. B. Bosworth, Conquest and Empire: The Reign of Alexander the Great (1988), ch. 2 and part II, A.I."
      - "N. G. L. Hammond and F. W. Walbank, A History of Macedonia III (1988), part one, ch. I."
    images: [a portrait of Alexander made in antiquity, the site of Corinth or of the Isthmus]
  the-danube:
    account: Alexander marches from Amphipolis over the Nessus and through Rhodope to Mount Haemus, where the free Thracians roll waggons down on the phalanx, and he forces the pass. The Triballi make a stand in a wooded glen by the Lyginus, and his archers draw them out. Arrian gives 3,000 Triballi killed and, from Ptolemy, 11 Macedonian horsemen and about 40 foot. Syrmus takes refuge on the island of Peuce, and the warships from Byzantium fail to land there. Alexander crosses the Danube by night on ships, log canoes and stuffed hides, scatters the Getae, razes their town and comes back. He would not leave the northern peoples unsubdued behind him. The map shows the army beyond the Haemus and then beyond the Danube. The route and the sites are reconstructions, and the text says once that they are approximate.
    files:
      - { file: .references/archive.org-download-theanabasisofale46976gut-46976-0.txt.txt, read: "Book I, Chapters I to IV, from the approach of spring" }
      - { file: .references/archive.org-onquest-20and-20Empire-20The-20Reign-20of-20Alexander-20the-20Great-20-281993-29-djvu.txt.txt, read: "ch. 2, II. Consolidation in Europe, to the Celtic embassy" }
      - { file: .references/archive.org-History-20of-20Alexander-3B-20Volume-20I-20Books-20I-III-20-20A.-20B.-20Bosworth-djvu.txt.txt, read: "the notes on 1.1.4 to 1.4.8" }
      - { file: .references/archive.org-20Griffith-20G.-20A-20history-20of-20Macedonia.-20V.3-2C-20336-167-20B.C.-201988-djvu.txt.txt, read: "part one, ch. II, 1. The campaign to the Danube" }
    passages: ["Arrian 1.1.4 to 1.4.8", "Plutarch, Alexander 11.5"]
    disputes:
      - { claim: "020.19", how: "the body names no pass, and a note gives Bosworth's Trojan pass and Hammond's Shipka." }
    sources:
      - "Arrian, Anabasis of Alexander, book 1, 1 to 4."
      - "A. B. Bosworth, Conquest and Empire: The Reign of Alexander the Great (1988), ch. 2."
      - "A. B. Bosworth, A Historical Commentary on Arrian's History of Alexander I (1980), on book 1, 1 to 4."
      - "N. G. L. Hammond and F. W. Walbank, A History of Macedonia III (1988), part one, ch. II."
    images: [a Thracian or Getic object of the fourth century BC, the Danube near the mouth of the Iskar]
  pelium:
    account: In the land of the Agrianians news comes that Cleitus, son of Bardylis, has revolted and that Glaucias of the Taulantians has joined him. Alexander goes west along the Erigon to Pelium and shuts Cleitus in. Glaucias arrives and holds the heights. Hemmed in, Alexander drills the phalanx 120 deep in sight of the enemy, who give up the ridges, and takes the army over the river. A few days later he crosses back by night and routs the Illyrians in their camp. Cleitus burns Pelium and flees. An invasion through Pelium threatened all of western Macedon. The map shows the march from the upper Strymon to the western border. The site of Pelium and every route are reconstructions.
    files:
      - { file: .references/archive.org-download-theanabasisofale46976gut-46976-0.txt.txt, read: "Book I, Chapters V and VI" }
      - { file: .references/archive.org-onquest-20and-20Empire-20The-20Reign-20of-20Alexander-20the-20Great-20-281993-29-djvu.txt.txt, read: "ch. 2, II, from Alexander now retraced his steps" }
      - { file: .references/archive.org-History-20of-20Alexander-3B-20Volume-20I-20Books-20I-III-20-20A.-20B.-20Bosworth-djvu.txt.txt, read: "the notes on 1.5.1 to 1.6.11" }
      - { file: .references/archive.org-20Griffith-20G.-20A-20history-20of-20Macedonia.-20V.3-2C-20336-167-20B.C.-201988-djvu.txt.txt, read: "part one, ch. II, 2. The battle at Pelion in Illyris" }
    passages: ["Arrian 1.5.1 to 1.6.11"]
    disputes:
      - { claim: "020.7", how: "the body says a few days later, and a note gives two days in Bosworth and three in Arrian." }
      - { claim: "020.18", how: "the body names Pelium, and a note gives Hammond's Goricë and Bosworth's site near Florina." }
    sources:
      - "Arrian, Anabasis of Alexander, book 1, 5 to 6."
      - "A. B. Bosworth, Conquest and Empire: The Reign of Alexander the Great (1988), ch. 2."
      - "A. B. Bosworth, A Historical Commentary on Arrian's History of Alexander I (1980), on book 1, 5 to 6."
      - "N. G. L. Hammond and F. W. Walbank, A History of Macedonia III (1988), part one, ch. II."
    images: [a Macedonian phalanx or sarissa as an ancient work shows it]
  fall-of-thebes:
    account: Theban exiles return, and the Thebans revolt on the report that Alexander has been killed in Illyria. They besiege the garrison in the Cadmeia. Alexander goes from Pelium through Eordaea and Elimiotis to Pelinna in seven days and into Boeotia six days later. The city is stormed. The allies who fought with him vote to raze it and sell its people, and to rebuild Orchomenus and Plataea. It is said that Alexander himself spared the house and descendants of Pindar. Southern Greece falls quiet, and he returns to Macedon. He made the razing a warning to the Greeks he would leave behind. The map cuts Thebes out of the League's Greece and shows the march from the Illyrian border. The route is a reconstruction.
    files:
      - { file: .references/archive.org-download-theanabasisofale46976gut-46976-0.txt.txt, read: "Book I, Chapters VII to IX, and the first sentence of X" }
      - { file: .references/penelope.uchicago.edu-Thayer-E-Roman-Texts-Diodorus-Siculus-17A.txt, read: "sections 8 to 14, and 16.1" }
      - { file: .references/penelope.uchicago.edu-Thayer-E-Roman-Texts-Plutarch-Lives-Alexander-3.txt, read: "ch. 11 to 13" }
      - { file: .references/archive.org-onquest-20and-20Empire-20The-20Reign-20of-20Alexander-20the-20Great-20-281993-29-djvu.txt.txt, read: "ch. 2, II, from The Theban crisis" }
    passages: ["Arrian 1.7 to 1.10", "Diodorus 17.8 to 17.14", "Plutarch, Alexander 11 to 13"]
    disputes:
      - { claim: "020.10", how: "the body says that the Macedonians break into the city and the garrison joins them, which is true for both accounts, and a note gives Arrian's and Diodorus's." }
    sources:
      - "Arrian, Anabasis of Alexander, book 1, 7 to 10."
      - "Diodorus Siculus, Library of History, book 17, 8 to 16."
      - "Plutarch, Life of Alexander, 11 to 13."
      - "A. B. Bosworth, Conquest and Empire: The Reign of Alexander the Great (1988), ch. 2."
    images: [the Cadmeia or the site of Thebes, a portrait of Pindar made in antiquity]
