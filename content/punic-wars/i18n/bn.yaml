markers.alalia-238.note: "কর্সিকার প্রধান শহর, প্রায় খ্রিস্টপূর্ব ৫৩৫ সাল থেকে কার্থেজের অধিকারে"

# Threatens war and takes both islands
markers.rome-238.note: "যুদ্ধের হুমকি দিয়ে দুটি দ্বীপই দখল করে"

# Gives up the islands and pays 1,200 talents more
markers.carthage-238.note: "দ্বীপগুলো ছেড়ে দেয় এবং আরও ১,২০০ ট্যালেন্ট দেয়"

# Hamilcar lands, probably in summer 237 BC
markers.gades-237.note: "হ্যামিলকার অবতরণ করেন, সম্ভবত গ্রীষ্ম খ্রিস্টপূর্ব ২৩৭"

# Silver and gold mines
markers.sierra-morena-237.note: "রুপা ও সোনার খনি"

# Founded by Hamilcar, probably in 235 BC
markers.akra-leuke-235.note: "হ্যামিলকারের প্রতিষ্ঠিত, সম্ভবত খ্রিস্টপূর্ব ২৩৫ সালে"

# Founded by Hasdrubal the Fair, about 227 BC
markers.new-carthage-227.note: "সুদর্শন হাসদ্রুবালের প্রতিষ্ঠিত, প্রায় খ্রিস্টপূর্ব ২২৭"

# Limit of Carthaginian expansion under the treaty of 226 BC
