# 22 – 30 May 1434
pages.lipany.date: "22 – 30 Mayıs 1434"

# The armies meet at Lipany
pages.lipany.title: "Ordular Lipany’de karşılaşır"

# The Bylanka brook in the valley west of Hřiby
emblems.lipany-forts.bylanka: "Hřiby’nin batısındaki vadide akan Bylanka deresi"

# Wagon fort of the Taborite and Orphan field armies at the foot of Lipská hora: 360 to 480 wagons, drawn as 30, chained in six rows, with the slope behind it and its right flank on the small Jordán pond by most accounts. Prokop the Great and Prokop the Lesser command about 10,000 foot and 700 horse by Čornej, 9,000 foot and 700 horse by Bartošek of Drahonice, 6,000 to 8,000 men by Šmahel.
emblems.lipany-forts.field-fort: "Táborcu ve Yetim sahra ordularının Lipská hora eteğindeki araba kalesi: 360 ile 480 araba, burada 30 olarak çizildi, altı sıra hâlinde zincirlenmiş, arkasında yamaç, çoğu anlatıma göre sağ kanadı küçük Jordán gölüne dayalı. Büyük Prokop ile Küçük Prokop komutasında Čornej’e göre yaklaşık 10.000 yaya ve 700 atlı, Drahoniceli Bartošek’e göre 9.000 yaya ve 700 atlı, Šmahel’e göre 6.000 ile 8.000 kişi."

# Guns of the field armies: more than 40 howitzers by Bartošek of Drahonice, 32 by the Zittau chronicler
emblems.lipany-forts.field-guns: "Sahra ordularının topları: Drahoniceli Bartošek’e göre 40’tan fazla houfnice, Zittau vakanüvisine göre 32"

# Horse of the field armies under Jan Čapek of Sány, about 700 by Bartošek of Drahonice
emblems.lipany-forts.capek: "Sánylı Jan Čapek komutasında sahra ordularının atlıları, Drahoniceli Bartošek’e göre yaklaşık 700"

# Wagon fort of the lords’ league on the plain north-east of Hřiby: 660 to 720 wagons by Čornej, drawn as 30, in 11 or 12 rows under Jan Černín of Vysoká. Four guns stand at the front, the rest on the flanks. Diviš Bořek of Miletínek commands 12,000 to 13,000 foot and about 1,200 horse by Čornej, 10,000 foot and 1,000 horse by Bartošek of Drahonice.
emblems.lipany-forts.lords-fort: "Soylular birliğinin Hřiby’nin kuzeydoğusundaki düzlükte kurduğu araba kalesi: Čornej’e göre 660 ile 720 araba, burada 30 olarak çizildi, Vysokálı Jan Černín komutasında 11 ya da 12 sıra hâlinde. Dört top önde, ötekiler kanatlarda durur. Miletínekli Diviš Bořek komutasında Čornej’e göre 12.000 ile 13.000 yaya ve 1.200 kadar atlı, Drahoniceli Bartošek’e göre 10.000 yaya ve 1.000 atlı."

# Vanguard of the league under Mikuláš Krchlebec of Krchleby, burgrave of Zvíkov, on foot: Rožmberk men, men of Prácheň and Karlštejn and of Menhart of Hradec
emblems.lipany-forts.vanguard: "Zvíkov burgravı Krchlebyli Mikuláš Krchlebec komutasında birliğin yaya öncüsü: Rožmberk’in adamları, Prácheň ve Karlštejn’in adamları ve Hradecli Menhart’ın adamları"

# Rear guard of the league, its striking force the Plzeň landfrýd and the Rožmberk men under the Rožmberk banner
emblems.lipany-forts.rear-guard: "Birliğin artçısı, vurucu gücü Plzeň landfrýdi ve Rožmberk sancağı altındaki Rožmberk adamları"

# Horse of the league held below the slope to the brook, out of sight of the field armies: lords who had once fought beside Tábor, among them Jan Malovec of Pacov, Mikuláš of Landštejn and Arnošt of Leskov. Only a few commanders know it is there.
emblems.lipany-forts.hidden-horse: "Birliğin dereye inen yamacın altında, sahra ordularının göremeyeceği yerde beklettiği atlılar: aralarında Pacovlu Jan Malovec, Landštejnli Mikuláš ve Leskovlu Arnošt’un bulunduğu, bir zamanlar Tábor’un yanında savaşmış soylular. Orada olduklarını yalnızca birkaç komutan bilir."

# The field armies fire first. The lords’ fort stands out of range, and the shots do little harm.
emblems.lipany-forts.gunfire: "İlk ateşi sahra orduları açar. Soyluların kalesi menzil dışında durur ve gülleler pek zarar vermez."

# 30 May 1434, from about 3 in the afternoon
pages.lipany-forts.date: "30 Mayıs 1434, öğleden sonra saat 3 dolaylarından başlayarak"

# Two wagon forts
pages.lipany-forts.title: "İki araba kalesi"

# The Bylanka brook in the valley west of Hřiby
emblems.lipany-feint.bylanka: "Hřiby’nin batısındaki vadide akan Bylanka deresi"

# The field armies’ wagon fort, unchained and opened on the side facing the lords for the pursuit
emblems.lipany-feint.field-fort: "Sahra ordularının araba kalesi, takip için zincirleri çözülmüş ve soylulara bakan yanından açılmış"

# Guns of the field armies, fired at the vanguard as it turns away
emblems.lipany-feint.field-guns: "Sahra ordularının topları, geri dönen öncüye ateş ederken"

# Horse of the field armies under Jan Čapek of Sány, about 700 by Bartošek of Drahonice
emblems.lipany-feint.capek: "Sánylı Jan Čapek komutasında sahra ordularının atlıları, Drahoniceli Bartošek’e göre yaklaşık 700"

# Wagons from the head of the field armies’ column go with the pursuit and cover its flank
emblems.lipany-feint.pursuit-wagons: "Sahra orduları kolunun başındaki arabalar takiple birlikte gider ve kanadını korur"

# Foot of the field armies, out of their wagons and chasing the vanguard onto the plain
emblems.lipany-feint.pursuit: "Arabalarından çıkıp öncüyü düzlüğe doğru kovalayan sahra ordusu yayaları"

# The lords’ wagon fort. Behind the wagons the gunners and crossbowmen wait with their weapons lowered.
emblems.lipany-feint.lords-fort: "Soyluların araba kalesi. Arabaların ardında topçular ve arbaletçiler silahlarını yere indirmiş bekler."

# Krchlebec’s vanguard, falling back towards the lords’ wagons as if beaten
emblems.lipany-feint.vanguard: "Krchlebec’in öncüsü, yenilmiş gibi soyluların arabalarına doğru geri çekilir"

# The rear guard, the Plzeň landfrýd and the Rožmberk men, waits on the flank
emblems.lipany-feint.rear-guard: "Artçı, yani Plzeň landfrýdi ve Rožmberk adamları, kanatta bekler"

# Horse of the league held below the slope to the brook, out of sight of the field armies: lords who had once fought beside Tábor, among them Jan Malovec of Pacov, Mikuláš of Landštejn and Arnošt of Leskov. Only a few commanders know it is there.
emblems.lipany-feint.hidden-horse: "Birliğin dereye inen yamacın altında, sahra ordularının göremeyeceği yerde beklettiği atlılar: aralarında Pacovlu Jan Malovec, Landštejnli Mikuláš ve Leskovlu Arnošt’un bulunduğu, bir zamanlar Tábor’un yanında savaşmış soylular. Orada olduklarını yalnızca birkaç komutan bilir."

# The field armies fire all their guns at the vanguard, which has come up close and fired its four guns at them
emblems.lipany-feint.gunfire: "Sahra orduları, iyice yaklaşıp dört topuyla ateş eden öncüye bütün toplarıyla ateş eder"

# Feigned retreat: the vanguard halts as if in confusion, turns and falls back towards the wagons
emblems.lipany-feint.feint: "Sahte geri çekilme: öncü şaşırmış gibi durur, döner ve arabalara doğru geri çekilir"

# The field armies open their wagons and pursue, horse and foot, shouting “Up, after them, they are running!”
emblems.lipany-feint.pursuit-move: "Sahra orduları arabalarını açar ve “Haydi, peşlerine, kaçıyorlar!” diye bağırarak atlı ve yaya takibe geçer"

# 30 May 1434, late afternoon
pages.lipany-feint.date: "30 Mayıs 1434, ikindi"

# The feigned retreat
pages.lipany-feint.title: "Sahte geri çekilme"

# The Bylanka brook in the valley west of Hřiby
emblems.lipany-rout.bylanka: "Hřiby’nin batısındaki vadide akan Bylanka deresi"

# The field armies’ wagon fort, still open where the pursuit went out. The lords’ horse rides round it, breaks in where the wagons stand open behind it and overturns eight of them, and both Prokops fall fighting on the wagons.
emblems.lipany-rout.field-fort: "Sahra ordularının araba kalesi, takibin çıktığı yerde hâlâ açık. Soyluların atlıları kalenin çevresini dolanır, arkasında arabaların açık durduğu yerden içeri dalar ve sekiz arabayı devirir, iki Prokop da arabaların üzerinde savaşırken düşer."

# The wagons that went out with the pursuit, left on the plain
emblems.lipany-rout.pursuit-wagons: "Takiple birlikte çıkan ve düzlükte kalan arabalar"

# Foot of the field armies, caught between the two attacks on the plain and cut down
emblems.lipany-rout.pursuit: "İki saldırı arasında kalan ve düzlükte kılıçtan geçirilen sahra ordusu yayaları"

# The lords’ wagon fort
emblems.lipany-rout.lords-fort: "Soyluların araba kalesi"

# Krchlebec’s vanguard and the lords’ men from the wagons turn about and attack
emblems.lipany-rout.vanguard: "Krchlebec’in öncüsü ve arabalardan çıkan soylu adamları geri döner ve saldırır"

# The rear guard, the Plzeň landfrýd and the Rožmberk men, strikes from behind and bars the way back to the fort
emblems.lipany-rout.rear-guard: "Artçı, yani Plzeň landfrýdi ve Rožmberk adamları, arkadan vurur ve kaleye dönüş yolunu keser"

# The league’s hidden horse, come round in an arc, breaks into the fort and overturns eight wagons
emblems.lipany-rout.hidden-horse: "Birliğin gizli atlıları bir yay çizerek gelir, kaleye dalar ve sekiz arabayı devirir"

# Jan Čapek of Sány and Ondřej Keřský ride off to Kolín with the horse and a few foot
emblems.lipany-rout.capek: "Sánylı Jan Čapek ile Ondřej Keřský atlılar ve birkaç yayayla Kolín’e gider"

# The vanguard and the lords’ men turn about and attack the pursuers
emblems.lipany-rout.front-attack: "Öncü ve soyluların adamları geri dönüp takip edenlere saldırır"

# The rear guard swings round behind the pursuers and cuts them off from their fort
emblems.lipany-rout.rear-attack: "Artçı, takip edenlerin arkasına dolanır ve onları kalelerinden koparır"

# The hidden horse rides out of the valley in an arc round the fighting to the open fort
emblems.lipany-rout.horse-ride: "Gizli atlılar vadiden çıkar ve çarpışmanın çevresinden bir yay çizerek açık kaleye gelir"

# Čapek’s horse leaves the field for Kolín
emblems.lipany-rout.capek-flight: "Čapek’in atlıları alanı bırakıp Kolín’e gider"

# Survivors flee over the hill towards Kouřim, and few get away
emblems.lipany-rout.flight: "Hayatta kalanlar tepenin üzerinden Kouřim’e doğru kaçar, pek azı kurtulur"

