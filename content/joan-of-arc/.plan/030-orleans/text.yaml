  the-english-march-away:
    account: >-
      On Sunday 8 May the English left their bastilles, firing some (Monstrelet, Ramsay), and drew up in order of
      battle before the city; the French came out and drew up facing them, she in a light coat of mail, and she
      forbade them to begin the fight on a Sunday (the Journal, Dunois, Luillier, the Chronique, Monstrelet). The
      Journal has the two stand facing each other a whole hour, and Monstrelet says the English waited a considerable
      time; the hour is told as the Journal's. Masses were said before the army in the field on a portable altar (the
      Chronique; the chronicle of the feast has her bid every man hear mass), and the English marched away: in good
      order into Meung (the Journal), Talbot to Meung and then Beaugency (Champion), Lord Scales and Talbot to Meung
      and Beaugency and Suffolk to Jargeau (the Chronique; Ramsay has some go to each). The French went back into the
      city giving thanks, and Orléans went in procession with a sermon (Pasquerel, the Journal). The townspeople
      plundered the abandoned bastilles and pulled them down, and their guns were brought into the city (the
      Chronique, Monstrelet). The siege had lasted about seven months, from 12 October 1428 (the Journal's first day)
      to 8 May 1429. The losses of the three days are given as 6,000 to 8,000 English killed or taken and no more than
      100 French killed (Monstrelet), with the two French dead at Saint-Loup of Charles VII's letter and the hundred
      wounded or more that she spoke of at her trial; the card gives them by author. The relief is the section's one
      battle: its card stands at Orléans on this page, and the pages before show each fort on the day it fell. The
      map shows the English array before the city and the roads of the English captains to Meung, Beaugency and
      Jargeau, reconstructions from their ends.
