# Calls up its Italian allies, 225 BC
markers.rome-225.note: "ইতালীয় মিত্রদের ডেকে পাঠায়, খ্রিস্টপূর্ব ২২৫"

# Hannibal winters here, 219 – 218 BC
markers.new-carthage-219.note: "হ্যানিবল এখানে শীতকাল কাটান, খ্রিস্টপূর্ব ২১৯ – ২১৮"

# The treaty line of 226 BC
markers.ebro-219.note: "খ্রিস্টপূর্ব ২২৬ সালের সন্ধির সীমারেখা"

# Scipio’s army lands, September 218 BC
markers.massalia-218.note: "সিপিওর সেনাবাহিনী অবতরণ করে, সেপ্টেম্বর খ্রিস্টপূর্ব ২১৮"

