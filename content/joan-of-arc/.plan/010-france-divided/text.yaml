      - { file: .references/archive.org-download-joanofarc00lowe-joanofarc00lowe-djvu.txt.txt, read: "ch. 1, l. 395 to 480; ch. 2, l. 1110 to 1125" }
      - { file: .references/archive.org-download-maidoffrancebein00languoft-maidoffrancebein00languoft-djvu.txt.txt, read: "ch. 1, l. 1335 to 1370" }
    passages: ["Ramsay 1, ch. 17 to 19", "Wylie and Waugh 3, ch. 51, 62 and 63", "Oman book 14 ch. 1, the conquest of Normandy", "Beaucourt 1, ch. 2 and 5", "Lowell ch. 1 and 2", "Lang ch. 1"]
    disputes:
      - { claim: "010.40", how: "the body gives 10 September 1419 with Ramsay, Wylie and Waugh and Beaucourt; Oman's 9 September is not told, since the page does not turn on the day." }
      - { claim: "010.41", how: "the body says that how the duke was struck and what the Dauphin knew are disputed: the Burgundian account, that armed men rushed on him from behind the Dauphin as he knelt (Ramsay, after Monstrelet), the Armagnac account, that he was attacked after he offered violence (Wylie and Waugh), and Lang's judgement that the Dauphin's foreknowledge and presence are in dispute. No side is taken." }
    sources:
      - "Sir James H. Ramsay, Lancaster and York, vol. 1 (Oxford, 1892), ch. 17 to 19."
      - "J. H. Wylie and W. T. Waugh, The Reign of Henry the Fifth, vol. 3 (Cambridge, 1929), ch. 51, 62 and 63."
      - "Francis C. Lowell, Joan of Arc (Boston, 1896), ch. 1 and 2."
      - "Andrew Lang, The Maid of France (London, 1908), ch. 1."
    images:
      - { name: montereau-bridge-murder-miniature, shows: "a fifteenth-century miniature of the killing of John the Fearless on the bridge of Montereau", "on": marker montereau-1419 }
      - { name: troyes-cathedral, shows: "the cathedral of Saint-Pierre-et-Saint-Paul at Troyes, where the treaty was sealed", "on": marker troyes-1420 }
  two-kings:
    account: >-
      On Holy Saturday, 22 March 1421, at Baugé in Anjou, the Dauphin's Scots and French under the Earl of Buchan,
      come by Le Lude the day before, are found by Thomas, Duke of Clarence, who rides at them from Beaufort-en-Vallée
      with his mounted men-at-arms and will not wait for his archers; the fight is beyond the bridge over the
      Couasnon, on the low hill by the church of Vieil-Baugé (Wylie and Waugh). Clarence is killed and the Earls of
      Somerset and Huntingdon are taken: the first defeat of the English in the field in the story, won by the army
      that Cravant and Verneuil will break. The numbers name their authors. Henry V besieges Meaux on
      the Marne from October 1421 until May 1422, takes there, Oman says, the dysentery that kills him, and dies in the
      castle of Vincennes on 31 August 1422, leaving Bedford regent of France for his son Henry VI, nine months old.
      Charles VI dies in Paris on 21 October 1422. At his burial at Saint-Denis on 11 November a herald cries Henry VI
      King of France and England, and Bedford rides back to Paris with the king's sword borne before him as regent.
      The Dauphin has already taken the title of King at Mehun-sur-Yèvre on 30 October 1422 (Beaucourt, told with his
      name), and from here the text calls him Charles VII; his enemies call him the "King of Bourges" for his long
      stays there (Beaucourt). So France has two kings: Henry VI north of the Loire, by Lowell's provinces Normandy,
      Paris and the land about it, Champagne and the north, Charles VII south of it between the Garonne and the Rhône,
      with Dauphiné. The map shows the two routes to Baugé and the places of the two deaths and the two
      proclamations; the zones are those of the Treaty of Troyes and approximate. The text links Paris, Vincennes and
      Bourges, whose markers wait under Saint-Denis's and Mehun-sur-Yèvre's at the opening view.
    files:
      - { file: .references/archive.org-download-reignofhenryfift03wyliuoft-reignofhenryfift03wyliuoft-djvu.txt.txt, read: "ch. 69, l. 16840 to 16910 and the notes, l. 17100 to 17170" }
