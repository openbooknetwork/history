emblems.kosovo-camp.anatolians: "Mehmed’in komutasındaki Anadolu askerleri araba istihkâmını doğudan kuşatır"

# The Thessalian sipahis behind the wagon fort
emblems.kosovo-camp.thessalians: "Araba istihkâmının arkasında Teselya sipahileri"

