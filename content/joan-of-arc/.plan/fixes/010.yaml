  old: "010.62 Event: Bedford besieges Ivry in summer 1424; the French army, coming to its relief, turns aside and takes Verneuil by a ruse, Scots with bound hands passed off as English prisoners crying that the English were beaten. agreed. \"Quant ilz furent pres de Verneil ou Perche, si firent une grant traïson\" (archive.org-download-journaldunbourge54182gut-54182-0.txt.txt, Bourgeois §404, 1424, primary) \"si  laissèrent  leur  entreprinse  d'aler  à Yvry  et  vindrent  audit  lieu  de  Vernueil\" (archive.org-download-chroniquesdeperc00cagnuoft-chroniquesdeperc00cagnuoft-djvu.txt.txt, Cagny, the battle of Verneuil, l. 6574, primary) \"on marcha vers Verneuil, dont on s'empara par ruse\" (archive.org-rt-histoire-de-charles-vii-v-2-Beaucourt-20Histoire-20de-20Charles-20VII-20v-202-djvu.txt.txt, Beaucourt 2, book 2 ch. 1, l. 604, scholarly)"
  new: "010.62 Event: Bedford besieges Ivry in summer 1424; the French army, coming to its relief, turns aside and takes Verneuil by a ruse, Scots with bound hands passed off as English prisoners crying out in English as men beaten. agreed for Ivry and the taking of Verneuil; disputed for how it was taken: by that ruse, the Bourgeois, and by ruse, Beaucourt; opened to the Duke of Alençon, whose town it was, by its townsmen, Cagny. \"Quant ilz furent pres de Verneil ou Perche, si firent une grant traïson\" (archive.org-download-journaldunbourge54182gut-54182-0.txt.txt, Bourgeois §404, 1424, primary) \"si  laissèrent  leur  entreprinse  d'aler  à Yvry  et  vindrent  audit  lieu  de  Vernueil\" (archive.org-download-chroniquesdeperc00cagnuoft-chroniquesdeperc00cagnuoft-djvu.txt.txt, Cagny, the battle of Verneuil, l. 6574, primary) \"bourgeois  et  gens  de  la  ville  firent  ouverture  de  la grant  ville  au  duc  d'Alençon\" (archive.org-download-chroniquesdeperc00cagnuoft-chroniquesdeperc00cagnuoft-djvu.txt.txt, Cagny, the battle of Verneuil, l. 6576, primary) \"on marcha vers Verneuil, dont on s'empara par ruse\" (archive.org-rt-histoire-de-charles-vii-v-2-Beaucourt-20Histoire-20de-20Charles-20VII-20v-202-djvu.txt.txt, Beaucourt 2, book 2 ch. 1, l. 604, scholarly)"
