emblems.kosovo-flanks.light-left-up: "Osmanlı hafif süvarileri sol kanada yardıma gelir"

# The Ottoman light horse comes up to support the right wing
emblems.kosovo-flanks.light-right-up: "Osmanlı hafif süvarileri sağ kanada yardıma gelir"

