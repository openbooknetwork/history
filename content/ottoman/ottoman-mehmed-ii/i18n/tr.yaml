emblems.belgrade-river.ditch: "Yukarı şehrin güney surlarının önündeki su dolu hendek"

# The walls of the upper town: a double wall with four gates, round the camps of the garrison
emblems.belgrade-river.upper-town: "Yukarı şehrin surları: garnizonun ordugâhlarını çeviren, dört kapılı çifte sur"

# The walls of the lower town, with the cathedral and the port on the Danube
emblems.belgrade-river.lower-town: "Katedralin ve Tuna kıyısındaki limanın bulunduğu aşağı şehrin surları"

# The Ottoman trenches across the neck of the headland, from the Sava to the Danube
emblems.belgrade-river.trenches: "Burnun dar boynunda Sava’dan Tuna’ya uzanan Osmanlı siperleri"

