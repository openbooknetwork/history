markers.telamon-velites-velites.note: "دونوں محاذوں پر برچھیاں"

# Rush out and are cut down
markers.telamon-velites-gaesatae.note: "باہر لپکتے ہیں اور کاٹ دیے جاتے ہیں"

# Hold the hill
markers.telamon-velites-cavalry.note: "پہاڑی سنبھالے رکھتے ہیں"

# Driven off
