routes.hamilcar-236.name: "ہملکار کی فتوحات، بیٹس کے ساتھ ساتھ مشرقی ساحل تک، 237 تا 228 ق م"

# Hamilcar marches west along the African coast and crosses to Gades, 237 BC
routes.hamilcar-237.name: "ہملکار افریقی ساحل کے ساتھ مغرب کی طرف بڑھتا ہے اور گادیس پہنچتا ہے، 237 ق م"

# Hannibal’s campaigns against the Olcades and the Vaccaei, 221 – 220 BC
routes.hannibal-221.name: "اولکادیس اور واکائی کے خلاف ہنیبال کی مہمات، 221 تا 220 ق م"

# Stormed by Hannibal, 220 BC
markers.iberia-helmantice.note: "ہنیبال کا دھاوا، 220 ق م"

# Hannibal defeats the Carpetani, 220 BC
markers.iberia-tagus.note: "ہنیبال کارپیتانی کو شکست دیتا ہے، 220 ق م"

# The Gauls turn back along the coast with their plunder
