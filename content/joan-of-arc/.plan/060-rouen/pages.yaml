- id: the-court
  title: "The court of Pierre Cauchon"
  date: "January – April 1431"
  when: "1431-01-03"
  tells: >-
    Pierre Cauchon, Bishop of Beauvais, in whose diocese, by the record, she was taken and whose see Charles VII now holds, opens
    the trial at Rouen in English Normandy, with masters of the University of Paris beside him, the vice-inquisitor
    drawn in by March, and the English crown paying: a church court that has to prove her a heretic.
