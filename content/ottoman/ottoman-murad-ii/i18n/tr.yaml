# The Ottoman camp
emblems.kosovo-flanks.ott-camp: "Osmanlı ordugâhı"

# The Rumelian sipahis on the left wing, who give ground until the light horse comes up. The accounts give the order of the wings but not their ground
emblems.kosovo-flanks.rumelians: "Hafif süvariler gelene kadar geri çekilen, sol kanattaki Rumeli sipahileri. Anlatımlar kanatların sırasını verir, yerlerini vermez"

# The Anatolian troops on the right wing under Murad’s son Mehmed, sixteen, in his first battle. Turkish accounts say that Murad kept them out of the first day’s fighting
emblems.kosovo-flanks.anatolians: "Murad’ın on altı yaşındaki oğlu Mehmed’in ilk muharebesinde komuta ettiği, sağ kanattaki Anadolu askerleri. Türk anlatımlarına göre Murad onları ilk günün çarpışmalarına sokmaz"

# Ottoman light horse on the flank of the left wing
emblems.kosovo-flanks.light-left: "Sol kanadın yanında Osmanlı hafif süvarileri"

# Ottoman light horse on the flank of the right wing
emblems.kosovo-flanks.light-right: "Sağ kanadın yanında Osmanlı hafif süvarileri"

# The crusader right wing: Hungarian horse, light and heavy, against the Ottoman left
emblems.kosovo-flanks.right: "Haçlıların sağ kanadı: Osmanlı sol kanadına karşı hafif ve ağır Macar süvarileri"

# Hunyadi with the heavy horse in the centre, before the wagon fort
emblems.kosovo-flanks.knights: "Merkezde, araba istihkâmının önünde ağır süvarileriyle Hunyadi"

# The crusader left wing: the Wallachian horsemen, about 8,000 by Cartledge, with Moldavian and Hungarian horse, against the Ottoman right
emblems.kosovo-flanks.left: "Haçlıların sol kanadı: Osmanlı sağ kanadına karşı Cartledge’a göre 8.000 kadar Eflak süvarisi, Boğdan ve Macar süvarileriyle birlikte"

# The wagon fort on the hill north of the Lab, with the guns and the German and Bohemian foot. The sources give 800 to 2,000 war wagons, each with a gun
emblems.kosovo-flanks.wagon-fort: "Lab’ın kuzeyindeki tepede, topları ve Alman ve Bohemyalı piyadeleriyle araba istihkâmı. Kaynaklar her birinde bir top bulunan 800 ile 2.000 savaş arabası verir"

# The horse of the crusader right attacks the Ottoman left wing, 17 October
emblems.kosovo-flanks.right-attack: "Haçlıların sağ kanadındaki süvariler Osmanlı sol kanadına saldırır, 17 Ekim"

# The horse of the crusader left attacks the Ottoman right wing
emblems.kosovo-flanks.left-attack: "Haçlıların sol kanadındaki süvariler Osmanlı sağ kanadına saldırır"

