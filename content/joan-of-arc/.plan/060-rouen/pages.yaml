- id: the-questioning
  title: "The questioning"
  date: "21 February – 12 May 1431"
  when: "1431-02-21"
  tells: >-
    In the chapel and the hall of the castle and then in her cell, she is questioned on her voices, the sign given
    to the king and the man's dress she will not put off; the charges are drawn into seventy articles and then
    twelve, and in the great tower she is shown the instruments of torture.
