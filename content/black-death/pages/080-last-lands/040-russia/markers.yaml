pskov:
  lnglat: [28.33, 57.82]
  icon: biohazard
  label: "Pskov"
  note: "Reached just before the winter of 1351, the full outbreak in spring 1352"
vasily-kalika:
  lnglat: [29.15, 57.62]
  icon: skull
  label: "Vasily Kalika"
  note: "The archbishop of Novgorod falls ill on the way home from Pskov and dies at the mouth of the Uza, 3 July 1352, it seems of the plague"
novgorod:
  lnglat: [31.27, 58.52]
  icon: biohazard
  label: "Novgorod"
  note: "Plague from August 1352"
belozersk-1352:
  lnglat: [37.79, 60.03]
  icon: biohazard
  label: "Belozersk (Beloozero)"
  note: "No one left alive in 1352. The town is later rebuilt here, on a new site."
simeon:
  lnglat: [37.617, 55.751]
  icon: skull
  label: "Simeon the Proud"
  note: "The grand prince dies 27 April 1353, weeks after his two sons. The chronicle names no illness, and historians take it for the plague."
moscow-1353:
  lnglat: [37.62, 55.757]
  icon: biohazard
  label: "Moscow"
  note: "Plague in 1353. The chronicles do not name Moscow."
