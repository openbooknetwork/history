# One story: a timeline shown on one map.
id: alexander-the-great
title: "Alexander the Great"
summary: "Alexander III of Macedon, from the kingdom Philip built through the conquest of the Persian Empire — the Granicus, Issus, Gaugamela and the Hydaspes — to his death at Babylon in 323 BC and the Hellenistic world his successors carved from the empire."
cover: issus-mosaic-alexander-863307   # Alexander at Issus, House of the Faun mosaic, Pompeii, about 100 BC; shown on the main page
span: "360 – 301 BC"          # BC years cannot go in a page's when, so the card's date line is written out
languages: [en]               # widened to the site's languages at the translation step
default_language: en
labels:
  countries: false

# Map extent for the border data and the opening view: [west, south, east, north]. Reaches Pelium and the
# Peloponnese in the west, Siwa, the Gedrosian coast and Patala in the south, the Hyphasis in the east, and the
# Getae beyond the Danube and the Saka beyond the Jaxartes in the north.
extent: [18, 23.5, 77, 46]
# Countries whose land the zones are clipped to. Natural Earth names.
land: [Greece, Albania, Macedonia, Kosovo, Serbia, Montenegro, Bulgaria, Romania, Turkey, Cyprus, N. Cyprus,
  Syria, Lebanon, Israel, Palestine, Jordan, Egypt, Libya, Iraq, Kuwait, Iran, Armenia, Azerbaijan, Georgia,
  Turkmenistan, Uzbekistan, Tajikistan, Kyrgyzstan, Kazakhstan, Afghanistan, Pakistan, India]
# Countries drawn with borders. Everything else inside the extent is left out.
countries: [Italy, Croatia, Bosnia and Herz., Hungary, Serbia, Montenegro, Kosovo, Albania, Macedonia, Greece, Bulgaria,
  Romania, Moldova, Ukraine, Russia, Turkey, Cyprus, N. Cyprus, Georgia, Armenia, Azerbaijan, Syria, Lebanon, Israel,
  Palestine, Jordan, Egypt, Libya, Sudan, Saudi Arabia, Iraq, Kuwait, Bahrain, Qatar, United Arab Emirates, Oman, Iran,
  Turkmenistan, Uzbekistan, Tajikistan, Kyrgyzstan, Kazakhstan, Afghanistan, Pakistan, India, China, Nepal]

# Zone families. A zone subtracts every zone from a family with a lower priority number.
# Zones in the same family never cut each other, so one family can hold several dated shapes.
# Macedon and the Seleucid Empire take their Punic Wars colours.
families:
  sogdians:   { priority: 0, color: "#e2734a", color_dark: "#f7a07c", pattern: hatch }   # the rising of Sogdiana and Bactria under Spitamenes, 329–327 BC
  thebes:     { priority: 1, color: "#c78a1c", color_dark: "#f0b54a" }                   # Thebes and the Boeotian League; Thebes in revolt, 335 BC
  thessaly:   { priority: 2, color: "#2e8b57", color_dark: "#5fcf8f", pattern: hatch }   # Thessaly under Philip and Alexander as its archons, from 352 BC
  ptolemaic:  { priority: 3, color: "#d4a017", color_dark: "#f2c94c" }                   # Ptolemy's Egypt from 323 BC, Ptolemaic Egypt from 305 BC
  lysimachus: { priority: 4, color: "#6d4c41", color_dark: "#a1887f" }                   # Lysimachus's Thrace from 323 BC, the kingdom of Lysimachus from about 305 BC
  seleucid:   { priority: 5, color: "#1f8a8a", color_dark: "#4fc4c4" }                   # Seleucus's Babylonia from 320 BC, the Seleucid Empire from about 305 BC
  antigonus:  { priority: 6, color: "#b5352a", color_dark: "#e8695c" }                   # Antigonus's satrapy from 323 BC, his Asia from 316 BC, the kingdom of Antigonus 306–301 BC
  eumenes:    { priority: 7, color: "#7f8c8d", color_dark: "#aab7b8", pattern: hatch }   # Eumenes's Cappadocia and Paphlagonia, 323–316 BC
  macedon:    { priority: 8, color: "#2e8b57", color_dark: "#5fcf8f" }                   # the kingdom of Macedon, Alexander's empire, the empire of the kings, Cassander's Macedon
  persia:     { priority: 9, color: "#a8323e", color_dark: "#e0606c" }                   # the Persian Empire of the Achaemenids to July 330 BC, and Bessus's kingdom to summer 329 BC
  taxila:     { priority: 10, color: "#3fa2d0", color_dark: "#86d0f0", pattern: cross }  # the kingdom of Taxiles
  porus:      { priority: 11, color: "#c0587a", color_dark: "#f08aa8" }                  # the kingdom of Porus
  indians:    { priority: 12, color: "#a0461e", color_dark: "#e07a4a", pattern: dots }   # the other Indian peoples as one zone: the Cophen valley, the Malli, the lower Indus
  sparta:     { priority: 13, color: "#6a3d9a", color_dark: "#b78ad6" }                  # Sparta, and Agis III's Peloponnesian allies in 331–330 BC
  athens:     { priority: 14, color: "#2f6a9f", color_dark: "#6fa3d6" }                  # Athens and Attica
  olynthus:   { priority: 15, color: "#b03a7a", color_dark: "#e07ab0", pattern: hatch }  # the Chalcidian League under Olynthus, to 348 BC
  league:     { priority: 16, color: "#2f6a9f", color_dark: "#6fa3d6", pattern: hatch }  # the Greek members of the League of Corinth as one zone, from 337 BC
  greeks:     { priority: 17, color: "#4a90c8", color_dark: "#82bdf0", pattern: dots }   # Greek states as one zone where a page needs no border between them; the Greeks of the Lamian War
  epirus:     { priority: 18, color: "#93b02a", color_dark: "#c9e063" }                  # the kingdom of Epirus
  illyrians:  { priority: 19, color: "#4f6272", color_dark: "#8fa5b8", pattern: cross }   # the Illyrian peoples: Bardylis, Cleitus, Glaucias and the Taulantians
  triballi:   { priority: 20, color: "#b8733a", color_dark: "#e0a56f", pattern: dots }   # the Triballi between the Haemus and the Danube
  thracians:  { priority: 21, color: "#a0522d", color_dark: "#d98b5f", pattern: hatch }  # the Thracian peoples outside Macedon, the Maedi among them
  getae:      { priority: 22, color: "#5e4630", color_dark: "#9c8164" }                  # the Getae beyond the Danube
  scythians:  { priority: 23, color: "#c2a878", color_dark: "#e2cfa3", pattern: dots }   # the Saka and Scythians beyond the Jaxartes, the Massagetae and the Dahae
  tyre:       { priority: 24, color: "#8e3b8e", color_dark: "#c97ac9" }                  # Tyre, on the battle card of the siege only
# Corner rounding passes applied to every hand drawn zone before the clip.
smoothing: 4
# Battle plans are drawn at the scale of the field, a few kilometres across; the Persian Gate is a narrow defile.
max_zoom: 14
