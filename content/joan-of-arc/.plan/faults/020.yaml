  old: "- 020.16 Border: by October 1428 the English held the Loire crossings of Meung and Beaugency below Orléans and Jargeau above it; Sully, higher up, surrendered (to the Burgundians, Ramsay; by La Trémoille, its lord, Lowell). Between Sully and Blois the Loire had four bridges: Jargeau, Orléans, Meung, Beaugency. Orléans lies on the north bank. The sources give the towns and bridges, not a line. agreed (Lowell; Ramsay). \"Between Sully and Blois there were but four bridges crossing the Loire, viz., at Jargeau, Orleans, Meung, and Beaugency.\" (archive.org-download-joanofarc00lowe-joanofarc00lowe-djvu.txt.txt, ch. 7 note, lines 3771-3773, scholarly) \"higher still Sully fell into the hands of the Burgundians\" (archive.org-download-lancasterandyor00ramsgoog-lancasterandyor00ramsgoog-djvu.txt.txt, ch. 26, line 24204, scholarly)"
  new: "- 020.16 Border: by October 1428 the English held the Loire crossings of Meung and Beaugency below Orléans and Jargeau above it; Sully, higher up, surrendered (to the Burgundians, Ramsay; by La Trémoille, its lord, Lowell). Between Sully and Blois the Loire had four bridges: Jargeau, Orléans, Meung, Beaugency. Orléans lies on the north bank. The sources give the towns and bridges, not a line. agreed (Lowell; Ramsay). \"Between Sully and Blois there were but four bridges crossing the Loire, viz., at Jargeau, Orleans, Meung, and Beaugency.\" (archive.org-download-joanofarc00lowe-joanofarc00lowe-djvu.txt.txt, ch. 7 note, lines 3771-3773, scholarly) \"higher still Sully fell into the hands of the Burgundians\" (archive.org-download-lancasterandyor00ramsgoog-lancasterandyor00ramsgoog-djvu.txt.txt, ch. 26, line 24204, scholarly) \"Above Jargeau was Sully, belonging to La Tremoille, wliicli he hastened to surrender\" (archive.org-download-joanofarc00lowe-joanofarc00lowe-djvu.txt.txt, ch. 7, lines 3735-3736, scholarly)"
  source: "Lowell's account of Sully had no quote: ch. 7, lines 3735-3736, \"Above Jargeau was Sully, belonging to La Tremoille, wliicli he hastened to surrender\"."
