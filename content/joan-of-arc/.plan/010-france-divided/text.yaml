      - { name: domremy-saint-remy-church, shows: "the church of Saint-Remy at Domrémy, where she was baptised" }
  harfleur-and-agincourt:
    account: >-
      Henry V, reviving Edward III's claim to the crown of France, takes his chance in the civil war. His fleet
      anchors at the mouth of the Seine near the Chef de Caux on 13 August 1415 and the army lands unopposed between
      Harfleur and Honfleur from the next day, about 6,000 men-at-arms and 23,000 archers by Monstrelet's count, told
      with his name. Harfleur, bombarded and mined, surrenders on 22 September, St Maurice's day, when no relief comes
      from the French army at Rouen. The siege cost a fifth of the army, more of camp fever than of fighting (Oman),
      and about 5,000 sick were sent home (the Gesta). Against most of his council Henry marches for Calais on 8 or 9
      October (Ramsay). The ford of Blanche-Taque is held on 13 October, and the army goes up the Somme and crosses
      only on 19 October at Béthencourt above Péronne (Oman), while the French gather at Bapaume. On Friday 25
      October, the feast of Sts Crispin and Crispinian, the French host under the Constable d'Albret bars the road to
      Calais between the woods and enclosures of Agincourt and Tramecourt. The ground is narrow and the ploughed fields
      soaked with rain; the English stand in one line, York on the right, the king in the centre, Camoys on the left,
      archers behind sharpened stakes; Henry advances to bring the French within bowshot; the French horse is shot
      down or breaks back through its own line, the men-at-arms on foot struggle through the mud and are beaten, and at
      an alarm Henry has the prisoners killed. The great of France are killed or taken to England: the Constable
      d'Albret, John I, Duke of Alençon, Edward, Duke of Bar, and the Count of Nevers dead, Charles of Orléans, the Duke of Bourbon and
      Marshal Boucicaut prisoners. The army reaches Calais on 29 October (Ramsay). Every strength and every count of
      the dead names its author; no one figure is given as the truth. The map adds Harfleur to the English holdings and
      shows Henry's march. The march between Blanche-Taque and Béthencourt is a reconstruction along the south bank of
      the Somme, and the text says the line is approximate.
    files:
      - { file: .references/archive.org-download-lancasterandyor00ramsgoog-lancasterandyor00ramsgoog-djvu.txt.txt, read: "ch. 15, l. 14216 to 15390" }
      - { file: .references/archive.org-download-historyofartofwa0002char-historyofartofwa0002char-djvu.txt.txt, read: "book 14 ch. 1, l. 18840 to 19210" }
      - { file: .references/archive.org-download-chroniclesengue06johngoog-chroniclesengue06johngoog-djvu.txt.txt, read: "Book 1, Henry lays siege to Harfleur and the battle of Azincourt, l. 24770 to 25760" }
      - { file: .references/archive.org-download-henriciquintian00willgoog-henriciquintian00willgoog-djvu.txt.txt, read: "after Harfleur and the battle, l. 4670 to 4700 and l. 5640 to 5670 (Latin)" }
    passages: ["Ramsay 1, ch. 15", "Oman book 14 ch. 1", "Monstrelet book 1, Henry lays siege to Harfleur; the battle of Azincourt", "the Gesta, after Harfleur and the battle", "the Bourgeois §129 to 130"]
    disputes:
      - { claim: "010.23", how: "the body says Henry left Harfleur on 8 or 9 October, as Ramsay gives it." }
      - { claim: "010.25", how: "the body gives the Gesta's 900 lances and 5,000 archers and Oman's not much more than 6,000 men, each with its author, and no one figure as the truth; the modern counts are Thin and not told." }
      - { claim: "010.26", how: "the body says the French were several times the English, with Ramsay's and Oman's estimates named, and gives Monstrelet's 150,000 as his; the modern counts are Thin and not told." }
      - { claim: "010.30", how: "the body says Henry advanced to bring the French within bowshot and gives no distance, since Oman and Ramsay differ." }
      - { claim: "010.31", how: "the body gives Monstrelet's more than 10,000 dead and Oman's lower count, each with its author; the card gives Ramsay's as well." }
    sources:
