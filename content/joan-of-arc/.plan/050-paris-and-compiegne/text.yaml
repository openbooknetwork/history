  compiegne:
    account: >-
      In May 1430 Philip the Good took the castle of Choisy on the Oise, which Louis de Flavy held for his brother, razed
      it, and bridged the Oise to come at Compiègne from the side of Montdidier. Soissons, held for the king by a captain
      the duke had bought, shut its gates on the army of Joan, the Archbishop of Reims and Vendôme (on 18 May, Lang), and
      was sold to Burgundy some weeks later; Lang, after Champion's document, names the captain Guichard Bournel and the
      price 4,000 saluts. The captains went to Senlis and left Compiègne to itself. By 21 or 22 May the besiegers lay on
      the right bank of the Oise opposite the town: the duke at Coudun, a league off; John of Luxembourg, Count of Ligny,
      at Clairoix; Baudot de Noyelle at Margny, at the end of the causeway from the bridge; and the English under Lord
      Montgomery in the meadows at Venette. Joan was at Crépy when she heard that Burgundy and the Earl of Arundel were
      besieging Compiègne; she rode out about midnight with her company, saying they were enough and she would go to see
      her good friends of Compiègne, and came in about sunrise (Cagny, followed by Lowell and Lang); Chastellain has her
      enter by night and rest two nights before the sortie. Her company was 300 to 400 combatants in Cagny, and the band
      of about 200 of the Italian captain Bartolomeo Baretta in Lowell and Lang. The day of the sortie and the capture is
      23 May in the Duke of Burgundy's letter to Saint-Quentin, written that day at Coudun, in Cagny and in the Bourgeois,
      followed by Lowell, Lang and Beaucourt; Monstrelet and Chastellain have the eve of the Ascension, the 24th, and
      Ramsay follows them while noting the letter's date. In the late afternoon, about four (Chastellain, Lowell) or five
      (Monstrelet), she rode out over the bridge and through the boulevard at its end with 500 to 600 horse and foot
      (Monstrelet; 500 in Chastellain) against the post at Margny. John of Luxembourg, riding over from Clairoix with the
      lord of Créqui and a few gentlemen, called up his men; by her own account she drove them back twice as far as the
      Burgundian camp and the third time to the middle of the road, and then the English, near 500 in Monstrelet, cut
      her off from the bridge. Cagny tells it otherwise, with a Burgundian ambush laid behind the hill of Clairoix that
      rode between her and the bridge. As the enemy pressed to the end of the bridge, Guillaume de Flavy, the captain,
      had the bridge raised and the gate shut for fear of losing the town, and she was left outside with few of her men,
      in the fields on the Picardy side by the boulevard, with only the river and the boulevard and its ditch between her
      and the town (her own account). The sources read find no treason in the shutting of the gate (Cagny, Champion,
      Ramsay); the Wikipedia article reports the question as one scholars still debate. An archer pulled her from her
      horse by her cloth-of-gold huque, and she gave her faith to the Bastard of Wandonne, a man-at-arms of John of
      Luxembourg's company, who took her to Margny (Chastellain); Lowell names him Lionel. Cagny has five or six lay hands
      on her and her answer that she had given her faith to another. Poton le Bourguignon was taken with her (Monstrelet),
      and her brother and her steward (Chastellain). The losses stand on the card by author. The Duke of Burgundy came
      from Coudun too late for the fight, went to see her and spoke with her, and Monstrelet, who was there, does not
      remember what was said. She was given into John of Luxembourg's keeping that evening, and he held her in his
      lodging three or four days (Cagny). The story that on the morning of 23 May, in the church of Saint-Jacques, she
      told the townsfolk and children she had been sold and betrayed was taken down by Bouchart in 1498 from two old men,
      and Lowell and Lang doubt it; the text tells it so or not at all. The map shows her road from Crépy, her sortie
      along the causeway to Margny, John of Luxembourg's ride from Clairoix and the English from Venette to the bridge,
      reconstructions from the places named but for the causeway, which the sources give; the posts are marked, and
      Choisy and Soissons as lost to Burgundy. Compiègne waits under the card, and Clairoix, Venette and Choisy wait under
      Margny's and Clairoix's icons at the opening view, so the text links each.
