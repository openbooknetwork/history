emblems.nicopolis-sipahis.azaps: "Sipahilerin arkasına kaçmış azaplar"

# Bayezid with the janissaries and the horsemen of his household on the hill behind his army
emblems.nicopolis-sipahis.bayezid: "Ordusunun gerisindeki tepede yeniçeriler ve kapıkulu süvarileriyle Bayezid"

# Stefan Lazarević with about 1,500 Serbian heavy horsemen, held back out of sight. The accounts give no position for them in the line
emblems.nicopolis-sipahis.serbs: "Görünmeyecek bir yerde geride tutulan, 1.500 kadar Sırp ağır süvarisiyle Stefan Lazarević. Anlatımlar onların hattaki yerini vermez"

# The French climb on after the fleeing azaps, believing they have beaten Bayezid’s whole army
emblems.nicopolis-sipahis.french-climb: "Bayezid’in bütün ordusunu yendiklerini sanan Fransızlar kaçan azapların ardından tırmanmayı sürdürür"

# The sipahis come over the crest and charge the French
emblems.nicopolis-sipahis.sipahi-charge: "Sipahiler sırtı aşıp Fransızlara hücum eder"

# Some of the French flee back down the slope
emblems.nicopolis-sipahis.french-flee: "Fransızların bir kısmı yokuştan aşağı kaçar"

# Sipahis ride down along the flanks of the crusader army
emblems.nicopolis-sipahis.sipahi-flank: "Sipahiler Haçlı ordusunun kanatları boyunca aşağı iner"

# 25 September 1396
pages.nicopolis-sipahis.date: "25 Eylül 1396"

# The sipahis
pages.nicopolis-sipahis.title: "Sipahiler"

# The Danube
emblems.nicopolis-serbs.danube: "Tuna"

# The Osam, which flows into the Danube west of the town
emblems.nicopolis-serbs.osam: "Kasabanın batısında Tuna’ya dökülen Osma ırmağı"

# Rows of sharpened stakes in front of the Ottoman foot
emblems.nicopolis-serbs.stakes: "Osmanlı piyadesinin önüne çakılmış sivri kazık sıraları"

# Sigismund’s main body: the Hungarians, the Germans and the Knights Hospitaller fight against the encircling sipahis and are overwhelmed
emblems.nicopolis-serbs.sigismund: "Sigismund’un ana birliği: Macarlar, Almanlar ve Rodos Şövalyeleri kendilerini kuşatan sipahilere karşı savaşır ve bozulur"

# The Transylvanians leave the field
emblems.nicopolis-serbs.transylvanians: "Erdelliler alanı terk eder"

# Mircea’s Wallachians leave the field
emblems.nicopolis-serbs.wallachians: "Mircea’nın Eflaklıları alanı terk eder"

# Venetian and Hospitaller galleys on the Danube
emblems.nicopolis-serbs.ships: "Tuna’daki Venedik ve Rodos Şövalyeleri kadırgaları"

# The sipahis press Sigismund’s main body from the front
emblems.nicopolis-serbs.sipahis: "Sipahiler Sigismund’un ana birliğini önden sıkıştırır"

# Sipahis close round the crusaders from the flank and the rear
emblems.nicopolis-serbs.sipahi-flanks: "Sipahiler Haçlıları yandan ve arkadan çevirir"

# Stefan Lazarević’s Serbian heavy horsemen strike the Hungarian centre, where Nicholas Garai’s troops hold the royal banner
emblems.nicopolis-serbs.serbs: "Stefan Lazarević’in Sırp ağır süvarisi, Nikola Garai’nin birliklerinin kraliyet sancağını tuttuğu Macar merkezine saldırır"

# The azaps, who have fled behind the sipahis
emblems.nicopolis-serbs.azaps: "Sipahilerin arkasına kaçmış azaplar"

# Bayezid with the janissaries and the horsemen of his household on the hill behind his army
emblems.nicopolis-serbs.bayezid: "Ordusunun gerisindeki tepede yeniçeriler ve kapıkulu süvarileriyle Bayezid"

# The Serbs charge into the Hungarian centre. Schiltberger, who fought on the Hungarian side, writes that they brought down the king’s banner
emblems.nicopolis-serbs.serbs-charge: "Sırplar Macar merkezine hücum eder. Macar tarafında savaşan Schiltberger, kralın sancağını yere indirdiklerini yazar"

# Seeing riderless horses run back through the lines, the Transylvanians leave the field
emblems.nicopolis-serbs.transylvanians-leave: "Safların arasından geri koşan binicisiz atları gören Erdelliler alanı terk eder"

# Mircea’s Wallachians leave the field
emblems.nicopolis-serbs.wallachians-leave: "Mircea’nın Eflaklıları alanı terk eder"

# The crusaders flee to the Danube, where many drown trying to reach the boats
emblems.nicopolis-serbs.rout: "Haçlılar Tuna’ya kaçar, birçoğu teknelere ulaşmaya çalışırken boğulur"

# Sigismund and the Master of the Hospitallers escape in a fishing boat to the Venetian ships
emblems.nicopolis-serbs.sigismund-escape: "Sigismund ile Rodos Şövalyeleri’nin üstadı bir balıkçı teknesiyle Venedik gemilerine kaçar"

