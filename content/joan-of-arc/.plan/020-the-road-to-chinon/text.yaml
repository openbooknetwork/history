      - { file: .references/archive.org-download-joanofarc00lowe-joanofarc00lowe-djvu.txt.txt, read: "ch. 4, lines 2200-2290; ch. 5, Chinon, lines 2313-2460 and the notes at lines 2850-2900" }
      - { file: .references/archive.org-download-maidoffrancebein00languoft-maidoffrancebein00languoft-djvu.txt.txt, read: "ch. 7, lines 3820-3900; ch. 8, lines 3990-4020; the notes at lines 14750-14765" }
      - { file: .references/archive.org-download-procsdecondam04joanuoft-procsdecondam04joanuoft-djvu.txt.txt, read: "the Continuator of Guillaume de Nangis, p. 313" }
    passages: ["Barrett, public examination of 22 February 1431, lines 1202-1228", "Murray, deposition of Jean de Metz, lines 11595-11635", "Murray, deposition of Bertrand de Poulengy, lines 11900-11930"]
    disputes:
      - { claim: "020.42", how: "the body gives the days of leaving with their authors: Lowell's 12 February, Jean de Metz's first Sunday in Lent, Lang's 23 February." }
      - { claim: "020.43", how: "the body gives Lowell's 23 February and the Continuator of Nangis's 6 March, each with those who follow it, and Beaucourt's 8 March in a note." }
      - { claim: "020.44", how: "the body gives the escorts' eleven days, and a note gives Lang's ten." }
      - { claim: "020.41", how: "the body names the six from Poulengy and her own count, and a note gives Thurston's three and Monstrelet's four to six." }
      - { claim: "020.63", how: "the body says they rode on south of the river from Gien and names no crossing." }
    sources:
      - "The Trial of Jeanne d'Arc, tr. W. P. Barrett (1932), the public examinations of 22 and 27 February 1431."
      - "T. Douglas Murray (ed. and tr.), Jeanne d'Arc, Maid of Orleans (1902), the depositions of Jean de Metz, Henri Le Royer, Bertrand de Poulengy and Dunois."
      - "The French Continuator of Guillaume de Nangis, in J. Quicherat (ed.), Procès, vol. 4 (1847)."
      - "F. C. Lowell, Joan of Arc (1896), ch. 4 and 5."
      - "A. Lang, The Maid of France (1908), ch. 7 and 8."
    images:
      - { name: vaucouleurs-porte-de-france, shows: "the Porte de France at Vaucouleurs, the gate she is said to have ridden out by", "on": marker vaucouleurs-departure }
      - { name: auxerre-cathedral, shows: "the cathedral of Saint-Étienne at Auxerre", "on": marker auxerre-1429 }
  chinon-and-poitiers:
    account: >-
      She reached Chinon towards noon and lodged at an inn, and by her own account went up to the castle after dinner;
      Dunois's envoys, Simon Charles as Lowell cites him, and Thurston have the king keep her waiting two days (two or
      three, Lowell). In the castle the Count of Vendôme brought her in, and she knew the king among many, though some
      played the king, by the counsel of her voice, she said, and told him she came to help him and make war on the
      English. She called him the Dauphin until he was anointed, and the text says so once. He had a sign before he
      believed her, she told her judges, and would say no more; Pasquerel had from her that she told him he was the
      true heir of France; what the sign was is not known. Churchmen and doctors, Regnault de Chartres, Archbishop of
      Reims and chancellor, with them, examined her at Poitiers, where she lodged with Jean Rabateau (Seguin Seguin, one
      of them, in 1456); no record of the examination survives (Thurston). She was there from about 10 March (Lowell),
      and her words were weighed three weeks at Chinon and Poitiers (Gaucourt); the doctors' written opinion came about
      6 April (Lowell) or about 17-20 April (Lang): nothing in her against the faith, and in the kingdom's need the king
      might use her. Yolande of Aragon, the king's mother-in-law, examined her too, at Poitiers (Lowell) or later at
      Tours with a jury of ladies (Lang), and helped pay for the convoy. Her letter summoning the King of England,
      Bedford and the captains before Orléans to go home is dated at Poitiers on the Tuesday of Holy Week, 22 March
      1429; she owned it at her trial, save two or three words. From about the middle of April she was at Tours, lodged
      with Jean Dupuy, and was given armour and a household: Jean d'Aulon her squire, the pages Louis de Coutes and
      Raymond, and the Austin friar Jean Pasquerel her confessor. A painter of Tours was paid 25 livres tournois for a
      great standard and a small one (Murray's note from the war treasurer's account); its design differs between her
      own account, Pasquerel's and Thurston's, and Lowell thinks she had more than one. She sent for a sword behind the
      altar of Sainte-Catherine-de-Fierbois, and it was found rusted, with five crosses on it, and fetched by an
      armourer of Tours: through her voices, she said; Lowell thinks she probably saw or heard of the votive arms there,
      and Lang that no more is known than what she told her judges. After about ten days at Tours she went up the Loire
      to Blois with the Archbishop of Reims and Raoul de Gaucourt, where the convoy for Orléans gathered under the
      marshals de Rais and de Boussac, the admiral de Culant and La Hire. The map shows her road from Chinon by Poitiers
      and Tours to Blois, a reconstruction through the towns the witnesses give in turn.
