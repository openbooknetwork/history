# Roman Republic
battle.sides.0.name: "Repubblica romana"

# 86,400, with 10,000 left to guard the camps
battle.sides.0.strength: "86.400, di cui 10.000 lasciati a guardia degli accampamenti"

# Polybius: 70,000 killed, 10,000 captured. Livy: 48,200 killed, 19,300 captured
battle.sides.0.casualties: "Polibio: 70.000 morti, 10.000 prigionieri. Livio: 48.200 morti, 19.300 prigionieri"

# Carthage
battle.sides.1.name: "Cartagine"

# 50,000, with 10,000 cavalry
battle.sides.1.strength: "50.000, di cui 10.000 cavalieri"

# Polybius: 5,700 killed. Livy: 8,000 killed
battle.sides.1.casualties: "Polibio: 5.700 morti. Livio: 8.000 morti"

# Battle of Cannae
battle.name: "Battaglia di Canne"

# 2 August 216 BC
battle.date: "2 agosto 216 a.C."

# Carthaginian victory
battle.result: "Vittoria cartaginese"

