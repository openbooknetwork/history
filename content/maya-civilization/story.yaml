# One story: a timeline shown on one map.
id: maya-civilization
title: "The Maya"
summary: "The Maya of southern Mexico and Central America, from the first cities of the Preclassic through the Classic kingdoms and their wars to the Spanish conquest, which ended at Nojpetén in 1697."
cover: rediscovery-tulum-7f3f4c   # Frederick Catherwood, the Castillo at Tulum, lithograph, 1844; shown on the main page
span: "c. 1000 BC – AD 1697"  # BC years cannot go in a page's when, so the card's date line is written out
languages: [en, tr]
default_language: en
labels:
  countries: false

# Map extent for the border data and the opening view: [west, south, east, north]. Reaches Teotihuacan and Mexico
# City in the west, western Cuba in the east and the Pacific coast of El Salvador in the south.
extent: [-99.5, 13, -85, 22.5]
# Countries whose land the zones are clipped to. Natural Earth names.
land: [Mexico, Guatemala, Belize, Honduras, El Salvador, Cuba]
# Countries drawn with borders. Everything else inside the extent is left out.
countries: [Mexico, Guatemala, Belize, Honduras, El Salvador, Nicaragua, Costa Rica, Cuba, Cayman Is.,
  United States of America]

# Zone families. A zone subtracts every zone from a family with a lower priority number.
# Zones in the same family never cut each other, so one family can hold several dated shapes.
families:
  spain:            { priority: 0, color: "#b03a7a", color_dark: "#e07ab0" }                  # Spanish rule: Cuba, New Spain, Guatemala, Yucatán
  mexico:           { priority: 0, color: "#3d4a5c", color_dark: "#9aa8bd" }                  # Mexico after independence
  britain:          { priority: 0, color: "#a0522d", color_dark: "#d98b5f" }                  # British Honduras
  nahua:            { priority: 1, color: "#6b8e23", color_dark: "#a3c45a" }                  # Teotihuacan, the Aztec Empire and its province of Xoconochco, the Mexican allies of the Spanish
  # the Classic kingdoms. Tikal's allies take its blue, the Kaanul's allies its red or a darker red, each with a pattern
  tikal:            { priority: 1, color: "#2f6fb0", color_dark: "#6fa6e0" }                  # Tikal (Mutul)
  kaanul:           { priority: 1, color: "#b5352a", color_dark: "#e8695c" }                  # the Kaanul kingdom of Dzibanche and Calakmul
  copan:            { priority: 2, color: "#2f6fb0", color_dark: "#6fa6e0", pattern: hatch }  # Copán, refounded from Tikal
  quirigua-tikal:   { priority: 2, color: "#2f6fb0", color_dark: "#6fa6e0", pattern: dots }   # Quiriguá as the vassal of Copán
  caracol-tikal:    { priority: 2, color: "#2f6fb0", color_dark: "#6fa6e0", pattern: cross }  # Caracol as the ally of Tikal, to 556
  el-peru-tikal:    { priority: 2, color: "#2f6fb0", color_dark: "#6fa6e0", pattern: dots }   # El Perú as the ally of Tikal in 378
  palenque-tikal:   { priority: 2, color: "#2f6fb0", color_dark: "#6fa6e0", pattern: hatch }  # Palenque under Pakal, allied with Tikal
  dos-pilas:        { priority: 2, color: "#b5352a", color_dark: "#e8695c", pattern: hatch }  # Dos Pilas, a Kaanul vassal from 648
  caracol-kaanul:   { priority: 2, color: "#b5352a", color_dark: "#e8695c", pattern: cross }  # Caracol as the ally of the Kaanul, from 556
  el-peru-kaanul:   { priority: 2, color: "#b5352a", color_dark: "#e8695c", pattern: dots }   # El Perú as the ally of the Kaanul
  quirigua-kaanul:  { priority: 2, color: "#b5352a", color_dark: "#e8695c", pattern: dots }   # Quiriguá backed by Calakmul, from 736
  naranjo-kaanul:   { priority: 2, color: "#6e1530", color_dark: "#b83a6a", pattern: hatch }  # Naranjo as a subject of the Kaanul
  la-corona-kaanul: { priority: 2, color: "#6e1530", color_dark: "#b83a6a", pattern: cross }  # La Corona as the ally of the Kaanul
  cancuen-kaanul:   { priority: 2, color: "#6e1530", color_dark: "#b83a6a", pattern: dots }   # Cancuén as a subject of the Kaanul
  mirador:          { priority: 2, color: "#8a5a2b", color_dark: "#c79063" }                  # El Mirador and the Mirador Basin
  uaxactun:         { priority: 2, color: "#2e8b57", color_dark: "#5fcf8f" }                  # Uaxactun
  el-peru:          { priority: 2, color: "#2e8b57", color_dark: "#5fcf8f" }                  # El Perú (Waka') on its own
  la-corona:        { priority: 2, color: "#c78a1c", color_dark: "#f0b54a" }                  # La Corona (Sak Nikte') on its own
  palenque:         { priority: 2, color: "#6a3d9a", color_dark: "#a98bd6" }                  # Palenque (B'aakal) on its own
  naranjo:          { priority: 2, color: "#c78a1c", color_dark: "#f0b54a" }                  # Naranjo free of the Kaanul, 626 to 631
  tonina:           { priority: 2, color: "#8a5a2b", color_dark: "#c79063" }                  # Toniná
  piedras-negras:   { priority: 2, color: "#1f8a8a", color_dark: "#4fc4c4" }                  # Piedras Negras (Yokib)
  yaxchilan:        { priority: 2, color: "#c0587a", color_dark: "#f08aa8" }                  # Yaxchilan (Pa' Chan)
  bonampak:         { priority: 2, color: "#c0587a", color_dark: "#f08aa8", pattern: hatch }  # Bonampak, a dependency of Yaxchilan
  aguateca:         { priority: 2, color: "#6a3d9a", color_dark: "#a98bd6" }                  # the Dos Pilas kings at Aguateca, from 761
  seibal:           { priority: 2, color: "#2e8b57", color_dark: "#5fcf8f" }                  # Seibal
  cancuen:          { priority: 2, color: "#c78a1c", color_dark: "#f0b54a" }                  # Cancuén on its own
  uxmal:            { priority: 2, color: "#2e8b57", color_dark: "#5fcf8f" }                  # Uxmal and the Puuc cities
  chichen:          { priority: 1, color: "#1f8a8a", color_dark: "#4fc4c4" }                  # Chichen Itza
  ek-balam:         { priority: 2, color: "#6a3d9a", color_dark: "#a98bd6" }                  # Ek' Balam
  coba:             { priority: 2, color: "#8a5a2b", color_dark: "#c79063" }                  # Coba
  # the Postclassic and the conquest
  mayapan:          { priority: 1, color: "#1f8a8a", color_dark: "#4fc4c4" }                  # the League of Mayapan
  kiche:            { priority: 1, color: "#a0461e", color_dark: "#e07a4a" }                  # the K'iche' kingdom of Q'umarkaj
  kaqchikel:        { priority: 2, color: "#d4a017", color_dark: "#f2c94c" }                  # the Kaqchikel kingdom of Iximche
  tzutujil:         { priority: 3, color: "#3a80c0", color_dark: "#5aa8e0" }                  # the Tz'utujil kingdom of Atitlan
  highland:         { priority: 3, color: "#7f8c8d", color_dark: "#aab7b8", pattern: dots }   # the Mam kingdom of Zaculeu, named highland by the Zaculeu battle plan
  poqomam:          { priority: 3, color: "#6a3d9a", color_dark: "#a98bd6" }                  # the Poqomam
  pipil:            { priority: 3, color: "#6b8e23", color_dark: "#a3c45a", pattern: hatch }  # the Pipil of Izcuintepeque (Panatacat)
  cuzcatlan:        { priority: 3, color: "#6b8e23", color_dark: "#a3c45a", pattern: cross }  # the Pipil of Cuzcatlan
  xiu:              { priority: 2, color: "#2e8b57", color_dark: "#5fcf8f" }                  # Maní under the Tutul Xiu
  canul:            { priority: 2, color: "#8a9a20", color_dark: "#c0d040" }                  # Ah Canul and Chakan
  pech:             { priority: 2, color: "#3a80c0", color_dark: "#5aa8e0" }                  # Ceh Pech, Ah Kin Chel and Hocaba
  western:          { priority: 2, color: "#8a9a20", color_dark: "#c0d040", pattern: hatch }  # the western provinces as one zone: Ah Canul, Chakan, Ceh Pech, Ah Kin Chel, Hocaba
  cocom:            { priority: 3, color: "#6a3d9a", color_dark: "#a98bd6" }                  # Sotuta under the Cocom
  cupul:            { priority: 4, color: "#c78a1c", color_dark: "#f0b54a" }                  # Cupul
  chikinchel:       { priority: 4, color: "#b5352a", color_dark: "#e8695c" }                  # Chikinchel and Tazes
  ecab:             { priority: 4, color: "#1f8a8a", color_dark: "#4fc4c4" }                  # Ecab, with Cozumel before 1517
  cozumel:          { priority: 4, color: "#d4a017", color_dark: "#f2c94c", pattern: dots }   # Cozumel
  cochuah:          { priority: 4, color: "#7a2a3a", color_dark: "#c0707f", pattern: hatch }  # Cochuah and Uaymil
  chetumal:         { priority: 4, color: "#2c3e7a", color_dark: "#8a9ee0", pattern: hatch }  # Chetumal
  canpech:          { priority: 5, color: "#d06a9a", color_dark: "#f0a0c8", pattern: dots }                  # Can Pech (Campeche)
  chontal:          { priority: 5, color: "#8a5a2b", color_dark: "#c79063" }                  # Potonchán and the Chontal Maya of Tabasco
  champoton:        { priority: 5, color: "#8a5a2b", color_dark: "#c79063", pattern: hatch }  # Champotón (Chakan Putum), a Chontal town
  acalan:           { priority: 5, color: "#8a5a2b", color_dark: "#c79063", pattern: dots }   # Acalan, the Chontal trading state of Itzamkanac
  itza:             { priority: 6, color: "#1aa3b8", color_dark: "#5fd3e6", pattern: cross }  # the Itza kingdom of Nojpetén
  kowoj:            { priority: 6, color: "#2e8b57", color_dark: "#5fcf8f" }                  # the Kowoj, rivals of the Itza
  kejache:          { priority: 7, color: "#c78a1c", color_dark: "#f0b54a" }                  # the Kejache
  chol:             { priority: 7, color: "#7d8b3a", color_dark: "#b5c46a", pattern: dots }   # the Lakandon and Manche Ch'ol
  cruzob:           { priority: 1, color: "#c0392b", color_dark: "#ef6b5b", pattern: hatch }  # the Maya of Chan Santa Cruz in the Caste War
  water:            { priority: 9, color: "#5b9bd5", color_dark: "#2c5d87" }                  # rivers and lakes on the battle plans, no zones
# Corner rounding passes applied to every hand drawn zone before the clip.
smoothing: 4
# Battle plans are drawn at the scale of the field: the island of Nojpetén is about 500 m across.
max_zoom: 16
