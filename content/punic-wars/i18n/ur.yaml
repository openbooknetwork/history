markers.mercenary-war-trap-saw.note: "دندانے دار شکل کی وجہ سے نام پانے والی پہاڑیاں"

# 40,000 rebels, no food
markers.mercenary-war-trap-spendius.note: "40,000 باغی، خوراک نہیں"

# Fortifies the way out
markers.mercenary-war-trap-hamilcar.note: "باہر کا راستہ قلعہ بند کرتا ہے"

# Second division
markers.mercenary-war-trap-hannibal.note: "دوسرا ڈویژن"

# Numidian cavalry
markers.mercenary-war-trap-naravas.note: "نومیڈیائی سوار فوج"

# Seized at the parley
markers.mercenary-war-saw-leaders.note: "بات چیت کے دوران پکڑے گئے"

# All killed
markers.mercenary-war-saw-rebels.note: "سب مارے گئے"

# The elephants lead the attack
markers.mercenary-war-saw-hamilcar.note: "ہاتھی حملے کی قیادت کرتے ہیں"

# Hanno and Hamilcar follow with more than 25,000 men
routes.carthaginians-238.name: "ہانو اور ہملکار 25,000 سے زیادہ آدمیوں کے ساتھ پیچھا کرتے ہیں"

# Hamilcar marches on Tunis, late 238 BC
routes.hamilcar-238.name: "ہملکار تیونس کی طرف بڑھتا ہے، 238 ق م کے اواخر"

# Matho leads the rebel army south to Leptis Parva
routes.mathos-238.name: "ماتھو باغی فوج کو جنوب میں لیپٹس پاروا لے جاتا ہے"

