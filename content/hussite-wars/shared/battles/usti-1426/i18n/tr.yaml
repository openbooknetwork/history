# About 11,000 by Čornej and Bělina, 24,000 to 25,000 by the chronicles, about 500 wagons
battle.sides.0.strength: "Čornej ve Bělina’ya göre yaklaşık 11.000, kroniklere göre 24.000 ile 25.000 arası, yaklaşık 500 araba"

# 19 by the Old Czech Annals, about 30 by Čornej and Bělina
battle.sides.0.casualties: "Eski Çek Yıllıkları’na göre 19, Čornej ve Bělina’ya göre yaklaşık 30"

# Relief army of Meissen, Saxony, Thuringia, Upper Lusatia and Hesse
battle.sides.1.name: "Meissen, Saksonya, Thüringen, Yukarı Lusatya ve Hessen’in kurtarma ordusu"

# About 13,000 by Čornej and Bělina, 30,000 by Bartošek of Drahonice, 70,000 by the Old Czech Annals
battle.sides.1.strength: "Čornej ve Bělina’ya göre yaklaşık 13.000, Drahoniceli Bartošek’e göre 30.000, Eski Çek Yıllıkları’na göre 70.000"

# About 4,000 by Bartošek of Drahonice, 6,000 by Matthias Döring, 12,000 by Hermann Korner
battle.sides.1.casualties: "Drahoniceli Bartošek’e göre yaklaşık 4.000, Matthias Döring’e göre 6.000, Hermann Korner’e göre 12.000"

