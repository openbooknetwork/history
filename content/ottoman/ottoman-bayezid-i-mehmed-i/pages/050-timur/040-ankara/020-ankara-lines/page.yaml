    - {side: timurids, type: elephants, at: [32.925, 40.12191], width: 1400, depth: 250, facing: 0, id: elephants, name: 'Thirty-two war elephants brought from India, in front of Timur’s centre', count: 8}
    - {side: timurids, type: cavalry, at: [32.925, 40.11286], width: 2200, depth: 900, facing: 0, id: timur, name: Timur in the centre with the main body. The accounts put his grandson Muhammad Sultan here or with the right wing}
