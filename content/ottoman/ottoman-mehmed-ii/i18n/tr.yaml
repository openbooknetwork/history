emblems.belgrade-river.anatolians: "Anadolu askerleri, Sava’dan hattın ortasına kadar sol kanat"

# The janissaries in the centre, before the sultan’s post
emblems.belgrade-river.janissaries: "Merkezde, padişahın otağının önündeki yeniçeriler"

