section:
  years: "1424 or 1425 to April 1429"
  opens: >-
    Since Verneuil in August 1424 Charles VII, crowned nowhere and called by his enemies the "King of Bourges", holds the
    land south of the Loire with Dauphiné and Languedoc, and Orléans, Vaucouleurs and a few towns beyond it. Henry VI,
    a child, is king in Paris, and his uncle Bedford governs Normandy, Paris, Champagne and Maine for him; Philip the
    Good, Duke of Burgundy, holds Flanders, Artois, Picardy and the two Burgundies as the English ally, and Brittany
    keeps to its own duke. The reader has met Joan as a child of Domrémy, born about 1412 in a village of the king's
    party on the Meuse, with Lorraine and Bar across the river, and has been told that the village's overlord is
    disputed.
  introduces: [Durand Laxart, Robert de Baudricourt, Antoine de Vergy, La Rousse, Neufchâteau, Burey, Saint-Urbain, the duchy of Lorraine, "William de la Pole, Earl of Suffolk", John de la Pole, Lord Talbot, Lord Scales, the Bastard of Orléans, Sir John Fastolf, "Charles, Count of Clermont", Guillaume d'Albret, Sandwich, Chartres, Janville, Meung, Beaugency, Jargeau, Sully, the Tourelles, the Portereau, Rouvray, the Beauce, the Sologne, the Parisians, Georges de La Trémoille, Languedoc, Henri Le Royer, Catherine Le Royer, Jean Fournier, Jacques Alain, Nancy, Saint-Nicolas-de-Port, Jean de Metz, Bertrand de Poulengy, Julien, Jean de Honnecourt, Colet de Vienne, Richard the Archer, Sainte-Catherine-de-Fierbois, Simon Charles, Regnault de Chartres, Raoul de Gaucourt, Yolande of Aragon, Seguin Seguin, Jean Rabateau, Poitiers, Tours, Jean Dupuy, Jean d'Aulon, Louis de Coutes, Raymond, Jean Pasquerel, Blois, La Hire, Gilles de Rais, Boussac, the Journal du siège, Quicherat, Murray, Champion, Boismarmin]
  hands_on: >-
    At the end of April 1429 Joan, examined at Poitiers and found without fault, armed and given a household and a
    banner at Tours, is at Blois with the convoy for Orléans, under the Archbishop of Reims, Gaucourt, the marshals
    de Rais and de Boussac and La Hire. Orléans has been besieged since October 1428: the English hold the Loire
    bridges of Jargeau, Meung and Beaugency, the Tourelles at the city's own bridge and a ring of bastilles that leaves
    the north-east open, and since the Herrings no French army has tried to break it. Charles VII is at Chinon. Left
    unsettled: whether the city can be relieved, and the day the convoy leaves Blois, which section 030 tells.
  left_out:
    - { event: "the crossing of the Loire at Gien", why: "France's Life alone names it (020.63, single), and rules.md leaves it out; the text says she reached Gien and went on south of the river, and names no crossing." }
    - { event: "Rouvray-Sainte-Croix as the field of the Herrings", why: "the Wikipedia article gives S. Cooper's case without a footnote, and Cooper was not read; the card stands at Rouvray-Saint-Denis, where the Journal of the Siege sets it." }
    - { event: "Salisbury's crossing from England", why: "told in a clause with both authors' dates (Calais about 1 July, Lowell; the muster at Sandwich on 19 July, Ramsay), and not drawn: the frame is the Loire campaign." }
pages:
  the-voices:
    account: >-
      At about thirteen, she told her judges on 22 February 1431, she heard a voice from God towards noon in summer in her
      father's garden at Domrémy, on her right towards the church, and seldom without a light; the year is 1424 or 1425,
      and the text gives it so, with Thurston's summer of 1425, Lang's "more probably" 1424 and Lowell's view that neither
      of her answers was meant to be exact. The voice told her, she said, to go into France, that she would raise the
      siege of Orléans, and to go to Robert de Baudricourt at Vaucouleurs, who would give her an escort; her father knew
      nothing of it. The text tells this as her testimony and takes no side on what the voices were. Vaucouleurs, on the
      Meuse a dozen miles north of Domrémy (twelve, Lang; thirteen, Lowell), was by midsummer 1428 the one town of the
      east that held for Charles VII (Lowell), with Champagne to the west, Troyes and Reims with it, Anglo-Burgundian
      (Lang); Domrémy, in Lorraine's territory, belonged to France as a dependency of Champagne, and Neufchâteau, a few
      miles south, was the Duke of Lorraine's, then of the English side. In May 1428, about Ascension Day, Bertrand de
      Poulengy remembered in 1456, she came to Baudricourt with her uncle Durand Laxart, the husband of a cousin, and
      was sent home; Lang holds to the date, Thurston puts the journey a month later, and Lowell doubts any visit in
      1428, since she, Laxart and Jean de Metz never speak of one. Laxart said that Baudricourt told him many times to
      take her back to her father and box her ears, at which visit Lang leaves uncertain. In July 1428 Antoine de Vergy,
      the English king's governor of Champagne, reviewed a force at Saint-Urbain (16-17 July, Lowell) and marched
      against Vaucouleurs; it left within days and Baudricourt kept the town, how is not known. For dread of the
      Burgundians, she said, she went to Neufchâteau and stayed about a fortnight with an innkeeper called La Rousse
      (later witnesses said four or five days); Lang and Lowell set the flight at Vergy's raid, Lowell calling the link
      altogether probable, and Murray's note gives September 1426 as another reading. The map shows the English and
      Burgundian land of 1428 closing round the island of Vaucouleurs, the visit of May 1428, the flight to Neufchâteau
      and Vergy's march; the routes are reconstructions from their two ends, and the text says once in the chapter
      that the borders and roads are approximate.
    files:
      - { file: .references/sourcebooks.web.fordham.edu-basis-joanofarc-trial.asp.txt, read: "the public examination of 22 February 1431, lines 1140-1200; Champion's sketch of Robert de Baudricourt, lines 8911-8920" }
      - { file: .references/archive.org-download-jeannedarcmaidof028754mbp-jeannedarcmaidof028754mbp-djvu.txt.txt, read: "Part II, the depositions of Durand Laxart and Bertrand de Poulengy, lines 11680-11730 and 11860-11900; Part I, Murray's notes at lines 1397-1399 and 1473" }
      - { file: .references/archive.org-download-joanofarc00lowe-joanofarc00lowe-djvu.txt.txt, read: "ch. 3, the voices, lines 1318-1737, with the notes; ch. 4, lines 1738-1930" }
      - { file: .references/archive.org-download-maidoffrancebein00languoft-maidoffrancebein00languoft-djvu.txt.txt, read: "ch. 2, lines 1622-1700; ch. 4, lines 2850-2900; ch. 5, the mission announced, lines 2967-3229" }
      - { file: .references/newadvent.org-cathen-08409c.txt, read: "paragraphs 12 to 15" }
    passages: ["Barrett, public examination of 22 February 1431, lines 1151-1195", "Murray, deposition of Bertrand de Poulengy, lines 11869-11894", "Murray, deposition of Durand Laxart, lines 11689-11716"]
    disputes:
      - { claim: "020.2", how: "the body says 1424 or 1425, and a note gives Thurston's summer of 1425, Lang's 1424 and Lowell's doubt of both." }
      - { claim: "020.4", how: "the body tells the visit of May 1428 as Poulengy's memory of 1456, followed by Lang, and a note gives Thurston's month later and Lowell's doubt that she went in 1428 at all." }
      - { claim: "020.11", how: "the body sets the flight in July 1428 with Lang and Lowell, and a note gives Murray's other reading, September 1426, and the four or five days of later witnesses against her fortnight." }
      - { claim: "020.10", how: "the body says Baudricourt kept the town and that how is not known, and a note gives Lang's compact of 22 July and Lowell's guess at a conditional surrender." }
    sources:
      - "The Trial of Jeanne d'Arc, tr. W. P. Barrett (1932), the public examination of 22 February 1431, with P. Champion's sketch of Robert de Baudricourt."
      - "T. Douglas Murray (ed. and tr.), Jeanne d'Arc, Maid of Orleans (1902), the depositions of Durand Laxart and Bertrand de Poulengy."
      - "F. C. Lowell, Joan of Arc (1896), ch. 3 and 4."
      - "A. Lang, The Maid of France (1908), ch. 2, 4 and 5."
      - "H. Thurston, \"St. Joan of Arc\", Catholic Encyclopedia (1910)."
    images:
      - { name: domremy-saint-remy-church, shows: "the church of Saint-Rémy at Domrémy, beside the house where she was born", "on": marker domremy-voices }
      - { name: vaucouleurs-castle-hill, shows: "the castle hill and the remains of the ramparts of Vaucouleurs above the Meuse", "on": marker vaucouleurs-1428 }
  salisbury-on-the-loire:
    account: >-
      Thomas Montagu, Earl of Salisbury, Henry VI's lieutenant and the most renowned English captain (the Journal of the
      Siege), came over in July 1428 with fresh troops: he landed at Calais about 1 July (Lowell), or passed his muster
      at Sandwich on 19 July and sailed at once (Ramsay). Ramsay gives 450 spears and 2,250 bows, 2,700 men, joined by
      men of Paris, Chartres and Normandy; Lowell gives four or five thousand at the start of August, half of them from
      England. The plan settled at Paris turned from Anjou to Orléans. Janville was stormed (29 August, Ramsay; after a
      week, Lowell), Meung surrendered and was entered about 8 September, Beaugency's bridge and castle fell on 25
      September, and Sir John de la Pole took Jargeau on 5 October; Sully above it surrendered, to the Burgundians
      (Ramsay) or by its lord La Trémoille (Lowell). Salisbury's own letter from Janville counted thirty-eight towns
      (Ramsay) or forty in as many days (Lowell). So the English held three of the four Loire bridges between Sully and
      Blois, and on Tuesday 12 October 1428 he camped on the Sologne side by the Portereau and laid siege to Orléans,
      on the north bank. On Sunday 24 October the English took the Tourelles, the fort at the bridge's southern end;
      the bridge between it and the town was broken, by the English (the Journal) or by the French as they withdrew
      (Lowell). Looking at the city from a window of the Tourelles, Salisbury was struck by a cannon shot and carried
      to Meung, where he died: struck on 24 October and dead on the night of the 27th in the Journal, struck on the 27th
      and dead on 3 November in Ramsay. Suffolk took the command (Ramsay, Monstrelet), shared with Lord Scales and Lord
      Talbot from late November (Lowell), and the Bastard of Orléans, the king's lieutenant inside the city (coming
      in on 25 October, the Journal), held it. On 29 December the main army came up from Beaugency, and through the
      winter the English built bastilles, seven on the north bank and four on the south with the Tourelles, leaving
      the north-east open (Ramsay). On Saturday 12 February 1429, the eve of the first Sunday in Lent, Sir John
      Fastolf, steward of Bedford's household, bringing a convoy of Lenten food, much of it herrings (Monstrelet), from
      Paris, made a park of his carts and stakes at Rouvray in the Beauce, two leagues from Janville. The Count of
      Clermont, knighted that day, with the force from Blois and the men from Orléans, had agreed to fight mounted;
      the Scots under Sir John Stewart of Darnley got down and attacked against the order, the English sallied from
      the park and broke the men on foot, and Clermont's horsemen rode off to Orléans, carrying the wounded Bastard.
      Darnley and Guillaume d'Albret were among the dead; the convoy reached the camp three days later (Ramsay).
      Clermont went home, and the king's council talked of retreat to Dauphiné or Languedoc. The map shows the English
      zone pushed down to the Loire from Beaugency to Jargeau, the towns taken, the siege, and the convoy and the two
      French columns meeting at Rouvray; the routes are reconstructions from the towns the sources give.
