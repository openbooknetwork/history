  storming-saint-loup:
    account: >-
      The bastille of Saint-Loup stood on the north bank east of the city, over the landing-place by the road to
      Chécy, about a mile and a half above it (Lowell), a league (Lang) or two and a half miles (France); the text
      gives the place and, if a distance, each with its author. On Wednesday 4 May, the eve of the Ascension, the
      French went out against it at about noon, about 1,500 men (the Journal's figure, and the Journal has her and the Bastard of
      Orléans lead them out together); she had been resting, came to the assault after it had begun, armed and with her
      standard, and the attack grew stronger (the Chronique, Pasquerel, de Coutes, Ramsay). The English defended it hard; it was taken by force about vespers, burned and
      pulled down. English came out to help it, from the bastille of Paris at Saint-Pouair in the Journal, from the
      other bastilles under Talbot in the Chronique and the chronicle of the feast, as far as the pavé de Fleury; the
      city's belfry rang twice, the French drew up against them, and they went back. Where Talbot was is disputed:
      Champion and Ramsay put him at Saint-Loup and the Chronique has him garrison it, the Chronique and the chronicle
      of the feast have him bring men from the other bastilles, and Lang and France put him at Saint-Laurent; the
      body says English came out from the other bastilles, and a note gives the authors. The English losses: 114
      killed and 40 taken (the Journal), 160 killed (the Chronique), more than 120 taken and dead (Girault), of 120 to
      140 within (the chronicle of the feast), of a garrison of 300 to 400 (Monstrelet), all killed with two French
      dead (Charles VII's letter of 10 May); the assault lasted three hours (the Journal) or more than four or five
      (the letter). English who had hidden in the church tower in priests' vestments were spared at her word and
      brought into the city (the Chronique, de Coutes's hearsay). It was the first English fort taken in May, as she
      said at her trial; that its fall cleared the east side of the city is Lowell's judgement, told with his name.
      The map shows the French going out along the north bank to Saint-Loup and the bastille of Paris from which the
      Journal has the English come out; both are reconstructions.
