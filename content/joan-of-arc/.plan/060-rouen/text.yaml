      - { claim: "060.13", how: "the body gives ten thousand livres tournois from the levy and the receipt, with Lowell, Lang and Champion, and Ramsay's ten thousand francs with his name, as rules.md says." }
      - { claim: "060.14", how: "the body tells John of Luxembourg as the seller with Lowell and the others, Ramsay's Duke of Burgundy with his name, and the record's surrender by both." }
      - { claim: "060.23", how: "no account leads, so the body says late in 1430 and gives Lang's November, Lowell's first days of December and Ramsay's before the end of the year, each with its author." }
