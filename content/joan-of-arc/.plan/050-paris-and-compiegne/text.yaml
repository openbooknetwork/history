      - { file: .references/archive.org-download-ProcesDeCondamnationV5-ProcesDeCondamnationV5-djvu.txt.txt, read: "the note of Clermont of 7 November and the letters to Riom of 9 November 1429, lines 7475-7625; the levy of Bourges of 24 November 1429, lines 16625-16640" }
