# Kingdom of Hungary, with Capistrano’s crusaders
battle.sides.0.name: "Capistrano’nun haçlılarıyla birlikte Macaristan Krallığı"

# 5,000 to 7,000 in the fortress, 10,000 to 12,000 with Hunyadi, 25,000 to 60,000 crusaders, about 200 boats
battle.sides.0.strength: "Kalede 5.000 ile 7.000, Hunyadi’nin yanında 10.000 ile 12.000, 25.000 ile 60.000 haçlı, 200 kadar tekne"

# 4,000 to 10,000
battle.sides.0.casualties: "4.000 ile 10.000"

# Ottoman state
battle.sides.1.name: "Osmanlı Devleti"

# 60,000 to 70,000 by newer research, 160,000 in early accounts. 300 guns and 21 to 200 river boats
battle.sides.1.strength: "Yeni araştırmalara göre 60.000 ile 70.000, ilk kayıtlara göre 160.000. 300 top ve 21 ile 200 arası nehir teknesi"

# About 13,000, or 4,000 to 5,000 by Babinger. The guns
battle.sides.1.casualties: "13.000 kadar, Babinger’e göre 4.000 ile 5.000. Toplar"

# Siege of Belgrade
battle.name: "Belgrad Kuşatması"

# 4 – 22 July 1456
battle.date: "4 – 22 Temmuz 1456"

# Hungarian victory, Mehmed lifts the siege
battle.result: "Macar zaferi, Mehmed kuşatmayı kaldırır"

