      - "Charles Oman, A History of the Art of War in the Middle Ages, vol. 2 (London, 1924), book 14, ch. 1."
      - "Enguerrand de Monstrelet, The Chronicles, tr. Thomas Johnes (London: Bohn, 1849), vol. 1, book 1."
      - "Henrici Quinti Angliae Regis Gesta, ed. and tr. Benjamin Williams (London, 1850)."
      - "Journal d'un bourgeois de Paris, 1405–1449, ed. Alexandre Tuetey (Paris, 1881), §129–130."
