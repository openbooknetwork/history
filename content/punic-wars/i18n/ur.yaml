routes.hannibal-219.name: "ہنیبال نئے قرطاجنہ سے ساگونتم کی طرف بڑھتا ہے، موسمِ بہار 219 ق م"

# Wounded in the thigh
markers.saguntum-assault-hannibal.note: "ران میں زخمی"

# The town on its ridge
markers.saguntum-assault-town.note: "اپنی پہاڑی چوٹی پر قصبہ"

# On the plain below
markers.saguntum-assault-camp.note: "نیچے میدان میں"

# Presses the siege
