# The regions the plague reached, read by front.mjs. See README.md.
#
# id, name     the region
# seeds        [lon, lat] of its towns. A region's land is the land nearer its seeds than any other seed, its own or
#              of the blank land below, so the regions tile the map without gaps.
# arrival      YYYY-MM, the month the epidemic broke out. Where the sources give a season, its first month. Where they
#              give only a year, the comment says so.
# months       how long the region's epidemic ran, 6 when not given. The tally counts a share of the region's dead for
#              each month past since the arrival.
# page         the page that first shows the region, when the region broke out in the month of an earlier page.
# population   about 1346. A region without one stays out of the tally.
# rate         the share that died, [low, high].
# unconfirmed  the fields that the Wikipedia articles in ../.wikipedia/ neither confirm nor date, for a later check
# source       of the arrival and the rate. "via Wikipedia" marks a work cited in those articles. Populations take
#              the country totals of Benedictow (2021) and of the works the articles cite, else of McEvedy and Jones
#              (1978), shared out by region.

