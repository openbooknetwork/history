      - { file: .references/archive.org-download-maidoffrancebein00languoft-maidoffrancebein00languoft-djvu.txt.txt, read: "ch. 1, l. 1265 to 1320" }
      - { file: .references/archive.org-download-joanofarc00lowe-joanofarc00lowe-djvu.txt.txt, read: "ch. 1, l. 295 to 355" }
    passages: ["Monstrelet book 1, the murder of the Duke of Orleans", "Beaucourt 1, ch. 5", "Lang ch. 1", "Lowell ch. 1"]
    sources:
      - "Enguerrand de Monstrelet, The Chronicles, tr. Thomas Johnes (London: Bohn, 1849), vol. 1, book 1, the murder of the Duke of Orleans."
      - "Gaston du Fresne de Beaucourt, Histoire de Charles VII, vol. 1 (Paris, 1881), ch. 5."
