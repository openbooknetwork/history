  saint-pierre-and-la-charite:
    account: >-
      In October 1429 Joan stayed about three weeks at Bourges in the house of Marguerite La Touroulde while an
      expedition was made ready (La Touroulde's deposition, which Lowell and Beaucourt follow). The council at
      Mehun-sur-Yèvre resolved to take La Charité, and Saint-Pierre-le-Moûtier first. At the western frontier of the
      duchy of Burgundy, on the Loire and the Allier, towns such as La Charité and Cosne were held against the king by
      soldiers of fortune. La Charité was Perrinet Gressart's, a soldier of fortune in Burgundy's service, who had taken
      it from the French in 1423; Saint-Pierre, Burgundian since 1422, had for bailli François de Surienne, the husband
      of Gressart's niece (Lowell). The expedition was led by Charles d'Albret, La Trémoille's half-brother and
      lieutenant-general in Berry, with Joan. She gathered her force at Bourges and went to besiege Saint-Pierre at the
      end of October (on or soon after 25 October, Lang). The first assault was beaten back; d'Aulon, her squire, wounded
      in the heel, found her left with four or five men, and she told him she had fifty thousand of her people with her
      and would not leave until she had taken the town; she had faggots and hurdles brought to bridge the ditch, and the
      town was taken (d'Aulon's deposition of 1456, the only account of its course). Regnault Thierry, a surgeon who was
      there, said in 1456 that she stopped the soldiers pillaging the church. It was taken by 9 November, when Joan and
      Albret wrote from Moulins that it had fallen; Lowell has it about 1 November. The powder spent there left them
      short: on 7 November they asked Clermont-Ferrand (then Clermont) for powder, arrows and artillery, and the town sent
      two quintals of saltpetre, one of sulphur and two cases of arrows, with a sword, two daggers and a battle-axe for
      her; on 9 November she wrote from Moulins to Riom for powder, saltpetre, sulphur, arrows and crossbows. From about
      10 November Joan, Albret and the Count of Montpensier, joined by Marshal de Boussac, sat before La Charité in the
      cold, short of money and supplies. An assault was made in which a baron of Dauphiné, Raymon de Montremur, was
      killed (the Berry herald); at her trial she said she had an assault made there, and that Saint Catherine had not
      bidden her go and it was too cold. The king sent neither food nor money; Bourges was asked for 1,300 crowns on 24
      November; and after about a month (the Berry herald) the siege was raised with the loss of artillery: bombards and
      artillery in the Berry herald, the greater part of it as was said in Chartier, some in Lang. No source read gives
      the day it was raised: Moranvillé, Cagny's editor, puts it at the end of November or the start of December, and
      Beaucourt finds her at Jargeau on Christmas Day. La Charité was not taken, and Gressart held it for Burgundy after;
      the story that he sold it for the money of Bourges Lowell calls impossible and Lang a fable. In December 1429 (on
      29 December, Thurston) at Mehun-sur-Yèvre Charles VII ennobled Joan and her family. The map shows the road from
      Bourges to Saint-Pierre and by Moulins to La Charité, reconstructions from the towns named, Saint-Pierre marked as
      taken, and La Charité and Cosne marked as held against the king.
