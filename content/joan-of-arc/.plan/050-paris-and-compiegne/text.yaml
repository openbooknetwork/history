  back-to-the-loire:
    account: >-
      Before leaving Saint-Denis Joan offered her whole armour before the image of Our Lady and the relics of the
      abbey (Cagny). At her trial she said it was a white harness, with a sword won before Paris, offered as soldiers
      did when they were wounded, and to Saint Denis because his name was the war cry of France; she said too that her
      voice had told her to stay at Saint-Denis, and that the lords took her away against her will (her answer of 22
      February 1431, as the court recorded it). Before he went the king left governors north of the Seine: Charles,
      Count of Clermont, over the Île-de-France and the Beauvaisis, the chancellor at Beauvais, Vendôme at Senlis,
      Guillaume de Flavy at Compiègne, Jacques de Chabannes at Creil, and Ambroise de Loré at Lagny. The king left
      Saint-Denis after dinner on Tuesday 13 September (Cagny, Ramsay; the Journal of the Siege has Monday the 12th)
      and went back by Lagny on the Marne, Provins, and Bray on the Seine, which now yielded to him, then over a ford of
      the Yonne below Sens, by Courtenay and Montargis, to Gien, where he dined on Wednesday 21 September. There the army
      that had gone to Reims was disbanded: Alençon went home to his wife and his viscounty of Beaumont, and the captains
      each to his frontier. Alençon asked to take Joan with him toward the marches of Brittany and Maine (Cagny; into
      Maine, Ramsay), and Regnault de Chartres, La Trémoille and Gaucourt would not allow it; he never served with her
      again. The map shows the king's road from Saint-Denis to Gien, a reconstruction from the towns the sources name,
      and Bray marked as the king's.
