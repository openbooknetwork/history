# Hidden near the entrance
markers.trasimene-ambush-cavalry.note: "داخلے کے قریب چھپی ہوئی"

# Behind the hills
markers.trasimene-ambush-gauls.note: "پہاڑیوں کے پیچھے"

# Close to the camp
markers.trasimene-ambush-africans.note: "کیمپ کے قریب"

# Camps by the lake
markers.trasimene-ambush-flaminius.note: "جھیل کے کنارے پڑاؤ"

# About 25,000, in three columns
markers.trasimene-trap-column.note: "تقریباً 25,000، تین دستوں میں"

# Closes the road behind
markers.trasimene-trap-cavalry.note: "پیچھے سے سڑک بند کر دیتی ہے"

# Charge down the slopes
markers.trasimene-trap-gauls.note: "ڈھلوانوں سے نیچے دھاوا"

# Stop the head of the column
markers.trasimene-trap-africans.note: "دستے کے اگلے سرے کو روکتے ہیں"

# Killed by the Gaul Ducarius
markers.trasimene-end-flaminius.note: "گال ڈوکاریئس کے ہاتھوں مارا جاتا ہے"

# 6,000 break out, surrender later
