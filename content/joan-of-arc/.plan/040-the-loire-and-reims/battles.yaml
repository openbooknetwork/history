- id: jargeau-1429
  page: jargeau
  phases: false
  name: Battle of Jargeau
  date: "11–12 June 1429"
  site: Jargeau, on the south bank of the Loire about twelve miles above Orléans by Lowell's reckoning
  sides:
    - name: French
      family: france
      commanders: [the Duke of Alençon, Joan, the Bastard of Orléans, La Hire]
      strength: "Alençon: about 1,200 lances; Cagny: 2,000 to 3,000 fighting men and as many common people or more; Monstrelet: five or six thousand; the Journal of the Siege: about 8,000, horse and foot"
      casualties: "Cagny: 16 or 20 dead"
    - name: English
      family: english
      commanders: ["William de la Pole, Earl of Suffolk"]
      strength: "Chartier: 600 to 700; Cagny: 700 to 800; Lowell: about 600; Monstrelet: 300 to 400, with the townsmen"
      casualties: "Alençon: more than a thousand killed in the pursuit to the bridges; Chartier: 300 to 400 killed; Monstrelet: about 300 killed and sixty or more taken; Cagny: 40 or 50 taken and the rest put to death. Suffolk and his brother John taken, his brother Alexander de la Pole killed"
  outcome: French victory. The town is stormed on 12 June and the Earl of Suffolk taken.
- id: patay-1429
  page: patay
  phases: false
  name: Battle of Patay
  date: "18 June 1429"
  site: near the village of Patay in the Beauce, two leagues from Janville by Wavrin
  sides:
    - name: French
      family: france
      commanders: [the Duke of Alençon, La Hire, Poton de Xaintrailles, "Arthur de Richemont, Constable of France"]
      strength: "Wavrin: about 6,000 before Beaugency on 17 June, 12,000 to 13,000 on the march of the 18th; Monstrelet: a main body of 8,000 to 9,000; the Journal of the Siege: 1,400 to 1,500 of the vanguard engaged"
      casualties: "Wavrin and Monstrelet: small loss, with no figure"
    - name: English
      family: english
      commanders: [Lord Talbot, Sir John Fastolf, Lord Scales]
      strength: "Wavrin, who marched with it: about 5,000 leaving Paris; Chartier: 4,000 to 5,000; Monstrelet: four or five thousand; the Journal of the Siege: 4,000; Alençon: a thousand men-at-arms"
      casualties: "Monstrelet: about 1,800 dead and 100 to 120 taken; Wavrin: about 2,000 dead and 200 taken; Gruel, by the heralds' count, and the Journal of the Siege: about 2,200 dead; Cagny: 2,000 to 3,000 dead and 400 to 500 taken besides the lords; Dunois: more than 4,000 killed and taken; Oman: a third or more of the army. Talbot, Lord Scales, Sir Thomas Rempston and Hungerford taken"
  outcome: French victory. The French vanguard rides down the English before they are formed, Talbot is taken and Fastolf flees.
