  old: "Wavrin has the English come within a league of Beaugency on 17 June, find the French on a small hill, and turn back to Meung; the Journal has them assail the bridge of Meung that night (040.23). The hill is not placed by any source read, so the middle station is a point a league north of Beaugency, and the roads are not given."
  new: "On 17 June Wavrin has the English come about a league from Meung and near Beaugency, Lowell about a league from each town, and Lang within a league of Beaugency; they find the French on a small hill and turn back to Meung, and the Journal has them assail the bridge of Meung that night (040.23). The hill is not placed by any source read, so the middle station is a point about a league from each town, north of the road between them, and the roads are not given."
  source: "Wavrin, Quicherat 4, p. 416, lines 16288-16289: \"quant ilz parvindrent ainsi comme à une lieue prez de Meun et assez près de Beaugensi\"; Lowell ch. 10, lines 5860-5861: \"it reached a place distant about a league from each town\"; Lang ch. 14, lines 7246-7247: \"they were within a league of Beaugency\". The passage line gains Lowell's and Lang's lines."
  kind: "map"
  claim: "040.23"
