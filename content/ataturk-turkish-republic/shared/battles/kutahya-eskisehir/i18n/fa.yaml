# 55,000 by Turkish counts, 95,750 by Greek counts
battle.sides.0.strength: "۵۵ هزار به شمارش ترک‌ها، ۹۵٬۷۵۰ به شمارش یونانیان"

# 1,643 killed, 4,981 wounded, 374 captured, 30,809 deserted
battle.sides.0.casualties: "۱٬۶۴۳ کشته، ۴٬۹۸۱ زخمی، ۳۷۴ اسیر، ۳۰٬۸۰۹ فراری"

# Kingdom of Greece
battle.sides.1.name: "پادشاهی یونان"

# 106,000 by Turkish counts, about 110,000 by Greek counts
battle.sides.1.strength: "۱۰۶ هزار به شمارش ترک‌ها، حدود ۱۱۰ هزار به شمارش یونانیان"

# 1,491 killed, 6,472 wounded, 110 missing
battle.sides.1.casualties: "۱٬۴۹۱ کشته، ۶٬۴۷۲ زخمی، ۱۱۰ مفقود"

# Battle of Kütahya–Eskişehir
battle.name: "نبرد کوتاهیه و اسکی‌شهر"

# 10–24 July 1921
battle.date: "۱۰ تا ۲۴ ژوئیهٔ ۱۹۲۱"

# Greek victory, Turkish retreat to the Sakarya
battle.result: "پیروزی یونان، عقب‌نشینی ترک‌ها به ساکاریا"

