# map.yaml of section 010 france-divided. Every zone is a reconstruction, as the brief's Map part says, and the
# first page's text says once that the borders are approximate. Coordinates in a marker's note are for the
# cartographer and appear in no text.
murder-in-paris:
  bbox: [-5.0, 42.3, 8.0, 51.3]
  zones: [france-1407, english-1407, burgundy-1407, brittany-1407]
  markers:
    paris-1407: { name: Paris, what: "Louis of Orléans is murdered in the rue Vieille-du-Temple by the Porte Barbette, 23 November 1407, about 48.858 N 2.360 E. In the colour of france", basis: sourced, rank: 5 }
    lille-1407: { name: Lille, what: "John the Fearless retires there after owning the murder (Lang), about 50.637 N 3.063 E. In the colour of burgundy", basis: sourced, rank: 3 }
  bare:
    lorraine-1412: "the duchy of Lorraine lies outside the kingdom, and the story draws it from Joan's village on the next page; the brief's Map part gives the zone from 1412, so this land stays untinted here, as Provence and Savoy do"
    bar-1412: "the duchy of Bar enters the story with Domrémy on the next page; the brief's Map part gives the zone from 1412, so its land east of the Meuse stays untinted here and its land west of it shows in the kingdom"
  unmarked:
    Orléans: "in the duke's title only; the city enters the story in a later section"
    the Porte Barbette: "the gate by the place of the murder; the Paris marker stands on it, since the frame is the whole kingdom"
    the rue Vieille-du-Temple: "the street of the murder, under the Paris marker"
    Calais: "the English town, shown by the english zone"
    Picardy: "Lang's Picardy in the duke's power, told and not drawn, as the brief's Map part says"
    Flanders: "a province shown by the burgundy zone"
    Brittany: "a duchy shown by the brittany zone"
    Burgundy: "the duchy and county, shown by the burgundy zone"
    Gascony: "the English land about Bordeaux, shown by the english zone"
domremy:
  bbox: [4.9, 47.95, 6.5, 48.95]
  zones: [france-1412, english-1407, burgundy-1407, brittany-1407, lorraine-1412, bar-1412]
  markers:
    domremy: { name: Domrémy, what: "Joan's village, born there about 1412; one parish with Greux, of the king's party; the edge of the kingdom and the duchy of Bar runs through it (disputed), about 48.442 N 5.674 E. In the colour of france", basis: sourced, rank: 5 }
    vaucouleurs-1412: { name: Vaucouleurs, what: "the walled town and castle down the Meuse, held for the king's party, its castellany with Domrémy and Greux an island of loyalty, about 48.602 N 5.667 E. In the colour of france", basis: sourced, rank: 4 }
    maxey-1412: { name: Maxey, what: "the Burgundian village across the Meuse whose boys fought the boys of Domrémy, about 48.448 N 5.697 E. In the colour of burgundy", basis: sourced, rank: 3 }
  unmarked:
    Greux: "one parish with Domrémy, a kilometre to the north; told with the village and under its marker"
    Ceffonds: "Jacques d'Arc's birthplace in Champagne, told in a clause; no event of the page happens there"
    Vouthon: "Isabelle Romée's village, told in a clause; no event of the page happens there"
    Rouen: "in Joan's own words only"
    the Meuse: "the river is on the base map"
    Champagne: "the province of Ceffonds, inside the france zone"
    Lorraine: "the duchy, shown by the lorraine zone"
    Bar: "the duchy, shown by the bar zone"
    Burgundy: "the county of Burgundy, shown by the burgundy zone"
    the Three Fountains brook: "the brook through Domrémy that Lowell gives as the edge of Bar; too small for the frame, under the Domrémy marker"
harfleur-and-agincourt:
  bbox: [-0.6, 48.95, 3.5, 51.2]
  zones: [france-1412, english-1407, burgundy-1407, brittany-1407]
  routes:
    - id: henry-v-1415-calais
      family: english
      stations: [Harfleur, Montivilliers, Fécamp, Arques, Eu, near Blanche-Taque, the south bank of the Somme upstream, Béthencourt, past Péronne, Albert, Frévent, Blangy on the Ternoise, Maisoncelles, Agincourt, Calais]
      passage: "Ramsay 1, ch. 15, l. 14418 to 14760 (Arques 11 October, Eu 12 October, Blanche-Taque 13 October, the crossing, Péronne, Albert, Frévent, Blangy, Maisoncelles), with Oman book 14 ch. 1, l. 18922 (the crossing at Béthencourt on 19 October) and Ramsay 1, ch. 15, l. 15369 (Calais on 29 October)"
      basis: reconstruction
      why: "Ramsay names every station but one stretch. Between Blanche-Taque and Béthencourt the line follows the south bank of the Somme, which Oman says the army mounted almost to its source; no source read names the villages of that stretch."
  markers:
    harfleur-1415: { name: Harfleur, what: "Henry V lands near the Chef de Caux from 14 August 1415 and takes the town on 22 September, about 49.507 N 0.198 E. In the colour of english", basis: sourced, rank: 5 }
    blanche-taque-1415: { name: Blanche-Taque, what: "the ford of the Somme found held on 13 October 1415, about 50.139 N 1.742 E. In the colour of france", basis: reconstruction, why: "Ramsay names the ford, not its point; placed at the old ford between Saigneville and Port-le-Grand, as names.md gives it near Port-le-Grand", rank: 2 }
    bethencourt-1415: { name: Béthencourt, what: "the English cross the Somme on 19 October 1415 (Oman), about 49.795 N 2.957 E. In the colour of france, which holds the village; the route shows the English army", basis: sourced, rank: 3 }
    calais-1415: { name: Calais, what: "the English town the army reaches on 29 October 1415 (Ramsay), about 50.951 N 1.858 E. In the colour of english", basis: sourced, rank: 4 }
  unmarked:
    the Chef de Caux: "the landing is told in the Harfleur marker's note, a few kilometres off"
    Honfleur: "across the estuary from the landing, told in a clause"
    Bapaume: "where the French gathered on 20 October (Oman), told in a clause"
    Rouen: "where the French army lay while Harfleur was besieged, told in a clause; Rouen is marked on the next page for its siege"
    Agincourt: "the battle card stands on the field"
    Tramecourt: "the wood on the field under the Agincourt card"
    Ruisseauville: "the road behind the French, under the Agincourt card"
    Péronne: "a station of Henry's route"
    the Seine: "the river is on the base map"
    the Somme: "the river is on the base map; the route follows it"
    Orléans: "in Charles of Orléans's title only"
    Bar: "in the Duke of Bar's title only"
normandy-and-troyes:
  bbox: [-5.0, 42.3, 8.0, 51.3]
  zones: [france-1420, english-1420, burgundy-1420, brittany-1407, lorraine-1412, bar-1412]
  routes:
    - id: henry-v-1417-caen
      family: english
      stations: [Touques, the coast road, Caen]
      passage: "Ramsay 1, ch. 17, l. 16533 (the landing at Touques on 1 August 1417), and Wylie and Waugh 3, ch. 51, l. 3622 (Henry leaves Touques on 13 August and marches along the coast towards Caen)"
      basis: reconstruction
      why: "Wylie and Waugh give the start, the end and the coast. The line keeps to the coast between them; no source read names the villages."
