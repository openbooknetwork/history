      passage: "Cagny, Chroniques, 1430, p. 174, lines 8282-8288; Lowell, Joan of Arc, ch. 16, p. 216, line 9461"
      basis: reconstruction
      why: "Cagny has her leave Crépy about midnight and come into Compiègne about sunrise (050.56). Only the two ends are given."
    - id: joan-1430-sortie
      family: joan
      stations: [the bridge of Compiègne, Margny]
      passage: "Monstrelet, book 2 ch. 86, lines 40266-40278; Barrett, the examination in prison of 10 March 1431, lines 2200-2205"
      basis: sourced
      why: "She went over the bridge and through the boulevard (her own answer), against Baudot de Noyelle's post at the end of the causeway of Margny (Monstrelet) (050.59). The causeway runs from the bridge to Margny; the line follows it."
    - id: burgundy-1430-clairoix
