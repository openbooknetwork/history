  the-augustins:
    account: >-
      No one fought on Thursday 5 May, the feast of the Ascension. The Chronique, with Ramsay, has the captains refuse
      to fight for the feast while she wanted to attack Saint-Laurent; Pasquerel and the chronicle of the feast have
      her refuse herself; Lowell notes that the accounts do not agree; the body says no one fought and gives both
      accounts. A council decided to attack the Tourelles and the works of the south bank, so that the city could be
      supplied again from Berry (the Journal, the Chronique, Lowell). That day, Pasquerel says, she had a last
      summons tied to an arrow and shot into the English lines. On Friday 6 May about 4,000 men (the Journal's figure)
      crossed the Loire in boats from between Saint-Loup and the Tour Neuve (the Journal) to an island, and from it to
      the south bank over a bridge of two boats (d'Aulon, Ramsay); the Journal has them take Saint-Jean-le-Blanc first
      and fall back to the island after. The island is "a small island facing
      Saint-Aignan" in the Journal, "an island before Saint-Jean-le-Blanc" in the chronicle of the feast, and the Île
      Saint-Aignan in Ramsay; the text calls it the Île Saint-Aignan; no source read places it. Glasdale
      emptied and burned the bastille of Saint-Jean-le-Blanc and drew his men back to the Augustins, the boulevard and
      the Tourelles (the Chronique, d'Aulon, Beaucroix); the Journal has the French take it at the first onset. The
      French fell back towards the island, on a cry that the English of Saint-Privé were coming (the Chronique) or by
      the captains' decision (d'Aulon); the English came out after them, she and La Hire turned on them with their
      lances couched and drove them back, and the French took the Augustins by assault before night, men wading from
      the island up to their armpits (the chronicle of the feast). It was burned, by her order so that the men would
      not stop to plunder, says the Chronique; Monstrelet has the fort burned and its men put to the sword. She was
      hurt in the foot by a caltrop (the Chronique; Ramsay follows it). That night the French lay before the
      Tourelles, the townspeople bringing them bread and wine; the Chronique, de Coutes and Lowell have her taken back
      into the city to sleep, and d'Aulon has her stay before the fort all night; the body follows the Chronique and
      de Coutes and a note gives d'Aulon. In the night English crossed at Saint-Privé: the Chronique and Ramsay have
      its garrison fire the work and cross to Saint-Laurent, while the chronicle of the feast has English try to cross
      there in two or three boats and many drown, which Lowell reads as Talbot sending men to the south bank; the body
      gives both and says the bastille was empty by morning. The map shows the crossing by the island to
      Saint-Jean-le-Blanc and the Augustins, Glasdale's men falling back, and the south-bank forts; the lines and the
      island's place are reconstructions.
