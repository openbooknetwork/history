  cravant-and-verneuil:
    account: >-
      Bedford binds the Duke of Burgundy closer by marrying his sister Anne at Troyes in June 1423. In July the
      English under the Earl of Salisbury and the Burgundians join at Auxerre and march up the right bank of the Yonne
      to relieve Cravant; on Saturday 31 July 1423 they find the army of Charles VII, French, Scots and others, before
      the town, cross to the left bank, probably at Champs (Ramsay), and face it across the river, drawn up between the
      walls of Cravant and the water; Salisbury's men wade the Yonne, Lord Willoughby carries the bridge, the garrison sallies on the
      French rear, and the army breaks. The Scots suffer most, and their commander, Sir John Stewart of Darnley, loses
      an eye and is taken. Cravant has no card: its losses name their authors in the text, and its strengths, in the
      Thin part, are not told. In summer 1424 Bedford besieges Ivry; the army of Charles VII, French, Scots and Lombards,
      sets out from Tours to relieve it, comes as far as Nonancourt and turns aside to take Verneuil, by a ruse in the
      Bourgeois and Beaucourt, or opened by its townsmen to the Duke of Alençon, whose town it was, in Cagny. On
      Thursday 17 August 1424 Bedford comes up and fights on a plain before the town: the English on foot, archers
      with stakes on the wings, the horses tied head to tail behind under a guard of archers; the French on foot with
      horse on both wings. The Lombards ride round to the baggage, fail to break the hedge of horses and flee with
      plunder; after some forty minutes of mêlée (Oman) the baggage guard falls on the French flank, the line breaks,
      and the slaughter is greatest at the moat of Verneuil. Buchan, Douglas and his son James, Aumale, Ventadour,
      Tonnerre and Narbonne are killed, the Duke of Alençon and Marshal La Fayette taken; Bedford has Narbonne's body
      hanged for his part in the murder of Montereau. Lang calls it "another Agincourt", told with his name. After it
      Charles VII can no longer fight in the open and can only stand on the defensive (Beaucourt),
      lingering at Bourges, Chinon and Gien (Lang), while Bedford clears the north and means to carry the war down the
      Loire (Oman). The map shows Salisbury's march to Cravant along the Yonne and the two armies' roads to Verneuil;
      the stretches of road from Tours to Nonancourt and from Ivry to Verneuil are reconstructions, drawn direct, and Salisbury's crossing at Champs is Ramsay's probable place. The text links Auxerre, whose marker waits under Cravant's at the opening view.
