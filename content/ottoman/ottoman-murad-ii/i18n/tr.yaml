# The Ottoman stockade behind the ditch
emblems.kosovo-flanks.stockade: "Hendeğin arkasındaki Osmanlı şarampolü"

# The janissaries and the azaps in the centre. Turkish accounts put shield bearers and spearmen round the ditch, with camels and guns along it
emblems.kosovo-flanks.janissaries: "Merkezde yeniçeriler ve azaplar. Türk anlatımlarına göre hendeğin çevresinde kalkanlı ve mızraklı askerler, boyunca da develer ve toplar vardır"

