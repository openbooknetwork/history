# 9–11 January and 23 March – 1 April 1921
battle.date: "9 تا 11 جنوری اور 23 مارچ تا 1 اپریل 1921ء"

# Greek advance stopped both times
battle.result: "دونوں بار یونانی پیش قدمی روک دی گئی"

