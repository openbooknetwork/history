# 1451 – 1481
story.span: "1451 – 1481"

# Mehmed II's thirty years on the Ottoman throne: the siege and fall of Constantinople in 1453, the conquest of Serbia, the Morea, Trebizond and Bosnia, the wars with Hunyadi, Skanderbeg, Vlad III, Venice, Uzun Hasan and Stephen the Great, and the landing at Otranto in 1480.
story.summary: "II. Mehmed’in Osmanlı tahtındaki otuz yılı: 1453’te İstanbul’un kuşatılması ve fethi, Sırbistan’ın, Mora’nın, Trabzon’un ve Bosna’nın fethi, Hunyadi Yanoş, İskender Bey, Kazıklı Voyvoda, Venedik, Uzun Hasan ve Boğdan Voyvodası Stefan ile savaşlar ve 1480’de Otranto’ya yapılan çıkarma."

# Mehmed II and the Fall of Constantinople
story.title: "Fatih Sultan Mehmed ve İstanbul’un Fethi"

