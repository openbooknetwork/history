markers.geronium-217.note: "হ্যানিবলের শীতকালীন আবাস, খ্রিস্টপূর্ব ২১৭ – ২১৬"

# Survivors gather here after the battle
markers.canusium-216.note: "যুদ্ধের পর বেঁচে যাওয়ারা এখানে জড়ো হয়"

# Varro escapes here with 70 horsemen
markers.venusia-216.note: "ভারো ৭০ জন অশ্বারোহী নিয়ে এখানে পালান"

# Greek port where Gnaeus Scipio lands, autumn 218 BC
markers.emporion-218.note: "গ্রিক বন্দর, যেখানে নিয়াস সিপিও অবতরণ করেন, শরৎ খ্রিস্টপূর্ব ২১৮"

# Roman base after the victory at Cissa, 218 BC
markers.tarraco-218.note: "সিসার জয়ের পর রোমান ঘাঁটি, খ্রিস্টপূর্ব ২১৮"

# Capital of Carthaginian Iberia
markers.new-carthage-218.note: "কার্থেজীয় আইবেরিয়ার রাজধানী"

# Retaken by the Scipios, 212 BC
markers.saguntum-212.note: "সিপিও ভাইয়েরা পুনর্দখল করেন, খ্রিস্টপূর্ব ২১২"

# Publius Scipio is killed nearby, 211 BC
markers.castulo-211.note: "কাছেই পাবলিয়াস সিপিও নিহত হন, খ্রিস্টপূর্ব ২১১"

# Gnaeus Scipio is killed, 211 BC
markers.ilorca-211.note: "নিয়াস সিপিও নিহত হন, খ্রিস্টপূর্ব ২১১"

# Holds out against Hannibal, 216 – 214 BC
markers.nola-216.note: "হ্যানিবলের বিরুদ্ধে টিকে থাকে, খ্রিস্টপূর্ব ২১৬ – ২১৪"

# Taken by Hannibal in 212 BC, except the citadel
markers.tarentum-212.note: "খ্রিস্টপূর্ব ২১২ সালে হ্যানিবল দখল করেন, দুর্গ বাদে"

# Hannibal marches to the city, 211 BC
markers.rome-211.note: "হ্যানিবল নগর পর্যন্ত এগোন, খ্রিস্টপূর্ব ২১১"

# Hieronymus is killed here, 214 BC
markers.leontini-214.note: "হিয়েরোনিমাস এখানে নিহত হন, খ্রিস্টপূর্ব ২১৪"

# Retaken by Himilco during the siege
markers.agrigentum-212.note: "অবরোধের সময় হিমিলকো পুনর্দখল করেন"

# Scipio arrives with reinforcements, late 210 BC
markers.tarraco-210.note: "সিপিও নতুন সৈন্য নিয়ে পৌঁছান, খ্রিস্টপূর্ব ২১০ সালের শেষ"

# Carthaginian base in Iberia after 209 BC
markers.gades-209.note: "খ্রিস্টপূর্ব ২০৯ সালের পর আইবেরিয়ায় কার্থেজীয় ঘাঁটি"

# Scipio defeats Hasdrubal Barca, 208 BC
markers.baecula-208.note: "সিপিও হাসদ্রুবাল বার্কাকে পরাজিত করেন, খ্রিস্টপূর্ব ২০৮"

# Livius’s camp, where Nero joins him
markers.sena-207.note: "লিভিয়াসের শিবির, যেখানে নিরো তাঁর সঙ্গে যোগ দেন"

# Nero fights Hannibal here, then marches north
markers.grumentum-207.note: "নিরো এখানে হ্যানিবলের সঙ্গে লড়েন, তারপর উত্তরে এগোন"

# Founded by Scipio, about 206 BC
markers.italica-206.note: "সিপিওর প্রতিষ্ঠিত, প্রায় খ্রিস্টপূর্ব ২০৬"

# Shuts its gates to Mago and goes over to Rome, 206 BC
markers.gades-206.note: "মাগোর জন্য ফটক বন্ধ করে রোমের পক্ষে যায়, খ্রিস্টপূর্ব ২০৬"

# Besieged by Scipio from 204 BC
markers.utica-204.note: "খ্রিস্টপূর্ব ২০৪ সাল থেকে সিপিওর অবরোধে"

# Scipio’s camp in sight of Carthage, 203 BC
markers.tunis-203.note: "কার্থেজের দৃষ্টিসীমায় সিপিওর শিবির, খ্রিস্টপূর্ব ২০৩"

# Recalls Hannibal and Mago from Italy, 203 BC
markers.carthage-203.note: "ইতালি থেকে হ্যানিবল ও মাগোকে ডেকে পাঠায়, খ্রিস্টপূর্ব ২০৩"

# Syphax’s capital, taken 203 BC
markers.cirta-203.note: "সাইফ্যাক্সের রাজধানী, খ্রিস্টপূর্ব ২০৩ সালে দখল হয়"

# Hannibal’s base after his return from Italy, 203 BC
markers.hadrumetum-203.note: "ইতালি থেকে ফেরার পর হ্যানিবলের ঘাঁটি, খ্রিস্টপূর্ব ২০৩"

# Accepts Rome’s terms, spring 201 BC
markers.carthage-201.note: "রোমের শর্ত মেনে নেয়, বসন্ত খ্রিস্টপূর্ব ২০১"

# Hannibal elected suffete, 196 BC
markers.carthage-196.note: "হ্যানিবল সুফেত নির্বাচিত হন, খ্রিস্টপূর্ব ১৯৬"

# Hannibal joins Antiochus III, 195 BC
markers.ephesus-195.note: "হ্যানিবল তৃতীয় অ্যান্টিওকাসের সঙ্গে যোগ দেন, খ্রিস্টপূর্ব ১৯৫"

# The Rhodians defeat Hannibal’s fleet, 190 BC
markers.side-190.note: "রোডসবাসীরা হ্যানিবলের নৌবহরকে পরাজিত করে, খ্রিস্টপূর্ব ১৯০"

# The Romans defeat Antiochus III, winter 190 to 189 BC
markers.magnesia-190.note: "রোমানরা তৃতীয় অ্যান্টিওকাসকে পরাজিত করে, শীতকাল খ্রিস্টপূর্ব ১৯০ থেকে ১৮৯"

# Hannibal’s death, 183 to 181 BC
markers.libyssa-183.note: "হ্যানিবলের মৃত্যু, খ্রিস্টপূর্ব ১৮৩ থেকে ১৮১"

# Capital of Masinissa’s kingdom
markers.cirta-201.note: "মাসিনিসার রাজ্যের রাজধানী"

# Numidian town, present-day Dougga
markers.thugga-150.note: "নুমিডীয় শহর, আজকের দুগ্গা"

# Pays the last instalment of the indemnity, 151 BC
markers.carthage-151.note: "ক্ষতিপূরণের শেষ কিস্তি পরিশোধ করে, খ্রিস্টপূর্ব ১৫১"

# Cato calls for the destruction of Carthage
markers.rome-153.note: "কাতো কার্থেজ ধ্বংসের আহ্বান জানান"

# Sides with Rome, Roman landing, 149 BC
markers.utica-149.note: "রোমের পক্ষ নেয়, রোমানদের অবতরণ, খ্রিস্টপূর্ব ১৪৯"

# Holds out against the consul Piso, 148 BC
