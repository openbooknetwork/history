  meung-and-beaugency:
    account: >-
      On Wednesday 15 June the army left Orléans and took by assault the fortified bridge of Meung, put a garrison in
      the bridge towers, and left the town and castle to the English. On Thursday 16 June it came before Beaugency and
      entered the town, which Matthew Gough, a Welsh captain and Talbot's lieutenant, and Sir Richard Gethin, bailli of
      Évreux, had left for the castle and the bridge; men hidden in the houses fell on the French as they took their
      quarters, and the guns were set up that night. Cagny gives the two captains 400 English and Lowell fewer than a
      thousand men. Arthur de Richemont, Constable of France, came to the army on Friday 17 June (Cagny, Ramsay; Lang,
      following Gruel, has the 16th) with 500 or 600 fighting men in Cagny, where Laval had heard at Selles of 600
      men-at-arms and 400 archers; the king, at La Trémoille's urging, had forbidden it, and Alençon had orders not to
      receive him. How Joan and Richemont met is told two ways: in Gruel she knelt to him and he said he did not know
      whether she came from God or the devil, in the Chronique de la Pucelle he begged her pardon; Lowell holds both
      fantastical, and the text gives both with their sources. Meanwhile the English relief under Sir John Fastolf had
      left Paris early in June, left its supplies and artillery at Étampes, and halted at Janville when Jargeau fell, and
      Lord Talbot rode in from Beaugency to join it. At Janville, Wavrin says, for he was there, Fastolf counselled
      against going on and Talbot swore he would fight with his own men alone if need be, and Fastolf gave way. On 17
      June the English came within about a league of Meung and Beaugency and found the French drawn up on a small hill; the English
      dismounted, the archers set their stakes, and two heralds offered three knights to fight any who came down, and
      the French told them to lodge for the night and they would see them closer in the morning (Wavrin, followed by
      Lowell and Lang). The English turned back to Meung, took the town and battered the bridge, still French, through
      the night. In that night Gough signed articles, and on the morning of Saturday 18 June the garrison of Beaugency
      marched off through the Beauce with their lives, horses and harness, sworn in the Journal not to bear arms for ten
      days, and the French entered (Cagny, the Journal, Wavrin, Ramsay, Lowell). The map shows the French road from
      Orléans to Meung and Beaugency and the English roads from Paris and from Beaugency to Janville and back towards
      Beaugency and Meung, reconstructions from the towns named; the hill the French held is placed by no source and is
      not marked, and Richemont's road is not drawn, since no source read gives where he came from. Meung's icon waits
      under Beaugency's at the opening view, so the text links Meung.
