# 15,000 to 30,540 dead
battle.sides.0.casualties: "من 15,000 إلى 30,540 قتيل"

# Carthage
battle.sides.1.name: "قرطاج"

# 31,500 to 56,000 men, 30 to 60 elephants, and the garrison
battle.sides.1.strength: "من 31,500 إلى 56,000 رجل، ومن 30 إلى 60 فيلًا، والحامية"

# 3,200 killed, 4,000 captured, 25,000 inhabitants enslaved
battle.sides.1.casualties: "3,200 قتيل، و4,000 أسير، و25,000 من السكان بيعوا عبيدًا"

# Battle of Agrigentum
battle.name: "معركة أغريجنتوم"

# 262 – 261 BC
battle.date: "262 – 261 ق.م"

# Roman victory, Agrigentum taken
battle.result: "نصر روماني، سقوط أغريجنتوم"

