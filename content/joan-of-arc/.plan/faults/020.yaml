  source: "\"who held Tours\" had no quote: Lang ch. 10, line 4923, \"To the city of Tours, then held by the Queen of Sicily\". Lowell ch. 6, lines 3066-3068, puts her examination of Joan at Poitiers, not Tours: \"was come to Poitiers. She examined Joan herself, and made her report to the council\"; his notes 3076 and 3081 give the money and the provisions."
