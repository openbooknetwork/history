emblems.varna-king.janissaries: "İki Trak mezar höyüğünün çevresinde, hendek ve şarampollerinin arkasındaki yeniçeriler"

# Murad with the horsemen of his household, by the burial mound from which he watches the battle
emblems.varna-king.murad: "Muharebeyi üzerinden izlediği mezar höyüğünün yanında, kapıkulu süvarileriyle Murad"

# Władysław with 500 Polish knights among the janissaries, in front of Murad’s tent
emblems.varna-king.king: "Murad’ın çadırının önünde, yeniçerilerin arasında 500 Leh şövalyesiyle Vladislav"

