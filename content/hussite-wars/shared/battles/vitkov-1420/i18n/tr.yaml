# Crusaders
battle.sides.1.name: "Haçlılar"

# 7,000 to 8,000 horse in the attack, by Laurence of Březová
battle.sides.1.strength: "Březová’lı Vavřinec’e göre saldırıda 7.000 ile 8.000 atlı"

# About 300 killed by Laurence of Březová, 144 to 500 in other chronicles, Heinrich of Isenburg among them
battle.sides.1.casualties: "Březová’lı Vavřinec’e göre 300 kadar ölü, başka kroniklerde 144 ile 500 arası, aralarında Isenburg’lu Heinrich"

# Battle of Vítkov Hill
battle.name: "Vítkov Tepesi Muharebesi"

# 14 July 1420
battle.date: "14 Temmuz 1420"

# Hussite victory, the crusaders fail to close the ring round Prague
battle.result: "Husçu zaferi, haçlılar Prag’ın çevresindeki çemberi kapatamaz"

