- id: the-voices
  title: "The Voices and Vaucouleurs"
  date: "1424 or 1425 to July 1428"
  when: 1424
  tells: >-
    At about thirteen Joan hears a voice in her father's garden at Domrémy, as she told her judges in 1431, and in time, she said, the voices bid her leave home and go into France to
    the Dauphin. In May
    1428, as Bertrand de Poulengy remembered it, she goes to Robert de Baudricourt, captain of Vaucouleurs, the king's last stronghold on the upper Meuse,
    and he sends her home. That July a Burgundian force under Antoine de Vergy moves against Vaucouleurs, and, as Lang and Lowell date it, the
    people of Domrémy flee with their cattle to Neufchâteau.
  rests_on: ["020.1", "020.2", "020.3", "020.4", "020.5", "020.7", "020.8", "020.9", "020.10", "020.11", "020.61", "020.62"]
  markers: [domremy-voices, vaucouleurs-1428, neufchateau, vergy-review-1428]
  battles: []
- id: salisbury-on-the-loire
  title: "Salisbury on the Loire"
  date: "July 1428 to February 1429"
  when: 1428-07
  tells: >-
    The Earl of Salisbury lands with fresh troops, takes Janville, Meung, Beaugency and Jargeau, and lays siege to
    Orléans on 12 October 1428. The English take the Tourelles at the bridge's southern end, and Salisbury, wounded
    by a cannon shot, dies at Meung. Through the winter the English ring the city with bastilles. On 12 February
    1429 at Rouvray, Fastolf's convoy of Lenten herrings beats off the French and Scots of Clermont from behind its
    wagons.
  rests_on: ["020.12", "020.13", "020.14", "020.15", "020.16", "020.17", "020.18", "020.19", "020.20", "020.21", "020.22", "020.23", "020.24", "020.25", "020.26", "020.27", "020.28", "020.29", "020.30"]
