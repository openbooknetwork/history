# Build every story with harita, upload dist/ to the site bucket and deploy the Worker when a v* tag is pushed.
name: Deploy
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # each story's cleaned zones, kept between runs
      - uses: actions/cache@v4
        with:
          path: .cache/kitap
          key: harita-${{ github.sha }}
          restore-keys: harita-
      # strict: every image and tile a page links to is in the asset store, and every translation is filled
      - run: npm run build -- --strict
      # the site bucket's token, which reads and writes that bucket alone
      - run: ./node_modules/.bin/harita deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # the Worker and its route go up once the bucket holds the site
      - run: ./node_modules/.bin/wrangler deploy -c worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
