      - { claim: "020.32", how: "the body says she came back in winter 1428-1429 and lodged about three weeks with the Le Royers, and a note gives Lang's January and February and Poulengy's beginning of Lent." }
      - { claim: "020.33", how: "the exorcism is told as Catherine Le Royer's account, which she had from Joan." }
