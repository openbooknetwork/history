markers.adys-256.note: "রেগুলাস একটি কার্থেজীয় সেনাবাহিনীকে পরাজিত করেন, খ্রিস্টপূর্ব ২৫৬ সালের শেষ"

# Refuses the peace terms of Regulus
markers.carthage-255.note: "রেগুলাসের সন্ধির শর্ত প্রত্যাখ্যান করে"

# Hasdrubal marches out from here, summer 250 BC
markers.lilybaeum-250.note: "হাসদ্রুবাল এখান থেকে যাত্রা করেন, গ্রীষ্ম খ্রিস্টপূর্ব ২৫০"

# Taken by the Romans, 252 BC
markers.thermae-252.note: "রোমানরা দখল করে, খ্রিস্টপূর্ব ২৫২"

# Besieged by Rome from 250 BC
markers.lilybaeum-249.note: "খ্রিস্টপূর্ব ২৫০ সাল থেকে রোমের অবরোধে"

