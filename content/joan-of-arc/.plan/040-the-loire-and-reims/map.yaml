jargeau:
  bbox: [1.2, 47.1, 2.5, 48.1]
  zones: [france-may-1429, english-may-1429, burgundy-1420, brittany-1407]
  routes:
    - id: france-1429-jargeau
      family: france
      stations: [Selles, Romorantin, Orléans, Jargeau]
      passage: "Guy de Laval's letter of 8 June 1429, Quicherat 5, lines 5770-5790 and 5943-5946; the Journal of the Siege, Quicherat 4, p. 170, lines 7005-7020, with Quicherat's note on the entry of 9 June; Cagny, Quicherat 4, pp. 12-13, lines 900-915"
      basis: reconstruction
      why: "Laval has her ride out of Selles for Romorantin, three leagues on, on the evening of 6 June; Quicherat's note has her enter Orléans a second time on 9 June by the town's accounts; the Journal has the army leave Orléans for Jargeau on Saturday 11 June (040.2, 040.87). The places are given and the roads are not, so the line runs from the Cher across the Sologne to Orléans and up the Loire to Jargeau."
  markers:
    selles-rendezvous: { name: Selles, what: "the rendezvous of the army on the Cher, where Guy de Laval saw her ride out armed all in white on 6 June 1429 and Alençon came the same day; about 47.28 N 1.55 E. In the france colour", basis: sourced }
    orleans-june-1429: { name: Orléans, what: "she comes back to the city on 9 June by the town's accounts, and the army marches out of it for Jargeau on Saturday 11 June; about 47.90 N 1.91 E. In the france colour", basis: sourced }
    jargeau-stormed: { name: Jargeau, what: "Suffolk's town on the Loire, stormed on Sunday 12 June 1429 after an assault of three or four hours; Suffolk taken, the town and its church sacked; about 47.86 N 2.12 E. In the france colour once taken, under the battle card", basis: sourced }
  unmarked:
    Romorantin: "a station of the army's road, where Laval has her ride on 6 June; it changes nothing on the map."
    Loches: "named as where she came from to Selles; the court's town, outside the story of this page's map."
    the Cher: "the river is drawn on the base map; Selles on it is marked."
    the Loire: "the river is drawn on the base map; Orléans and Jargeau on it are marked."
    the Sologne: "the land the road crosses between Selles and Orléans; a region, not a place."
meung-and-beaugency:
  bbox: [1.1, 47.55, 2.7, 48.95]
  zones: [france-june-1429, english-june-1429, burgundy-1420, brittany-1407]
  routes:
    - id: france-1429-beaugency
      family: france
      stations: [Orléans, Meung, Beaugency]
      passage: "the Journal of the Siege, Quicherat 4, p. 174, lines 7165-7195; Cagny, Quicherat 4, pp. 13-14, lines 960-990; Lang, The Maid of France, ch. 14, lines 7090-7100"
      basis: reconstruction
      why: "The Journal has the army leave Orléans on Wednesday 15 June, take the bridge of Meung on the way and come before Beaugency next morning (040.11, 040.12). The three towns are given, all on the north bank, and the road is not, so the line follows the river."
    - id: fastolf-1429-janville
      family: english
      stations: [Paris, Étampes, Janville]
      passage: "Lowell, Joan of Arc, ch. 10, lines 5695-5710; the Journal of the Siege, Quicherat 4, p. 176, lines 7235-7245; Ramsay, Lancaster and York, ch. 27, lines 25020-25024"
      basis: reconstruction
      why: "Lowell has the relief leave Paris early in June under Fastolf and reach Janville the day Jargeau fell; the Journal has it leave its supplies and artillery at Étampes; Ramsay has it halt at Janville (040.20). The towns are given and the roads are not."
    - id: talbot-1429-janville
      family: english
      stations: [Beaugency, Janville]
      passage: "Wavrin, Quicherat 4, p. 414, lines 16195-16207; Lang, The Maid of France, ch. 14, lines 7096-7099"
      basis: reconstruction
      why: "Lang has Talbot gone from Beaugency, where Gough held for him, to Janville before the French came on 16 June, and Wavrin has him ride into Janville with about forty lances and two hundred archers to join Fastolf (040.20, 040.13). Only the two ends are given, so the line runs straight across the Beauce."
    - id: english-1429-meung
      family: english
      stations: [Janville, a league from Beaugency, Meung]
      passage: "Wavrin, Quicherat 4, pp. 416-418, lines 16287-16330; the Journal of the Siege, Quicherat 4, p. 176, lines 7240-7260; Lowell, Joan of Arc, ch. 10, lines 5858-5862; Lang, The Maid of France, ch. 14, lines 7242-7247"
      basis: reconstruction
      why: "On 17 June Wavrin has the English come about a league from Meung and near Beaugency, Lowell about a league from each town, and Lang within a league of Beaugency; they find the French on a small hill and turn back to Meung, and the Journal has them assail the bridge of Meung that night (040.23). The hill is not placed by any source read, so the middle station is a point about a league from each town, north of the road between them, and the roads are not given."
  markers:
    meung-bridge-1429: { name: Meung, what: "the fortified bridge taken by the French on 15 June 1429 and garrisoned in its towers, while the English keep the town and castle; on 17 June the English come back and batter the bridge all night; about 47.83 N 1.70 E. In the france colour, for the bridge", basis: sourced, rank: 1 }
    beaugency-1429: { name: Beaugency, what: "the French enter the town on 16 June 1429 and besiege Gough and Gethin in the castle and on the bridge; in the night of 17 to 18 June the garrison yields on terms and marches off; about 47.78 N 1.63 E. In the france colour once yielded", basis: sourced, rank: 2 }
    janville-1429: { name: Janville, what: "where Fastolf's relief halts when Jargeau falls, Talbot joins it, and Fastolf counsels retreat and is overruled; about 48.20 N 1.88 E. In the english colour", basis: sourced }
    orleans-15-june-1429: { name: Orléans, what: "the French army marches out of it for Meung and Beaugency on Wednesday 15 June 1429; about 47.90 N 1.91 E. In the france colour", basis: sourced }
    paris-fastolf-1429: { name: Paris, what: "the start of Fastolf's relief, which leaves it early in June 1429 for Janville; about 48.86 N 2.35 E. In the english colour", basis: sourced }
  unmarked:
    Étampes: "where the Journal has the relief leave its supplies and artillery; a station of fastolf-1429-janville."
    the hill before Beaugency: "where the French stood on 17 June; no source read places it, and it would stand under Beaugency's icon."
    Évreux: "named for Gethin's office of bailli; outside the frame and the event."
    the Beauce: "the plain north of the Loire, inside the english zone; Janville is marked in it."
    Jargeau: "named as the town whose fall halted Fastolf at Janville; marked on jargeau."
    Selles: "named as where Laval heard of Richemont's force; marked on jargeau."
patay:
  bbox: [1.2, 47.7, 2.7, 48.75]
  zones: [france-1428, english-1429, burgundy-1420, brittany-1407]
  routes:
    - id: english-1429-patay
      family: english
      stations: [Meung, Patay]
      passage: "Wavrin, Quicherat 4, pp. 420-423, lines 16480-16560; Cagny, Quicherat 4, p. 15, lines 1020-1035"
      basis: reconstruction
      why: "Wavrin and the Journal have the English leave Meung on the morning of 18 June for Janville, and Cagny has them abandon it in the night before and go straight for Janville; Wavrin has them caught near Patay, two leagues from Janville (040.25, 040.39). The road is not given, so the line runs north from Meung and stops at the field, where the card stands."
    - id: france-1429-patay
      family: france
      stations: [Beaugency, Patay]
      passage: "the Journal of the Siege, Quicherat 4, pp. 176-177, lines 7260-7295; Murray, deposition of Dunois, lines 12225-12245"
      basis: reconstruction
      why: "The French were at Beaugency, which had yielded that morning, and rode after the English, the vanguard under La Hire and Poton ahead (040.26, 040.27). The start and the field are given and the road is not."
    - id: fastolf-1429-flight
      family: english
      stations: [Patay, Étampes, Corbeil]
      passage: "Wavrin, Quicherat 4, p. 424, line 16567; the Journal of the Siege, Quicherat 4, p. 178"
      basis: reconstruction
      why: "Wavrin has Fastolf take the road to Étampes, which he reached about midnight, and the Journal has him save himself in Corbeil (040.33). The towns are given and the roads are not."
    - id: france-1429-orleans
      family: france
      stations: [Patay, Orléans]
      passage: "Cagny, Quicherat 4, p. 16, lines 1060-1070; Monstrelet, book 2 ch. 61, lines 39227-39228"
      basis: reconstruction
      why: "Cagny has Joan and Alençon go back to Orléans with the prisoners on Sunday 19 June (040.44). Only the two ends are given."
  markers:
    patay-village: { name: Patay, what: "the village of the Beauce, two leagues from Janville by Wavrin, near which the battle was fought on 18 June 1429 and where the French lay that night; about 48.05 N 1.70 E. Under the battle card; the text gives Monstrelet's half league short of it and Ramsay's Coinces", basis: sourced }
    janville-shut: { name: Janville, what: "the townsmen shut their gates on the English fugitives and give the town and its great tower to the king on 18 June 1429; about 48.20 N 1.88 E. In the france colour", basis: sourced }
    montpipeau-1429: { name: Montpipeau, what: "an English castle of the Beauce, burned and abandoned by its garrison after Patay; the castle site at Huisseau-sur-Mauves, about 47.89 N 1.70 E. In the france colour", basis: sourced, rank: 1 }
    saint-sigismond-1429: { name: Saint-Sigismond, what: "an English place of the Beauce, burned and abandoned after Patay; about 47.98 N 1.67 E. In the france colour", basis: sourced }
    meung-18-june-1429: { name: Meung, what: "the English give it up on the morning of 18 June 1429 and march for Janville, the start of english-1429-patay; about 47.83 N 1.70 E. In the france colour", basis: sourced }
    beaugency-18-june-1429: { name: Beaugency, what: "its garrison rides off on 18 June 1429 and the French ride after the English from it, the start of france-1429-patay; about 47.78 N 1.63 E. In the france colour", basis: sourced }
    orleans-19-june-1429: { name: Orléans, what: "Joan and Alençon bring the prisoners back to it on Sunday 19 June 1429, the end of france-1429-orleans; about 47.90 N 1.91 E. In the france colour", basis: sourced }
    etampes-1429: { name: Étampes, what: "Fastolf reaches it about midnight in his flight from Patay, 18 June 1429, and it stays English; about 48.43 N 2.16 E. In the english colour", basis: sourced }
    corbeil-1429: { name: Corbeil, what: "where Fastolf saves himself after Patay, the end of fastolf-1429-flight; about 48.61 N 2.48 E. In the english colour", basis: sourced }
    chartres-1429: { name: Chartres, what: "stays English after Patay; about 48.447 N 1.489 E. In the english colour", basis: sourced }
  unmarked:
    Coinces: "where Ramsay sets the fight, a few kilometres from Patay; the card stands at Patay, as Cagny and Wavrin have it, and the text gives Ramsay's site."
    the Lignerolles wood: "where Anatole France sets the fight; his Life is read only for where to look, and the card stands at Patay."
    Saint-Péravy: "named only with France's site; not marked."
    Bonny: "Lowell's upper limit of the French Loire after Jargeau; outside the frame, and the zone shows the river clear."
    Paris: "named for the Beauce cleared almost to Paris; at the frame's edge, inside the english zone."
    the Loire: "the river is drawn on the base map; the zone shows it clear of the English about Orléans."
    the Beauce: "the plain north of the Loire, cleared of the English; Janville, Montpipeau and Saint-Sigismond are marked in it."
auxerre-and-troyes:
  bbox: [1.7, 47.35, 4.6, 48.6]
  zones: [france-1428, english-1429, burgundy-1420, brittany-1407]
  routes:
    - id: france-1429-gien
      family: france
      stations: [Orléans, Gien]
      passage: "Cagny, Quicherat 4, pp. 16-17, lines 1074-1095"
      basis: reconstruction
      why: "Cagny has Joan and Alençon leave Orléans on Friday 24 June with all their company, those in the town and those in the fields, and lodge with the king at Gien that day (040.44, 040.48); the army marches with her, so the road is france. Only the two ends are given, so the line follows the Loire."
    - id: france-1429-troyes
      family: france
      stations: [Gien, Auxerre, Saint-Florentin, Troyes]
      passage: "the Journal of the Siege, Quicherat 4, pp. 181-183, lines 7430-7500; Cagny, Quicherat 4, pp. 17-18, lines 1110-1155; Ramsay, Lancaster and York, ch. 27, lines 25140-25150"
      basis: reconstruction
      why: "Cagny has the king leave Gien on Wednesday 29 June and come before Troyes on 8 July; the Journal and Ramsay give Auxerre, then Saint-Florentin, then Troyes. Monstrelet names Saint-Florentin before Auxerre (040.53), and the route follows the Journal. The towns are given and the roads are not."
  markers:
    gien-rendezvous: { name: Gien, what: "where Joan joins the king on 24 June 1429, the council turns from Normandy to Reims, and the army sets out on 29 June unpaid; about 47.69 N 2.63 E. In the france colour", basis: sourced }
    auxerre-truce: { name: Auxerre, what: "the Burgundian town that keeps its gates shut, sells food to the army under a truce and promises to do as Troyes, Châlons and Reims do; the king passes on after about three days; about 47.80 N 3.57 E. In the burgundy colour", basis: sourced }
    saint-florentin-1429: { name: Saint-Florentin, what: "submits to the king on the road to Troyes, early in July 1429; about 48.00 N 3.73 E. In the france colour", basis: sourced }
    troyes-1429: { name: Troyes, what: "refuses the summons and holds with 500 to 600 English and Burgundians (the Journal); yields on terms as the assault is readied, and the king enters on Sunday 10 July 1429; about 48.30 N 4.07 E. In the france colour", basis: sourced }
    orleans-24-june-1429: { name: Orléans, what: "Joan and Alençon leave it with their company for Gien on Friday 24 June 1429, the start of france-1429-gien; about 47.90 N 1.91 E. In the france colour", basis: sourced }
  unmarked:
    La Charité: "named as the upper Loire some of the council would take first; outside the event of the page, and marked in 050."
    Normandy: "named as where the princes wished the king to go; outside the frame."
    Champagne: "a province, shown by the english zone, which counts its Anglo-Burgundian towns as English."
    Paris: "named as whence Friar Richard was driven; inside the english zone at the frame's edge."
    Châlons: "named in Auxerre's promise; outside the frame, marked on reims."
    Reims: "named as the king's goal and in Auxerre's promise; outside the frame, marked on reims."
reims:
  bbox: [3.6, 48.05, 4.8, 49.45]
  zones: [france-reims-1429, english-reims-1429, burgundy-1420, brittany-1407]
  routes:
    - id: france-1429-reims
      family: france
      stations: [Troyes, Châlons, Sept-Saulx, Reims]
      passage: "Cagny, Quicherat 4, pp. 18-19, lines 1155-1195; the Journal of the Siege, Quicherat 4, p. 184, lines 7550-7575"
      basis: reconstruction
      why: "Cagny has the king received at Châlons on Thursday 14 July and enter Reims on Saturday 16 July; the Journal has him lodge at Sept-Saulx, four leagues from Reims, where the keys were brought (040.62, 040.63). The towns are given and the roads are not."
  markers:
    chalons-1429: { name: Châlons, what: "its bishop and burgesses come out to the king and give him full obedience; he is received there on Thursday 14 July 1429 (Cagny); about 48.96 N 4.37 E. In the france colour", basis: sourced }
    sept-saulx-1429: { name: Sept-Saulx, what: "the archbishop's castle four leagues from Reims where the king lodges, and the burgesses of Reims bring him the keys, 16 July 1429; about 49.15 N 4.26 E. In the france colour", basis: sourced, rank: 1 }
    reims-cathedral: { name: Reims, what: "the king enters on Saturday 16 July 1429, and on Sunday 17 July he is anointed and crowned in the cathedral, Joan beside him with her standard; the cathedral, about 49.254 N 4.034 E. In the france colour", basis: sourced, rank: 2 }
    troyes-july-1429: { name: Troyes, what: "the start of france-1429-reims: the king, who entered it on 10 July 1429, marches from it for Reims; about 48.30 N 4.07 E. In the france colour", basis: sourced }
  unmarked:
    the abbey of Saint-Remi: "whence the Holy Ampulla was brought; a few hundred metres from the cathedral, it would stand under its icon, and the text names it."
    Domrémy: "her father and Laxart came from it to Reims; outside the frame, marked in 010."
    Burgundy: "named for the duke Joan wrote to and his envoys; the burgundy zone shows the duke's land."
    Orléans: "named for the siege she said God wished her to raise, and for its bishop; marked on jargeau."
    Paris: "named as the city the duke would give up at the truce's end; outside the frame, marked in 050."
    Chartres: "named only in Regnault de Chartres's name; no place."
    Champagne: "a province, shown by the english zone with its southern and central part gone; the towns that opened are marked."
the-towns-come-over:
  bbox: [2.4, 48.1, 4.3, 49.7]
  zones: [france-aug-1429, english-aug-1429, burgundy-1420, brittany-1407]
  routes:
    - id: france-1429-provins
      family: france
      stations: [Reims, Corbeny, Vailly, Soissons, Château-Thierry, Montmirail, Provins]
      passage: "Cagny, Quicherat 4, pp. 20-21, lines 1210-1255; the Journal of the Siege, Quicherat 4, p. 187, lines 7655-7715; Lowell, Joan of Arc, ch. 12, lines 7195-7210"
      basis: reconstruction
      why: "Cagny has the king leave Reims on Thursday 21 July for Saint-Marcoul, enter Soissons on 23 July and reach Provins on 2 August; the Journal names Vailly; Cagny, with the day supplied by Quicherat, and Lang have him at Château-Thierry from 29 July to 1 August, and Lowell has two days there (040.75 to 040.80); Cagny has him lie at Montmirail in Brie on 1 August (Quicherat 4, p. 20, lines 1240-1242). The places are given and the roads are not."
  markers:
    corbeny-1429: { name: Corbeny, what: "the shrine of Saint-Marcoul, where the king touches for the King's Evil after leaving Reims on 21 July 1429 and the keys of Laon are brought to him; about 49.46 N 3.82 E. In the france colour", basis: sourced, rank: 2 }
    laon-1429: { name: Laon, what: "submits to the king, sending its keys or its deputies to him at Corbeny, July 1429; about 49.56 N 3.62 E. In the france colour", basis: sourced, rank: 1 }
    soissons-1429: { name: Soissons, what: "sends the king its keys, and he enters it on Saturday 23 July 1429; about 49.38 N 3.32 E. In the france colour", basis: sourced }
    chateau-thierry-1429: { name: Château-Thierry, what: "held for Burgundy by the lords of Châtillon, Croy and Brimeu, it yields when its townsmen lean to the king; he enters on 29 July 1429 and stays to 1 August, and here on 31 July exempts Domrémy and Greux from taxes; about 49.05 N 3.40 E. In the france colour", basis: sourced }
    crecy-1429: { name: Crécy, what: "declares for the king in the weeks after the coronation (Beaucourt); about 48.86 N 2.91 E. In the france colour", basis: sourced, rank: 1 }
    coulommiers-1429: { name: Coulommiers, what: "declares for the king in the weeks after the coronation (Ramsay, Beaucourt); about 48.81 N 3.08 E. In the france colour", basis: sourced, rank: 2 }
    provins-1429: { name: Provins, what: "the king reaches it on Tuesday 2 August 1429 and stays to Friday 5 August (Cagny); about 48.56 N 3.30 E. In the france colour", basis: sourced }
    vailly-1429: { name: Vailly, what: "a station of the road, where the king passes on 22 July 1429 (the Journal); about 49.41 N 3.52 E. In the france colour", basis: sourced }
    sens-1429: { name: Sens, what: "named in Bedford's memorandum of December 1433, as Lang dates it, among the cities lost after Orléans; no source read gives when it came over; about 48.20 N 3.28 E. In the english colour", basis: sourced }
  unmarked:
    Paris: "Bedford's city, where Cardinal Beaufort's reinforcement entered on 25 July (Ramsay); inside the english zone, and marked in 050."
    Domrémy: "a village exempted from taxes; outside the frame, told at Château-Thierry's marker, and marked in 010."
    Greux: "a village exempted from taxes; outside the frame, told at Château-Thierry's marker."
    Orléans: "named only as the victory after which the cities went over; marked on jargeau."
    Reims: "the start of the road, a station of france-1429-provins; marked on reims."
    the Marne: "the river is drawn on the base map; Château-Thierry on it is marked."
    Burgundy: "named for the duke spared while the two treated; the burgundy zone shows his land."
    Senlis: "named in Bedford's list; it came over in August, on a page of 050."
    Lagny: "named in Bedford's list; it came over in August, on a page of 050."
    Creil: "named in Bedford's list; it came over in August, on a page of 050."
    Beauvais: "named in Bedford's list; it came over in August, on a page of 050."
    Compiègne: "named by Beaucourt as the road to Paris not taken; outside this page's event, marked in 050."
