beaulieu-and-beaurevoir:
  bbox: [2.45, 49.25, 3.65, 50.15]
  zones: [france-1430, english-1430, burgundy-1430, brittany-1407]
  routes:
    - id: joan-1430-beaulieu
      family: joan
      stations: [Clairoix, Beaulieu]
      passage: "Lang, The Maid of France, ch. 21, lines 10563-10570; Lowell, Joan of Arc, ch. 17, lines 9833-9840; Ramsay, Lancaster and York, vol. 1, ch. 29, lines 26384-26392"
      basis: reconstruction
      why: "Lang has John of Luxembourg keep her three or four days at Clairoix and send her to his castle of Beaulieu in the Vermandois; Ramsay puts Beaulieu near Noyon, and Lowell has her sent under strong escort some twenty miles north-east of Compiègne (060.2). No road is given, so the line joins the two places. Drawn in joan, her road as a prisoner."
    - id: joan-1430-beaurevoir
      family: joan
      stations: [Beaulieu, Beaurevoir]
      passage: "Ramsay, Lancaster and York, vol. 1, ch. 29, lines 26384-26392; Lang, The Maid of France, ch. 21, lines 10660-10666; Lowell, Joan of Arc, ch. 18, lines 10318-10325"
      basis: reconstruction
      why: "Ramsay, Lang and Lowell have her moved from Beaulieu to Beaurevoir, Lang's 'forty miles north of Beaulieu' (060.4, 060.5). When she was moved is disputed (060.4), and no road is given, so the line joins the two places."
  markers:
    beaulieu-1430: { name: Beaulieu, what: "John of Luxembourg's castle near Noyon, where she is held from the end of May 1430, a few weeks or through June and July as the authors differ; she nearly escapes between two pieces of wood of her tower until the porter stops her; about 49.66 N 2.91 E (Beaulieu-les-Fontaines). In the burgundy colour", basis: sourced, rank: 1 }
    beaurevoir-1430: { name: Beaurevoir, what: "John of Luxembourg's castle near Saint-Quentin in the Vermandois, where the Demoiselle of Luxembourg and the Lady of Beaurevoir offer her a woman's dress and she leaps from the tower, about four months by her own count; about 50.00 N 3.31 E. In the burgundy colour", basis: sourced, rank: 2 }
    clairoix-beaulieu-1430: { name: Clairoix, what: "John of Luxembourg's quarters before Compiègne, where Lang has him keep her three or four days before he sends her to Beaulieu; the start of joan-1430-beaulieu, which the text names; about 49.44 N 2.85 E. In the burgundy colour", basis: sourced }
  unmarked:
    Compiègne: "the Duke of Burgundy's camp before it, where Cauchon presents the summons of 14 July 1430 (060.11); the record gives no site for the camp, so the summons is told and not drawn; the town is marked on compiegne and on sold-to-the-english, where it is relieved."
    Noyon: "named to place Beaulieu; the Beaulieu marker stands a few kilometres from it."
    Saint-Quentin: "named to place Beaurevoir; the Beaurevoir marker stands near it."
    Cambrai: "named by Anatole France to place Beaurevoir; the marker stands at Beaurevoir."
    the Vermandois: "a region, not a place; both castles stand in it."
    Flanders: "one of Cauchon's journeys of the summer (060.17); a region outside the frame."
    Paris: "named only in 'the Bourgeois of Paris', a source; no place on this page."
    Bar: "named only in the name of Jeanne de Bar, the Lady of Beaurevoir's daughter; no place on this page."
    Burgundy: "named in the Duke of Burgundy's title; his lands are the burgundy zone."
sold-to-the-english:
  bbox: [0.85, 49.2, 3.6, 50.55]
  zones: [france-1430, english-1430, burgundy-1430, brittany-1407]
  routes:
    - id: joan-1430-le-crotoy
      family: joan
      stations: [Beaurevoir, Arras, Drugy, Le Crotoy]
      passage: "Ramsay, Lancaster and York, vol. 1, ch. 29, lines 26430-26438; Lowell, Joan of Arc, ch. 18, lines 10576-10600; Lang, The Maid of France, ch. 21, lines 10833-10840; Anatole France, Life, vol. 2, ch. 10, lines 25571-25585"
      basis: reconstruction
      why: "Ramsay and Lowell have the Burgundians take her from Beaurevoir to Arras and from there to Le Crotoy, Lowell in the latter part of October (060.18, agreed). Lang has her pass a night at the castle of Drugy on the way to Le Crotoy, and Anatole France the same, so Drugy is a station by Lang. No road is given, so the line joins the stations. The line ends at Le Crotoy: rules.md leaves out the road from Le Crotoy to Rouen, so the map draws no route between them and marks the two places. Drawn in joan, her road as a prisoner."
  markers:
    arras-1430: { name: Arras, what: "the Burgundian town where she is brought from Beaurevoir in the latter part of October 1430, where, as it seems, the Duke of Burgundy held his court (Lowell); about 50.29 N 2.78 E. In the burgundy colour", basis: sourced, rank: 1 }
    le-crotoy-1430: { name: Le Crotoy, what: "the English fortress at the mouth of the Somme, English since 3 March 1424, where she is in English hands by November 1430 and hears the Masses of Nicolas de Queuville, a prisoner there; about 50.22 N 1.62 E. In the english colour", basis: sourced, rank: 1 }
    rouen-1430: { name: Rouen, what: "the capital of English Normandy, where the Estates granted in August 1430 the ten thousand livres tournois of her price, and where she is brought in November or early December 1430, as the authors differ, and shut in a tower of the castle; about 49.44 N 1.10 E. In the english colour", basis: sourced, rank: 2 }
    compiegne-relief-1430: { name: Compiègne, what: "the town John of Luxembourg besieged while she was his prisoner; it holds under Guillaume de Flavy and is relieved on 25–26 October 1430, and the Burgundians fall back and leave their guns; about 49.42 N 2.83 E. In the france colour", basis: sourced, rank: 1 }
    beaurevoir-october-1430: { name: Beaurevoir, what: "John of Luxembourg's castle, from which she is taken to Arras in the latter part of October 1430; the start of joan-1430-le-crotoy, which the text names; about 50.00 N 3.31 E. In the burgundy colour", basis: sourced }
    drugy-1430: { name: Drugy, what: "the castle where Lang has her pass a night on the way to Le Crotoy, a station of joan-1430-le-crotoy, which the text names; today in the commune of Saint-Riquier, about 50.125 N 1.947 E. In the burgundy colour", basis: reconstruction, why: "Lang names the castle of Drugy and names.md puts it in today's commune of Saint-Riquier; no source read gives its site, so the point stands just south of the town." }
  unmarked:
    the Somme: "drawn on the base map."
    Saint-Valery: "on the coast road that only Père Ignace (1657) traces (060.24); rules.md leaves the road out."
    Eu: "on the coast road that only Père Ignace traces (060.24); left out by rules.md."
    Dieppe: "on the coast road that only Père Ignace traces (060.24); left out by rules.md."
    Paris: "the University of Paris writes from it on 21 November 1430; marked on the-court, the page of the trial."
    Normandy: "the Estates of Normandy, met at Rouen; English Normandy is the english zone, and Rouen is marked."
    Burgundy: "named in the Duke of Burgundy's title; his lands, Arras among them, are the burgundy zone."
the-court:
  bbox: [0.75, 48.7, 3.0, 49.75]
  zones: [france-1430, english-1430, burgundy-1430, brittany-1407]
  markers:
    rouen-castle-1431: { name: the castle of Rouen, what: "Philip Augustus's castle on the Bouvreuil hill, north of the old town, where Warwick is captain; she is held in a tower of it, a secular prison guarded by English soldiers, and the court sits in the king's council house in Rouen from 9 January 1431 and in the castle from 21 February; about 49.445 N 1.093 E. In the english colour", basis: sourced, rank: 2 }
    beauvais-1431: { name: Beauvais, what: "Pierre Cauchon's see, which drove him out in August 1429 and holds for Charles VII, so the bishop's court sits at Rouen; about 49.43 N 2.08 E. In the france colour", basis: sourced, rank: 1 }
    university-of-paris-1431: { name: Paris, what: "the University of Paris, which pressed in November 1430 for her trial, and whose doctors, paid twenty sous tournois a day by the English crown, are most of the assessors at Rouen; about 48.85 N 2.35 E. In the english colour", basis: sourced, rank: 1 }
  unmarked:
    Compiègne: "where she was taken, which the record puts in Cauchon's diocese and Canon Dunand in Soissons's (060.31); marked on sold-to-the-english."
    Soissons: "named only for Canon Dunand's view of the diocese (060.31); it changes nothing on the map."
    Coutances: "where the Inquisitor Jean Graverent dated his commission of 4 March 1431 (060.35); outside the frame, told and not drawn."
    the king's council house: "where the court first sat on 9 January 1431 (060.34); no source read places it in Rouen, and the castle marker names it."
    Normandy: "English Normandy is the english zone, and Rouen is marked."
the-questioning:
  bbox: [1.087, 49.4425, 1.0995, 49.4485]
  zones: [english-sep-1429]
  markers:
    castle-sessions-1431: { name: the castle of Rouen, what: "where the court questions her: in the chapel royal on 21 February 1431, in the Robing Room at the end of the great hall from 22 February, in her cell from 10 March to 17 March, and in the room near the great hall when the articles are read on 27 March and when she is admonished on 2 May; about 49.4452 N 1.0932 E. In the english colour", basis: reconstruction, why: "The castle's site is sourced: on the Bouvreuil hill north of the old town, a triangle with the keep at its northern point (Rouen_Castle.wiki, which cites Le Donjon de Rouen; Anatole France). The record names the chapel royal, the Robing Room, the room near the great hall and her cell, and no source read gives where each stood inside the castle, so one marker stands in the middle of the ward and names them.", rank: 2 }
    great-tower-1431: { name: the great tower, what: "the keep of the castle, where on 9 May 1431 she is shown the instruments of torture with the torturers present; on 12 May the judges decide against the torture; the keep stands today as the Tour Jeanne d'Arc; about 49.4461 N 1.0938 E. In the english colour", basis: sourced, rank: 1 }
  unmarked:
    the chapel royal: "named by the record for 21 February (060.39); no source read places it inside the castle, and the castle marker names it."
    the Robing Room: "at the end of the great hall (060.40); no source read places the hall inside the castle, and the castle marker names it."
    her cell: "a tower near the postern gate in Lowell, looking on the open country in Anatole France (060.25); no source read says which tower, and the castle marker names it."
    Paris: "the University of Paris condemns the twelve articles (060.46); marked on the-court."
    Reims: "named in her answer on the sign, through the Archbishop of Reims; no place on this page."
saint-ouen:
  bbox: [1.087, 49.4395, 1.104, 49.4485]
  zones: [english-sep-1429]
  routes:
    - id: joan-1431-saint-ouen
      family: joan
      stations: [the castle of Rouen, the cemetery of Saint-Ouen]
      passage: "Lowell, Joan of Arc, ch. 24, lines 13874-13885; Massieu's deposition of 1450, Murray, Jeanne d'Arc, Maid of Orleans, lines 9371-9385"
      basis: reconstruction
      why: "Lowell has her taken from her cell early in the morning of 24 May to the cemetery of Saint-Ouen, and Massieu has Cauchon send her back to the castle she came from (060.49, 060.53). No source gives the streets, so the line joins the two places, and it stands for the way there and back. Drawn in joan, her road as a prisoner."
  markers:
    saint-ouen-1431: { name: the cemetery of Saint-Ouen, what: "the open ground just south of the abbey church of Saint-Ouen (Lowell), where on 24 May 1431, on a scaffold before the judges, Cardinal Beaufort and a great crowd, Guillaume Erard preaches and she abjures before the sentence is read to its end, and is sentenced to prison for life; about 49.4425 N 1.0995 E. In the english colour", basis: reconstruction, why: "The record and Leparmentier put the scene in the cemetery of the abbey of Saint-Ouen, and Lowell alone puts the cemetery just south of the abbey church (060.49); the church stands, and the point is set at its own coordinates (Saint-Ouen_Abbey,_Rouen.wiki), some tens of metres from its south side. The cemetery is gone, and its extent is not given.", rank: 2 }
    castle-relapse-1431: { name: the castle of Rouen, what: "brought back to her cell on 24 May, she puts on a woman's dress that afternoon; on Monday 28 May the judges find her in man's dress again, and on 29 May they find her relapsed; about 49.4452 N 1.0932 E. In the english colour", basis: reconstruction, why: "The castle's site is sourced (Rouen_Castle.wiki; Anatole France); no source read says which tower held her cell, so the marker stands in the middle of the ward.", rank: 1 }
  unmarked:
    the archiepiscopal chapel: "where the judges and assessors find her relapsed on 29 May (060.57); no source read places it in Rouen, so it is told and not drawn."
    Noyon: "named in the title of a bishop at Saint-Ouen; no place on this page."
    Thérouanne: "named in the title of a bishop at Saint-Ouen; no place on this page."
    the Old Market: "where she is cited for 30 May; marked on the-old-market, the page of the burning."
the-old-market:
  bbox: [1.083, 49.44, 1.0985, 49.4485]
  zones: [english-sep-1429]
  routes:
    - id: joan-1431-old-market
      family: joan
      stations: [the castle of Rouen, the Old Market]
      passage: "Massieu's deposition of 1450, Murray, Jeanne d'Arc, Maid of Orleans, lines 9446-9452; Lowell, Joan of Arc, ch. 24, lines 14685-14690"
      basis: reconstruction
      why: "Massieu, who walked beside her, and Lowell have her led from the castle to the Old Market under an English guard on the morning of 30 May (060.59). No source gives the streets, so the line joins the two places. Drawn in joan, her road as a prisoner."
  markers:
    castle-last-morning-1431: { name: the castle of Rouen, what: "on the morning of 30 May 1431, in her cell, Martin Ladvenu tells her she is to die and hears her confession, she receives communion, and she says to Cauchon, 'Bishop, I die through you'; about 49.4452 N 1.0932 E. In the english colour", basis: reconstruction, why: "The castle's site is sourced (Rouen_Castle.wiki; Anatole France); no source read says which tower held her cell, so the marker stands in the middle of the ward.", rank: 1 }
    old-market-1431: { name: the Old Market, what: "the market place by the church of Saint-Sauveur, where at about nine in the morning of 30 May 1431 Nicolas Midi preaches, the church gives her over to the secular power, and she is burned without a sentence of the bailli; her ashes are thrown into the Seine; about 49.4430 N 1.0878 E. In the english colour", basis: sourced, rank: 2 }
  unmarked:
    the church of Saint-Sauveur: "the church on the Old Market by which the scaffolds stood (060.60); it is gone, and the Old Market marker names it."
    the Seine: "her ashes were thrown into it (060.65); drawn on the base map, and no source gives the place on its bank."
    Paris: "named only in 'the Bourgeois of Paris', a source; no place on this page."
    Saint-Sauveur: "the church on the Old Market, whose cross Massieu had brought; it is gone, and the Old Market marker names it."
