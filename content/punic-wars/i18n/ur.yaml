markers.fabius-trap-pass.note: "4,000 آدمی کالیکولا درّہ سنبھالے ہوئے"

# Plunders the plain all summer
markers.fabius-trap-hannibal.note: "ساری گرمیاں میدان لوٹتا ہے"

# 400 horsemen destroyed by Carthalo
markers.fabius-trap-mancinus.note: "400 سوار، کارتھالو کے ہاتھوں تباہ"

# Stands at arms in camp
