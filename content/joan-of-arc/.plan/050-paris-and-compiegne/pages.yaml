- id: saint-pierre-and-la-charite
  title: "Saint-Pierre-le-Moûtier and La Charité"
  date: "October – December 1429"
  when: "1429-10"
  tells: Sent from Bourges with Charles d'Albret against Perrinet Gressart's towns on the upper Loire, she takes Saint-Pierre-le-Moûtier by storm by 9 November, then sits before La Charité in the cold, short of powder and money, and the siege is given up after about a month, at the end of November or in December.
