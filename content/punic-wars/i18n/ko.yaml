# 264 – 146 BC
story.span: "기원전 264~146년"

# Three wars between Rome and Carthage, from the crossing to Messana in 264 BC through Hannibal’s invasion of Italy to the destruction of Carthage in 146 BC.
story.summary: "로마와 카르타고 사이의 세 차례 전쟁. 기원전 264년 메사나로 건너간 일에서 시작해 한니발의 이탈리아 침공을 거쳐 기원전 146년 카르타고의 파괴로 끝난다."

