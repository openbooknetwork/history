# Murad II's thirty years on the Ottoman throne: the pretenders of 1421 and 1422, the conquest of Thessalonica and Serbia, the wars with John Hunyadi and Skanderbeg, the Crusade of Varna in 1444 and the second battle of Kosovo in 1448.
story.summary: "II. Murad’ın Osmanlı tahtındaki otuz yılı: 1421 ve 1422’deki taht davacıları, Selanik’in ve Sırbistan’ın fethi, Hunyadi Yanoş ve İskender Bey ile savaşlar, 1444’teki Varna Haçlı Seferi ve 1448’deki İkinci Kosova Muharebesi."

