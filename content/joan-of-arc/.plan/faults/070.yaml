  field: "070.12"
  replaces: "value"
  old: "- 070.12 Event: the Truce of Tours, a general truce signed four days after Margaret of Anjou's betrothal to Henry VI by proxy at Tours on 24 May 1444, that is on 28 May. single (Ramsay; Wikipedia gives the same day). \"days after the betrothal a general truce was signed\" (archive.org-download-cu31924088011436-cu31924088011436-djvu.txt.txt, Ramsay 2, ch. 5, scholarly) \"concluded by their envoys on 28 May 1444\" (Truce_of_Tours.wiki, lead, wikipedia)"
  new: "- 070.12 Event: the Truce of Tours, a general truce concluded at Tours in May 1444, at the time of Margaret of Anjou's betrothal to Henry VI by proxy there on 24 May. agreed for a general truce made at Tours in May 1444; disputed for the day: four days after the betrothal, that is 28 May, in Ramsay, and 28 May in Wikipedia; the text of the truce in Monstrelet (Johnes) is given at Tours on the 20th of May, which may be a misprint. \"days after the betrothal a general truce was signed\" (archive.org-download-cu31924088011436-cu31924088011436-djvu.txt.txt, Ramsay 2, ch. 5, scholarly) \"concluded by their envoys on 28 May 1444\" (Truce_of_Tours.wiki, lead, wikipedia) \"at Tours, the 20th day of May, in the year 1444\" (archive.org-download-chroniclesengue07johngoog-chroniclesengue07johngoog-djvu.txt.txt, Monstrelet book 2, ch. 275, the text of the truce, primary)"
  source: "Monstrelet B, book 2 ch. 275, line 11633: \"Given at Tours, the 20th day of May, in the year 1444.\"; Ramsay 2 ch. 5, line 6260: \"Four days after the betrothal a general truce was signed\""
  kind: "sources"
  claim: "070.12"
