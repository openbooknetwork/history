# 264 – 146 BC
story.span: "খ্রিস্টপূর্ব ২৬৪ – ১৪৬"

# Three wars between Rome and Carthage, from the crossing to Messana in 264 BC through Hannibal’s invasion of Italy to the destruction of Carthage in 146 BC.
story.summary: "রোম ও কার্থেজের মধ্যে তিনটি যুদ্ধ, খ্রিস্টপূর্ব ২৬৪ সালে মেসানায় পারাপার থেকে ইতালিতে হ্যানিবলের অভিযান হয়ে খ্রিস্টপূর্ব ১৪৬ সালে কার্থেজের ধ্বংস পর্যন্ত।"

