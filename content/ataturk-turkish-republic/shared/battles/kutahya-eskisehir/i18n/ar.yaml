# Grand National Assembly
battle.sides.0.name: "المجلس الوطني الكبير"

# 55,000 by Turkish counts, 95,750 by Greek counts
battle.sides.0.strength: "55,000 بحسب الأرقام التركية، و95,750 بحسب الأرقام اليونانية"

# 1,643 killed, 4,981 wounded, 374 captured, 30,809 deserted
