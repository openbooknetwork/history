  melun-and-lagny:
    account: >-
      The truce with Burgundy, prolonged, ran out at Easter, 16 April 1430, and the Duke of Burgundy took the field on
      the Oise as soon as Easter was past. At the end of March (between 28 March and 1 April, Moranvillé; at the very end
      of March or the first days of April, Lowell) Joan left the court at Sully without the king's leave, as if going
      for an outing, with her small household (Cagny). Melun, held by the English and then the Burgundians since Henry V
      took it, drove out its garrison about Easter and came over to the king; whether Joan was there before it rose is
      not known (Lowell). In Easter week, in the trenches at Melun, her voices, Saint Catherine and Saint Margaret, told
      her she would be taken before Saint John's Day, and told her so nearly every day after, but not when (her answer of
      10 March 1431, as the court recorded it). From Melun she went to Lagny on the Marne, whose garrison made good war on
      the English of Paris. Near Lagny she and the French of the garrisons met Franquet d'Arras, a captain of partisans
      of the Burgundian party, coming back from a raid with about 300 men (Monstrelet, Chastellain; the Bourgeois's
      raiders are about 300 English); Monstrelet gives her 400. His dismounted archers held off her first attacks, she
      sent for the garrison of Lagny and the places round, who came with culverins and crossbows, and his men were killed
      or taken and he was captured; Cagny has 300 to 400 English put to death. The date is given differently: early May
      in Monstrelet, May in Champion, the end of April in Lowell, who takes the Bourgeois's raid of 21 April for the same
      affair. At her trial she said she had asked to exchange Franquet for the landlord of an inn in Paris, and
      gave him up to justice when she heard the landlord was dead; he was tried for a fortnight before the bailli of
      Senlis and a jury of Lagny, confessed himself a murderer, thief and traitor, and was beheaded. Monstrelet and
      Chastellain, Burgundians, lay his death to her. The map shows her road from Sully by Melun to Lagny, in the colour
      of her own company, a reconstruction from the towns named, and Melun marked as the king's inside the English land.
