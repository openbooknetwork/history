  the-court:
    account: >-
      Pierre Cauchon had been raised to the see of Beauvais by the Burgundian party in 1420 and was driven out in August
      1429, when Beauvais went over to Charles VII; he had lived at Rouen since (Ramsay, Champion; 060.29). Beauvais was
      held for the French, so the trial of its bishop sat at Rouen, in English Normandy (Thurston; 060.30). His title
      was that she had been taken at Compiègne, in his diocese, as the record, Henry VI's letter and Thurston have it;
      Lang gives Canon Dunand's view that Compiègne lay in the see of Soissons (060.31). The chapter of Rouen, which held
      the spiritual jurisdiction while the archbishopric stood vacant, granted him territory in Rouen and its diocese
      (the record; 060.33), and by letters given at Rouen on 3 January 1431 Henry VI ordered her delivered to him for
      trial, keeping the right to take her back if she was not convicted (060.32). She was held in a tower of the castle
      of Rouen, Philip Augustus's castle on the Bouvreuil hill, near the postern gate, a great tower about a hundred feet
      high in Lowell (060.25), where Richard Beauchamp, Earl of Warwick, was captain (060.28). Though tried by a church
      court, she was kept in this secular prison, guarded in her cell by English soldiers, and not in a church prison
      (Ladvenu in 1450, Thurston; 060.27). Whether she was kept in an iron cage is disputed (060.26): Thurston says she
      was at first, chained by the neck, hands and feet; Lowell says it is not certain the cage was used, and Lang that
      one witness saw her in irons but not in the cage; Massieu says that at night she was chained by the legs to a
      beam. Cauchon opened the trial on Tuesday 9 January 1431 in the house of the King's Counsel at Rouen, with abbots,
      canons and doctors summoned (the record; 060.34). The vicar of the Inquisitor for the diocese of Rouen, the
      Dominican Jean Le Maistre, declined on 20 February for want of jurisdiction; the Inquisitor of France, Jean
      Graverent, sent a commission dated at Coutances on 4 March, received on 12 March, and Le Maistre sat from 13 March
      as the second judge (060.35). The assessors were almost all French, most of them theologians and doctors of the
      University of Paris (Thurston), and forty-three sat at the first public session (Lowell; 060.36). The English crown
      paid: Henry VI's order of 2 April 1431 and receipts of March and April allowed each of the Paris doctors twenty
      sous tournois a day, and the English government gave Le Maistre twenty saluts d'or on 24 April for his attendance
      (060.37). What the court had to prove: she was summoned as "vehemently suspected of heresy"; Henry VI's letter
      reports the University's judgment that she was superstitious, a sorceress, a blasphemer and a schismatic; and
      Thurston writes that the English could not put her to death for beating them but could have her sentenced as a
      witch and a heretic (060.38). The map shows Rouen in English Normandy, Beauvais in Charles VII's hands and Paris,
      the seat of the University, in English hands.
