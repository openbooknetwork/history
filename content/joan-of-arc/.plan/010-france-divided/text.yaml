      - { file: .references/archive.org-rt-histoire-de-charles-vii-v-1-Beaucourt-20Histoire-20de-20Charles-20VII-20v-201-djvu.txt.txt, read: "ch. 7, l. 16840 to 16910 (the letter of the Scots) and l. 17470 to 17490" }
      - { file: .references/archive.org-download-journaldunbourge54182gut-54182-0.txt.txt, read: "§361 to 370, 1422" }
      - { file: .references/archive.org-download-joanofarc00lowe-joanofarc00lowe-djvu.txt.txt, read: "ch. 1, l. 505 to 515 and 650 to 695" }
    passages: ["Wylie and Waugh 3, ch. 69", "Ramsay 1, ch. 20 to 22", "Beaucourt 1, ch. 7; Beaucourt 2, book 2 ch. 2", "the Bourgeois §361 to 370", "Oman book 14 ch. 1 and 2", "Lowell ch. 1"]
    disputes:
      - { claim: "010.48", how: "the body gives Holy Saturday, 22 March 1421, with the Scots' own letter and most of the sources; Oman's 21 March and the Chronique de la Pucelle's Palm Saturday are not told, since the page does not turn on the day." }
      - { claim: "010.49", how: "the body and the card give Wylie and Waugh's 1,500 English men-at-arms and Jean Juvenal's 5,000 to 6,000 French and Scots (in Wylie and Waugh), each with its author; Cagny's 10,000 to 12,000 is the English in Anjou and Maine, not at the battle, and is not told as the battle's." }
      - { claim: "010.50", how: "the body says October 1421, since Ramsay's about 6 October and Oman's 21 October differ." }
      - { claim: "010.53", how: "the body gives 21 October 1422 with the Bourgeois and Ramsay; Lang's 22 October is not told." }
    sources:
