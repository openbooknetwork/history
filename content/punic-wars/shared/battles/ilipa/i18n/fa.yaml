# 7,000 killed
battle.sides.0.casualties: "۷ هزار کشته"

# Carthage
battle.sides.1.name: "کارتاژ"

# 74,000 with 32 elephants (Polybius) or 54,500 (Livy)
battle.sides.1.strength: "۷۴ هزار با ۳۲ فیل (پولیبیوس) یا ۵۴٬۵۰۰ (لیویوس)"

# Over 48,500 killed or captured
battle.sides.1.casualties: "بیش از ۴۸٬۵۰۰ کشته یا اسیر"

# Battle of Ilipa
battle.name: "نبرد ایلیپا"

# Spring 206 BC
battle.date: "بهار ۲۰۶ پیش از میلاد"

# Roman victory, end of Carthaginian rule in Iberia
battle.result: "پیروزی روم، پایان فرمانروایی کارتاژ در ایبری"

