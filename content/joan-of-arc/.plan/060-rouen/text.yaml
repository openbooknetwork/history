  saint-ouen:
    account: >-
      On Thursday 24 May 1431 she was set on a scaffold in the cemetery of the abbey of Saint-Ouen, just south of the
      abbey church in Lowell, before the judges and a great crowd, and Guillaume Erard preached (the record, Leparmentier;
      060.49). With the judges sat Cardinal Beaufort, great-uncle of Henry VI, and the bishops of Thérouanne, Noyon and
      Norwich (the record; 060.50). Before the sentence was read to its end she abjured, and made a cross with a pen that
      Massieu handed her (Massieu; 060.51). The words she abjured are disputed (060.52): the record inserts a long
      formula of abjuration, while witnesses of 1450 to 1456 say the schedule read to her was short,
      about six lines in Taquel's words and a few lines in those of the five with Massieu whom Thurston cites, and Thurston holds that its terms will never be known. She was sentenced
      to perpetual imprisonment, "with the bread of sorrow and water of affliction", taken back to the castle and not to
      a church prison, and that afternoon put on a woman's dress (060.53). On Monday 28 May, the day after Trinity
      Sunday, the judges found her in man's dress in her cell; the record has her say that her voices told her she had
      damned herself to save her life, and that she had recanted only for fear of the fire (060.54). Why she put the
      man's dress on again is disputed (060.55): the record has her say she took it of her own will, as more fitting
      among men, because what was promised her, Mass and her chains taken off, was not kept; Massieu says that on Trinity
      Sunday the English guards took her woman's dress and left her only the man's; Thurston reports the later charge of
      a trap laid with Cauchon's connivance. Ladvenu and Isambart de La Pierre testified in 1450 that after the
      abjuration she said she had been ill-treated and molested in prison, an English lord among them, and had taken
      the man's dress again for that (060.56). On Tuesday 29 May the judges and assessors met in the archiepiscopal
      chapel of Rouen, found her relapsed and cited her to the Old Market for eight the next morning; Thurston counts
      thirty-seven judges (060.57). The map shows her taken from the castle to the cemetery of Saint-Ouen and back, a line
      that joins the two places since no source gives the streets.
