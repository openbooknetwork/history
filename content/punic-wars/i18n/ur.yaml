# Lead anchors on the sea floor
markers.aegates-interception-phorbantia.note: "سمندر کی تہہ میں سیسے کے لنگر"

# 250 warships laden with grain
markers.aegates-interception-hanno.note: "اناج سے لدے 250 جنگی جہاز"

