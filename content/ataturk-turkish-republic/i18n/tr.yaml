# Trikoupis group: 7,000 infantry fit to fight, crowded together
emblems.dumlupinar-alioren.trikoupis-group: "Trikupis grubu: savaşabilecek 7.000 piyade, birbirine sıkışmış"

# 10,000 to 15,000 disorganised men, largely unarmed
emblems.dumlupinar-alioren.stragglers: "Dağınık, büyük ölçüde silahsız 10.000 ile 15.000 asker"

# Turkish 14th Cavalry Division, blocking the road at 13.30
emblems.dumlupinar-alioren.fourteenth-cavalry: "Saat 13.30’da yolu kesen Türk 14. Süvari Tümeni"

# Turkish IV Corps, pressing from the east and south
emblems.dumlupinar-alioren.fourth-corps: "Doğudan ve güneyden bastıran Türk IV. Kolordusu"

# Turkish VI Corps, attacking from the north
emblems.dumlupinar-alioren.sixth-corps: "Kuzeyden saldıran Türk VI. Kolordusu"

# The IV Corps attacks
emblems.dumlupinar-alioren.fourth-corps-attack: "IV. Kolordu saldırır"

# The VI Corps attacks
emblems.dumlupinar-alioren.sixth-corps-attack: "VI. Kolordu saldırır"

# At 20.30 the survivors march west, leaving guns and wounded
emblems.dumlupinar-alioren.night-march-west: "Saat 20.30’da sağ kalanlar topları ve yaralıları bırakıp batıya yürür"

