    the Seine: "the river is on the base map"
    the Meuse: "the river is on the base map"
    the Yonne: "the river is on the base map, at the Montereau marker"
    Normandy: "shown by the english zone"
    Champagne: "shown by the english zone"
    Picardy: "shown by the burgundy zone"
    the Île-de-France: "shown by the english zone"
    Anjou: "in René of Anjou's name only"
