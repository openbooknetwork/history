    orleans-8-may: { name: Orléans, what: "the city that keeps each 8 May the procession ordered after the relief of 1429, with candles, to the Augustins and with a station wherever the fighting had been; the city accounts pay for it, and for a play at the bridge, in 1435; a procession a fortnight after the sentence of 1456; Bishop Dupanloup's panegyric of 8 May 1869 and the bishops' letter that asks for her canonisation; about 47.902 N 1.909 E. In the france colour", basis: sourced, rank: 1 }
