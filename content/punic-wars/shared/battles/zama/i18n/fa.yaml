# Battle of Zama
battle.name: "نبرد زاما"

# October 202 BC
battle.date: "اکتبر ۲۰۲ پیش از میلاد"

# Roman victory, Carthage sues for peace
battle.result: "پیروزی روم، کارتاژ درخواست صلح می‌کند"

