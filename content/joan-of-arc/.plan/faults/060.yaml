- id: "060-research-reviewer-8"
  severity: "wrong"
  file: "content/joan-of-arc/.plan/research/060.md"
  field: "060.24"
  replaces: "value"
  old: "- 060.24 Event: from Le Crotoy she is taken by boat at high tide to Saint-Valery, then, as is supposed, to Dieppe, and so to Rouen. single (France alone; by rules.md no claim rests on France alone, so the coast road is not told as fact; Lowell and Ramsay give only Le Crotoy to Rouen). \"Jeanne was taken out of Crotoy at high tide and conveyed by boat to Saint-Valery, then to Dieppe, as is supposed, and certainly in the end to Rouen.\" (archive.org-download-thelifeofjoanofa19488gut-19488.txt.txt, France vol. 2 ch. 10, scholarly)"
  new: "- 060.24 Event: from Le Crotoy she is taken by boat across the mouth of the Somme to Saint-Valery, then by Eu and Dieppe to Rouen, in the account of Père Ignace de Jésus-Maria's history of the counts of Ponthieu (1657), which Quicherat prints with the warning that Ignace is the only author to trace this road and is to be distrusted until originals confirm him; France follows Ignace, with Dieppe \"as is supposed\". single (Ignace, by Quicherat 5 and France; Lowell and Ramsay give only Le Crotoy to Rouen). \"descendit à Saint Valéry\" (archive.org-download-ProcesDeCondamnationV5-ProcesDeCondamnationV5-djvu.txt.txt, Quicherat 5, letters and acts, Le Crotoy to Rouen, November 1430, from Père Ignace, primary) \"à Dieppe, puis enfin à Rouen\" (archive.org-download-ProcesDeCondamnationV5-ProcesDeCondamnationV5-djvu.txt.txt, Quicherat 5, letters and acts, Le Crotoy to Rouen, November 1430, from Père Ignace, primary) \"Peut-être sera-t-il bon de se défier de son témoignage\" (archive.org-download-ProcesDeCondamnationV5-ProcesDeCondamnationV5-djvu.txt.txt, Quicherat 5, letters and acts, Le Crotoy to Rouen, Quicherat's introduction, scholarly) \"Jeanne was taken out of Crotoy at high tide and conveyed by boat to Saint-Valery, then to Dieppe, as is supposed, and certainly in the end to Rouen.\" (archive.org-download-thelifeofjoanofa19488gut-19488.txt.txt, France vol. 2 ch. 10, scholarly)"
  source: "Quicherat 5 (16797-16809): \"Le père Ignace de Jésus Maria (Jacques Samson) ... Il est le seul auteur qui parle d'une visite des dames d'Abbeville à la Pucelle, et qui trace l'itinéraire qu'on lui fit suivre lorsqu'on la transféra du Crotoy à Rouen. Peut-être sera-t-il bon de se défier de son témoignage jusqu'à ce qu'on ait retrouvé des originaux qui le confirment.\"; (16938-16951): \"descendit à Saint Valéry ... ses gardes la conduisirent à la ville d'Eu, et de là à Dieppe, puis enfin à Rouen\"; France's footnote 2125 cites \"Le P. Ignace de Jesus Maria, in Trial, vol. v, p. 363\""
  kind: "sources"
  claim: "060.24"
  introduced: "research"
  owner: "researcher"
  state: "fixed"
