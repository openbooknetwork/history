section:
  years: "May 1430 – May 1431"
  opens: >-
    On 23 May 1430 (the Duke of Burgundy's date; Monstrelet's is the 24th), in a sortie from Compiègne against the
    Burgundian post at Margny, she was pulled from her horse and gave her faith to the Bastard of Wandonne, a man of
    John of Luxembourg's company. The Duke of Burgundy and John of Luxembourg besiege Compiègne, which Guillaume de
    Flavy holds for Charles VII. The English hold Paris, Normandy and the land about Paris; Beauvais, Compiègne and the
    towns between the Oise and Paris that came over in 1429 are the king's, and Soissons has been sold to Burgundy.
    The reader has followed her from Domrémy to Orléans, Reims, Paris and Compiègne, and knows Pierre Cauchon as the
    Bishop of Beauvais driven out of his see in August 1429.
  introduces: [Beaulieu, Noyon, the Vermandois, Beaurevoir, Cambrai, the Demoiselle of Luxembourg, the Lady of Beaurevoir, Jeanne de Bar, Martin V, Drugy, Le Crotoy, Nicolas de Queuville, Haimond de Macy, the University of Paris, the Estates of Normandy, the castle of Rouen, Richard Beauchamp, Earl of Warwick, Canon Dunand, Jean Le Maistre, Jean Graverent, Coutances, Jean Beaupère, the chapel royal, the Robing Room, Saint Michael, Petit de Julleville, Jean d'Estivet, Thomas de Courcelles, Nicolas Midi, the great tower, Maugier Leparmentier, the cemetery of Saint-Ouen, Guillaume Erard, Jean Massieu, Nicolas Taquel, Martin Ladvenu, Isambart de La Pierre, Jean Toutmouillé, the Old Market, Saint-Sauveur, Laurent Guesdon, Guillaume Manchon]
  hands_on: >-
    On 30 May 1431 she is dead, burned at the Old Market of Rouen as a relapsed heretic, and her ashes are thrown into
    the Seine. The English hold Normandy, Paris and the land about it, and Le Crotoy; the Duke of Burgundy is still
    their ally and holds Picardy and Arras. Compiègne, relieved in October 1430, and Beauvais hold for Charles VII.
    Henry VI is king of France by the Treaty of Troyes and not yet crowned in France. Left unsettled: whether the
    alliance of England and Burgundy will hold, which section 070 opens with Henry VI's crowning in Paris in December
    1431 and the Congress of Arras in 1435, and the sentence of 1431, which the retrial of 1455–1456 takes up.
  left_out:
    - { event: "060.24, the road from Le Crotoy to Rouen by boat to Saint-Valery and by Eu and Dieppe", why: "only Père Ignace's history of 1657 traces it, and Quicherat, who prints it, warns against trusting it until originals confirm it; rules.md leaves the road out, and the map marks Le Crotoy and Rouen with no route between them." }
pages:
  beaulieu-and-beaurevoir:
    account: >-
      Taken at Compiègne by men of the Bastard of Wandonne, a follower of John of Luxembourg, Count of Ligny and lord
      of Beaurevoir, she was turned over to John of Luxembourg, whose prisoner she now was (Ramsay, Champion, Anatole
      France; 060.1). After three or four days at Clairoix (Lang), he sent her under strong escort to his castle of
      Beaulieu in the Vermandois, near Noyon, some twenty miles north-east of Compiègne by Lowell's reckoning (060.2).
      There, as she told her judges on 15 March 1431, she slipped out between two pieces of wood and would have shut
      her keepers in the tower had the porter not seen her (060.3). How long she stayed is disputed (060.4): Lowell says
      some weeks; Lang not more than a fortnight, with Beaurevoir from the beginning of June to the end of September;
      Ramsay, from a document of Quicherat's fifth volume, Beaurevoir from August to November, so Beaulieu all June and July; Champion
      has her at Beaurevoir in August. She herself said she was about four months in the tower of Beaurevoir. Beaurevoir,
      near Saint-Quentin in the Vermandois (Ramsay), was John of Luxembourg's principal castle, with high walls, great
      towers and a deep moat, and she was held in one of the towers (Lowell; 060.5). His aunt, the Demoiselle of
      Luxembourg, and his wife, the Lady of Beaurevoir, with her daughter Jeanne de Bar in Lang, offered her a woman's
      dress or cloth for one, and she answered that she had not God's leave and it was not yet time (060.6). By her own
      words in Lang the Demoiselle begged her nephew not to hand her to the English; Lowell and Champion hedge it (060.7).
      Meanwhile, on 14 July 1430, in the Duke of Burgundy's camp before Compiègne, Pierre Cauchon presented a summons
      in the king's name and his own to the Duke, John of Luxembourg and the Bastard of Wandonne to deliver her to him
      for trial (060.11); it offered up to 6,000 francs to her captors and a pension of 200 or 300 pounds to the Bastard, or,
      failing that, 10,000, as the king might pay for a captured king or prince (060.12). Lang has Cauchon paid 765
      livres tournois for journeys to Beaurevoir, Compiègne, Flanders and the Duke to the last day of September (060.17).
      Learning that the English were coming to take her, that she was sold to them, and that the people of Compiègne
      would all be killed when the town fell, she leapt from the tower against her voices, commending herself to God
      and Our Lady (her answers of 3 March 1431; 060.8, 060.9). She was picked up senseless and for two or three days
      could neither eat nor drink (Ramsay, Lowell); the Bourgeois of Paris heard she was not hurt at all. No source read
      gives the day. Lang reckons the tower about sixty feet high, an estimate he rests on no measurement (060.10). The map shows
      the English, Burgundian and French holdings of 1430, whose borders are approximate, and her road as a prisoner from
      Clairoix to Beaulieu and Beaurevoir, which joins the places since no source gives the road.
