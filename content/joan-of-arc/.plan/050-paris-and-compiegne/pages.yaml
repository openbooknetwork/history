- id: montepilloy
  title: "Montépilloy"
  date: "August 1429"
  when: "1429-08-14"
  tells: Turned back at Bray, where an Anglo-Burgundian force holds the crossing of the Seine, the king's army marches on Paris, and it and Bedford's face each other at Montépilloy near Senlis on 14 and 15 August and part without a battle; Compiègne, Senlis and Beauvais come over to Charles, and at Compiègne on 28 August he signs a truce with the Duke of Burgundy.
