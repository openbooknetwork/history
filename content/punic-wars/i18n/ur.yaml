routes.hamilcar-240.name: "ہملکار بگراداس کو زبردستی پار کرتا ہے اور باغیوں کو شکست دیتا ہے، 240 ق م"

# The army marches from Sicca and seizes Tunis, 241 BC
routes.rebels-241.name: "فوج سکا سے روانہ ہو کر تیونس پر قبضہ کر لیتی ہے، 241 ق م"

