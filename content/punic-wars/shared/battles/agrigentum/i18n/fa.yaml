# Roman Republic
battle.sides.0.name: "جمهوری روم"

# 40,000 to 100,000 soldiers and labourers
battle.sides.0.strength: "۴۰ تا ۱۰۰ هزار سرباز و کارگر"

# 15,000 to 30,540 dead
battle.sides.0.casualties: "۱۵ هزار تا ۳۰٬۵۴۰ کشته"

# Carthage
battle.sides.1.name: "کارتاژ"

# 31,500 to 56,000 men, 30 to 60 elephants, and the garrison
battle.sides.1.strength: "۳۱٬۵۰۰ تا ۵۶ هزار مرد، ۳۰ تا ۶۰ فیل، و پادگان شهر"

# 3,200 killed, 4,000 captured, 25,000 inhabitants enslaved
battle.sides.1.casualties: "۳٬۲۰۰ کشته، ۴ هزار اسیر، ۲۵ هزار ساکن شهر به بردگی فروخته‌شده"

# Battle of Agrigentum
battle.name: "نبرد آگریجنتوم"

# 262 – 261 BC
battle.date: "۲۶۲ تا ۲۶۱ پیش از میلاد"

# Roman victory, Agrigentum taken
battle.result: "پیروزی روم، تصرف آگریجنتوم"

