- id: jargeau
  title: "Jargeau"
  date: "11 to 12 June 1429"
  when: 1429-06-11
  tells: The army gathered at Selles under the Duke of Alençon marches up the Loire and storms Jargeau, and Suffolk is taken.
  markers: [selles-rendezvous, orleans-june-1429, jargeau]
