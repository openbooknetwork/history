  afterwards:
    account: >-
      What is recorded of how she was remembered, and no claim of what she means. After the relief of 1429 the bishop
      of Orléans, the Bastard of Orléans (later Count of Dunois) and the townsmen order a procession each 8 May, with
      candles, to the Augustins and with a station wherever the fighting had been; the city accounts pay for it in
      1435, and it is kept, almost without a break, to the twentieth century (070.45; the Orléans chronicle and the
      accounts in Quicherat, Lowell, and the bull of 1920). On 8 May 1435 the city pays two men for their scaffolds
      where they played "a certain mistère" at the bridge during the procession (070.46, Quicherat, single); a play of
      the siege of Orléans of some 25,000 lines by an unknown author survives in an early sixteenth-century manuscript
      of the Vatican, and the text does not say it was the play of 1435 (rules.md). A fortnight after the sentence of
      1456, by order of the court, a procession at Orléans is attended by two of the judges (070.47, Lowell). Aeneas
      Sylvius Piccolomini, later Pope Pius II, wrote of her as a maid inspired by the divine spirit, and Antoninus of
      Florence as led by the spirit of God; the bull of 1920 quotes both (070.48). In Shakespeare's day she was still
      held a witch in England, and by the early nineteenth century English writers, Southey, Hallam, Carlyle and De
      Quincey among them, honoured her (070.49, Thurston). After his panegyric at Orléans on 8 May 1869, Bishop Félix
      Dupanloup has the bishops present sign a letter asking the Holy See for her canonisation (Renoux, Thurston); the
      diocesan tribunal opens at Orléans in 1874 (Renoux) (070.51). Leo XIII signs the decree introducing the cause on
      27 January 1894, and she is called Venerable; Pius X declares her virtues heroic on 6 January 1904 (070.52). The
      brief of beatification is published on 11 April 1909, and Pius X beatifies her in St Peter's on 18 April 1909
      (070.53). Benedict XV canonises her in St Peter's on 16 May 1920; the bull Divina disponente bears that date
      (070.54). The map marks Orléans alone and takes no zone; Rome lies outside the story's map, and the
      canonisation stands in the text.
