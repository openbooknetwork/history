    - {side: taborites, type: wagon-fort, at: [13.9648, 50.6598], width: 900, depth: 540, facing: 0, id: wagon-fort, name: 'Wagon fort of the Hussite unions on Běhání hill: about 500 wagons by the chronicles, drawn as 40, chained wheel to wheel. Sigismund Korybut, Prokop the Great and Jan Roháč of Dubá command about 11,000 by Čornej and Bělina, 24,000 to 25,000 by the chronicles. The hill was dug away by a coal mine in 1977–1997.', count: 40}
    - {side: taborites, type: wagons, at: [13.9648, 50.66052], width: 420, depth: 70, facing: 0, id: second-line, name: Second line of wagons behind the north side. With some 500 wagons the Hussites can set two lines one behind the other (Čornej and Bělina)., count: 9}
