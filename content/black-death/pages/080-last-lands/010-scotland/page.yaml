sources:
  - "Henry Knighton, Chronicon (about 1390), ed. J. R. Lumby, Chronicon Henrici Knighton, vol. 2 (1895), pp. 62–63, on the Scots at Selkirk."
  - "Henry Knighton, Chronicon (about 1390), in Rosemary Horrox, The Black Death (1994)."
  - "John of Fordun, Chronica gentis Scotorum (about 1385), tr. F. J. H. Skene, ed. W. F. Skene, John of Fordun’s Chronicle of the Scottish Nation (1872), pp. 358–59, and the editor’s introduction, pp. lxxiii–lxxiv."
  - "Charles Creighton, A History of Epidemics in Britain, vol. 1 (1891), p. 119, on Selkirk in the autumn of 1349 and Scotland in 1350."
  - "Francis Aidan Gasquet, The Black Death of 1348 and 1349, 2nd ed. (1908), pp. 185–86, on the Scots carrying the plague home."
  - "Adam Izdebski and others, “Palaeoecological data indicates land-use changes across Europe linked to spatial heterogeneity in mortality during the Black Death pandemic”, Nature Ecology & Evolution 6 (2022), on the slight Scottish evidence."
  - "Philip Ziegler, The Black Death (2003), p. 182, on the north of England in summer 1349, as Wikipedia cites it."
  - "Mark Ormrod, “England: Edward II and Edward III”, in The New Cambridge Medieval History, vol. 6 (2000), pp. 276–77, on Neville’s Cross, as Wikipedia cites it."
  - "Josiah Cox Russell, British Medieval Population (1948), pp. 220–23, on bishops’ registers, as Wikipedia cites it."
  - "Philip Slavin, “Plague Strikes Back: The Pestis Secunda of 1361–62 and Its Demographic Consequences in England and Wales”, Journal of Medieval and Early Modern Studies 54 (2024), on court rolls and registers."
