battle.sides.1.strength: "Yaklaşık 75.000, çarpışmaya girenler 47.000’den az, Schierling’de 16.000"

# 11,000 at Eckmühl, 5,000 of them captured, and 3,000 at Schierling
battle.sides.1.casualties: "Eckmühl’de 11.000, bunların 5.000’i esir, Schierling’de 3.000"

# Battle of Eckmühl
