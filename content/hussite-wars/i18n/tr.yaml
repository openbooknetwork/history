# March – 7 June 1424
pages.malesov.date: "Mart – 7 Haziran 1424"

# The chase across Bohemia
pages.malesov.title: "Bohemya boyunca kovalamaca"

# The brook in the narrow valley south of Malešov, the Bohynka of Hugo Toman’s map of 1898. Traced from the elevation of today
emblems.malesov-ground.brook: "Malešov’un güneyindeki dar vadide akan dere, Hugo Toman’ın 1898 haritasındaki Bohynka. Bugünkü yükseltiden çizilmiştir"

# Battle wagons in a line, 300 in May by Bartošek of Drahonice. They stand ready to roll forward with the foot, and handguns fire from them
emblems.malesov-ground.wagons: "Bir sıra halinde savaş arabaları, Drahoniceli Bartošek’e göre Mayıs’ta 300. Yayalarla birlikte ileri yuvarlanmaya hazır dururlar, el topçuları da onların içinden ateş eder"

# Žižka’s field guns and howitzers between the wagons
emblems.malesov-ground.guns: "Arabaların arasında Žižka’nın sahra topları ve houfniceleri"

# Hay wagons loaded with stones in the centre of the line, hidden from the enemy, by the younger Old Czech Annals
emblems.malesov-ground.stone-wagons: "Genç Eski Çek Yıllıkları’na göre hattın ortasında, düşmandan gizlenmiş taş yüklü saman arabaları"

# Orebite and Taborite foot with flails, halberds, spears and handguns, 7,000 in May by Bartošek of Drahonice
emblems.malesov-ground.foot: "Savaş dövenleri, teberler, mızraklar ve el toplarıyla Orebçi ve Táborcu yayalar, Drahoniceli Bartošek’e göre Mayıs’ta 7.000"

# Žižka’s horse, 500 by Bartošek, held back on the wings
emblems.malesov-ground.horse: "Žižka’nın kanatlarda geride tutulan atlıları, Bartošek’e göre 500"

# The head of the column: Prague men at arms and the lords’ horse, crossing the brook
emblems.malesov-ground.prague-head: "Kolun başı: dereyi geçen Prag zırhlıları ve soyluların atlıları"

# The army of Prague and the lords: Prague militia, Utraquist lords and Catholic men of the Landfried of Plzeň under Diviš Bořek of Miletínek. Larger than Žižka’s army by every account, numbers unknown
emblems.malesov-ground.prague-column: "Prag ve soylular ordusu: Miletínekli Diviš Bořek komutasında Prag milisleri, Utrakist soylular ve Plzeň Landfried’inin Katolik askerleri. Bütün anlatılara göre Žižka’nın ordusundan büyük, sayısı bilinmiyor"

# The rear of the column, still coming down past the fortress
emblems.malesov-ground.prague-rear: "Kolun arkası, kalenin önünden hâlâ aşağı inmekte"

# The wagons and guns of Prague at the rear of the column
emblems.malesov-ground.prague-wagons: "Kolun arkasında Prag’ın arabaları ve topları"

# The fortress of Malešov, 6 km south-west of Kutná Hora
emblems.malesov-ground.fortress: "Kutná Hora’nın 6 km güneybatısındaki Malešov kalesi"

# The army of Prague and the lords follows Žižka’s track past the fortress and down into the valley. By the Old Czech Annals they do not wait for all their men to come up
emblems.malesov-ground.prague-march: "Prag ve soylular ordusu Žižka’nın izinden kalenin önünden geçerek vadiye iner. Eski Çek Yıllıkları’na göre bütün adamlarının yetişmesini beklemezler"

# 7 June 1424
pages.malesov-ground.date: "7 Haziran 1424"

# Žižka turns at Malešov
pages.malesov-ground.title: "Žižka Malešov’da döner"

# The brook in the narrow valley south of Malešov, the Bohynka of Hugo Toman’s map of 1898. Traced from the elevation of today
emblems.malesov-wagons.brook: "Malešov’un güneyindeki dar vadide akan dere, Hugo Toman’ın 1898 haritasındaki Bohynka. Bugünkü yükseltiden çizilmiştir"

# Battle wagons in a line, 300 in May by Bartošek of Drahonice. They stand ready to roll forward with the foot, and handguns fire from them
emblems.malesov-wagons.wagons: "Bir sıra halinde savaş arabaları, Drahoniceli Bartošek’e göre Mayıs’ta 300. Yayalarla birlikte ileri yuvarlanmaya hazır dururlar, el topçuları da onların içinden ateş eder"

# Žižka’s field guns and howitzers between the wagons
emblems.malesov-wagons.guns: "Arabaların arasında Žižka’nın sahra topları ve houfniceleri"

# Orebite and Taborite foot with flails, halberds, spears and handguns, 7,000 in May by Bartošek of Drahonice
emblems.malesov-wagons.foot: "Savaş dövenleri, teberler, mızraklar ve el toplarıyla Orebçi ve Táborcu yayalar, Drahoniceli Bartošek’e göre Mayıs’ta 7.000"

# Žižka’s horse, 500 by Bartošek, held back on the wings
emblems.malesov-wagons.horse: "Žižka’nın kanatlarda geride tutulan atlıları, Bartošek’e göre 500"

# Half of the Prague army, across the brook and climbing towards the wagons
emblems.malesov-wagons.prague-head: "Dereyi geçmiş ve arabalara doğru tırmanan Prag ordusunun yarısı"

# The other half of the column, still in the valley and on the road from the fortress
emblems.malesov-wagons.prague-column: "Kolun öbür yarısı, hâlâ vadide ve kaleden gelen yolda"

# The wagons and guns of Prague at the rear of the column
emblems.malesov-wagons.prague-wagons: "Kolun arkasında Prag’ın arabaları ve topları"

# The fortress of Malešov, 6 km south-west of Kutná Hora
emblems.malesov-wagons.fortress: "Kutná Hora’nın 6 km güneybatısındaki Malešov kalesi"

# Hay wagons loaded with stones run down the slope into the head of the column and break its ranks, by the younger Old Czech Annals. Men on foot cannot stand against them, and the narrow valley leaves no room to step aside
emblems.malesov-wagons.stone-wagons: "Genç Eski Çek Yıllıkları’na göre taş yüklü saman arabaları yamaçtan aşağı kolun başına dalar ve saflarını dağıtır. Yayalar onlara karşı duramaz, dar vadi de kenara çekilecek yer bırakmaz"

# The guns fire into the confusion
emblems.malesov-wagons.gunfire: "Toplar karmaşanın içine ateş eder"

# 7 June 1424
pages.malesov-wagons.date: "7 Haziran 1424"

# The wagons of stones
pages.malesov-wagons.title: "Taş arabaları"

# The brook in the narrow valley south of Malešov, the Bohynka of Hugo Toman’s map of 1898. Traced from the elevation of today
emblems.malesov-rout.brook: "Malešov’un güneyindeki dar vadide akan dere, Hugo Toman’ın 1898 haritasındaki Bohynka. Bugünkü yükseltiden çizilmiştir"

# The battle wagons roll forward with the foot
emblems.malesov-rout.wagons: "Savaş arabaları yayalarla birlikte ileri yuvarlanır"

# Žižka’s foot at the bottom of the slope after the charge
emblems.malesov-rout.foot: "Hücumdan sonra yamacın eteğindeki Žižka yayaları"

# Žižka’s horse, released from the wings, ride after the fleeing army
emblems.malesov-rout.horse: "Kanatlardan salıverilen Žižka’nın atlıları kaçan ordunun ardına düşer"

# The wagons and guns of Prague, left on the field and taken by Žižka
emblems.malesov-rout.prague-wagons: "Savaş alanında bırakılan ve Žižka’nın aldığı Prag arabaları ve topları"

# The fortress of Malešov, 6 km south-west of Kutná Hora
emblems.malesov-rout.fortress: "Kutná Hora’nın 6 km güneybatısındaki Malešov kalesi"

# Žižka’s foot charge down the slope behind the wagons
emblems.malesov-rout.charge: "Žižka’nın yayaları arabaların ardından yamaçtan aşağı hücum eder"

# The head of the column flees back across the brook and up the valley past the fortress, and the rear flees with it
emblems.malesov-rout.flight: "Kolun başı dereyi geri geçerek vadi boyunca kalenin önünden kaçar, ordunun arkası da onunla birlikte kaçar"

# The horse ride down from the wings after the fugitives
emblems.malesov-rout.pursuit: "Atlılar kanatlardan inip kaçanların ardına düşer"

