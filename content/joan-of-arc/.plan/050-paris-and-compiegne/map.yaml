saint-pierre-and-la-charite:
  bbox: [1.9, 46.45, 3.65, 47.55]
  zones: [france-1422, english-sep-1429, burgundy-1420, brittany-1407]
  routes:
    - id: france-1429-saint-pierre
      family: france
      stations: [Bourges, Saint-Pierre-le-Moûtier]
      passage: "Murray, deposition of Jean d'Aulon, p. 318, lines 15863-15896; Lowell, Joan of Arc, ch. 14, p. 185, line 8148"
      basis: reconstruction
      why: "d'Aulon has her assemble her forces at Bourges and go to besiege Saint-Pierre-le-Moûtier; Lowell has her leave Bourges toward the end of October with Albret (050.35). Only the two ends are given."
    - id: france-1429-la-charite
      family: france
      stations: [Saint-Pierre-le-Moûtier, Moulins, La Charité]
      passage: "Joan's letter to Riom and Albret's letter to Riom, Moulins, 9 November 1429, Quicherat 5, lines 7536-7620; Lowell, Joan of Arc, ch. 14, p. 190, line 8345"
      basis: reconstruction
      why: "Joan and Albret write from Moulins on 9 November that Saint-Pierre is taken and that they are going to lay siege to La Charité, and Lowell has the army sit down before it about 10 November (050.37, 050.38, 050.39). The towns are given and the roads are not."
  markers:
    mehun-1429: { name: Mehun-sur-Yèvre, what: "where the council resolves to take La Charité, and Saint-Pierre-le-Moûtier first, and where in December 1429 (on 29 December, Thurston) Charles VII ennobles Joan and her family; about 47.15 N 2.21 E. In the france colour", basis: sourced }
    bourges-1429: { name: Bourges, what: "where Joan stays about three weeks in October 1429 in the house of Marguerite La Touroulde and gathers her force; the town is asked for 1,300 crowns for the siege of La Charité on 24 November; about 47.08 N 2.40 E. In the france colour", basis: sourced }
    saint-pierre-le-moutier: { name: Saint-Pierre-le-Moûtier, what: "Burgundian since 1422 (Lowell), taken by assault by 9 November 1429 after a first assault had failed; Joan stops the soldiers pillaging the church; about 46.80 N 3.12 E. In the france colour once taken", basis: sourced }
    moulins-1429: { name: Moulins, what: "where Joan and Albret write on 9 November 1429 to Riom for powder, saltpetre, sulphur, arrows and crossbows for the siege of La Charité; about 46.57 N 3.33 E. In the france colour", basis: sourced }
    la-charite: { name: La Charité, what: "Perrinet Gressart's town on the Loire, held for Burgundy since 1423; besieged from about 10 November 1429 for about a month, an assault fails and the siege is raised with the loss of artillery; it stays Gressart's; about 47.18 N 3.02 E. In the burgundy colour", basis: sourced }
    cosne-1429: { name: Cosne, what: "a town on the Loire held against the king in autumn 1429, named with La Charité in Albret's letter of 9 November; about 47.41 N 2.93 E. In the burgundy colour", basis: sourced }
  unmarked:
    Clermont-Ferrand: "the town that sent saltpetre, sulphur and arrows on 7 November; outside the frame, to the south."
    Riom: "the town Joan and Albret wrote to on 9 November; outside the frame, to the south."
    Jargeau: "where Beaucourt finds her on Christmas Day; outside the frame and the page's event."
    Selles: "whence Lowell has her sent on to Bourges; marked in 040."
    Dauphiné: "the country of Raymon de Montremur, killed in the assault on La Charité; outside the frame."
    the Allier: "the river of the frontier towns, drawn on the base map; Moulins and Saint-Pierre are marked near it."
    the Loire: "the river is drawn on the base map; La Charité and Cosne on it are marked."
    Berry: "a region, named for Albret's office; the france zone shows it."
    Burgundy: "named for the duchy's western frontier and the Duke's service; the burgundy zone shows his land."
melun-and-lagny:
  bbox: [2.0, 47.6, 3.1, 49.0]
  zones: [france-1422, english-sep-1429, burgundy-1420, brittany-1407]
  routes:
    - id: joan-1430-lagny
      family: joan
      stations: [Sully, Melun, Lagny]
      passage: "Cagny, Chroniques, 1430, p. 173, lines 8230-8248; Lowell, Joan of Arc, ch. 15, pp. 200-202, lines 8750-8862"
      basis: reconstruction
      why: "Cagny has her leave the king at Sully without his leave and go to Lagny, whose men made good war on the English of Paris; her own answer of 10 March 1431 puts her in the trenches at Melun in Easter week, and Lowell has her ride on from Melun to cross the Marne at Lagny (050.44, 050.46, 050.47). The towns are given and the roads are not. Whether she was at Melun before it rose is not known (Lowell), and the text says so."
  markers:
    sully-1430: { name: Sully, what: "the court is here at the end of March 1430, when Joan leaves it with her small household without the king's leave; about 47.77 N 2.38 E. In the france colour", basis: sourced }
    melun-1430: { name: Melun, what: "held by the English and then the Burgundians since Henry V took it, it drives out its garrison about Easter 1430 and comes over to the king; in its trenches in Easter week her voices tell her she will be taken before Saint John's Day; about 48.54 N 2.66 E. In the france colour", basis: sourced }
    lagny-1430: { name: Lagny, what: "the king's town on the Marne whose garrison makes war on the English of Paris; from it Joan defeats and takes Franquet d'Arras, and he is tried and beheaded there, April or May 1430; about 48.87 N 2.71 E. In the france colour", basis: sourced }
  unmarked:
    the place of the fight with Franquet: "near Lagny; no source read places it."
    Paris: "the English city Lagny's garrison raided; inside the english zone at the frame's north edge, marked on paris."
    Senlis: "whose bailli judged Franquet; outside the frame, marked on montepilloy."
    the Seine: "the river is drawn on the base map; Melun on it is marked."
    the Marne: "the river is drawn on the base map; Lagny on it is marked."
    Arras: "named only in the name of Franquet d'Arras; no place."
    the Oise: "where the Duke of Burgundy took the field; outside the frame, and the river is drawn on the base map."
    Burgundy: "named for the truce and the Burgundian party; the burgundy zone shows the Duke's land."
compiegne:
  bbox: [2.65, 49.18, 3.4, 49.52]
  zones: [france-1422, english-sep-1429, burgundy-1420, brittany-1407]
  routes:
    - id: joan-1430-compiegne
