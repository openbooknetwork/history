# Crusade army of the Empire and the papal legate
battle.sides.0.name: "İmparatorluğun ve papalık elçisinin haçlı ordusu"

# 130,000 by the Old Czech Annals, 40,350 horse, 90,000 foot and 9,000 wagons by Bartošek of Drahonice
battle.sides.0.strength: "Eski Çek Yıllıkları’na göre 130.000, Drahoniceli Bartošek’e göre 40.350 atlı, 90.000 yaya ve 9.000 araba"

# Over 200 killed, most of them Cesarini’s Italians, about 2,000 wagons and 300 guns lost
battle.sides.0.casualties: "Çoğu Cesarini’nin İtalyanları olmak üzere 200’den fazla ölü, yaklaşık 2.000 araba ve 300 top kaybı"

# Hussite unions: Taborites, Orphans, Praguers and the Hussite towns
battle.sides.1.name: "Husçu birlikleri: Táborcular, Yetimler, Praglılar ve Husçu kentler"

# 40,000 by the Old Czech Annals, 55,000 with 3,000 wagons by Bartošek of Drahonice
battle.sides.1.strength: "Eski Çek Yıllıkları’na göre 40.000, Drahoniceli Bartošek’e göre 3.000 arabayla 55.000"

# Unknown
battle.sides.1.casualties: "Bilinmiyor"

# Battle of Domažlice
battle.name: "Domažlice Muharebesi"

# 14 August 1431
battle.date: "14 Ağustos 1431"

# Hussite victory: the crusaders flee before the battle
battle.result: "Husçu zaferi: haçlılar savaştan önce kaçar"

