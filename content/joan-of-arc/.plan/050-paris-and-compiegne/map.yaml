      stations: [Clairoix, Margny]
      passage: "Chastellain, Quicherat 4, pp. 445-447, lines 17341-17413; Monstrelet, book 2 ch. 86, lines 40269-40278"
      basis: reconstruction
      why: "John of Luxembourg rode over from Clairoix with Créqui and a few gentlemen and called up his men against the sortie (050.59). Only the two ends are given."
    - id: english-1430-venette
      family: english
      stations: [Venette, the end of the bridge of Compiègne]
      passage: "Monstrelet, book 2 ch. 86, lines 40269-40278; Barrett, the examination in prison of 10 March 1431, lines 2200-2205"
      basis: reconstruction
      why: "The English from Venette, near 500 in Monstrelet, came between her and the bridge and cut off her road (050.59, 050.61). Only the start and the place they made for are given."
  markers:
    choisy-1430: { name: Choisy, what: "the king's castle on the Oise, held by Louis de Flavy for his brother; Philip the Good takes it in May 1430, razes it and bridges the Oise to come at Compiègne; about 49.44 N 2.88 E. In the burgundy colour", basis: sourced, rank: 1 }
    soissons-1430: { name: Soissons, what: "held for the king by a captain bought by Burgundy, it shuts its gates on the army of Joan, the archbishop and Vendôme in May 1430 (18 May, Lang), and is sold to Burgundy weeks later; about 49.38 N 3.32 E. In the burgundy colour", basis: sourced }
