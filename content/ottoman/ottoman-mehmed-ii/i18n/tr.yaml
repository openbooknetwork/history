emblems.belgrade-river.rumelians: "Rumeli beylerbeyi Karaca Paşa’nın emrindeki Rumeli askerleri, Tuna’ya doğru sağ kanat"

# The batteries of the Rumelian troops, who have most of the 300 guns, 22 of them large
emblems.belgrade-river.guns-rumelia: "Rumeli askerlerinin bataryaları. 300 topun, 22’si büyük olmak üzere çoğu onlardadır"

# Guns before the centre
emblems.belgrade-river.guns-centre: "Merkezin önündeki toplar"

# The sipahis, the horsemen who hold fiefs, guard the ground from the Danube eastwards so that no army can come round the right wing
emblems.belgrade-river.sipahis: "Tımarlı sipahiler, hiçbir ordunun sağ kanadı dolaşamaması için Tuna’dan doğuya uzanan araziyi korur"

# Ottoman boats on the Sava, which guard the left wing of the army
emblems.belgrade-river.sava-ships: "Ordunun sol kanadını koruyan, Sava’daki Osmanlı tekneleri"

# The Ottoman river fleet, broken after five hours: three large galleys sunk, four large boats and twenty smaller ones taken
emblems.belgrade-river.fleet: "Beş saat sonra dağılan Osmanlı nehir donanması: üç büyük kadırga batar, dört büyük ve yirmi küçük tekne ele geçirilir"

# Hunyadi’s boats, about 200, only one of them a galley, with his troops and food for the fortress
emblems.belgrade-river.hunyadi-boats: "Hunyadi’nin, yalnızca biri kadırga olan 200 kadar teknesi, askerleri ve kale için erzakla"

# About 40 boats from the city sail out against the Ottoman fleet
emblems.belgrade-river.city-boats: "Şehirden çıkan 40 kadar tekne Osmanlı donanmasına saldırır"

# The inner castle with the palace of the despots
emblems.belgrade-river.castle: "Despotların sarayının bulunduğu iç kale"

# Michael Szilágyi with the garrison, 5,000 to 7,000 men: Hungarian, Czech and Polish mercenaries hired by Hunyadi, and the townspeople
emblems.belgrade-river.garrison: "Mihály Szilágyi ve garnizon, 5.000 ile 7.000 kişi: Hunyadi’nin tuttuğu Macar, Çek ve Polonyalı paralı askerler ve şehir halkı"

# Capistrano’s crusaders on the Syrmian bank at Zemun: peasants, townsmen, students and friars, many armed with clubs, flails and slings
emblems.belgrade-river.crusaders: "Capistrano’nun haçlıları, Zemun’da, Srem kıyısında: köylüler, kasabalılar, öğrenciler ve keşişler, çoğunun elinde sopa, harman döveni ve sapan"

# Hunyadi’s boats come down the Danube
emblems.belgrade-river.hunyadi-down: "Hunyadi’nin tekneleri Tuna’dan aşağı iner"

# Boats from the city attack the Ottoman fleet from below
emblems.belgrade-river.city-out: "Şehirden çıkan tekneler Osmanlı donanmasına aşağıdan saldırır"

# Hunyadi breaks through and brings his troops and food into the fortress
emblems.belgrade-river.hunyadi-in: "Hunyadi yarıp geçer ve askerlerini ve erzakı kaleye sokar"

