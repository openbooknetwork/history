name: "Battle of the Hydaspes"
date: "April–May 326 BC (Arrian); about July 326 BC by Diodorus's dating"
result: "Macedonian victory; Porus wounded, taken and confirmed as king with more land. The site is disputed; the map follows Stein's ground"
source: https://en.wikipedia.org/wiki/Battle_of_the_Hydaspes
images: [le-brun-alexander-porus-5fc99c, porus-medallion-cng-08694a]
default_language: en
families:
