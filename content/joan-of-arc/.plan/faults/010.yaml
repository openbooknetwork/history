  field: "010.57"
  replaces: "value"
  old: "010.57 Border: the divided kingdom of the 1420s, as Lowell gives it for 1428: Normandy, Paris and the land about it, Perche, Alençon, most of Maine and Champagne English; Picardy, Flanders and the two Burgundies Philip's; Brittany its own prince's; Charles VII acknowledged south of the Loire between the Garonne and the Rhône and in Dauphiné; Bordeaux and much of Guyenne English. Bedford governs Normandy, Paris and the north (Lang). By provinces, with no line. agreed. \"Paris  and  the  country  about  it,  Perche, Alengon,  most  of  Maine  and  Champagne,  were in  the  hands  of  the  English\" (archive.org-download-joanofarc00lowe-joanofarc00lowe-djvu.txt.txt, Lowell ch. 1, l. 655, scholarly) \"The  remainder  of  France,  the  country  south  of  the Loire  between  the  Garonne  and  the  Rhone,  together  with Dauphiny,  acknowledged  Charles  VII\" (archive.org-download-joanofarc00lowe-joanofarc00lowe-djvu.txt.txt, Lowell ch. 1, l. 690, scholarly) \"he  governed  Normandy,  Paris,  and  the north\" (archive.org-download-maidoffrancebein00languoft-maidoffrancebein00languoft-djvu.txt.txt, Lang ch. 1, l. 1421, scholarly)"
  new: "010.57 Border: the divided kingdom of the 1420s, as Lowell gives it for 1428: Normandy, Paris and the land about it, Perche, Alençon, most of Maine and Champagne English; Picardy, Flanders and the two Burgundies Philip's; Brittany its own prince's; Charles VII acknowledged south of the Loire between the Garonne and the Rhône and in Dauphiné; Bordeaux and much of Guyenne English. Bedford governs Normandy, Paris and the north (Lang). By provinces, with no line. agreed for Bedford's north and Charles VII's south of the Loire (Lang here and at 010.6); single (Lowell) for the list of provinces. \"Paris  and  the  country  about  it,  Perche, Alengon,  most  of  Maine  and  Champagne,  were in  the  hands  of  the  English\" (archive.org-download-joanofarc00lowe-joanofarc00lowe-djvu.txt.txt, Lowell ch. 1, l. 655, scholarly) \"The  remainder  of  France,  the  country  south  of  the Loire  between  the  Garonne  and  the  Rhone,  together  with Dauphiny,  acknowledged  Charles  VII\" (archive.org-download-joanofarc00lowe-joanofarc00lowe-djvu.txt.txt, Lowell ch. 1, l. 690, scholarly) \"he  governed  Normandy,  Paris,  and  the north\" (archive.org-download-maidoffrancebein00languoft-maidoffrancebein00languoft-djvu.txt.txt, Lang ch. 1, l. 1421, scholarly)"
