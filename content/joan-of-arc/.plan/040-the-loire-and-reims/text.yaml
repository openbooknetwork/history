  reims:
    account: >-
      Châlons opened to the king: its bishop and burgesses came out to him and gave him full obedience, Monstrelet has
      deputies bring him the keys, and Cagny has him received there on Thursday 14 July. The king lodged at the
      archbishop's castle of Sept-Saulx, four leagues from Reims; the Anglo-Burgundian captains, the lords of Châtillon
      and Saveuses, left the city, the burgesses came to Sept-Saulx with the keys, and the king entered Reims after dinner
      on Saturday 16 July (Cagny; the letter three Angevin gentlemen wrote at Reims on the 17th). On Sunday 17 July Charles
      VII was anointed and crowned in the cathedral by Regnault de Chartres, Archbishop of Reims; the service lasted from
      nine to two, the Angevin gentlemen wrote. The Holy Ampulla was brought from the abbey of Saint-Remi by its abbot,
      escorted by Marshal de Boussac, Rais, Graville and the admiral de Culant with their four banners, armed and mounted,
      who rode into the cathedral. Alençon knighted the king and stood for the absent Duke of Burgundy; Clermont, Vendôme,
      Laval and La Trémoille stood for the other lay peers, and for the peers of the Church the Archbishop of Reims and the
      bishop of Châlons were there, with the bishops of Sées and Orléans in place of the others. Through the rite Joan
      stood beside the king holding her standard (the Angevin letter). Asked by her judges in 1431 why her standard was
      borne into the church at Reims rather than the other captains', she answered that it had been in the perils and that
      was reason enough for it to be honoured. The Journal of the Siege has her kneel weeping after the anointing and say
      that God's will was done, who wished her to raise the siege of Orléans and bring the king to Reims; Lowell says
      whether she said it cannot be known, and the text says so. Her father and her cousin Laxart came to Reims, and the
      town paid her father's lodging (Lowell, from the documents). On the day of the coronation she wrote to Philip the
      Good bidding him make peace with the king, and he did not answer. His envoys came to the king at Reims, on the 16th
      in Ramsay's note after Beaucourt and as the consecration ended in Lowell, and by Ramsay they got La Trémoille to sign
      a truce of fifteen days, and Joan was told the duke would give up Paris at its end. Bedford's own memorandum, of
      December 1433 as Lang dates it, lists Reims, Troyes and Châlons among the cities that went over without resistance.
      The map shows the road from Troyes by Châlons and Sept-Saulx to Reims, a reconstruction from the towns named, and
      the English zone with southern and central Champagne gone, a reconstruction drawn round the towns that opened.
