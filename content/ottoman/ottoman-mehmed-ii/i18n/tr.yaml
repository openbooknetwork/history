# The arm of the Danube between Zemun and the Great War Island
emblems.belgrade-river.zemun-arm: "Tuna’nın Zemun ile Büyük Savaş Adası arasındaki kolu"

# The Sava, which flows into the Danube below the fortress
emblems.belgrade-river.sava: "Kalenin altında Tuna’ya karışan Sava"

