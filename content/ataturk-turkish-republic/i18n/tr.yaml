pages.afyon-gap.title: "Büyük Taarruz: iki Yunan grubu"

# The railway from Afyon to Dumlupınar and İzmir, the Greek supply line
emblems.afyon-gap.railway: "Afyon’dan Dumlupınar’a ve İzmir’e demiryolu, Yunan ikmal hattı"

# Trikoupis group: most of the Greek I and II Corps, the night at Olucak
emblems.afyon-gap.trikoupis-group: "Trikupis grubu: Yunan I. ve II. Kolordu’nun çoğu, gece Olucak’ta"

# Frangou group: the Greek 1st and 7th Divisions at Dumlupınar
emblems.afyon-gap.frangou-group: "Frangu grubu: Dumlupınar’da Yunan 1. ve 7. Tümenleri"

# Turkish First Army, following
emblems.afyon-gap.first-army: "Türk Birinci Ordusu, izliyor"

# Turkish 2nd Cavalry Division, mauled by the Greek 9th Division
emblems.afyon-gap.second-cavalry: "Yunan 9. Tümeni’nin ağır kayıp verdirdiği Türk 2. Süvari Tümeni"

# Frangou takes his group west in the night of 27 to 28 August
emblems.afyon-gap.frangou-march: "Frangu grubunu 27’yi 28 Ağustos’a bağlayan gece batıya götürür"

# Trikoupis starts west at 5.00 on 28 August
emblems.afyon-gap.trikoupis-march: "Trikupis 28 Ağustos saat 5.00’te batıya yola çıkar"

# Turkish units follow into the gap between the two groups
emblems.afyon-gap.into-the-gap: "Türk birlikleri iki grup arasındaki boşluğa girer"

# 29 August 1922
pages.afyon-ring.date: "29 Ağustos 1922"

# Great Offensive: the ring around Trikoupis
pages.afyon-ring.title: "Büyük Taarruz: Trikupis’in çevresinde çember"

# The railway from Afyon to Dumlupınar and İzmir, the Greek supply line
emblems.afyon-ring.railway: "Afyon’dan Dumlupınar’a ve İzmir’e demiryolu, Yunan ikmal hattı"

# Trikoupis group, surrounded
emblems.afyon-ring.trikoupis-group: "Kuşatılmış Trikupis grubu"

# Frangou group at Dumlupınar
emblems.afyon-ring.frangou-group: "Dumlupınar’daki Frangu grubu"

# Turkish VI Corps of the Second Army, to the north
emblems.afyon-ring.sixth-corps: "İkinci Ordu’nun VI. Kolordusu, kuzeyde"

# Turkish IV Corps, to the south
emblems.afyon-ring.fourth-corps: "Türk IV. Kolordusu, güneyde"

# V Cavalry Corps, between the two Greek groups
emblems.afyon-ring.fifth-cavalry: "İki Yunan grubu arasında V. Süvari Kolordusu"

# Turkish I Corps, before Dumlupınar
emblems.afyon-ring.first-corps: "Dumlupınar önünde Türk I. Kolordusu"

# The Greek 9th Division tries to open the road to Dumlupınar
emblems.afyon-ring.ninth-division: "Yunan 9. Tümeni Dumlupınar yolunu açmaya çalışır"

# The Turks attack the Greek 12th Division on the eastern flank
emblems.afyon-ring.east-attack: "Türkler doğu kanadındaki Yunan 12. Tümeni’ne saldırır"

# At 23.00 the group breaks away towards Çalköy
emblems.afyon-ring.night-march: "Saat 23.00’te grup çarpışmayı keser ve Çalköy’e yürür"

# 30 August 1922
