  sold-to-the-english:
    account: >-
      The Estates of Normandy, met at Rouen in August 1430, granted Henry VI 120,000 livres tournois, of which ten
      thousand were for the purchase of Joan, "who is said to be a witch"; the tax was assessed early in September and
      collected through the autumn (the levy letter of the record, which Ramsay, Lowell and Lang follow; 060.15). The
      price was ten thousand (060.13). Who sold her is disputed (060.14): John of Luxembourg, whose prisoner she was,
      in Lowell, Lang, Champion and Thurston, for ten thousand livres tournois, the sum the levy and the king's receipt
      name; Ramsay has the bargain struck with the Duke of Burgundy, Philip the Good, who wanted the ransom for his
      followers, for ten thousand francs, the coin of the summons of 14 July. The record has the Duke and John of
      Luxembourg together surrender her to the king. In the latter part of October the Burgundians took her from
      Beaurevoir to Arras, in Burgundian land, where, as it seems, the Duke held his court (Lowell), and where Jean de
      Pressy and others asked her to put on a woman's dress. From there she passed a night at the castle of Drugy (Lang)
      and came to Le Crotoy at the mouth of the Somme, a fortress English since it opened its gates on 3 March 1424
      (Ramsay; 060.18, 060.19). At Le Crotoy, or somewhere between it and Arras (Lowell), the English took their
      prisoner and paid: in November in Lang, and a receipt of 6 December 1430 speaks of the ten thousand livres
      tournois the king paid to have her, "prisoner of war" (060.16). At Le Crotoy she confessed to Nicolas de Queuville,
      chancellor of the church of Amiens, a prisoner there, and heard his Masses (Haimond de Macy's deposition, which
      Lowell and Lang follow; 060.20). On 21 November the University of Paris wrote to Cauchon and to Henry VI,
      reproaching the delay and asking that she be tried in Paris (060.21). Compiègne, which John of Luxembourg was
      besieging while she was his prisoner, held under Guillaume de Flavy and was relieved on 25–26 October 1430; the
      Burgundians fell back and left their guns (060.22). She was brought to Rouen late in 1430: in November by Lang,
      probably in the first days of December by Lowell, before the end of the year by Ramsay (060.23). The map shows
      her road from Beaurevoir by Arras and Drugy to Le Crotoy, which joins the places since no source gives the road;
      it draws no road from Le Crotoy to Rouen, which no trusted source traces, and marks the two places. Compiègne
      relieved is marked in the colour of Charles VII.
