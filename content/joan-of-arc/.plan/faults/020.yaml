- id: "020-research-reviewer-11"
  severity: "weak"
  file: "content/joan-of-arc/.plan/research/020.md"
  field: "the lines of the pages the-voices and eleven-days"
  new: "Two clauses of the pre-plan's tells have no line: Vaucouleurs as the king's stronghold \"on the upper Meuse\" (the-voices), and that she \"crosses the Loire at Gien\" (eleven-days). Searched: Lowell and Lang put Domrémy on the Meuse (Lowell ch. 2 line 748, Lang ch. 2 line 1626) but no quote found sets Vaucouleurs on it; Lowell ch. 5, lines 2402-2404, has Gien \"a town on the Loire about forty miles above Orleans, holding for Charles\" and Lang ch. 8, lines 4004-4007 and 4014-4016, sets Fierbois south of the Loire, but no passage read says they crossed the river at Gien. Add a line for each from the sources, or the plan drops the clause."
  source: "content/joan-of-arc/.plan/020-the-road-to-chinon/pages.yaml, the-voices.tells and eleven-days.tells"
  kind: "sources"
  introduced: "research"
  owner: "researcher"
  state: "fixed"
- id: "020-research-reviewer-12"
  severity: "weak"
  file: "content/joan-of-arc/.plan/020-the-road-to-chinon/pages.yaml"
  field: "eleven-days.tells"
  replaces: "clause"
  old: "crosses the Loire at Gien and"
  new: "reaches Gien on the Loire, held for the king, goes on south of the river and"
  source: "research/020.md, 020.63: the road on from Gien south of the Loire is agreed (Lowell ch. 5, lines 2402-2425, \"Gien, a town on the Loire about forty miles above Orleans, holding for Charles; … rode forward across the sandy Sologne\"; Lang ch. 8, lines 4015-4016, Fierbois \"south of the Loire\"), but the crossing at Gien itself is France's alone (vol. 1 ch. 4, lines 5885-5948), and rules.md: France's Life is read for where to look, and no claim rests on it alone. The depositions that name Gien (Dunois, Murray 11975-11976; Ricarville, 12565-12566) and Beaucourt 2 (10995) say she passed through Gien, not that she crossed the river there."
  kind: "plan"
