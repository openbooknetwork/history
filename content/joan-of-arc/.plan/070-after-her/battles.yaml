- id: formigny-1450
  page: normandy-won-back
  phases: false
  name: Battle of Formigny
  date: "15 April 1450"
  site: "Formigny, on the road from Carentan to Bayeux, the English drawn up in front of the village with a stream, an affluent of the Aure, behind them (Ramsay)"
  sides:
    - name: French
      family: france
      commanders: ["John, Count of Clermont", "Arthur de Richemont, Constable of France"]
      strength: "Oman: Clermont about 3,000 with two culverins, and Richemont 1,200 more; Monstrelet's continuator, by the heralds' report: not more than 3,000"
      casualties: "Beaucourt: ten or twelve men; Oman: the French annalists name twelve men-at-arms, and the loss cannot be ascertained"
    - name: English
      family: english
      commanders: [Sir Thomas Kyriell, Matthew Gough]
      strength: "Oman: some 4,500, Kyriell's 2,500 at most and the rest from the garrisons; Ramsay: Kyriell's 2,500 and perhaps 1,000 from the garrisons; Beaucourt: four to five thousand with Kyriell; Monstrelet's continuator, by the heralds' report: six to seven thousand"
      casualties: "The French heralds' count the next day: 3,774 dead (Oman, Beaucourt; 3,773 in Monstrelet's continuator, buried in fourteen pits); Beaucourt: 1,200 to 1,400 taken; Ramsay holds the English reckoning of 3,000 dead an exaggeration. Kyriell taken; Gough escapes to Bayeux"
  outcome: "French victory. Kyriell's army is destroyed, and by 12 August 1450 the English hold nothing in Normandy."
- id: castillon-1453
  page: castillon
  phases: false
  name: Battle of Castillon
  date: "17 July 1453"
  site: "the French entrenched camp east of Castillon on the Dordogne, by the Lidoire, two kilometres from the town between the Dordogne and the Lidoire by Beaucourt"
  sides:
    - name: French
      family: france
      commanders: [the Marshal de Lohéac, the Marshal de Jalognes, Jean Bureau, the lord of Montauban, the lord of La Hunaudaye]
      strength: "Beaucourt: about 1,800 lances with a body of francs-archers; Monstrelet's continuator: 1,600 to 1,800 men-at-arms and archers; Monstrelet's continuator and Ramsay: 700 sappers or gunners under the Bureau brothers; the guns more than a hundred, it is said (Oman), three hundred (Beaucourt)"
    - name: English
      family: english
      commanders: ["John Talbot, Earl of Shrewsbury", Viscount Lisle]
      strength: "Ramsay, from Aeneas Sylvius: 500 men-at-arms and 800 archers; Beaucourt: about 7,000, from the chroniclers' 800 to 1,000 horse and 4,000 to 5,000 foot up to Basin's 10,000; Monstrelet's continuator: 800 to 1,000 horse followed by four to six thousand foot"
      casualties: "Monstrelet's continuator: four or five hundred English dead buried. Talbot and his son Viscount Lisle killed"
  outcome: "French victory. Talbot is killed; Castillon yields the next day and Bordeaux on 19 October 1453, which ends the war."
