  field: "020.21"
  replaces: "value"
  old: "- 020.21 Person: Jean, Bastard of Orléans (later Count of Dunois), comes into Orléans with reinforcements on 25 October 1428 and holds the chief command there as the king's lieutenant for the war. agreed (his own deposition; the Journal; Ramsay; Lowell). \"I was then entrusted with the care of the town of Orleans and was Lieutenant-General of the King in affairs of war.\" (archive.org-download-jeannedarcmaidof028754mbp-jeannedarcmaidof028754mbp-djvu.txt.txt, deposition of Dunois, lines 11979-11981, primary) \"arrivèrent dedens Orléans pour la conforter, secourir et ayder, plusieurs nobles seigneurs, … tard d'Orléans, le seigneur de Saincte-Sevère\" (archive.org-download-procsdecondam04joanuoft-procsdecondam04joanuoft-djvu.txt.txt, Journal du siège, 25 October 1428, lines 4266-4279, primary) \"Inside the city the Bastard of Orleans held the chief\" (archive.org-download-lancasterandyor00ramsgoog-lancasterandyor00ramsgoog-djvu.txt.txt, ch. 26, line 24258, scholarly)"
  new: "- 020.21 Person: Jean, Bastard of Orléans (later Count of Dunois), comes into Orléans with reinforcements on 25 October 1428 and holds the chief command there as the king's lieutenant for the war. agreed for the command (his own deposition; Ramsay; Lowell). single for his coming on 25 October (the Journal); Ramsay has him in command inside the city at the English approach, and Lowell has him succeed Gaucourt, hurt by a fall, in November or December. \"I was then entrusted with the care of the town of Orleans and was Lieutenant-General of the King in affairs of war.\" (archive.org-download-jeannedarcmaidof028754mbp-jeannedarcmaidof028754mbp-djvu.txt.txt, deposition of Dunois, lines 11979-11981, primary) \"arrivèrent dedens Orléans pour la conforter, secourir et ayder, plusieurs nobles seigneurs, … tard d'Orléans, le seigneur de Saincte-Sevère\" (archive.org-download-procsdecondam04joanuoft-procsdecondam04joanuoft-djvu.txt.txt, Journal du siège, 25 October 1428, lines 4266-4279, primary) \"Inside the city the Bastard of Orleans held the chief\" (archive.org-download-lancasterandyor00ramsgoog-lancasterandyor00ramsgoog-djvu.txt.txt, ch. 26, line 24258, scholarly) \"and Gaucourt, who had been injured by a fall, … in his command by John, Bastard of Orleans\" (archive.org-download-joanofarc00lowe-joanofarc00lowe-djvu.txt.txt, ch. 7, lines 3898-3910, scholarly)"
  source: "Only the Journal gives 25 October; Ramsay ch. 26, line 24258, has the Bastard holding the chief command inside the city at the English approach, and Lowell ch. 7, lines 3898-3910, has him supersede Gaucourt (margin: Nov.-Dec.)."
