- id: paris
  title: "The Porte Saint-Honoré"
  date: "September 1429"
  when: "1429-09-08"
  tells: From Saint-Denis and La Chapelle the army attacks Paris on 8 September, the feast of the Nativity of Our Lady, she with Rais and Gaucourt at the Porte Saint-Honoré while Alençon covers them; the assault stops at the water of the moat, she is wounded by a crossbow bolt, and next day the king calls the army back to Saint-Denis.
