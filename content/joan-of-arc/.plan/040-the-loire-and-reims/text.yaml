  patay:
    account: >-
      On the morning of Saturday 18 June, about eight by Wavrin and nine by Lowell, as they made ready to storm the bridge
      of Meung, the English learned that Beaugency had fallen, gave up Meung and marched for Janville: the van, the
      artillery and supplies, the main body under Fastolf and Talbot, and a rearguard. Asked by Alençon what to do, Joan
      told the captains to have good spurs, for the English would not stand (Dunois in 1456; Ramsay and Lowell set it on
      the 18th, Lang on the 17th). La Hire and Poton de Xaintrailles led the vanguard with Jamet du Tillay and other
      mounted captains, and Wavrin puts the Constable and Boussac in it too, and Monstrelet Boussac at the Constable's order; the main body followed under
      Alençon and the Bastard of Orléans, and Joan, kept out of the van, was much vexed, her page Louis de Coutes said.
      The French scouts found the English when a stag broke from the woods and ran into their ranks and they raised a
      shout (Wavrin). Talbot dismounted with 500 picked archers to hold a narrow passage between two hedges while the van
      took position near Patay; the French were on him before the English were formed, and Monstrelet says the archers
      had not planted their stakes. Talbot was overrun, and the English van, seeing Fastolf ride towards it, fled. The
      fight was over about two in the afternoon (Monstrelet), and the French lay that night at Patay. Where it was fought
      is given differently: near the village of Patay (Cagny, the Journal), two leagues from Janville (Wavrin) and about five from Beaugency (Cagny), half a league short of
      it (Monstrelet), near Coinces two or three miles short of it (Ramsay); the card stands at Patay. The date is 18
      June in Cagny, Wavrin, the Journal, Ramsay and Lowell; Oman has 17 June. Talbot was taken, by the archers of Poton
      in Gruel, with Lord Scales, Sir Thomas Rempston and a Hungerford, a lord in Monstrelet and Sir Walter Hungerford
      the younger in Ramsay. Alençon told him he had not expected such a day that morning, and Talbot answered that it
      was the fortune of war (Alençon). Both armies' strengths and losses stand on the card by author, and the French
      losses were small, with no figure. Fastolf, who had not dismounted, fled with a few to Étampes by about midnight,
      then to Corbeil; Monstrelet says Bedford took the Garter from him, which he later regained. After the fight Joan
      got down from her horse to hold the head of an English prisoner struck down by his captor and had him confessed
      (Louis de Coutes). Janville shut its gates on the fugitives and gave itself and its great tower to the king that
      day, and the English of the Beauce burned Montpipeau, Saint-Sigismond and other places and fled: after the week of
      11 to 18 June the English held no place on the Loire about Orléans, the French held the river up to Bonny (Lowell),
      and the Beauce was clear almost to Paris. Richemont was sent home: Alençon dared not bring him to the king, who bade
      him go back to his own lands. On Sunday 19 June Joan and Alençon went back to Orléans with the prisoners and
      stayed until 24 June. The map shows the English road from Meung toward Janville, broken off at Patay, the French
      pursuit from Beaugency, Fastolf's flight and the return to Orléans, all reconstructions from the places named,
      and the English zone after Patay, with Chartres and Étampes still English.
