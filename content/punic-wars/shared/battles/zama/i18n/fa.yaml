# Carthage
battle.sides.1.name: "کارتاژ"

# 40,000 or 50,000, with 80 war elephants
battle.sides.1.strength: "۴۰ یا ۵۰ هزار، با ۸۰ فیل جنگی"

# 20,000 killed, 20,000 captured
