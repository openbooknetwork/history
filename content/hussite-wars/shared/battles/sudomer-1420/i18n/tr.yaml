# Landfrieden of Plzeň, Hospitallers of Strakonice and the Iron Lords
battle.sides.1.name: "Plzeň Barış Birliği, Strakonice Hospitalierleri ve Demir Beyler"

# More than 2,000 horse by the chronicle of the old Prague collegiate, about 700 by modern estimates
battle.sides.1.strength: "Eski Prag kolej üyesinin kroniğine göre 2.000’i aşkın, günümüz tahminlerine göre 700 kadar atlı"

# Heavy, Jindřich of Hradec mortally wounded
battle.sides.1.casualties: "Ağır, Hradec’li Jindřich ölümcül biçimde yaralanır"

# Battle of Sudoměř
battle.name: "Sudoměř Muharebesi"

# 25 March 1420
