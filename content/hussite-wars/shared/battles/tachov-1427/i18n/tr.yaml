# Crusade army of the Empire, with the Plzeň landfrýd and English archers
battle.sides.0.name: "Plzeň landfrýdı ve İngiliz okçularıyla birlikte İmparatorluğun haçlı ordusu"

# About 20,000 by modern estimates, 80,000 horse by Bartošek of Drahonice
battle.sides.0.strength: "Günümüz tahminlerine göre yaklaşık 20.000, Drahoniceli Bartošek’e göre 80.000 atlı"

# Stragglers of the rear guard, about 1,400 prisoners at Tachov (900 by Bartošek of Drahonice)
battle.sides.0.casualties: "Artçıdan geride kalanlar, Tachov’da yaklaşık 1.400 esir (Drahoniceli Bartošek’e göre 900)"

# Hussite unions: Taborites, Orphans and Praguers
battle.sides.1.name: "Husçu birlikleri: Táborcular, Yetimler ve Praglılar"

# 16,000 foot and 1,500 horse by Bartošek of Drahonice
battle.sides.1.strength: "Drahoniceli Bartošek’e göre 16.000 yaya ve 1.500 atlı"

# Unknown
battle.sides.1.casualties: "Bilinmiyor"

# Battle of Tachov
battle.name: "Tachov Muharebesi"

# 4 August 1427
battle.date: "4 Ağustos 1427"

# Hussite victory: the crusaders flee before the battle, Tachov taken
battle.result: "Husçu zaferi: haçlılar savaştan önce kaçar, Tachov alınır"

