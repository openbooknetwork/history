# Kingdom of Greece
battle.sides.1.name: "مملكة اليونان"

# 106,000 by Turkish counts, about 110,000 by Greek counts
battle.sides.1.strength: "106,000 بحسب الأرقام التركية، ونحو 110,000 بحسب الأرقام اليونانية"

# 1,491 killed, 6,472 wounded, 110 missing
battle.sides.1.casualties: "القتلى 1,491، والجرحى 6,472، والمفقودون 110"

# Battle of Kütahya–Eskişehir
battle.name: "معركة كوتاهية وإسكي شهير"

# 10–24 July 1921
battle.date: "من 10 إلى 24 يوليو 1921"

# Greek victory, Turkish retreat to the Sakarya
battle.result: "نصر يوناني، وانسحاب تركي إلى سقاريا"

