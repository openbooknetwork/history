title: "Joan of Arc"
summary: "France divided between two kings, the girl from Domrémy who raised the siege of Orléans and led the Dauphin to his coronation at Reims in 1429, her capture, her trial and death at Rouen, the verdict that cleared her in 1456, and how she was remembered."
