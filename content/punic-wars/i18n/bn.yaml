# The army of the consul Flaminius, spring 217 BC
markers.arretium-217.note: "কনসাল ফ্লামিনিয়াসের সেনাবাহিনী, বসন্ত খ্রিস্টপূর্ব ২১৭"

# The army of the consul Servilius Geminus
markers.ariminum-217.note: "কনসাল সার্ভিলিয়াস জেমিনাসের সেনাবাহিনী"

# Fabius holds the crossing of the Volturnus
markers.casilinum-217.note: "ফেবিয়াস ভোলটার্নাসের পারাপার ধরে রাখেন"

