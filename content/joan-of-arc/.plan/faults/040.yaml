- id: 040-battle-coordinator-3
  severity: weak
  file: content/joan-of-arc/.plan/research/040.md
  field: lines
  new: >-
    New lines, or quotes added to 040.25, 040.28 and 040.29, for the positions of Patay that the source files give
    and no line quotes, so that the phase pages can tell them: (a) Wavrin, Quicherat 4, p. 420 (from character
    about 826700), and Monstrelet book 2 ch. 61: the French sent sixty or eighty of their most expert men on the
    best horses ahead to find the English (the scouts' strength, now unknown in the plan); (b) Wavrin p. 421 (about
    character 829300): the English rode towards Patay until a league short of it and halted there, warned by the
    runners of their rearguard, and the captains sent the vanguard, merchants, victuals and artillery ahead to take
    place along the hedges near Patay (pages.yaml patay-the-hedges says "a league short", which now rests on no
    quote; 040.39 gives Monstrelet's half league and Ramsay's two or three miles); (c) Wavrin p. 422: Talbot hoped
    to rejoin the main body by skirting the hedges; (d) Monstrelet book 2 ch. 61 (from character about 2959700):
    some English captains would have dismounted by the hedgerows and others fought on the plain, and they fell back
    about half a quarter of a league from the hedges; most of the French dismounted and turned their horses loose,
    a second account of the positions against Wavrin's; (e) Lowell ch. 10 (from character about 307900): the
    Bastard and La Hire with a force of cavalry hung on the English rear, and the Bastard charged Talbot, where
