  source: "The Journal, lines 4258-4262: \"Et d'autre part rompirent les Anglois deux archesdupont devant les Tournelles, aprez qu'ilz les eurent prinses\" (the English broke the arches); Lowell ch. 7, lines 3871-3873: \"Before withdrawing, however, the French broke down a span of the bridge\". The line gave the French version alone, as agreed, under the Journal's name."
