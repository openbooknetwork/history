  new: "010.60 Event: the day of Cravant. disputed: Saturday 31 July 1423, Beaucourt, Tuetey's note to the Bourgeois, Ramsay (the allies marched out on 30 July and found the enemy \"next morning\") and Monstrelet (\"the following Saturday\"); 30 July 1423, Lang; \"Saturday, the last day of August\" 1423, the Chronique de la Pucelle (Geste des nobles ch. 202). \"bataille s'engagea le 31 juillet\" (archive.org-rt-histoire-de-charles-vii-v-2-Beaucourt-20Histoire-20de-20Charles-20VII-20v-202-djvu.txt.txt, Beaucourt 2, book 2 ch. 1, l. 527, scholarly) \"On  the  30th  July  they  marched  out\" (archive.org-download-lancasterandyor00ramsgoog-lancasterandyor00ramsgoog-djvu.txt.txt, Ramsay 1, ch. 22, l. 21448, scholarly) \"the  battle  of  Cravant (July  30,  1423)\" (archive.org-download-maidoffrancebein00languoft-maidoffrancebein00languoft-djvu.txt.txt, Lang ch. 1, l. 1429, scholarly) \"la victoire de Cravant remportée le samedi 31\" (archive.org-download-journaldunbourge54182gut-54182-0.txt.txt, Bourgeois, Tuetey's note 757, 1423, l. 11545, scholarly) \"On  the  following  Saturday,  they  decamped\" (archive.org-download-chroniclesengue06johngoog-chroniclesengue06johngoog-djvu.txt.txt, Monstrelet book 2, the battle of Crevant, l. 35765, primary) \"jour  d'aonst  l'an  mil  quatre  cent  vint\" (archive.org-download-chroniquedelapuc00cousuoft-chroniquedelapuc00cousuoft-djvu.txt.txt, Chronique de la Pucelle (Geste des nobles) ch. 202, l. 7927, primary)"
  source: "archive.org-download-journaldunbourge54182gut-54182-0.txt.txt 11545, Tuetey's note 757: \"Il s'agit de la victoire de Cravant remportée le samedi 31 juillet\"; archive.org-download-chroniclesengue06johngoog-chroniclesengue06johngoog-djvu.txt.txt 35765: \"On the following Saturday, they decamped at ten o'clock in the morning, and advanced in handsome array toward the French\"; archive.org-download-chroniquedelapuc00cousuoft-chroniquedelapuc00cousuoft-djvu.txt.txt 7927 (Geste des nobles ch. 202): \"le samedi derrenier jour d'aoust l'an mil quatre cent vint trois\""
