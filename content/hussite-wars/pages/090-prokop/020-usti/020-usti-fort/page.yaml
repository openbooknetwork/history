    - {side: taborites, type: artillery, at: [13.96905, 50.66061], width: 120, depth: 70, facing: 0, id: guns, name: Howitzers (houfnice) and light field guns (tarasnice) aimed through gaps in the wagon line, count: 3}
    - {side: taborites, type: pavises, at: [13.9648, 50.65991], width: 380, depth: 40, facing: 0, id: pavises, name: 'Pavise bearers: large shields with pointed ends driven into the ground, a cover behind the second line (Lützow)', count: 12}
    - {side: taborites, type: handguns, at: [13.9648, 50.65944], width: 380, depth: 50, facing: 0, id: handguns, name: 'Handgunners with píšťaly, ready to fire through the gaps between the wagons', count: 8}
    - {side: taborites, type: infantry, at: [13.9648, 50.65871], width: 380, depth: 80, facing: 0, id: hussite-foot, name: 'Hussite foot with flails, halberds and hooks, held inside the ring'}
