  field: "010.61"
  old: "010.61 Figure: the armies and losses at Cravant: about 4,000 Anglo-Burgundians (Smith and DeVries), about 4,000 Scots and a Dauphinist army two or three times the larger (Burne, Myers), 1,200 to 3,000 Scots dead and over 2,000 taken, Wikipedia; Ramsay has only the 1,000 or so men of the reinforcement brought in May, and some sixteen men of name taken or killed. single (Wikipedia for the totals). \"The Anglo-Burgundian army mustered about 4,000 men (2,000 Burgundians and 2,000 English)\" (Battle_of_Cravant.wiki, Armies, wikipedia) \"Perhaps 1,200–3,000 of them fell at the bridgehead or along the riverbanks, and over 2,000 prisoners were taken\" (Battle_of_Cravant.wiki, Battle, wikipedia) \"Some  sixteen  gentlemen  of  name  were  taken\" (archive.org-download-lancasterandyor00ramsgoog-lancasterandyor00ramsgoog-djvu.txt.txt, Ramsay 1, ch. 22, l. 21488, scholarly)"
  new: "010.61 Figure: the armies and losses at Cravant: the Scots of the front ranks 3,000, the greater part of them killed or taken, some 400 knights and gentlemen taken and about 1,200 slain, Monstrelet; the constable of Scotland, Ventadour and forty-four other gentlemen of name taken, the Chronique de la Pucelle (Geste des nobles ch. 202), and 2,000 to 3,000 killed and taken (its ch. 4); about 4,000 Anglo-Burgundians (Smith and DeVries), about 4,000 Scots and a Dauphinist army two or three times the larger (Burne, Myers), 1,200 to 3,000 Scots dead and over 2,000 taken, Wikipedia; Ramsay has only the 1,000 or so men of the reinforcement brought in May, and some sixteen men of name taken or killed. single (Wikipedia) for the strengths of the two armies; disputed for the losses. \"The Anglo-Burgundian army mustered about 4,000 men (2,000 Burgundians and 2,000 English)\" (Battle_of_Cravant.wiki, Armies, wikipedia) \"Perhaps 1,200–3,000 of them fell at the bridgehead or along the riverbanks, and over 2,000 prisoners were taken\" (Battle_of_Cravant.wiki, Battle, wikipedia) \"Some  sixteen  gentlemen  of  name  were  taken\" (archive.org-download-lancasterandyor00ramsgoog-lancasterandyor00ramsgoog-djvu.txt.txt, Ramsay 1, ch. 22, l. 21488, scholarly) \"the  greater  part  of  the  Scots,  amounting  to  three  thousand,  who  were  in  the  front\" (archive.org-download-chroniclesengue06johngoog-chroniclesengue06johngoog-djvu.txt.txt, Monstrelet book 2, the battle of Crevant, l. 35778, primary) \"with  several  gentlemen  of  note,  to  the  number  of  four  hundred,\" (archive.org-download-chroniclesengue06johngoog-chroniclesengue06johngoog-djvu.txt.txt, Monstrelet book 2, the battle of Crevant, l. 35782, primary) \"with  many  others,  to  the  amount  of  twelve  hundred\" (archive.org-download-chroniclesengue06johngoog-chroniclesengue06johngoog-djvu.txt.txt, Monstrelet book 2, the battle of Crevant, l. 35797, primary) \"et  quarante  quatre  autres  genfilz\" (archive.org-download-chroniquedelapuc00cousuoft-chroniquedelapuc00cousuoft-djvu.txt.txt, Chronique de la Pucelle (Geste des nobles) ch. 202, l. 7932, primary) \"prins  jusques  au  nombre  de  deux  à  (rois\" (archive.org-download-chroniquedelapuc00cousuoft-chroniquedelapuc00cousuoft-djvu.txt.txt, Chronique de la Pucelle ch. 4, Cravant, l. 8899, primary)"
