section:
  years: "June to August 1429"
  opens: >-
    On 8 May 1429 the English left their bastilles before Orléans and the siege was raised: Talbot went to Meung and
    Suffolk to Jargeau, and the English still hold the Loire bridges of Jargeau, Meung and Beaugency and Janville in
    the Beauce, with Paris, Normandy, Champagne and Reims behind them. Charles VII, crowned nowhere, is south of the
    Loire with his court at Loches; Philip the Good, Duke of Burgundy, holds Auxerre and his own lands as the English
    ally. The reader has seen Joan reach Chinon, be examined at Poitiers, enter Orléans on 29 April and take part in
    the fall of Saint-Loup, the Augustins and the Tourelles, wounded on 7 May, and has been told that the borders are
    approximate.
  introduces: [Selles, Romorantin, Loches, Guy de Laval, Guillaume Regnault, Alexander de la Pole, Jean Chartier, Matthew Gough, Sir Richard Gethin, Évreux, Gruel, Étampes, Patay, Coinces, Poton de Xaintrailles, Jamet du Tillay, Sir Thomas Rempston, Sir Walter Hungerford, Corbeil, Montpipeau, Saint-Sigismond, Bonny, Saint-Florentin, Robert le Maçon, Friar Richard, Châlons, Sept-Saulx, the lords of Châtillon and Saveuses, Graville, the Holy Ampulla, the abbey of Saint-Remi, Corbeny, Saint-Marcoul, Laon, Vailly, Château-Thierry, the lords of Croy and Brimeu, Crécy, Coulommiers, Provins, Cardinal Beaufort, Christine de Pizan, Sens, Lagny, Creil, Beauvais]
  hands_on: >-
    On 2 August 1429 Charles VII, anointed and crowned at Reims on 17 July, is at Provins with the army, south and east
    of Paris, and stays there to 5 August. The English hold nothing on the Loire about Orléans or in the Beauce but
    Chartres and Étampes; Troyes, Châlons, Reims, Laon, Soissons, Château-Thierry, Crécy, Coulommiers and Provins are
    the king's, and Auxerre stays Burgundian. Bedford is in Paris with Cardinal Beaufort's reinforcement from England,
    and holds Paris, Normandy, the Brie about Paris and the towns between the Oise and Paris. At Reims La Trémoille
    signed a truce of fifteen days with the Duke of Burgundy's envoys (Ramsay), and Joan was told the duke would give
    up Paris at its end. Left unsettled: whether the king will march on Paris, which section 050 tells from the turn
    at Bray.
pages:
  jargeau:
    account: >-
      Early in June 1429 the king's council gave the Duke of Alençon command of the army, with orders to take the
      English places on the Loire, and sent Joan, the Bastard of Orléans and other captains with him; Alençon called
      himself the king's lieutenant in command. The army gathered at Selles on the Cher. Guy de Laval wrote from there
      on Wednesday 8 June that Joan had ridden out on the evening of Monday 6 June for Romorantin, three leagues on, armed
      all in white but for her head, with Boussac and many men, and that Alençon had come the same day. She entered
      Orléans a second time on 9 June, by the town's accounts, and on Saturday 11 June the army marched out for Jargeau,
      twelve miles up the river by Lowell's reckoning. Its size is each author's: about 1,200 lances (Alençon), 2,000 to
      3,000 fighting men and as many common people (Cagny), five or six thousand (Monstrelet), about 8,000 horse and foot
      (the Journal of the Siege). Suffolk held Jargeau with 600 to 700 English (Chartier), 700 to 800 (Cagny), or 300 to
      400 with the townsmen (Monstrelet); these stand on the card. On the afternoon of the 11th the common people rushed
      the ditches without the men-at-arms and were thrown back, and the guns were set up in the night. Suffolk asked a
      fortnight's delay, to yield if not relieved; the captains refused and called La Hire away from parleying, and Joan,
      as she told her judges in 1431, said the garrison might go in their doublets with their lives. On Sunday 12 June
      the town was stormed after an assault of three or four hours. Joan, on a ladder with her standard, was struck on
      the head by a stone, fell, rose and cried the men on (Alençon in 1456; the Journal). Suffolk was taken, Chartier
      says by a squire, Guillaume Regnault, whom he knighted before yielding; his brother John was taken and his brother
      Alexander de la Pole killed. The losses stand on the card by author. The town and its church were sacked, and
      prisoners were killed on the road to Orléans in a quarrel among their captors, most of them in Chartier and some in
      Lowell and Lang; the rest went down to Orléans by boat in the night. The map shows the English hold of 1428 on the
      Loire about Orléans, the army's road from Selles by Romorantin and Orléans to Jargeau, and Jargeau marked as
      taken. The road is a reconstruction from the places Laval and the chronicles name, and the text says once in the
      chapter that the borders and roads are approximate.
