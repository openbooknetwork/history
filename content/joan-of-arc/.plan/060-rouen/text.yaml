  the-questioning:
    account: >-
      The first public session sat at eight in the morning of Wednesday 21 February 1431 in the chapel royal of the
      castle of Rouen (060.39); from 22 February the court sat in the Robing Room at the end of the great hall (060.40),
      and from Saturday 10 March it questioned her in her prison chamber before a few judges, to 17 March: twelve days of
      questioning from 21 February in Ramsay (060.41). On the voices she said, in the record's words, that at thirteen
      she had a voice from God to help and guide her, that it first came towards noon, in summer, in her father's
      garden, and that she had seen Saint Michael with angels, and Saint Catherine and Saint Margaret (060.42). The text
      tells this as her testimony and takes no side on what the voices were. On the sign given to the king the record of
      13 March has her say that an angel brought a crown, given to the Archbishop of Reims in the king's presence; Ramsay
      says she kept silent on the sign, and Thurston that most authorities, among them Petit de Julleville and Lang,
      read the angel and the crown as an allegory to guard the king's secret, she herself being the angel, while others
      doubt the record (060.43). On the man's dress she said she would not put it off without God's leave and had taken
      it by God's command (the record; 060.44); Thurston holds that she kept it to protect her modesty among her guards.
      The articles of the promoter Jean d'Estivet were read to her by Thomas de Courcelles in the room near the great
      hall on 27 March (the record; Lang has 28 March): seventy articles in the record as Murray, Lang and Lowell count
      them, sixty-nine in Ramsay (060.45). They were cut down to twelve by Nicolas Midi, sent to the doctors on 5 April
      and then to the University of Paris, which condemned her (060.46). She was admonished in private on 18 April,
      while sick, and in public on 2 May in the room near the great hall, and did not submit (060.47). On 9 May she was
      brought into the great tower of the castle and shown the instruments of torture with the torturers present; the
      judges put the torture off, and on 12 May decided against it (060.48). The map shows the castle of Rouen, where the
      sessions sat, and its keep, the great tower.
