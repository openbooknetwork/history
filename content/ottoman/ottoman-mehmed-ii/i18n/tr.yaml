emblems.constantinople-mines.bridge: "Haliç’in yukarısında 19 Mayıs’ta tamamlanan, Zağanos’un askerlerini surların önündeki orduya bağlayan fıçı köprüsü"

# Theophilos Palaiologos and Johannes Grant at the Kaligaria gate
emblems.constantinople-mines.theophilos: "Eğrikapı’da Theophilos Palaiologos ve Johannes Grant"

# The Venetian bailo Girolamo Minotto with his Venetians at the palace of Blachernae
emblems.constantinople-mines.minotto: "Blaherne Sarayı’nda Venedikli askerleriyle Venedik balyosu Girolamo Minotto"

# The wooden siege tower brought up to the walls on 18 May and burned by the defenders that night. Some accounts put it at the Charisian gate
emblems.constantinople-mines.tower: "18 Mayıs’ta surlara yanaştırılan ve aynı gece savunanlarca yakılan ahşap kuşatma kulesi. Bazı anlatımlar onu Edirnekapı’ya koyar"

# Zaganos Pasha’s miners, many of them Serbs from Novo Brdo
emblems.constantinople-mines.miners: "Zağanos Paşa’nın, çoğu Novobırdalı Sırp lağımcıları"

# Mehmed’s janissaries, 5,000 to 10,000, before the gate of St Romanos and the Mesoteichion
emblems.constantinople-mines.janissaries: "Topkapı ve Mesoteikhion önünde Mehmed’in 5.000 ile 10.000 arası yeniçerisi"

# The Rumelian troops under Karaca Pasha, the beylerbey of Rumelia, from the Charisian gate to the Horn
emblems.constantinople-mines.rumelians: "Edirnekapı’dan Haliç’e kadar Rumeli beylerbeyi Karaca Paşa’nın komutasındaki Rumeli askerleri"

# The Ottoman ships in the Horn below Kasımpaşa
emblems.constantinople-mines.in-horn: "Kasımpaşa’nın altında, Haliç’teki Osmanlı gemileri"

# Zaganos Pasha’s troops at the north end of the bridge
emblems.constantinople-mines.zaganos: "Köprünün kuzey ucunda Zağanos Paşa’nın askerleri"

