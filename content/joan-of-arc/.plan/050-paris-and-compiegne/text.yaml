  paris:
    account: >-
      On Tuesday 23 August Joan and Alençon left the king at Compiègne with a strong company, gathering on their way
      men who had been at the taking of Senlis (Cagny), and took Saint-Denis on 25 August (the Bourgeois, Lowell; Cagny
      has them lodge there on Friday the 26th). For a fortnight they skirmished at the gates of Paris two or three times
      a day. Alençon went to the king at Senlis on 1 and 5 September, and the king came to Saint-Denis on Wednesday 7
      September; that evening Joan and the captains lodged at La Chapelle, midway on the road from Saint-Denis to
      Paris. The governors who were to rule north of the Seine after the king went south had been named that same day,
      before the assault (Ramsay). On Thursday 8 September, the feast of the Nativity of Our Lady, the army marched from
      La Chapelle about eight and drew up in the pig market before the Porte Saint-Honoré; Joan, Marshal de Rais and
      Gaucourt attacked the gate, the barrier and boulevard before it were fired and taken, and Alençon, with Bourbon in
      the Journal of the Siege and with Boussac in Ramsay, covered them behind a hill against a sally from the Porte
      Saint-Denis. The Bourgeois, inside the walls, has the assault between the two gates from between eleven and noon,
      and the attackers bring great faggots to fill the ditches. Past the first ditch and the ridge between the two, the
      second ditch was full of water too deep to cross; Joan sounded it with her lance and had faggots and wood thrown
      in, but it could not be filled before night. Late in the day, after sunset in Cagny, a crossbow bolt struck her
      through the thigh (Cagny, the Journal) or the leg (the Bourgeois, Lowell), and her standard-bearer was shot dead.
      She would not leave the ditch, saying the place would have been taken, until Gaucourt and others (Cagny) or
      Alençon (the Journal) had her carried back to La Chapelle. Asked at her trial, she said she was wounded before
      Paris and recovered in five days. On Friday 9 September she asked Alençon to sound the trumpets and go back to the
      walls, and the Baron of Montmorency came out of Paris with fifty or sixty gentlemen to join her; then René, Duke
      of Bar, and the Count of Clermont came from the king at Saint-Denis and bade her and the captains return to him,
      and the army went back to Saint-Denis (Cagny, followed by Lowell and Ramsay). In the night the bridge Alençon had
      thrown over the Seine near Saint-Denis, to attack from the other side, was broken up, by the king's order in Cagny
      and by some of the council without the duke's knowledge in Lowell. Monstrelet alone sets the assault on Monday the
      12th, the king leading the army from between Montmartre and Paris; the text follows the day of Cagny, the
      Bourgeois and the trial. Paris was held by its garrison and townsmen under Louis of Luxembourg and L'Isle-Adam,
      whose posts no source read gives; the strengths and the losses stand on the card by author. The map shows the
      north side of Paris with Saint-Denis, La Chapelle and the two gates, and the army's road from Saint-Denis by La
      Chapelle to the pig market, a reconstruction; the gates are placed on the line of the wall of Charles V, which no
      source read draws, so their places are approximate. The pig market stands under the card and the text names it;
      the Porte Saint-Denis waits under the Porte Saint-Honoré at the opening view and the text links it.
