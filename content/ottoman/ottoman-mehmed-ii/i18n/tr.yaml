emblems.belgrade-sortie.trenches: "Burnun dar boynunda Sava’dan Tuna’ya uzanan Osmanlı siperleri"

# Crusaders who climb out over the broken walls and attack the Ottoman line
emblems.belgrade-sortie.crusaders-out: "Yıkık surlardan dışarı çıkıp Osmanlı hattına saldıran haçlılar"

# About 2,000 crusaders under Capistrano, who cross the Sava and fall on the Ottoman flank and rear
emblems.belgrade-sortie.capistrano: "Sava’yı geçip Osmanlıların yanına ve arkasına saldıran, Capistrano’nun emrindeki 2.000 kadar haçlı"

# Hunyadi with his men, who charge out of the fortress and take the guns
emblems.belgrade-sortie.hunyadi: "Kaleden hücuma çıkıp topları ele geçiren Hunyadi ve adamları"

# The Ottoman guns, taken by Hunyadi’s men
emblems.belgrade-sortie.guns-rumelia: "Hunyadi’nin adamlarının ele geçirdiği Osmanlı topları"

# The Ottoman guns, taken by Hunyadi’s men
emblems.belgrade-sortie.guns-centre: "Hunyadi’nin adamlarının ele geçirdiği Osmanlı topları"

# The Anatolian troops fall back
emblems.belgrade-sortie.anatolians: "Anadolu askerleri geri çekilir"

# The janissaries and the sultan’s household rally round Mehmed at the edge of the camp
emblems.belgrade-sortie.janissaries: "Yeniçeriler ve padişahın hassa askerleri ordugâhın kenarında Mehmed’in çevresinde toplanır"

# The sipahis, who try to scatter the crusaders and later help to drive the Christians out of the camp
emblems.belgrade-sortie.sipahis: "Haçlıları dağıtmaya çalışan, sonra Hristiyanları ordugâhtan çıkarmaya yardım eden sipahiler"

# The inner castle with the palace of the despots
emblems.belgrade-sortie.castle: "Despotların sarayının bulunduğu iç kale"

# Capistrano leads his crusaders across the Sava
emblems.belgrade-sortie.sava-crossing: "Capistrano haçlılarını Sava’nın karşısına geçirir"

# Hunyadi charges out of the fortress to the Ottoman guns
emblems.belgrade-sortie.hunyadi-charge: "Hunyadi kaleden Osmanlı toplarına hücum eder"

# The Christians reach the Ottoman camp
emblems.belgrade-sortie.into-camp: "Hristiyanlar Osmanlı ordugâhına ulaşır"

# Mehmed’s men drive the Christians out of the camp, but fail to take back the guns
emblems.belgrade-sortie.counter: "Mehmed’in askerleri Hristiyanları ordugâhtan çıkarır, ama topları geri alamaz"

# In the night of 22 to 23 July the army leaves its camp and marches south-east with its wounded in a long column of wagons
emblems.belgrade-sortie.retreat: "22’yi 23 Temmuz’a bağlayan gece ordu ordugâhını bırakır ve yaralılarıyla uzun bir araba kafilesi hâlinde güneydoğuya yürür"

