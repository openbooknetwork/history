- id: eleven-days
  title: "Eleven Days to Chinon"
  date: "February or March 1429"
  when: 1429-02
  tells: >-
    With six men Joan rides from Vaucouleurs to Chinon, mostly by night, across lands held by Burgundy and
    England. She stops at Saint-Urbain, hears mass at Auxerre, reaches Gien on the Loire, held for the king, goes on
    south of the river and writes to the king from Sainte-Catherine-de-Fierbois. Her two escorts later said the journey took eleven days. The day she left
    and the day she reached Chinon differ between authors.
  rests_on: ["020.41", "020.42", "020.43", "020.44", "020.45", "020.46", "020.47", "020.48", "020.63"]
  markers: [vaucouleurs-departure, saint-urbain, auxerre-1429, gien-1429, fierbois-letter, chinon-arrival]
  battles: []
- id: chinon-and-poitiers
  title: "Chinon and Poitiers"
  date: "Late February or March to April 1429"
  when: 1429-03
  tells: >-
    Charles VII receives her at Chinon, in late February as Lowell dates her coming or in March as others do.
    Churchmen examine her at Poitiers and find nothing against her, and her letter to the English is dated at Poitiers on 22 March. At Tours she is given armour, a household
    and a banner, and a sword is found, as she asked, behind the altar at Fierbois. In late April she joins the convoy for Orléans gathering at Blois.
  rests_on: ["020.43", "020.49", "020.50", "020.51", "020.52", "020.53", "020.54", "020.55", "020.56", "020.57", "020.58", "020.59", "020.60"]
