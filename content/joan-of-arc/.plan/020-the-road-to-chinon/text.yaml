  eleven-days:
    account: >-
      She rode out of Vaucouleurs by the Gate of France in men's clothes with six men: Jean de Metz and Bertrand de
      Poulengy, their servants Julien and Jean de Honnecourt, Colet de Vienne, a king's messenger, and Richard the
      Archer; in her own words a knight, a squire and four servants (Thurston gives three men-at-arms and Monstrelet
      four to six). The day differs: at or about 12 February 1429, the day of the Herrings, Lowell, after the clerk of La
      Rochelle and Boismarmin; back from Nancy about the first Sunday in Lent, 13 February, and then away, Jean de
      Metz; 23 February, Lang, who says the critical historians make it 13 February. The first half of the road lay
      through country that acknowledged Henry VI. They rode mostly by night, and all the first night, for fear of the
      Burgundians and the English who held the roads, kept out of inns, and heard mass only twice. The first night
      they slept in the abbey of Saint-Urbain on the Marne; she heard mass in the principal church of Auxerre, a
      Burgundian city; at Gien, on the Loire about forty miles above Orléans and held for Charles VII, word of her
      went ahead to Orléans; and they rode on south of the river, across the Sologne (Lowell). At
      Sainte-Catherine-de-Fierbois she heard mass three times in one day and wrote to the king for leave to come,
      saying she had ridden a hundred and fifty leagues to help him and would know him among all others. Her two
      escorts said the road took eleven days; Lang notes that Metz's day of leaving with the La Rochelle day of
      arrival would give ten. She reached Chinon towards noon: on 23 February, Lowell, after the Livre Noir of La
      Rochelle and Boismarmin, or on 6 March, the Continuator of Guillaume de Nangis, the one chronicle that gives the
      day, followed by Quicherat, Lang and Thurston; Beaucourt has the news reach the castle about noon on 8 March. The
      map shows her road across the English and Burgundian land to the Loire and on into the king's; the route is a
      reconstruction through the towns she and the witnesses name, and no crossing place of the Loire is told.
    files:
      - { file: .references/sourcebooks.web.fordham.edu-basis-joanofarc-trial.asp.txt, read: "the public examinations of 22 February 1431, lines 1200-1230, and of 27 February, lines 1588-1600" }
