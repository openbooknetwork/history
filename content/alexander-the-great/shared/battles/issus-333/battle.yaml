sides:
  - name: "Macedon"
    color: macedon
    commanders: ["Alexander", "Parmenion", "Craterus"]
    strength: "Callisthenes, in Polybius: 40,000 foot and 4,500 horse at the crossing to Asia, joined by 5,000 foot and 800 horse before Cilicia. Higher than Arrian's count of the army that crossed, not much above 30,000 foot and more than 5,000 horse, and Diodorus's, about 32,000 foot and 4,500 horse, though his totals and his list of contingents do not quite agree"
    casualties: "Diodorus: 300 foot and 150 horse killed. Curtius: 302 foot missing, 150 horse killed, about 4,500 wounded. Arrian: Ptolemy, son of Seleucus, and about 120 other Macedonians of note killed in the centre"
  - name: "Persian Empire"
    color: persia
    commanders: ["Darius III", "Nabarzanes"]
    strength: "Arrian: about 600,000 fighting men. Plutarch: 600,000. Diodorus: more than 400,000 foot and at least 100,000 horse. Callisthenes, in Polybius: 30,000 horse and 30,000 mercenaries. Curtius: 250,000 foot and 62,000 horse"
    casualties: "Arrian: about 100,000, more than 10,000 of them horse. Diodorus: more than 100,000 foot and at least 10,000 horse. Curtius: 100,000 foot and 10,000 horse"
