emblems.kosovo-night.thessalians: "19 Ekim’de Haçlıların sol kanadının çevresinden dolaşan ve esir almadan oradaki süvarileri kılıçtan geçiren Teselya sipahileri"

# The crusader right wing holds against the Rumelian sipahis
emblems.kosovo-night.right: "Haçlıların sağ kanadı Rumeli sipahilerine karşı direnir"

# Wagons with guns, brought up against the Ottoman centre on the night of 18 to 19 October
emblems.kosovo-night.night-wagons: "18 Ekim’i 19 Ekim’e bağlayan gece Osmanlı merkezine karşı ileri sürülen toplu arabalar"

# Hunyadi with the heavy horse in the centre, before the wagon fort
emblems.kosovo-night.knights: "Merkezde, araba istihkâmının önünde ağır süvarileriyle Hunyadi"

# What is left of the crusader left falls back on Hunyadi’s main body
emblems.kosovo-night.left: "Haçlıların sol kanadından geriye kalanlar Hunyadi’nin ana gücüne çekilir"

# The wagon fort on the hill north of the Lab, with the guns and the German and Bohemian foot. The sources give 800 to 2,000 war wagons, each with a gun
emblems.kosovo-night.wagon-fort: "Lab’ın kuzeyindeki tepede, topları ve Alman ve Bohemyalı piyadeleriyle araba istihkâmı. Kaynaklar her birinde bir top bulunan 800 ile 2.000 savaş arabası verir"

# The crusader guns fire on the sultan’s position through the night
emblems.kosovo-night.night-guns: "Haçlı topları gece boyunca sultanın mevziini döver"

# The Thessalian sipahis ride round the crusader left
emblems.kosovo-night.thessalians-round: "Teselya sipahileri Haçlıların sol kanadının çevresinden dolaşır"

# The survivors of the crusader left flee to the main body
emblems.kosovo-night.left-flees: "Haçlıların sol kanadından kurtulanlar ana güce kaçar"

# Hunyadi’s knights and light foot break through the janissaries and ride as far as the Ottoman camp
emblems.kosovo-night.knights-charge: "Hunyadi’nin şövalyeleri ve hafif piyadeleri yeniçerileri yarar ve Osmanlı ordugâhına kadar ilerler"

# The Ottoman foot rallies and drives the knights back
emblems.kosovo-night.knights-back: "Osmanlı piyadeleri toparlanır ve şövalyeleri geri püskürtür"

