markers.rhone-elephants-romans.note: "سکیپیو کے 300 سوار"

# Marches north for the Alps
markers.rhone-elephants-march.note: "الپس کے لیے شمال کی طرف کوچ"

# Hannibal crosses the Po and follows Scipio to Placentia
