  new: "The stage of June 1429 that 040-map-auditor-1 asks for draws the English edge back from the walls of Orléans, so that the city's own land no longer shows English a month after the siege was raised: line 44 rests on the bastilles (030.1, 030.3, 030.4), which the English left on 8 May for Meung, Beaugency and Jargeau. The towns stay inside: Meung, Beaugency, Janville and the Beauce. Where the new edge runs between Meung and Orléans no source read gives, so it is an estimate and the text's clause on approximate borders covers it. As it stands orleans-june-1429 on jargeau is 0.7 km from the English edge (points.txt), and the green reaches the city in /tmp/claude-0/-home-user-history/b2454564-72e1-5d65-95b9-08040cb36fae/scratchpad/maps-040-map-auditor/pack/shots/jargeau.png."
