# The army of the consul Aemilius Papus
markers.ariminum-225.note: "কনসাল এমিলিয়াস পাপাসের সেনাবাহিনী"

# The Gauls defeat a Roman army, 225 BC
markers.faesulae-225.note: "গলরা একটি রোমান সেনাবাহিনীকে পরাজিত করে, খ্রিস্টপূর্ব ২২৫"

# The consul Atilius Regulus lands from Sardinia
