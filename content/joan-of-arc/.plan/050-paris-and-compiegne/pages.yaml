- id: compiegne
  title: "Compiègne"
  date: "May 1430"
  when: "1430-05"
  tells: Burgundy razes Choisy and besieges Compiègne, and Soissons shuts its gates on her; she rides from Crépy by night into Compiègne, and on 23 May (the Duke of Burgundy's date; Monstrelet's is the eve of the Ascension, the 24th) leads a sortie on the Burgundian post at Margny; men from Clairoix and the English from Venette cut off the retreat, the gate is closed behind her, an archer pulls her from her horse and she yields to the Bastard of Wandonne, a man of John of Luxembourg.
