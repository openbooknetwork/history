routes.gauls-225.name: "بوئی، انسوبری اور گیساتائی اپینائن پار کر کے ایتروریا میں داخل ہوتے ہیں، 225 ق م"

# The consul Aemilius Papus follows from Ariminum
routes.papus-225.name: "قونصل ایمیلیئس پاپس اریمینم سے پیچھا کرتا ہے"

