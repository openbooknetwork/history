section:
  years: "August 1429 to May 1430"
  opens: >-
    On 2 August 1429 Charles VII, anointed and crowned at Reims on 17 July, is at Provins with the army, south and east
    of Paris, and stays there to 5 August. Troyes, Châlons, Reims, Laon, Soissons, Château-Thierry, Crécy, Coulommiers
    and Provins are the king's; the English hold nothing on the Loire about Orléans, and Auxerre stays Burgundian.
    Bedford is in Paris with Cardinal Beaufort's reinforcement from England, and holds Paris, Normandy, the Brie about
    Paris and the towns between the Oise and Paris. At Reims La Trémoille signed a truce of fifteen days with the Duke
    of Burgundy's envoys (Ramsay), and Joan was told the duke would give up Paris at its end. The reader has been told
    that Joan called the king the Dauphin until Reims, and that the borders and roads on the map are approximate; the
    chapter says the second once again.
  introduces: [Bray, Montépilloy, Notre-Dame-de-la-Victoire, Senlis, Crépy, Creil, Pont-Sainte-Maxence, Choisy, Gournay-sur-Aronde, Aumale, Blangy, Nogent, Guillaume de Flavy, Pierre Cauchon, Louis of Luxembourg, Thérouanne, L'Isle-Adam, the lord of Créqui, Sir John Ratcliffe, Simon Morhier, the captain of Orbec, the Porte Saint-Honoré, the Porte Saint-Denis, the pig market, La Chapelle, Montmartre, the Baron of Montmorency, Jacques de Chabannes, Courtenay, Montargis, Marguerite La Touroulde, Charles d'Albret, Perrinet Gressart, François de Surienne, Saint-Pierre-le-Moûtier, Cosne, Moulins, Clermont-Ferrand, Riom, the Count of Montpensier, Raymon de Montremur, Regnault Thierry, Saint Catherine, Saint Margaret, Franquet d'Arras, Louis de Flavy, Montdidier, Guichard Bournel, Coudun, Clairoix, Margny, Venette, the Earl of Arundel, Lord Montgomery, Baudot de Noyelle, Bartolomeo Baretta, John of Luxembourg, the Bastard of Wandonne, Poton le Bourguignon, Saint-Quentin, Chastellain, the Berry herald, Bouchart, Moranvillé]
  hands_on: >-
    On the evening of 23 May 1430 Joan is a prisoner in the keeping of John of Luxembourg, the Burgundian captain whose
    man the Bastard of Wandonne took her, in his lodging by Compiègne; the Duke of Burgundy has seen her. Compiègne,
    under Guillaume de Flavy, is besieged by the Burgundians with an English force at Venette, and Soissons and Choisy
    are lost to them; Charles VII still holds Senlis, Beauvais, Creil, Lagny and Melun north of the Loire, Gressart
    still holds La Charité, and Paris and Normandy are English. The truce with Burgundy ran out at Easter. Left
    unsettled: what John of Luxembourg will do with her and whether Compiègne will hold, which section 060 tells.
  left_out:
    - { event: "the terms of the truce of 28 August 1429: its land, its towns and how long it ran", why: "rules.md leaves them out, as the authors read give them differently (050.10); the text gives its date and place." }
    - { event: "the dates the Wikipedia articles give for Montépilloy (26 August), Saint-Pierre-le-Moûtier (4 November) and La Charité (24 November to 25 December), and La Charité delivered for a ransom", why: "no source that counts carries them (050.3, 050.37, 050.40, 050.41)." }
pages:
  montepilloy:
    account: >-
      Early in August 1429 the royal council at Provins resolved to cross the Seine at Bray and go back over the Loire;
      the townsmen of Bray promised the passage, but the night before the crossing they let in a company of English and
      Burgundians (Chartier and the Journal of the Siege, followed by Lowell and Ramsay). The captains of the war party,
      Alençon, Bar, Vendôme and Laval among them, were glad of the check, and the army turned north again by Coulommiers
      to Crépy. Bedford, regent of France for Henry VI, sent the king a letter of challenge dated at Montereau on 7
      August, which reached him at Crépy on 11 August. On Sunday 14 August the two armies came face to face at
      Montépilloy near Senlis: the French lodged at evening by a hedge in the fields about two leagues from Senlis, and
      Bedford half a league from the town, between them and it, by the abbey of Notre-Dame-de-la-Victoire on the little
      river Nonette, where his men fortified themselves overnight with stakes, ditches and carts, the river at their
      back. His main body was English, with Picards and French of the Burgundian party on the other wing (on the right,
      Lowell); the French were in an advance guard under Alençon, a centre under René, Duke of Bar, a rear with the king
      and La Trémoille, and skirmishers under Joan, the Bastard of Orléans and La Hire (Lowell alone gives this order).
      There was a skirmish on the evening of the 14th, in which Cagny has the English captain of Orbec and ten or twelve
      others killed, and on Monday 15 August, the Assumption, the armies stood in array all day and skirmished, and
      Bedford would not come out of his camp. Monstrelet counts about 300 killed in the skirmishes and does not know
      which side lost more. The strengths are each author's: Cagny gives Bedford 8,000 to 9,000 English and the French
      6,000 to 7,000 (Lang follows him); Monstrelet gives the king men-at-arms much superior in number, with 600 to 800
      Burgundians with Bedford; the Journal of the Siege has Bedford as many as the king; Lowell and Ramsay make the
      French the more numerous. On the morning of the 16th Bedford fell back by Senlis to Paris, and the French went back
      to the king at Crépy. The days are Cagny's, which Lowell, Ramsay, Lang and Beaucourt follow. Compiègne sent its
      keys to the king at Crépy on Wednesday 17 August, and he entered it on Thursday 18 August and made Guillaume de
      Flavy its captain at the townsmen's asking. Senlis yielded by treaty to Vendôme and the marshals and had letters of
      abolition dated 22 August, and Vendôme stayed as its governor; Beauvais came over and drove out its bishop, Pierre
      Cauchon, who went to Rouen. Creil, Pont-Sainte-Maxence, Choisy and Gournay-sur-Aronde (Monstrelet), Aumale and
      Blangy (Ramsay) and Lagny on the Marne (Lowell) came over too; Paris and Normandy stayed with Henry VI. Bedford,
      seeing Senlis French, left Paris to its burgesses, to L'Isle-Adam and the Burgundians and to Louis of Luxembourg,
      Bishop of Thérouanne, Henry VI's chancellor, and went into Normandy; Lowell has the Duke of Burgundy accept from
      him the office of governor of Paris. Meanwhile the king's embassy under Regnault de Chartres, Archbishop of Reims,
      who with La Trémoille and Gaucourt governed the king and his war, treated with the Duke of Burgundy at Arras, and
      at Compiègne on 28 August a truce with him was signed; the authors give its land and its length differently, and
      the text does not give its terms. The map shows the army's road from Provins toward Bray and north by Coulommiers to
      Crépy, out to Montépilloy and back by Crépy to Compiègne, and Bedford's road from Paris to his camp and back, all
      reconstructions from the towns the sources name, and the towns between the Oise and Paris marked as the king's;
      the English zone without them is a reconstruction drawn round those towns, and the text says once in the chapter
      that the borders and roads are approximate. Senlis waits under the abbey's icon and Choisy under Compiègne's at
      the opening view, so the text links both.
