  auxerre-and-troyes:
    account: >-
      At Gien, where Joan and Alençon joined the king on Friday 24 June, the princes and captains wished him to go into
      Normandy and others to take La Charité and the upper Loire first; Joan held for Reims, and the council gave way.
      Impatient at the delay, she went to lodge in the fields two days before he left, and on Wednesday 29 June the king
      set out from Gien (Cagny, Ramsay). He had no money to pay the army, and knights, squires and common men went with
      her unpaid (Cagny). Friar Richard, a preaching friar lately driven from Paris, followed the army: with the king from
      Gien in Monstrelet, who calls him an Augustinian, and coming over to Joan at Troyes in Lowell, who calls him a
      Franciscan. The towns of Champagne had held for the Anglo-Burgundians since about the Treaty of Troyes, with small
      garrisons under captains in English pay in Lowell and with no English garrisons in Oman. Auxerre, a Burgundian
      town, would not open its gates: under a truce it sold food to the army and promised to do as Troyes, Châlons and
      Reims did, and after about three days the king passed on. The Journal of the Siege says its citizens secretly paid
      La Trémoille 2,000 écus to spare them an assault that Joan and several captains thought easy; Lang tells it as a
      thing said. Saint-Florentin submitted on the road to Troyes (the Journal, Ramsay; Monstrelet names it before
      Auxerre). Troyes refused the summons, its garrison of 500 to 600 English and Burgundians (the Journal) sallied, and
      the army lay before it short of food, men living on beans (Ramsay). The text follows Cagny for the days, the king
      before the town after dinner on Friday 8 July and in it on Sunday 10 July. At the council the captains were told
      that the army lacked artillery and money, and most held Troyes too strong for it (the Journal); Robert le Maçon
      asked that Joan be heard, and she promised the town within two or three days, by love or by force, and set about
      readying an assault, and the bishop and the townsmen came out to treat. The garrison was to go with its goods, the
      town to have a general pardon, and the churchmen named under Henry VI to keep their benefices. When the garrison
      would have led off its French prisoners under the terms, Joan would not allow it, and the king paid their ransoms
      (the Journal). The king entered Troyes on Sunday 10 July; Ramsay dates the capitulation the 9th. The map shows
      the army's road from Orléans to Gien and the king's from Gien by Auxerre and Saint-Florentin to Troyes, reconstructions
      from the towns named, Auxerre left Burgundian, and Saint-Florentin and Troyes marked as the king's.
