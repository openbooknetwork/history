  the-army-of-blois:
    account: >-
      The English held Orléans with a chain of detached bastilles on both banks that covered the west and the south
      and left the north-east open, so that armed companies came and went (Ramsay, Lang, Oman). Their number differs:
      seven on the north bank and four on the south with the Tourelles and the Île Charlemagne (Ramsay), ten or eleven
      (the chronicle of the feast), thirteen places, boulevards and bastilles, in December 1428 (the Chronique), not fewer than sixty towers and batteries (Monstrelet). By name: on the north bank
      Saint-Laurent, the largest, outside the west gate, where the chief captains and most of the English strength lay;
      London, Rouen at the Pressoir-Ars and Paris at Saint-Pouair to the north-west and north; Saint-Loup to the east;
      on the south bank Saint-Jean-le-Blanc, the Augustins, Saint-Privé and the Tourelles; and the Île Charlemagne
      between (the Chronique de la Pucelle, Girault, the chronicle of the feast). Suffolk had the chief command after
      Salisbury's death, with Lord Talbot and Lord Scales, as lieutenants of Bedford; William Glasdale held the
      Tourelles. Their strength is given as 10,000 under the captains Bedford sent after Salisbury's death, who closed the Beauce side in December 1428 (the Chronique), an army of 5,000 (Oman),
      hardly equal to the French regulars in May (Lowell); the text gives each with its author. On Saturday 30 April
      La Hire and Florent d'Illiers made a sortie towards Saint-Pouair, in which she took no part (the Journal, which
      Lowell follows). The English had kept the herald who carried her letter, and answered that they would burn her,
      calling her a whore and telling her to go back to keeping cows (the Journal, the Chronique, the Bourgeois). From
      the French boulevard of the Belle-Croix on the bridge, facing the Tourelles across the broken arches, she called
      on Glasdale and his men to yield, their lives safe, and they insulted her and called her a cowherd. The Journal
      and Lowell put this on the evening of 30 April, and the Chronique, with Ramsay after it, on the Ascension, 5 May;
      the body follows the Journal and names the Chronique. On Sunday 1 May the Bastard of Orléans left for Blois to
      bring the army back (the Journal, which Lowell follows); she rode through the city, and on Monday 2 May rode out
      to look at the English bastilles and heard vespers at Sainte-Croix (the Journal). The army left Blois on 3 May
      along the north bank through the Beauce, lay a night at a village halfway (the Chronique), and on the morning of
      4 May, met by her and about 500 men (the Journal; Lang gives the same), came into the city past the English
      bastilles, whose garrisons did not come out; garrisons from Montargis, Gien and Château-Renard came in on 3 May
      (the Chronique), and Ramsay has the force from Gien and Montargis join the army before it came in. The chronicle of the feast and Lang name the bastille of Paris as the one it passed
      close by; the Journal and the Chronique name none, and the text names no other. Lowell puts the regular troops
      in the city then at about 5,000, besides several thousand armed citizens. The map shows the north-western
      bastilles, the Île Charlemagne, the Belle-Croix and her lodging, and the army's road round the north of the city;
      the places of the bastilles and the road are reconstructions, as the text says once in the chapter.
