pages.otlukbeli.date: "Nisan – Ağustos 1473"

# The march to the Euphrates
pages.otlukbeli.title: "Fırat’a yürüyüş"

# The Euphrates (Karasu), which runs through the plain of Tercan
emblems.otlukbeli-euphrates.euphrates: "Tercan ovasından geçen Fırat (Karasu)"

# Here the river spreads over banks of sand, where an army can cross
emblems.otlukbeli-euphrates.shallows: "Irmak burada kum sığlıklarının üzerine yayılır ve bir ordunun geçebileceği bir geçit verir"

# A stream that runs from the heights east of Otlukbeli down to the Euphrates
emblems.otlukbeli-euphrates.stream: "Otlukbeli’nin doğusundaki yükseltilerden Fırat’a inen bir dere"

# The Ottoman camp with Mehmed and the main army, pitched on the west bank at the edge of the sandbanks, where the Ottomans expect Uzun Hasan to cross
emblems.otlukbeli-euphrates.camp: "Batı kıyıda, kum sığlıklarının kenarında kurulan, Mehmed’in ve ana ordunun bulunduğu Osmanlı ordugâhı. Osmanlılar Uzun Hasan’ın ırmağı burada geçeceğini düşünür"

# Mahmud Pasha’s troops, who cross with Has Murad, suspect a trick and come back across the river
emblems.otlukbeli-euphrates.mahmud: "Has Murad’la birlikte ırmağı geçen, bir tuzaktan kuşkulanıp geri dönen Mahmud Paşa’nın askerleri"

# Has Murad Pasha, the young beylerbey of Rumelia, with his troops, surrounded on the east bank. Turahanoğlu Ömer Bey is taken prisoner here
emblems.otlukbeli-euphrates.has-murad: "Doğu kıyıda kuşatılan genç Rumeli beylerbeyi Has Murad Paşa ve askerleri. Turahanoğlu Ömer Bey burada esir düşer"

# Uğurlu Mehmed, a son of Uzun Hasan, with 10,000 horsemen. They ride away as if in flight, then turn on Has Murad
emblems.otlukbeli-euphrates.ughurlu: "Uzun Hasan’ın oğlu Uğurlu Mehmed ve 10.000 atlısı. Kaçıyormuş gibi çekilir, sonra Has Murad’ın üzerine döner"

# Horsemen hidden in ambush north of the plain
emblems.otlukbeli-euphrates.ambush-north: "Ovanın kuzeyinde pusuya yatan atlılar"

# Horsemen hidden in ambush south of the plain
emblems.otlukbeli-euphrates.ambush-south: "Ovanın güneyinde pusuya yatan atlılar"

# Uzun Hasan’s army, encamped on the far side of the river
emblems.otlukbeli-euphrates.uzun-hasan: "Irmağın öbür yakasında konaklayan Uzun Hasan’ın ordusu"

# Has Murad and Mahmud Pasha cross the river and chase the retreating horsemen
emblems.otlukbeli-euphrates.cross: "Has Murad ile Mahmud Paşa ırmağı geçer ve çekilen atlıları kovalar"

# The men in ambush ride out behind Has Murad
emblems.otlukbeli-euphrates.ambush-ride: "Pusudakiler Has Murad’ın arkasından çıkar"

# Has Murad’s men are driven back into the river. He drowns with about 4,000 of them
emblems.otlukbeli-euphrates.flight: "Has Murad’ın askerleri ırmağa sürülür. Has Murad 4.000 kadar adamıyla birlikte boğulur"

# Mahmud Pasha pulls back across the river
emblems.otlukbeli-euphrates.mahmud-back: "Mahmud Paşa ırmağın öbür yakasına çekilir"

# 4 August 1473
pages.otlukbeli-euphrates.date: "4 Ağustos 1473"

# The ambush on the Euphrates
pages.otlukbeli-euphrates.title: "Fırat kıyısındaki pusu"

# The Euphrates (Karasu), which runs through the plain of Tercan
emblems.otlukbeli-battle.euphrates: "Tercan ovasından geçen Fırat (Karasu)"

# Here the river spreads over banks of sand, where an army can cross
emblems.otlukbeli-battle.shallows: "Irmak burada kum sığlıklarının üzerine yayılır ve bir ordunun geçebileceği bir geçit verir"

# A stream that runs from the heights east of Otlukbeli down to the Euphrates
emblems.otlukbeli-battle.stream: "Otlukbeli’nin doğusundaki yükseltilerden Fırat’a inen bir dere"

# The Ottoman camp at Üç Ağız, the junction of three valleys near Tercan, a narrow place where the army halts on 11 August
emblems.otlukbeli-battle.camp: "Ordunun 11 Ağustos’ta konakladığı, Tercan yakınında üç vadinin birleştiği dar yer olan Üç Ağız’daki Osmanlı ordugâhı"

# Davud Pasha, the beylerbey of Anatolia, with the Anatolian troops. He throws back Gavur İshak and takes his post on the plain
emblems.otlukbeli-battle.davud: "Anadolu beylerbeyi Davud Paşa ve Anadolu askerleri. Gavur İshak’ı geri püskürtür ve ovada yerini alır"

# Şehzade Mustafa, the governor of Karaman, with his troops and the azebs, the foot soldiers among whom Zeynel is killed
emblems.otlukbeli-battle.mustafa: "Karaman valisi Şehzade Mustafa, askerleri ve Zeynel’in aralarında öldürüldüğü yaya askerler olan azaplar"

# The janissaries’ guns and the light mortars that Mehmed has cast for this campaign
emblems.otlukbeli-battle.guns: "Yeniçerilerin topları ve Mehmed’in bu sefer için döktürdüğü hafif havan topları"

# The janissaries, about 25,000, whom Mehmed sends in when the Aq Qoyunlu right has broken
emblems.otlukbeli-battle.janissaries: "Akkoyunlu sağ kanadı dağılınca Mehmed’in ileri sürdüğü 25.000 kadar yeniçeri"

# Mehmed with the horsemen of his household
emblems.otlukbeli-battle.mehmed: "Mehmed ve kapıkulu atlıları"

# Şehzade Bayezid, the governor of Amasya, with the right wing
emblems.otlukbeli-battle.bayezid: "Amasya valisi Şehzade Bayezid ve sağ kanat"

# The right wing under Zeynel, a son of Uzun Hasan, with Sufi Khalil Mawsillu and Sulayman Bijan
emblems.otlukbeli-battle.zeynel: "Uzun Hasan’ın oğlu Zeynel Mirza’nın, Musullu Sufi Halil ve Süleyman Bican’la birlikte komuta ettiği sağ kanat"

# Uzun Hasan’s centre on the slope of the ridge, with Pir Ahmed of Karaman. Most of his army are horsemen, with foot soldiers armed with lances
emblems.otlukbeli-battle.centre: "Sırtın yamacında, Karamanoğlu Pir Ahmed’le birlikte Uzun Hasan’ın merkezi. Ordusunun çoğu atlıdır, yanlarında mızraklı yayalar vardır"

# The left wing under Uzun Hasan’s nephews Murad and Alikhan, with Mehmed Bakır
emblems.otlukbeli-battle.left: "Uzun Hasan’ın yeğenleri Murad ile Alihan’ın komutasında, Mehmed Bakır’ın da bulunduğu sol kanat"

# Uğurlu Mehmed with a swift force on a hill behind the stream, to back up the left wing
emblems.otlukbeli-battle.ughurlu: "Sol kanadı desteklemek için derenin ardındaki bir tepede bekleyen Uğurlu Mehmed ve hızlı birliği"

# At noon Gavur İshak’s men come down from the hill of Otlukbeli. Davud Pasha’s Anatolian troops throw them back to the main army
emblems.otlukbeli-battle.ishak: "Öğle vakti Gavur İshak’ın adamları Otlukbeli tepesinden iner. Davud Paşa’nın Anadolu askerleri onları ana orduya geri püskürtür"

# Mustafa falls on Zeynel’s wing. Zeynel is killed and the Aq Qoyunlu right breaks
emblems.otlukbeli-battle.mustafa-charge: "Mustafa Zeynel’in kanadına saldırır. Zeynel öldürülür ve Akkoyunlu sağ kanadı dağılır"

# Bayezid attacks Uğurlu Mehmed, who holds the stream between them, and then turns on Mehmed Bakır’s men
emblems.otlukbeli-battle.bayezid-attack: "Bayezid önündeki dereyi tutan Uğurlu Mehmed’e saldırır, sonra Mehmed Bakır’ın adamlarına yönelir"

# Mehmed sends the janissaries forward
emblems.otlukbeli-battle.janissaries-advance: "Mehmed yeniçerileri ileri sürer"

# Uzun Hasan leaves the field. Pir Mehmed Bey, who looks like him, stays behind in his place and is taken
emblems.otlukbeli-battle.flight: "Uzun Hasan savaş alanından ayrılır. Ona benzeyen Pir Mehmed Bey onun yerinde kalır ve esir alınır"

