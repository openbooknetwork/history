# Sigismund’s winter campaign
pages.kutna-hora.title: "Sigismund’un kış seferi"

# The Vrchlice brook in its valley below the town
emblems.kutna-hora-ring.vrchlice: "Kentin altındaki vadisinde Vrchlice deresi"

# Kutná Hora, the silver town, drawn after the outline of the medieval town
emblems.kutna-hora-ring.walls: "Gümüş kenti Kutná Hora, ortaçağ kentinin sınırlarına göre çizilmiştir"

# Wagon fort of the Hussites of Tábor, Prague and the towns, a third of the royal army by Thomas Ebendorfer. The wagons stand chained wheel to wheel, guns and handguns fire through the gaps, flails and halberds hold them. The number of wagons is not recorded, 36 are drawn.
emblems.kutna-hora-ring.fort: "Tábor, Prag ve kentlerin Husçuları, Thomas Ebendorfer’e göre kraliyet ordusunun üçte biri kadar araba kalesi. Arabalar tekerlek tekerleğe zincirlenmiştir, toplar ve el topları aralıklardan ateş eder, savaş dövenleri ve teberler aralıkları tutar. Araba sayısı kaydedilmemiştir, 36 araba çizilmiştir."

# Guns and handguns on the western side of the fort, facing the royal army
emblems.kutna-hora-ring.guns: "Kalenin batı yanında, kraliyet ordusuna dönük toplar ve el topları"

# Hussite foot with flails, halberds and pikes, the men of Kutná Hora who marched out with them among them
emblems.kutna-hora-ring.foot: "Savaş dövenleri, teberler ve kargılarla Husçu yayalar, aralarında onlarla birlikte çıkan Kutná Hora’nın adamları"

# The largest royal body, Hungarian horse and foot with many hundreds of oxen and cows driven among them as cover against the guns, by Laurence of Březová. Sigismund’s army: about 50,000 by the Old Czech Annals, 80,000 Hungarians and 12,000 Austrians by Eberhard Windecke
emblems.kutna-hora-ring.main-body: "En büyük kraliyet bölüğü: Vavřinec z Březové’ye göre toplara karşı korunmak için aralarına yüzlerce öküz ve inek sürülmüş Macar atlılar ve yayalar. Sigismund’un ordusu: Eski Çek Yıllıkları’na göre yaklaşık 50.000, Eberhard Windecke’ye göre 80.000 Macar ve 12.000 Avusturyalı"

# Hungarian horse under Pippo Spano
emblems.kutna-hora-ring.hungarians: "Pippo Spano komutasında Macar atlılar"

# Austrian men at arms sent by Duke Albert V
emblems.kutna-hora-ring.austrians: "Dük V. Albrecht’in gönderdiği Avusturyalı zırhlı atlılar"

# Moravian lords and the Catholic lords of Bohemia
emblems.kutna-hora-ring.lords: "Moravyalı senyörler ve Bohemya’nın Katolik senyörleri"

# Royal troops in Kutná Hora, many hundreds let in through the Kolín gate by exiles from the town, by Laurence of Březová
emblems.kutna-hora-ring.in-town: "Kutná Hora’daki kraliyet askerleri, Vavřinec z Březové’ye göre kentten sürülmüş kişilerin Kolín kapısından içeri aldığı yüzlerce adam"

# After a short breakfast the Hussites march out of the Kouřim gate and close their wagons about 400 m from the walls
emblems.kutna-hora-ring.march-out: "Kısa bir kahvaltının ardından Husçular Kouřim kapısından çıkar ve arabalarını surların yaklaşık 400 m ötesinde kale biçiminde kapatır"

# The royal bodies charge the wagons and are driven back by the guns, until night
emblems.kutna-hora-ring.attacks: "Kraliyet bölükleri gece çökene kadar arabalara hücum eder ve toplarla geri püskürtülür"

# Guns and handguns fire from the wagons and keep the horse at a distance
emblems.kutna-hora-ring.gunfire: "Toplar ve el topları arabalardan ateş eder ve atlıları uzakta tutar"

# Exiles from Kutná Hora open the Kolín gate to royal troops, who kill the Hussites in the town
emblems.kutna-hora-ring.kolin-gate: "Kutná Hora’dan sürülmüş kişiler Kolín kapısını kraliyet askerlerine açar, bunlar kentteki Husçuları öldürür"

# 21 December 1421
pages.kutna-hora-ring.date: "21 Aralık 1421"

# The wagon fort before the town
pages.kutna-hora-ring.title: "Kent önündeki araba kalesi"

# The Vrchlice brook in its valley below the town
emblems.kutna-hora-breakout.vrchlice: "Kentin altındaki vadisinde Vrchlice deresi"

# Kutná Hora, the silver town, drawn after the outline of the medieval town
emblems.kutna-hora-breakout.walls: "Gümüş kenti Kutná Hora, ortaçağ kentinin sınırlarına göre çizilmiştir"

# The royal camp, pitched barely a bowshot from the wagon fort to draw food from the town
emblems.kutna-hora-breakout.camp: "Kentten erzak almak için araba kalesinin ancak bir ok atımı ötesine kurulan kraliyet ordugâhı"

# The wagons of the Hussites of Tábor, Prague and the towns, a third of the royal army by Thomas Ebendorfer, in a column. They drive through the royal camp in the dark, and the guns on the wagons fire as they roll. Fewer wagons are drawn than there were.
emblems.kutna-hora-breakout.column: "Tábor, Prag ve kentlerin Husçuları, Thomas Ebendorfer’e göre kraliyet ordusunun üçte biri kadar arabaları, bir kol halinde. Karanlıkta kraliyet ordugâhının içinden geçerler, arabaların üzerindeki toplar ilerlerken ateş eder. Gerçekte olduğundan az araba çizilmiştir."

# Royal horse scattered by the gunfire in the dark
emblems.kutna-hora-breakout.scattered: "Karanlıktaki top ateşiyle dağılan kraliyet atlıları"

# Royal troops hold Kutná Hora
emblems.kutna-hora-breakout.in-town: "Kraliyet askerleri Kutná Hora’yı tutar"

# In the night the Hussites leave their position before the town
emblems.kutna-hora-breakout.set-out: "Gece Husçular kent önündeki mevzilerini bırakır"

# At daybreak, less than a quarter of a mile on, the wagons close into a fort again below Kaňk
emblems.kutna-hora-breakout.to-kank: "Gün ağarırken, çeyrek milden kısa bir mesafe ötede, arabalar Kaňk’ın eteğinde yeniden kale biçiminde kapanır"

# The guns on the wagons fire into the camp as the column rolls
emblems.kutna-hora-breakout.gunfire: "Kol ilerlerken arabaların üzerindeki toplar ordugâha ateş eder"

# The royal troops scatter out of the camp
emblems.kutna-hora-breakout.flight: "Kraliyet askerleri ordugâhtan dağılır"

# Night of 21 to 22 December 1421
pages.kutna-hora-breakout.date: "21 Aralık’ı 22 Aralık 1421’e bağlayan gece"

# The breakout
pages.kutna-hora-breakout.title: "Kuşatmanın yarılması"

# The Hussite army of Taborites, Praguers and Orebites with its wagons, and the men raised round Jičín and Turnov. The chronicles do not record how the wagons stood at Nebovidy. Fewer wagons are drawn than there were.
emblems.nebovidy.wagons: "Táborcular, Praglılar ve Orebçilerden oluşan Husçu ordusu arabalarıyla, yanlarında Jičín ve Turnov çevresinden toplanan adamlar. Vakayinameler Nebovidy’de arabaların nasıl durduğunu kaydetmez. Gerçekte olduğundan az araba çizilmiştir."

# Hussite foot attacking the height
emblems.nebovidy.foot: "Yükseltiye saldıran Husçu yayalar"

# Prague foot
emblems.nebovidy.praguers: "Praglı yayalar"

# The royal vanguard, mostly Hungarians, on the rising ground south of the village. It cannot form a line before the Hussites are on it. The royal troops stood on the hills “so thick that it looked like a forest”, by the Old Czech Annals
emblems.nebovidy.vanguard: "Köyün güneyindeki yükseltide, çoğu Macarlardan oluşan kraliyet öncüsü. Husçular üzerine gelmeden bir hat kuramaz. Eski Çek Yıllıkları’na göre kraliyet askerleri tepelerde “orman gibi görünecek kadar sık” durur"

# Žižka’s army comes from Kolín, about 4 km to the north
emblems.nebovidy.from-kolin: "Žižka’nın ordusu yaklaşık 4 km kuzeydeki Kolín’den gelir"

# The Hussite foot go forward from the wagons
emblems.nebovidy.advance: "Husçu yayalar arabalardan ileri çıkar"

# The Hussites attack before the vanguard can form a line
emblems.nebovidy.attack: "Husçular öncü bir hat kurmadan saldırır"

# The vanguard breaks and flees towards Kutná Hora
emblems.nebovidy.flight: "Öncü dağılır ve Kutná Hora’ya doğru kaçar"

# 6 January 1422
pages.nebovidy.date: "6 Ocak 1422"

# Nebovidy
pages.nebovidy.title: "Nebovidy"

# The Sázava, frozen over in January 1422, drawn wider than it is
emblems.nemecky-brod.sazava: "Ocak 1422’de donmuş Sázava, olduğundan geniş çizilmiştir"

# Německý Brod, held by part of the royal commanders and their men to cover the flight
emblems.nemecky-brod.town: "Kaçışı korumak için kraliyet komutanlarının bir kısmının ve adamlarının tuttuğu Německý Brod"

# The royal army in flight from Habry, 8 January 1422
emblems.nemecky-brod.fleeing: "Habry’den kaçan kraliyet ordusu, 8 Ocak 1422"

# Hussite horse in pursuit
emblems.nemecky-brod.horse: "Takipteki Husçu atlılar"

# The wagons of the Hussites of Tábor, Prague and the towns, a third of the royal army by Thomas Ebendorfer, following the same day. Fewer wagons are drawn than there were
emblems.nemecky-brod.wagons: "Tábor, Prag ve kentlerin Husçuları, Thomas Ebendorfer’e göre kraliyet ordusunun üçte biri kadar arabaları, aynı gün arkadan gelir. Gerçekte olduğundan az araba çizilmiştir"

# The fugitives cross the frozen Sázava, and the ice breaks under the armoured men
emblems.nemecky-brod.ice: "Kaçanlar donmuş Sázava’yı geçer ve buz zırhlı adamların altında kırılır"

# The rest of the royal army flees south into Moravia
emblems.nemecky-brod.south: "Kraliyet ordusunun geri kalanı güneye, Moravya’ya kaçar"

# The Hussite horse ride down the fugitives
emblems.nemecky-brod.pursuit: "Husçu atlılar kaçanlara yetişir"

# 10 January: Hussite troops break into the town without Žižka’s order while the garrison is negotiating, and kill most of it
emblems.nemecky-brod.assault: "10 Ocak: Garnizon teslim olmak için görüşürken Husçu askerler Žižka’nın emri olmadan kente girer ve garnizonun çoğunu öldürür"

