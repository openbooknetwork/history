  replaces: "value"
  old: "- 020.58 Event: after about ten days at Tours she goes up the Loire to Blois with the Archbishop of Reims and Gaucourt, where the convoy for Orléans gathers under the marshals de Rais and de Boussac, the admiral de Culant and La Hire; the force leaves Blois and comes opposite Orléans on the south bank on 28 April. agreed (Dunois; Lowell; Lang). \"the King sent her with the Lord Archbishop of Rheims … and the Sieur de Gaucourt, then Grand Steward, to Blois, where those were who had the charge of escorting the convoy\" (archive.org-download-jeannedarcmaidof028754mbp-jeannedarcmaidof028754mbp-djvu.txt.txt, deposition of Dunois, lines 12025-12029, primary) \"After staying about ten days at Tours, Joan went up the Loire to Blois, where the troops had their rendezvous,\" (archive.org-download-joanofarc00lowe-joanofarc00lowe-djvu.txt.txt, ch. 6, lines 3451-3452, scholarly) \"When they left Blois, the clergy went in advance, singing Veni creator spiritus. On April 28 this strange force, with a convoy of cattle, arrived opposite Orleans by the south bank of the Loire\" (archive.org-download-maidoffrancebein00languoft-maidoffrancebein00languoft-djvu.txt.txt, ch. 10, lines 5227-5230, scholarly)"
  new: "- 020.58 Event: after about ten days at Tours she goes up the Loire to Blois with the Archbishop of Reims and Gaucourt, where the convoy for Orléans gathers under the marshals de Rais and de Boussac, the admiral de Culant and La Hire; the force leaves Blois and comes opposite Orléans by the south bank. agreed (Dunois; Lowell; Lang). disputed for the day: opposite Orléans on 28 April, Lang; out of Blois on the morning of Thursday 28 April, a night in the fields, and on the heights of Olivet about noon on Friday 29 April, Lowell. \"the King sent her with the Lord Archbishop of Rheims … and the Sieur de Gaucourt, then Grand Steward, to Blois, where those were who had the charge of escorting the convoy\" (archive.org-download-jeannedarcmaidof028754mbp-jeannedarcmaidof028754mbp-djvu.txt.txt, deposition of Dunois, lines 12025-12029, primary) \"After staying about ten days at Tours, Joan went up the Loire to Blois, where the troops had their rendezvous,\" (archive.org-download-joanofarc00lowe-joanofarc00lowe-djvu.txt.txt, ch. 6, lines 3451-3452, scholarly) \"When they left Blois, the clergy went in advance, singing Veni creator spiritus. On April 28 this strange force, with a convoy of cattle, arrived opposite Orleans by the south bank of the Loire\" (archive.org-download-maidoffrancebein00languoft-maidoffrancebein00languoft-djvu.txt.txt, ch. 10, lines 5227-5230, scholarly) \"On the morning of Thursday, April 28, … about Friday noon Joan came upon the heights of Olivet,\" (archive.org-download-joanofarc00lowe-joanofarc00lowe-djvu.txt.txt, ch. 8, lines 4266-4278, scholarly)"
