    disputes:
      - { claim: "020.12", how: "the body says he came over in July 1428, and a note gives Lowell's landing at Calais about 1 July and Ramsay's muster at Sandwich on 19 July." }
      - { claim: "020.13", how: "each figure names its author: Ramsay's 2,700 from England, Lowell's four or five thousand." }
      - { claim: "020.15", how: "the body gives both counts from Salisbury's letter, each with its author." }
      - { claim: "020.18", how: "the body says the bridge was broken, and names the Journal (the English broke it) and Lowell (the French)." }
      - { claim: "020.19", how: "the body gives the Journal's days, the primary account, and a note gives Ramsay's 27 October and 3 November and Monstrelet's eight days." }
      - { claim: "020.20", how: "the body gives Suffolk the command and adds Lowell's division of it among three from late November." }
      - { claim: "020.21", how: "the body has the Bastard of Orléans command inside the city, and gives his coming on 25 October as the Journal's, with Lowell's succession to Gaucourt in a note." }
      - { claim: "020.24", how: "the body tells the park of carts and stakes, which all agree on, and a note gives the Journal's one entry, Monstrelet's two openings and Oman's archers on the carts." }
      - { claim: "020.26", how: "the card gives each strength with its author, and the text names no number without one." }
      - { claim: "020.27", how: "the card gives the Journal's and Monstrelet's dead, each with its author." }
    sources:
