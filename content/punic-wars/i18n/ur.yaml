# Fugitives drown
markers.trasimene-end-lake.note: "بھاگنے والے ڈوبتے ہیں"

# Three hours of hard fighting
markers.trasimene-end-gauls.note: "تین گھنٹے کی سخت لڑائی"

# Fabius follows along the high ground
routes.fabius-shadow-217.name: "فابیئس اونچی زمین کے ساتھ ساتھ پیچھا کرتا ہے"

# Hannibal marches from Arpi into the Ager Falernus, summer 217 BC
routes.hannibal-falernus-217.name: "ہنیبال آرپی سے آگر فالیرنس میں داخل ہوتا ہے، گرمیاں 217 ق م"

# Fabius camps about 9 km from Hannibal
markers.aecae-217.note: "فابیئس ہنیبال سے تقریباً 9 کلو میٹر دور پڑاؤ ڈالتا ہے"

# Main army near Mount Massicus
markers.fabius-trap-fabius.note: "کوہِ ماسیکس کے قریب مرکزی فوج"

# Watches the Via Latina and Via Appia
