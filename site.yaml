# The main page: a list of the stories under content/.
title: Open History Atlas
intro: Step-through maps of how places and people changed over time. A free educational project. Pick a story.
languages: [en, tr]
default_language: en
# Order on the main page. Leave out to list stories alphabetically.
stories: [ataturk-turkish-republic, american-revolutionary-war, punic-wars, napoleonic-wars, maya-civilization, viking-age, hussite-wars,
  ottoman-osman-orhan-murad-i]

# Colour theme for the site: cool, mono, navy, parchment or sepia. Readers can switch.
theme: cool

# Where the site is published: canonical links, sitemaps and llms.txt are written from it.
url: https://openhistoryatlas.org/

# Content repository: Contribute link on the main page, source link on every story.
repository: https://github.com/openhistoryatlas/atlas

# The asset store: images and elevation tiles, read by readers and builds at url, written by harita upload.
assets:
  url: https://assets.openhistoryatlas.org/
  bucket: openhistoryatlas-assets
  endpoint: https://929f186b3b6db84ea6cd5dcfe90dd2b3.r2.cloudflarestorage.com

# The site bucket, in the same account: harita deploy writes dist/ there and the Worker in worker/ serves it.
pages:
  bucket: openhistoryatlas-site
