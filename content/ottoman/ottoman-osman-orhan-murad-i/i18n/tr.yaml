# The Serbian heavy horse forms a wedge and charges into the Ottoman left
emblems.kosovo-charge.knights-charge: "Sırp ağır süvarisi kama düzeni alır ve Osmanlı sol kanadına hücum eder"

# Yakub’s wing gives way
emblems.kosovo-charge.yakub-back: "Yakub’un kanadı geri çekilir"

# A Florentine letter of October 1389 has twelve lords cut through the lines and the chained camels to Murad’s tent. Ottoman accounts put his death after the battle
emblems.kosovo-charge.twelve-lords: "Ekim 1389 tarihli bir Floransa mektubuna göre on iki bey safları ve zincirli develeri yararak Murad’ın çadırına ulaşır. Osmanlı anlatımları onun ölümünü muharebeden sonraya koyar"

# 15 June 1389
pages.kosovo-charge.date: "15 Haziran 1389"

# The Serbian charge
pages.kosovo-charge.title: "Sırp hücumu"

# The river Sitnica
emblems.kosovo-bayezid.sitnica: "Sitnica ırmağı"

# The river Lab, which flows into the Sitnica
emblems.kosovo-bayezid.lab: "Sitnica’ya dökülen Lab ırmağı"

# Vuk Branković’s troops leave the field
emblems.kosovo-bayezid.brankovic: "Vuk Branković’in askerleri alanı terk eder"

# The Serbian heavy horse, its charge spent, hemmed in by Ottoman light troops
emblems.kosovo-bayezid.knights: "Hücumu tükenen Sırp ağır süvarisi Osmanlı hafif birlikleri arasında sıkışır"

# The Serbian foot soldiers of Lazar’s centre, routed
emblems.kosovo-bayezid.lazar: "Lazar’ın merkezindeki Sırp yayaları bozguna uğrar"

# Vuković’s Bosnians, moved toward the centre to make up for the Serbian losses
emblems.kosovo-bayezid.vukovic: "Sırp kayıplarını karşılamak için merkeze kayan Vuković’in Bosna askerleri"

# Light horsemen and foot soldiers of the Ottoman left counterattack the Serbian heavy horse
emblems.kosovo-bayezid.ott-light: "Osmanlı sol kanadının hafif atlıları ve yayaları Sırp ağır süvarisine karşı saldırıya geçer"

# The janissaries and the Ottoman centre advance again
emblems.kosovo-bayezid.janissaries: "Yeniçeriler ve Osmanlı merkezi yeniden ilerler"

# Bayezid’s wing, turned against the Serbian centre
emblems.kosovo-bayezid.bayezid: "Sırp merkezine yönelen Bayezid’in kanadı"

# Bayezid’s counterattack from the right drives the Serbian forces back
emblems.kosovo-bayezid.bayezid-counter: "Bayezid’in sağ kanattan karşı saldırısı Sırp kuvvetlerini geri sürer"

# Ottoman light troops close on the Serbian heavy horse
emblems.kosovo-bayezid.light-counter: "Osmanlı hafif birlikleri Sırp ağır süvarisini sıkıştırır"

# The Serbian foot soldiers are routed
emblems.kosovo-bayezid.serb-rout: "Sırp yayaları bozguna uğrar"

# Vuk Branković leaves the field with his troops after Lazar is captured. Tradition from 1601 on calls it a betrayal, which most historians reject
emblems.kosovo-bayezid.brankovic-leaves: "Vuk Branković, Lazar esir düştükten sonra askerleriyle alanı terk eder. 1601’den sonraki gelenek bunu ihanet sayar, tarihçilerin çoğu bu suçlamayı kabul etmez"

# The Bosnians and the last Serbian troops yield the field
emblems.kosovo-bayezid.bosnians-leave: "Bosna askerleri ve son Sırp birlikleri alanı bırakır"

# 15 June 1389
pages.kosovo-bayezid.date: "15 Haziran 1389"

# Bayezid’s counterattack
pages.kosovo-bayezid.title: "Bayezid’in karşı saldırısı"

# June 1389 – 1390
pages.after-kosovo.date: "Haziran 1389 – 1390"

# After Kosovo, 1389
pages.after-kosovo.title: "Kosova’dan sonra, 1389"

# c. 1280 – 1389
story.span: "y. 1280 – 1389"

# The first three Ottoman rulers, from Osman's raids on Byzantine Bithynia around 1300 through Orhan's Bursa, Nicaea and Gallipoli to Murad I's conquests in Thrace and the Balkans and his death at Kosovo in 1389.
story.summary: "İlk üç Osmanlı hükümdarı: Osman’ın 1300 dolaylarında Bizans’a ait Bitinya’ya akınlarından Orhan’ın Bursa, İznik ve Gelibolu’suna, I. Murad’ın Trakya ve Balkanlar’daki fetihlerine ve 1389’da Kosova’da ölümüne."

# Osman, Orhan and Murad I: From Bithynia to Kosovo
story.title: "Osman, Orhan ve I. Murad: Bitinya’dan Kosova’ya"

