      - { name: henry-v-portrait, shows: "the portrait of Henry V of England in the National Portrait Gallery, London" }
  normandy-and-troyes:
    account: >-
      Henry V lands again at Touques on 1 August 1417 (Ramsay) and marches along the coast to Caen,
      taken by assault on 4 September, its castle on 20 September; Lisieux and Bayeux follow. He
      conquers Normandy town by town, sparing the country, and lays siege to Rouen on 29 July 1418; the city starves
      and surrenders on 19 January 1419 with a ransom of 300,000 écus, and by the end of 1419 only Mont-Saint-Michel is
      left to the French. Meanwhile in May and June 1418 the Burgundians take Paris and massacre the Armagnacs, the
      Count of Armagnac among them, and the Dauphin Charles, the king's last surviving son, fifteen (Lowell) or
      sixteen (Lang), is carried off and flees to Bourges. On 10 September 1419 John the Fearless is killed at a
      meeting with the Dauphin in a fenced enclosure on the bridge of Montereau, where the Yonne meets the Seine, his
      head cleft with an axe; how he was struck and what the Dauphin knew are disputed and the text takes no side. His
      son Philip the Good and the Burgundian party go over to Henry V. By the Treaty of Troyes, sealed in the
      cathedral of Troyes on 21 May 1420, Henry is made heir and regent of Charles VI, the two crowns to be united at
      Charles VI's death, the Dauphin is disinherited and branded with the murder of Montereau, and none is to treat
      with him; on 2 June Henry marries Catherine of Valois in the same cathedral (Ramsay's day). After Troyes the war
      reaches the Meuse: the Burgundians invade Bar, the Cardinal of Bar resigns the duchy to René of Anjou under the
      guardianship of the Duke of Lorraine, and the Duke of Lorraine swears allegiance to Henry V (Lowell, told with
      his name). The map changes most on this page: Normandy, Paris, the Île-de-France and Champagne go to the English
      and Picardy to the Duke of Burgundy, with the Dauphin's holds of Melun, Meaux, Soissons and Compiègne inside that
      land (Ramsay); the Dauphin's party keeps the rest of the kingdom, with Bourges. The zones are approximate, and the
      route from Touques to Caen keeps to the coast as Wylie and Waugh say, its line a reconstruction. The text links Melun, Meaux, Soissons and Compiègne, whose markers wait under others at the opening view.
    files:
      - { file: .references/archive.org-download-lancasterandyor00ramsgoog-lancasterandyor00ramsgoog-djvu.txt.txt, read: "ch. 17 to 19, l. 16520 to 16650, 17310 to 17600, 18000 to 18470" }
