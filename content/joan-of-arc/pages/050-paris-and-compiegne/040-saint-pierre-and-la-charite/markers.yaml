mehun-1429:
  lnglat: [2.21, 47.15]
  icon: crown
  color: france
  label: "Mehun-sur-Yèvre"
  note: "Charles VII's council resolves here to take La Charité, and Saint-Pierre-le-Moûtier first; here in December 1429 (on 29 December, Thurston) Charles VII ennobles Joan and her family"
bourges-1429:
  lnglat: [2.399, 47.081]
  icon: flag
  color: france
  label: "Bourges"
  note: "Joan stays about three weeks in October 1429 in Marguerite La Touroulde's house (her deposition at the retrial) and gathers her force; its townsmen are asked for 1,300 crowns for La Charité's siege on 24 November"
saint-pierre-le-moutier:
  lnglat: [3.12, 46.8]
  icon: castle
  color: france
  image: saint-pierre-le-moutier-church-c4ab4e
  label: "Saint-Pierre-le-Moûtier"
  note: "Burgundian since 1422 (Lowell), it is taken by assault by 9 November 1429 after a first assault fails; Joan stops her soldiers pillaging its church (Regnault Thierry, at the retrial)"
moulins-1429:
  lnglat: [3.33, 46.57]
  icon: scroll-text
  color: france
  label: "Moulins"
  note: "Joan and Charles d'Albret write from here on 9 November 1429 to Riom for powder, saltpetre, sulphur, arrows and crossbows for La Charité's siege"
la-charite:
  lnglat: [3.02, 47.18]
  icon: castle
  color: burgundy
  image: la-charite-priory-0f0654
  label: "La Charité"
  note: "Perrinet Gressart's town on the Loire, held for Burgundy since 1423; besieged from about 10 November 1429 for about a month, an assault is made, in which a baron of Dauphiné is killed, and its siege is raised with loss of artillery; it stays Gressart's"
cosne-1429:
  lnglat: [2.93, 47.41]
  icon: flag
  color: burgundy
  label: "Cosne"
  note: "A town on the Loire held against Charles VII in autumn 1429, named with La Charité in Charles d'Albret's letter of 9 November"
