  the-towns-come-over:
    account: >-
      The king stayed at Reims to Thursday 21 July (Cagny, Lowell, Ramsay; Anatole France and the Journal's count give the
      20th), then went to the shrine of Saint-Marcoul at Corbeny and touched for the King's Evil, as kings did after their
      anointing. There the keys or the deputies of Laon were brought to him. He went on by Vailly on 22 July and entered
      Soissons, which had sent him its keys, on Saturday 23 July. With the road to Paris open, the army turned south by
      Château-Thierry to Provins and did not march on Paris: Ramsay lays it to La Trémoille, Beaucourt to the wish to
      spare the Duke of Burgundy while the two treated. Château-Thierry, held for Burgundy by the lords of Châtillon, Croy
      and Brimeu, yielded when its townsmen leaned to the king, and its garrison marched off with its goods to Bedford in
      Paris (Monstrelet); the king entered on the evening of 29 July and stayed until 1 August, and there on 31 July, at
      Joan's request, he exempted Domrémy and Greux from taxes (the grant, as Lang and Lowell cite it). Crécy and
      Coulommiers declared for him too (Beaucourt; Ramsay names Coulommiers), and on Tuesday 2 August the king reached
      Provins, where he stayed until Friday 5 August (Cagny). Bedford meanwhile had a reinforcement from England brought
      by Cardinal Beaufort: 250 spears and 2,500 bows entering Paris on 25 July in Ramsay, about 4,000 combatants in
      Monstrelet. On the last day of July Christine de Pizan finished her Ditié of Joan, as its closing lines say.
      Bedford's memorandum names Laon, Sens and Provins with the cities lost after Orléans, and Senlis, Lagny, Creil and
      Beauvais, which came over in August and are told in section 050. The map shows the road from Reims by Corbeny,
      Vailly, Soissons and Château-Thierry to Provins, a reconstruction from the places named; the towns that came over,
      Laon, Soissons, Château-Thierry, Crécy, Coulommiers and Provins, marked as the king's; and the English zone without
      the land between the Marne and the Aisne, a reconstruction drawn round those towns. Paris stays English.
