  new: "010.49 Figure: the numbers at Baugé. disputed: the English in Anjou 10,000 to 12,000 or more, Cagny; Clarence's own body about 1,500 men-at-arms with hardly any archers, Wikipedia; the Scots and French outnumbering his horse two to one, Oman; about 600 English taken, the Chronique de la Pucelle; Wylie and Waugh, weighing the chronicles, give the English 1,500 men-at-arms from a record of the time and find that the victors' counts of the English losses bear out some 1,500 men engaged, the French and Scots being put at 5,000 to 6,000 by Jean Juvenal and at twice the English by Le Fèvre. \"nombre  de  x  à  xij  mille  ou  plus,  estoient  venuz  ou duché  d'Anjou\" (archive.org-download-chroniquesdeperc00cagnuoft-chroniquesdeperc00cagnuoft-djvu.txt.txt, Cagny, Baugé, l. 5945, primary) \"with only about 1500 men-at-arms available, and virtually no archers\" (Battle_of_Baugé.wiki, Battle, wikipedia) \"they outnumbered his horse by two to one\" (archive.org-download-historyofartofwa0002char-historyofartofwa0002char-djvu.txt.txt, Oman book 14 ch. 1, l. 19352, scholarly) \"au  nombre  d'environ 600  hommes\" (archive.org-download-chroniquedelapuc00cousuoft-chroniquedelapuc00cousuoft-djvu.txt.txt, Chronique de la Pucelle ch. 182, l. 7483, primary) \"states  that  the  English  had  1500  men-at-arms\" (archive.org-download-reignofhenryfift03wyliuoft-reignofhenryfift03wyliuoft-djvu.txt.txt, Wylie and Waugh 3, ch. 69, note, l. 17126, scholarly) \"confirm  the  view  that  they  had  some  1500  men  engaged\" (archive.org-download-reignofhenryfift03wyliuoft-reignofhenryfift03wyliuoft-djvu.txt.txt, Wylie and Waugh 3, ch. 69, note, l. 17163, scholarly) \"Scots  are  given  5000-6000  combatants  by  Jean  Juvenal\" (archive.org-download-reignofhenryfift03wyliuoft-reignofhenryfift03wyliuoft-djvu.txt.txt, Wylie and Waugh 3, ch. 69, note, l. 17114, scholarly) \"says  that  the  dauphinists  were  twice  as  many  as  the  English\" (archive.org-download-reignofhenryfift03wyliuoft-reignofhenryfift03wyliuoft-djvu.txt.txt, Wylie and Waugh 3, ch. 69, note, l. 17131, scholarly)"
  source: "archive.org-download-reignofhenryfift03wyliuoft-reignofhenryfift03wyliuoft-djvu.txt.txt 17114-17163 (ch. 69, notes): \"The French and Scots are given 5000-6000 combatants by Jean Juvenal\"; \"the English had 1500 men-at-arms\"; \"Le Fevre (ii. 35) says that the dauphinists were twice as many as the English\"; \"the dauphinist estimates of the losses of the English confirm the view that they had some 1500 men engaged\". Wylie and Waugh were read for the section and give the figures the line and the Thin list said only Wikipedia has"
