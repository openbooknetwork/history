stiklestad-1030:
  lnglat: [11.5667, 63.7967]
  name: "Battle of Stiklestad"
  date: "29 July 1030, by tradition"
  result: "Victory for the farmers’ army, Olaf Haraldsson killed"
  source: https://en.wikipedia.org/wiki/Battle_of_Stiklestad
  images: [stiklestad-altar, stiklestad-arbo]
  sides:
    - name: "Olaf Haraldsson’s army"
      color: norway
      commanders: ["Olaf Haraldsson", "Dagr Hringsson", "Harald Sigurdsson"]
      strength: "3,600 by Snorri’s account, among them 400 Swedes"
      casualties: "Olaf killed, Harald wounded"
    - name: "The farmers’ army, loyal to Cnut"
      color: danes
      commanders: ["Thorir Hund", "Kálfr Árnason", "Hárek of Tjøtta"]
      strength: "14,400 by Snorri’s account"
