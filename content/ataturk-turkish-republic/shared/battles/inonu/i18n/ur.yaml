# 18,000 in the first battle, 30,000 in the second
battle.sides.1.strength: "پہلی جنگ میں 18,000، دوسری میں 30,000"

# About 180 in the first battle, about 4,300 in the second
battle.sides.1.casualties: "پہلی جنگ میں تقریباً 180، دوسری میں تقریباً 4,300"

# First and Second Battles of İnönü
