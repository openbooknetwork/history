montepilloy:
  bbox: [1.45, 48.3, 3.6, 50.0]
  zones: [france-1422, english-sep-1429, burgundy-1420, brittany-1407]
  routes:
    - id: france-1429-bray
      family: france
      stations: [Provins, Nangis, Bray, Coulommiers, La Ferté-Milon, Crépy]
      passage: "Jean Chartier, Quicherat 4, p. 79, lines 3439-3447; the Journal of the Siege, Quicherat 4, pp. 187-188, lines 7678-7680 and 7702-7705; Ramsay, Lancaster and York, ch. 27, p. 402, lines 25323-25338; Cagny, Chroniques, 1429, pp. 160-161, lines 7740-7764"
      basis: reconstruction
      why: "Cagny has the king at Provins from 2 to 5 August, at Coulommiers on 7 August, at La Ferté-Milon on 10 August and at Crépy on 11 August; Ramsay has the army go first from Provins to Nangis as if to give battle (the Journal's army set in the field toward 'la Motte de Nangis'), then turn toward Bray, find it occupied, and retrace its steps northwards to Coulommiers, La Ferté-Milon and Crépy-en-Valois (050.1, 050.2). Chartier has the council resolve to cross the Seine at Bray and the van that went ahead to cross killed or robbed there, and the Journal has the townsmen let in English and Burgundians the evening before the crossing; how far the army itself came toward Bray no source read says, so the line reaches the town as the place it turned back from. The towns are given and the roads are not."
    - id: france-1429-montepilloy
      family: france
      stations: [Crépy, Lagny-le-Sec, Dammartin, Baron, Montépilloy]
      passage: "Cagny, Chroniques, 1429, pp. 161-162, lines 7763-7772 and 7778-7803; Ramsay, Lancaster and York, ch. 27, p. 403, lines 25370-25396"
      basis: reconstruction
      why: "Cagny has the king at Crépy on Thursday 11 August, the army at Lagny-le-Sec on the Friday and in the field all Saturday near Dammartin, and on Sunday 14 August Joan, Alençon, Vendôme and the marshals lodged at evening by a hedge near Montépilloy, about two leagues from Senlis; Ramsay has the king advance to Lagny-le-Sec with his van at Dammartin, the armies skirmish on 13 August at Thieux near Dammartin, the French fall back toward Baron, and next day advance from Baron to Montépilloy (050.3, 050.4). The towns are given and the roads are not."
    - id: france-1429-compiegne
      family: france
      stations: [Montépilloy, Crépy, Compiègne]
      passage: "Cagny, Chroniques, 1429, p. 164, lines 7878-7890; Lowell, Joan of Arc, ch. 12, p. 169, line 7458"
      basis: reconstruction
      why: "Cagny has the French leave Montépilloy about noon on 16 August for the king at Crépy, and the king go to Compiègne on Thursday 18 August (050.3, 050.7). The towns are given and the roads are not."
    - id: english-1429-montepilloy
      family: english
      stations: [Mitry, Thieux, Louvres, Notre-Dame-de-la-Victoire]
      passage: "Ramsay, Lancaster and York, ch. 27, p. 403, lines 25385-25396; Cagny, Chroniques, 1429, p. 162, lines 7803-7807"
      basis: reconstruction
      why: "Ramsay has Bedford, keeping between the French and Paris along an inner circle, reach Mitry, skirmish with the French all 13 August at Thieux near Dammartin, move at evening to Louvres on the road from Paris to Senlis, and next day take up his position on the Nonette by Notre-Dame-de-la-Victoire, which Cagny has half a league from Senlis (050.3, 050.4). His march of early August from Paris by Corbeil and Melun to Montereau (the Journal of the Siege, Ramsay) and his road from Montereau to Mitry are not drawn: no source read gives the second. The towns are given and the roads are not."
    - id: english-1429-paris
      family: english
      stations: [Notre-Dame-de-la-Victoire, Senlis, Paris]
      passage: "Cagny, Chroniques, 1429, p. 164, lines 7882-7885; Ramsay, Lancaster and York, ch. 27, p. 403, lines 25404-25405"
      basis: reconstruction
      why: "Cagny has news come about noon on 16 August that the English were going back to Senlis and straight to Paris, and Ramsay has Bedford fall back to Senlis (050.3). The towns are given and the roads are not."
  markers:
    bray-held-1429: { name: Bray, what: "the bridge over the Seine the king meant to cross early in August 1429 to go back over the Loire; the townsmen promised the passage and let in English and Burgundians the night before; about 48.41 N 3.24 E. In the english colour", basis: sourced }
    crepy-1429: { name: Crépy, what: "the king's quarters in August 1429, where Bedford's letter of challenge reached him on 11 August and the keys of Compiègne were brought on 17 August; about 49.23 N 2.89 E. In the france colour", basis: sourced }
    montepilloy: { name: Montépilloy, what: "where the king's army lodged by a hedge in the fields, about two leagues from Senlis, and faced Bedford's on 14 and 15 August 1429; there were skirmishes and no battle; the village, about 49.21 N 2.70 E. In the france colour", basis: sourced, rank: 2 }
    victoire-1429: { name: Notre-Dame-de-la-Victoire, what: "Bedford's camp by the abbey on the little river Nonette, half a league from Senlis, fortified overnight with stakes, ditches and carts, the river at its back, 14 to 16 August 1429; the abbey ruins, about 49.19 N 2.62 E. In the english colour", basis: sourced, rank: 1 }
    senlis-1429: { name: Senlis, what: "yields by treaty to Vendôme and the marshals after Bedford falls back, with letters of abolition dated 22 August 1429; Vendôme stays as its governor; about 49.21 N 2.59 E. In the france colour", basis: sourced, rank: 1 }
    compiegne-1429: { name: Compiègne, what: "sends its keys to the king at Crépy on 17 August 1429; he enters on 18 August and makes Guillaume de Flavy its captain; the truce with the Duke of Burgundy is signed here on 28 August; about 49.42 N 2.83 E. In the france colour", basis: sourced, rank: 2 }
    beauvais-1429: { name: Beauvais, what: "comes over to the king in the second half of August 1429 and drives out its bishop, Pierre Cauchon; about 49.43 N 2.08 E. In the france colour", basis: sourced }
    creil-1429: { name: Creil, what: "comes over to the king in August 1429 (Monstrelet, Ramsay); Jacques de Chabannes is left as its captain; about 49.26 N 2.47 E. In the france colour", basis: sourced }
    pont-sainte-maxence-1429: { name: Pont-Sainte-Maxence, what: "its bridge over the Oise comes over to the king in August 1429 (Monstrelet, Ramsay); about 49.30 N 2.60 E. In the france colour", basis: sourced }
    choisy-1429: { name: Choisy, what: "the castle on the Oise that comes over to the king in August 1429 (Monstrelet); about 49.44 N 2.88 E. In the france colour", basis: sourced, rank: 1 }
    gournay-1429: { name: Gournay-sur-Aronde, what: "comes over to the king in August 1429 (Monstrelet); about 49.49 N 2.70 E. In the france colour", basis: sourced }
    aumale-1429: { name: Aumale, what: "changes hands during the talks with Burgundy, August 1429 (Ramsay); about 49.77 N 1.75 E. In the france colour", basis: sourced }
    blangy-1429: { name: Blangy, what: "changes hands during the talks with Burgundy, August 1429 (Ramsay); about 49.93 N 1.63 E. In the france colour", basis: sourced }
    lagny-1429: { name: Lagny, what: "the small fortified town on the south bank of the Marne that acknowledges the king in August 1429 (Lowell); Ambroise de Loré is later made its captain; about 48.87 N 2.71 E. In the france colour", basis: sourced }
  unmarked:
    Provins: "the start of the army's road, a station of france-1429-bray; marked in 040."
    Coulommiers: "a station of the road north from Bray; marked in 040."
    Montereau: "where Bedford dated his letter of challenge on 7 August; it changes nothing on the map, and it is marked in 010."
    Paris: "Bedford's city, the start of english-1429-montepilloy; marked on paris."
    Arras: "where the king's embassy went to the Duke of Burgundy; outside the frame."
    Nogent: "named for the truce's terms, which rules.md leaves out; it changes nothing on the map."
    Harfleur: "named only in Ramsay's terms of the truce, which rules.md leaves out."
    Rouen: "where Bedford went from Paris (Cagny); outside the frame, and marked in 060."
    Normandy: "a duchy that stays English, shown by the english zone."
    the Nonette: "the little river of Bedford's camp, drawn on the base map; the camp is marked."
    Orbec: "named only in the title of the English captain killed on 14 August; outside the frame."
    Orléans: "named only for the Bastard of Orléans; no place on this page."
    Reims: "named only in the title of the Archbishop of Reims; marked in 040."
    Thérouanne: "named only in Louis of Luxembourg's title of bishop; outside the frame."
    Chartres: "named only in the name of Regnault de Chartres; no place."
    the Loire: "named as where the council meant to go back over; outside the frame."
    the Seine: "the river is drawn on the base map; Bray on it is marked."
    the Marne: "the river is drawn on the base map; Lagny on it is marked."
    the Oise: "the river is drawn on the base map; Compiègne, Choisy and Pont-Sainte-Maxence on it are marked."
    Bar: "named only in the title of René, Duke of Bar; the duchy is outside the frame."
    Burgundy: "named only in the Duke of Burgundy's title; the burgundy zone shows his land."
paris:
  bbox: [2.27, 48.84, 2.42, 48.95]
  zones: [france-1422, english-sep-1429, burgundy-1420, brittany-1407]
  routes:
    - id: france-1429-paris
      family: france
      stations: [Saint-Denis, La Chapelle, the pig market before the Porte Saint-Honoré]
      passage: "Cagny, Chroniques, 1429, pp. 166-167, lines 7979-8005; the Journal of the Siege, Quicherat 4, p. 198, lines 8072-8080"
      basis: reconstruction
      why: "Cagny has the king dine at Saint-Denis on Wednesday 7 September, and the Journal has the army lodge that evening at La Chapelle, on the road midway between Saint-Denis and Paris, and draw up next day in the pig market before the Porte Saint-Honoré (050.15, 050.16). The road from Saint-Denis to La Chapelle is the road to Paris; the way from La Chapelle round outside the wall to the pig market is given by no source and is drawn outside the line of the wall of Charles V."
  markers:
    saint-denis-1429: { name: Saint-Denis, what: "taken by Joan and Alençon on 25 August 1429 (the Bourgeois; Cagny has them lodge there on the 26th); for a fortnight they skirmish at the gates of Paris from it, and the king comes on 7 September; the town, about 48.94 N 2.35 E. In the france colour", basis: sourced }
    la-chapelle-1429: { name: La Chapelle, what: "the village midway between Saint-Denis and Paris where Joan and the captains lodge on the evening of 7 September 1429 and to which she is carried back wounded; about 48.89 N 2.36 E. In the france colour", basis: sourced }
    porte-saint-denis-1429: { name: Porte Saint-Denis, what: "the gate of Paris from which the defenders threatened a sally on 8 September 1429, while Alençon covered the attack behind a hill; the gate stood on the wall of Charles V where the Rue Saint-Denis crossed it, about 48.867 N 2.352 E. In the english colour", basis: reconstruction, why: "The sources name the gate (050.16) and no source read gives a plan of the walls; it is placed on the line of the wall of Charles V where the Rue Saint-Denis crossed it.", rank: 1 }
    porte-saint-honore: { name: Porte Saint-Honoré, what: "the gate Joan, Rais and Gaucourt attacked on 8 September 1429 from the pig market; the barrier and boulevard before it were fired and taken, and the attack stopped at the water of the inner moat; the gate stood on the wall of Charles V where the Rue Saint-Honoré crossed it, about 48.863 N 2.337 E. In the english colour, under the battle card", basis: reconstruction, why: "The sources name the gate and the pig market before it (050.16) and no source read gives a plan of the walls; it is placed on the line of the wall of Charles V where the Rue Saint-Honoré crossed it.", rank: 2 }
  unmarked:
    the pig market: "the Marché aux Pourceaux before the Porte Saint-Honoré, where the army drew up; a few hundred metres from the gate, it would stand under the card, and it is the last station of france-1429-paris."
    Montmartre: "named only in Monstrelet's account of the king drawn up between Montmartre and Paris; it changes nothing on the map."
    the bridge over the Seine near Saint-Denis: "Alençon's bridge, broken in the night of 9 to 10 September; no source read places it beyond 'near Saint-Denis'."
    the hill behind which Alençon stood: "no source read places it."
    Senlis: "where Alençon went to the king on 1 and 5 September; outside the frame, marked on montepilloy."
    Compiègne: "whence Joan and Alençon set out on 23 August; outside the frame, marked on montepilloy. No source read gives their road but its ends, and the page's frame is the north side of Paris, so the road is not drawn."
    Paris: "the city held for Henry VI, shown by the english zone; its two attacked gates are marked."
    the Porte Saint-Honoré: "marked as porte-saint-honore, whose label is the name without the article."
    the Porte Saint-Denis: "marked as porte-saint-denis-1429, whose label is the name without the article."
    the Seine: "the river is drawn on the base map; the bridge over it is placed by no source."
    Bar: "named only in the title of René, Duke of Bar; no place on this page."
back-to-the-loire:
  bbox: [2.0, 47.55, 3.55, 49.0]
  zones: [france-1422, english-sep-1429, burgundy-1420, brittany-1407]
  routes:
    - id: france-1429-gien
      family: france
      stations: [Saint-Denis, Lagny, Provins, Bray, a ford of the Yonne below Sens, Courtenay, Château-Renard, Montargis, Gien]
      passage: "Cagny, Chroniques, 1429, pp. 169-170, lines 8100-8121; the Journal of the Siege, Quicherat 4, p. 200, lines 8193-8205; Lowell, Joan of Arc, ch. 13, p. 179 n., lines 7901-7902"
      basis: reconstruction
      why: "Cagny has the king leave Saint-Denis on Tuesday 13 September and dine at Gien on Wednesday 21 September; the Journal has him go to Lagny on the Marne, next day to Provins, then to Bray on the Seine, past Sens, which did not open to him, over a ford of the Yonne a little below it, and to Courtenay, Château-Renard, Montargis and at last Gien; Lowell has the Marne crossed at Lagny, the Seine at Bray and the Yonne near Sens (050.29). The towns are given and the roads are not."
  markers:
    saint-denis-abbey: { name: Saint-Denis, what: "before leaving, Joan offers her whole white armour, with a sword won before Paris, before the image of Our Lady and the relics of the abbey, September 1429; she told her judges her voice had bidden her stay there; the abbey church, about 48.936 N 2.360 E. In the france colour", basis: sourced }
    bray-1429: { name: Bray, what: "the bridge over the Seine that held against the king in August yields to him on his way south and the army crosses there, September 1429; about 48.41 N 3.24 E. In the france colour", basis: sourced }
    gien-disbanded: { name: Gien, what: "the king dines here on 21 September 1429, and the army that went to Reims is disbanded: Alençon goes home to Beaumont and the captains to their frontiers; about 47.69 N 2.63 E. In the france colour", basis: sourced }
  unmarked:
