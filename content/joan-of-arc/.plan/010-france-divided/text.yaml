  domremy:
    account: >-
      Joan is born at Domrémy on the Meuse, which with Greux makes one parish, the daughter of Jacques d'Arc and
      Isabelle, and baptised in the church of Saint-Remy: her own answer to her judges on 21 February 1431, and Jean
      Morel, her godfather, at Domrémy in 1455. Her year is about 1412: she told the court in February 1431 that she
      thought she was nineteen, and Lowell and Lang say the exact year is not known. The night of the Epiphany as her
      birthday rests on one letter of 1429, Perceval de Boulainvilliers's to the Duke of Milan, and the text says so.
      Her father, born at Ceffonds in Champagne, and her mother, of Vouthon, called Romée, were labourers of good
      repute and not rich (Beatrix Estellin in 1455). Her childhood is told in the witnesses' and her own words: her
      mother taught her the Paternoster, Ave Maria and Credo, and at sewing and spinning she "feared no woman in
      Rouen". Whether she kept the beasts is disputed and both accounts are told. The village: Vaucouleurs, the walled
      town and castle down the Meuse, held for the king's party, its castellany with Domrémy and Greux an island of
      loyalty in a land Anglo-Burgundian or outside France (Lang); across the river Maxey was Burgundian, and the boys
      of the two villages fought as Armagnacs and Burgundians, which Lowell takes for an old local feud. Joan herself
      said she knew only one Burgundian in Domrémy. Who was the overlord of Domrémy is disputed and both accounts are
      told. The map shows the upper Meuse: the kingdom with Vaucouleurs and the northern part of Domrémy, the duchy of
      Bar, the duchy of Lorraine, and the county of Burgundy to the south. The edge of the kingdom and Bar through the
      village is a reconstruction along the Three Fountains brook after Lowell, and the text says it is approximate. The text links Maxey, whose marker waits under Domrémy's at the opening view.
    files:
      - { file: .references/sourcebooks.web.fordham.edu-basis-joanofarc-trial.asp.txt, read: "the first public session, 21 February 1431; the second, 22 February; the session of 24 February (Domrémy and Maxey)" }
      - { file: .references/archive.org-download-jeannedarcmaidof028754mbp-jeannedarcmaidof028754mbp-djvu.txt.txt, read: "Part II, the depositions at Domrémy, 1455: Jean Morel and Beatrix Estellin" }
      - { file: .references/archive.org-download-joanofarc00lowe-joanofarc00lowe-djvu.txt.txt, read: "ch. 2, l. 900 to 1100 and l. 1285 to 1300, with the note at l. 915" }
      - { file: .references/archive.org-download-maidoffrancebein00languoft-maidoffrancebein00languoft-djvu.txt.txt, read: "ch. 2, l. 1655 to 1770" }
      - { file: .references/archive.org-download-ProcesDeCondamnationV5-ProcesDeCondamnationV5-djvu.txt.txt, read: "Boulainvilliers to the Duke of Milan, l. 6150 to 6170" }
    passages: ["Barrett, the public sessions of 21, 22 and 24 February 1431", "Murray Part II, the depositions at Domrémy, 1455", "Lowell ch. 2", "Lang ch. 2", "Quicherat 5, Boulainvilliers to the Duke of Milan"]
    disputes:
      - { claim: "010.9", how: "the body says about 1412, with her own answer that she thought herself nineteen in February 1431, and says that the exact year is not known (Lowell, Lang)." }
      - { claim: "010.13", how: "both accounts, each with who said it and when: her own of 1431, that at home she saw to the household and did not go to the fields after the sheep and other animals, and Jean Morel's of 1455, that she followed the plough and sometimes minded the cattle. Thurston's judgement may follow, with his name." }
      - { claim: "010.14", how: "the body says the village lay where the kingdom met the duchy of Bar, and gives Lowell's account, that it lay in Bar south of the Three Fountains brook and Joan was born a subject of the Duke of Bar, and Lang's, that her father's house stood on the Lorraine march or just across it, each with its author. Thurston's Burgundian confines are not told." }
    sources:
      - "The Trial of Jeanne d'Arc, tr. W. P. Barrett (1932), the public sessions of 21, 22 and 24 February 1431."
      - "T. Douglas Murray, ed. and tr., Jeanne d'Arc, Maid of Orleans (London, 1902), part II, the depositions at Domrémy."
      - "Francis C. Lowell, Joan of Arc (Boston, 1896), ch. 2."
      - "Andrew Lang, The Maid of France (London, 1908), ch. 2."
      - "Jules Quicherat, ed., Procès de condamnation et de réhabilitation de Jeanne d'Arc, vol. 5 (Paris, 1849), the letter of Perceval de Boulainvilliers."
